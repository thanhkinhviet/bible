 của toàn bộ câu chuyện đó: \"Vì Thiên Chúa yêu thế gian đến nỗi đã ban Con Một.\""],["p","Ba điều trong câu này cần được lưu ý:"],["p","Thứ nhất: Thiên Chúa yêu \"thế gian\" – không phải chỉ yêu con người, không phải chỉ yêu \"những người xứng đáng\". \"Thế gian\" trong tiếng Hy-lạp là \"kosmos\" – toàn bộ vũ trụ tạo vật. Tình yêu của Thiên Chúa không chỉ hướng đến linh hồn con người mà bỏ qua thế giới vật chất. Đó là tình yêu bao trùm toàn bộ tạo vật."],["p","Thứ hai: \"đến nỗi đã ban Con Một\" – đây là hành động đắt giá nhất trong lịch sử. Không phải Thiên Chúa ở xa nhìn vào và đồng cảm. Ngài đi vào trong – qua Nhập Thể, qua Thập Giá, qua Phục Sinh. Đây là Thiên Chúa không đứng bên ngoài câu chuyện."],["p","Thứ ba: mục đích là sự sống – \"để ai tin vào Con của Người thì khỏi phải chết, nhưng được sống muôn đời.\" Đây không phải là câu chuyện về sự thoát khỏi thế giới. Đây là câu chuyện về sự sống được phục hồi – trong thế giới này và trong thế giới đến."],["h3","IV. Bạn Là Một Phần Của Câu Chuyện Này"],["p","Đây là điều thay đổi tất cả: nếu thế giới là sân khấu của câu chuyện Thiên Chúa đang kể, và nếu Ngài đủ yêu thương để bước vào trong câu chuyện đó – thì bạn không phải là khán giả ngồi ngoài. Bạn là một nhân vật trong câu chuyện đó."],["p","Điều đó không có nghĩa là cuộc đời bạn đã được viết sẵn như một kịch bản cứng nhắc. Câu chuyện của Thiên Chúa không phải là câu chuyện của con rối mà là câu chuyện của những con người thật, với những lựa chọn thật, trong một thế giới thật – cùng với Thiên Chúa đang kiên nhẫn và sáng tạo làm việc qua và trong tất cả điều đó."],["p","Nhà thần học N.T. Wright mô tả điều này bằng hình ảnh một vở kịch Shakespeare được viết với bốn màn đã hoàn chỉnh (sáng tạo, sa ngã, dân Israel, Đức Giê-su Ki-tô) và màn thứ năm chưa viết xong. Người diễn viên trong màn thứ năm đó – chúng ta – không được đọc kịch bản của cảnh mình chưa đến. Nhưng họ biết đủ về câu chuyện để ứng tấu một cách trung thực với những gì đã xảy ra trước đó và những gì hứa hẹn sẽ đến."],["p","Đó là vị trí của chúng ta trong câu chuyện này: biết đủ về nguồn gốc và đích đến, để sống trung thực với cả hai trong khoảng giữa."],["h3","V. Khi Câu Chuyện Cảm Thấy Vô Nghĩa"],["p","Hà, người bạn đã mất người thân, không thể nhìn thấy câu chuyện lớn ngay lúc đó. Và điều đó là hoàn toàn có thể hiểu được."],["p","Có những khoảnh khắc mà câu chuyện lớn cảm thấy trừu tượng và vô ích khi đau khổ thật sự đang xảy ra ngay trước mặt. Câu hỏi \"Tại sao?\" lớn hơn bất kỳ câu trả lời thần học nào."],["p","Kinh Thánh không bỏ qua điều đó. Các Thánh Vịnh đầy những lời kêu than – Tv 22 bắt đầu bằng câu mà chính Đức Giê-su kêu lên trên Thập Giá: \"Lạy Thiên Chúa, lạy Thiên Chúa của con, sao Ngài bỏ con?\" Đây là lời cầu nguyện của người đang ở trong câu chuyện nhưng không thể nhìn thấy kết cục."],["p","Nhưng điều đáng chú ý là: Đức Giê-su đã trích dẫn câu đó. Không phải Ngài không biết kết cục. Mà là Ngài hoàn toàn ở trong trải nghiệm đó – sự đau khổ thật, sự vắng mặt cảm nhận được của Thiên Chúa, sự tối tăm thật. Và Ngài ở trong đó cùng chúng ta."],["p","Đây là ý nghĩa của Ga 3,16: Thiên Chúa không yêu thế gian từ xa. Ngài yêu thế gian đến mức đi vào trong sự đau khổ của thế gian. Câu chuyện không bỏ qua đau khổ – nó đặt Đấng kể chuyện vào ngay trung tâm của đau khổ đó."],["h3","VI. Kết Chương 4 – Và Tổng Kết Phần 1"],["p","Minh đặt điện thoại xuống và cảm thấy trống không. Linh đứng nhìn hồ Đà Lạt và cảm thấy điều gì đó muốn nói. Trường nhìn con sông đen và cảm thấy buồn sâu sắc. Hà mất người bạn và tự hỏi tại sao."],["p","Bốn trải nghiệm khác nhau. Bốn câu hỏi khác nhau. Nhưng chúng đều hội tụ về cùng một điểm: thế giới này không phải là không có nghĩa lý, không phải là không có trung tâm, không phải là không ai quan tâm."],["sum","TỔNG KẾT PHẦN 1 – BẢN CHẤT THẾ GIỚI",["<b>Chương 1: <\/b>Thế giới được tạo ra có chủ đích – không phải tai nạn, không phải vĩnh cửu tự tồn.","<b>Chương 2: <\/b>Thế giới mang dấu ấn của Đấng Tạo Dựng – trong vẻ đẹp, trong trật tự, trong những khoảnh khắc vượt qua lời giải thích thông thường.","<b>Chương 3: <\/b>Thế giới được trao phó, không phải sở hữu – con người là người quản lý, không phải người chủ.","<b>Chương 4: <\/b>Thế giới là sân khấu của câu chuyện Thiên Chúa đang kể – và Ngài đã bước vào trong câu chuyện đó."]],["p","Đây là tin tốt cho Minh: thế giới không trống không. Đây là tin tốt cho Linh: vẻ đẹp cô cảm nhận trỏ về điều thật. Đây là tin tốt cho Trường: cảm giác buồn của anh là cảm giác đúng. Đây là tin tốt cho Hà: ngay cả trong đau khổ, cô không một mình."],["p","Nhưng tin tốt này cũng đặt ra những câu hỏi mới: nếu thế giới được tạo ra tốt lành, tại sao nó lại như hiện nay? Tại sao có cái ác? Tại sao có đau khổ? Tại sao những người vô tội chịu thiệt thòi? Đó là những câu hỏi mà Phần 2 sẽ tiếp tục."],["p","Hành trình tiếp tục."],["refl","CÂU HỎI SUY NGẪM — Chương 4",["<i>Câu hỏi của Hà – \"tại sao Thiên Chúa không can thiệp?\" – đã bao giờ là câu hỏi của bạn chưa? Trong hoàn cảnh nào? Điều gì đã xảy ra sau đó?<\/i>","<i>Ý tưởng về thế giới như là \"sân khấu của câu chuyện Thiên Chúa đang kể\" – điều đó thay đổi gì trong cách bạn nhìn những sự kiện hàng ngày trong cuộc sống của mình?<\/i>","<i>Nếu bạn là một \"nhân vật trong câu chuyện\" thay vì \"khán giả ngồi ngoài\", điều đó gợi lên trách nhiệm hay cơ hội nào cho bạn trong tuần tới?<\/i>","<i>[Nhóm nhỏ] Chia sẻ một giai đoạn trong cuộc đời bạn khi câu chuyện lớn cảm thấy trừu tượng và vô nghĩa. Điều gì đã giúp bạn – nếu có – nhìn lại bức tranh lớn hơn?<\/i>","<i>[Nhóm nhỏ] Hình ảnh của N.T. Wright về \"vở kịch chưa viết xong\" – chúng ta đang ứng tấu trong màn thứ năm dựa trên những gì đã xảy ra trước – gợi lên điều gì về cách sống trung thực với đức tin trong thế giới hiện đại?<\/i>","<i>[Nhóm nhỏ] Trong nhóm của bạn, ai đang trải qua giai đoạn mà câu chuyện lớn cảm thấy xa xôi hay vô nghĩa? Nhóm có thể làm gì cụ thể – không phải giải thích hay khuyên bảo – để hiện diện cùng người đó?<\/i>"]]]},{"k":"ch","l":"Phần 2 · Chương 1","t":"Câu Hỏi Mà Không Ai Có Thể Tránh","pb":["PHẦN 2","CÁI ÁC VÀ ĐAU KHỔ","Tại Sao Thế Giới Lại Như Vậy?"],"b":[["q","Lạy Chúa, lạy Thiên Chúa của con, sao Ngài bỏ rơi con? Sao Ngài lìa xa không giải cứu, không nghe tiếng con kêu gào?","Thánh Thi 22:2"],["h3","I. Câu Chuyện Của Hà"],["p","Hà hai mươi bảy tuổi. Cô đã xuất hiện ở cuối Phần 1 – người bạn vừa mất đi người thân nhất trong một tai nạn không có lý do, không có cảnh báo. Cô đã đọc những chương trước và thấy chúng đẹp, thấy chúng hợp lý. Thế giới được tạo ra tốt lành. Thiên Chúa hiện diện trong tạo vật. Câu chuyện lớn đang được kể."],["p","Nhưng rồi buổi chiều hôm đó xảy ra, và tất cả những khung đó bỗng dưng trở nên mỏng manh như tờ giấy."],["p","Không phải cô không tin vào Thiên Chúa nữa. Cô chỉ không thể nhìn thấy Ngài. Và điều tệ hơn cả sự vắng mặt là sự im lặng. Người bạn cô yêu thương nhất đã biến mất khỏi thế giới này mà không có lời giải thích nào. Không có ý nghĩa nào. Không có lý do nào xứng đáng."],["p","Cô viết vào nhật ký tối hôm đó: \"Nếu Thiên Chúa thật sự tốt lành và thật sự toàn năng – tại sao? Tại sao những người vô tội chịu khổ? Tại sao trẻ em chết? Tại sao chiến tranh tồn tại? Tại sao thế giới được tạo ra tốt lành lại trở nên như thế này?\""],["p","Câu hỏi của Hà không phải câu hỏi của riêng cô. Nó là câu hỏi cổ xưa nhất và đau đớn nhất mà con người từng đặt ra. Và tập sách này không giả vờ có câu trả lời dễ dàng."],["h3","II. Vấn Đề Của Cái Ác – Không Phải Chỉ Là Triết Học"],["p","Các triết gia gọi đây là \"vấn đề của cái ác\" (the problem of evil). Nó thường được trình bày theo dạng tam đoạn luận:"],["ul",["Nếu Thiên Chúa hoàn toàn tốt lành, Ngài muốn ngăn chặn cái ác.","Nếu Thiên Chúa toàn năng, Ngài có thể ngăn chặn cái ác.","Cái ác tồn tại.","Vậy thì: Thiên Chúa hoặc không tốt lành, hoặc không toàn năng, hoặc không tồn tại."]],["p","Lập luận này có sức mạnh. Nó đã làm rung chuyển đức tin của nhiều người. Nhà vô thần nổi tiếng Bertrand Russell từng viết rằng đây là lý do chính khiến ông không thể tin vào Thiên Chúa Ki-tô giáo."],["p","Nhưng vấn đề của cái ác không chỉ là vấn đề triết học. Đối với Hà, nó không phải là bài toán cần giải. Nó là một vết thương cần được chữa lành. Và hai điều đó – bài toán trí tuệ và vết thương cảm xúc – cần được tiếp cận theo cách khác nhau, dù không thể hoàn toàn tách rời nhau."],["p","Chương này – và toàn bộ Phần 2 – không hứa sẽ giải quyết vấn đề này một cách hoàn toàn thỏa đáng. Không cuốn sách nào có thể làm điều đó. Nhưng chúng ta có thể cùng nhau đi qua những phần của câu trả lời mà Kinh Thánh và truyền thống thần học Ki-tô giáo đã tích lũy qua hàng thế kỷ đối mặt trung thực với câu hỏi này."],["h3","III. Hai Loại Cái Ác"],["p","Trước khi đi sâu hơn, cần phân biệt hai loại cái ác mà con người trải nghiệm – vì chúng đặt ra những câu hỏi khác nhau và đòi hỏi những cách tiếp cận khác nhau."],["h4","1. Cái ác đạo đức (Moral Evil)"],["p","Đây là cái ác (sự dữ) do con người gây ra: chiến tranh, bạo lực, lừa dối, bất công, lạm dụng. Đây là những điều xảy ra vì con người lựa chọn làm điều sai – vì sự tham lam, sự sợ hãi, sự căm thù, hay sự thờ ơ."],["p","Câu hỏi ở đây là: tại sao Thiên Chúa cho phép con người có khả năng lựa chọn điều ác? Và câu trả lời liên quan đến tự do ý chí – điều chúng ta sẽ khám phá trong chương tiếp theo."],["h4","2. Cái ác tự nhiên (Natural Evil)"],["p","Đây là đau khổ không do con người trực tiếp gây ra: động đất, bệnh tật, lũ lụt, hạn hán, cái chết tự nhiên. Đây là những điều xảy ra như là một phần của vận hành thế giới tự nhiên, không có \"thủ phạm\" rõ ràng."],["p","Câu hỏi ở đây khó hơn: tại sao một Đấng tốt lành và toàn năng lại thiết kế ra – hay cho phép tồn tại – một thế giới trong đó những điều như thế này có thể xảy ra?"],["p","Cả hai loại đều thật. Cả hai đều đau đớn. Và Phần 2 sẽ không bỏ qua loại nào."],["h3","IV. Kinh Thánh Không Tránh Né Câu Hỏi"],["p","Một trong những điều đáng ngạc nhiên nhất khi đọc Kinh Thánh là sự trung thực của nó trước cái ác và đau khổ. Kinh Thánh không phải là cuốn sách của những câu trả lời gọn gàng và những câu chuyện kết thúc có hậu."],["p","Sách Gióp là một trong những văn bản triết học và thần học sâu sắc nhất của nhân loại – và toàn bộ cuốn sách đó là một cuộc đối mặt với câu hỏi: tại sao người công chính phải chịu khổ? Gióp mất tất cả – con cái, tài sản, sức khỏe – mà không có lý do nào anh có thể nhìn thấy. Và Kinh Thánh ghi lại toàn bộ sự kêu than, nghi ngờ, và giận dữ của anh mà không phán xét anh vì những điều đó."],["p","Các Thánh Vịnh (Thánh Thi) – đặc biệt là những Thánh Vịnh \"than thở\" như Tv 22, 44, 88 – đầy những lời kêu gào không được trả lời, những câu hỏi không có hồi âm, những giai đoạn mà Thiên Chúa im lặng."],["p","Đức Giê-su trên Thập Giá đã kêu lên lời của Tv 22: \"Lạy Thiên Chúa, lạy Thiên Chúa của con, sao Ngài bỏ con?\" Đây không phải là lời của người thiếu đức tin. Đây là lời của Con Thiên Chúa đang ở trong chiều sâu nhất của đau khổ."],["p","Kinh Thánh không nói với bạn rằng câu hỏi của bạn là sai, rằng bạn không nên thắc mắc, rằng người có đức tin thật sẽ không đặt câu hỏi như vậy. Ngược lại – nó mời bạn mang câu hỏi đó thẳng đến trước mặt Thiên Chúa."],["h3","V. Ba Phản Ứng Không Đủ"],["p","Trước khi bắt đầu đi vào những phần của câu trả lời, cần đặt tên cho ba cách tiếp cận phổ biến mà – dù dễ hiểu – cuối cùng không đủ."],["h4","1. \"Đây là ý Chúa\" – Chủ Nghĩa Định Mệnh Đơn Giản"],["p","\"Thiên Chúa muốn điều này xảy ra vì lý do của Ngài.\" Câu này đôi khi được nói với ý tốt, nhưng nó có thể vô tình nói rằng Thiên Chúa muốn em bé chết, muốn chiến tranh xảy ra, muốn người vô tội chịu khổ. Đó là hình ảnh về Thiên Chúa mà Kinh Thánh không ủng hộ."],["h4","2. \"Chỉ là ngẫu nhiên\" – Thuyết Vô Thần"],["p","\"Không có Thiên Chúa nào, thế giới chỉ là vật chất và quy luật, đau khổ không có ý nghĩa.\" Cách này giải quyết vấn đề bằng cách xóa bỏ một vế của phương trình. Nhưng nó để lại một vấn đề lớn hơn: nếu đau khổ không có ý nghĩa, thì cũng không có lý do thật sự nào để chống lại nó hay để đồng cảm với người đang chịu khổ."],["h4","3. \"Đừng hỏi, cứ tin\" – Chủ Nghĩa Tín Ngưỡng Không Phản Tư"],["p","\"Hỏi nhiều là thiếu đức tin.\" Phản ứng này làm im lặng câu hỏi thay vì tiếp cận nó. Nhưng câu hỏi không biến mất khi bị im lặng – nó chỉ đi vào bóng tối, và đức tin được xây trên sự im lặng bắt buộc thì không đủ bền để đứng vững trong những khoảnh khắc thử thách thật sự."],["p","Phần 2 muốn đi theo con đường khác: trung thực với câu hỏi, trung thực với những giới hạn của câu trả lời con người có thể đưa ra, và trung thực với những điều mà Kinh Thánh và truyền thống Ki-tô giáo thật sự đã dạy."],["h3","VI. Kết Chương 1 – Bắt Đầu Từ Sự Trung Thực"],["p","Hà không cần ai giải thích sự mất mát của cô bằng những câu trả lời có sẵn. Cô cần được ngồi cùng với câu hỏi đó – và biết rằng câu hỏi đó không làm cô trở thành người thiếu đức tin, mà là người đang suy nghĩ thật."],["p","Phần 2 bắt đầu từ chỗ đó: sự trung thực rằng câu hỏi về cái ác và đau khổ là thật, nặng nề, và không có câu trả lời gọn gàng. Nhưng cũng từ chỗ đó, chúng ta bắt đầu đi – không phải vì chúng ta có tất cả câu trả lời, mà vì chúng ta tin rằng Đấng ở trung tâm câu chuyện này đã đi qua con đường đó trước chúng ta."],["refl","CÂU HỎI SUY NGẪM — Chương 1",["<i>Câu hỏi \"tại sao\" của bạn là gì – điều gì trong cuộc sống hay trong thế giới khiến bạn khó hiểu nhất với một Thiên Chúa tốt lành?<\/i>","<i>Bạn thường có phản ứng nào khi đối mặt với đau khổ – tránh né câu hỏi, tìm câu trả lời, hay điều gì khác?<\/i>","<i>Việc biết rằng Kinh Thánh không tránh né câu hỏi về đau khổ – điều đó thay đổi gì trong cách bạn cầu nguyện hay tiếp cận đức tin?<\/i>","<i>[Nhóm nhỏ] Chia sẻ một khoảnh khắc câu hỏi \"tại sao có cái ác?\" trở nên cụ thể và cá nhân đối với bạn. Điều đó ảnh hưởng thế nào đến đức tin của bạn?<\/i>","<i>[Nhóm nhỏ] Ba phản ứng không đủ trong chương này – bạn thấy mình gần nhất với phản ứng nào? Tại sao?<\/i>","<i>[Nhóm nhỏ] Làm thế nào một cộng đoàn có thể tạo ra không gian an toàn cho những câu hỏi về đau khổ mà không cảm thấy áp lực phải có câu trả lời ngay lập tức?<\/i>"]]]},{"k":"ch","l":"Phần 2 · Chương 2","t":"Tự Do Và Hệ Quả: Nguồn Gốc Của Cái Ác Đạo Đức","pb":null,"b":[["q","Ngài đặt trước mặt ngươi lửa và nước, ngươi muốn, cứ giơ tay ra lấy. Trước mặt con người có sự sống và sự chết, điều nào người thích, sẽ được ban cho.","Hc 15,16-17"],["h3","I. Câu Chuyện Của Hùng"],["p","Hùng ba mươi hai tuổi. Anh đã bỏ đạo từ năm mười chín tuổi, sau khi đọc về những cuộc chiến tranh tôn giáo trong lịch sử – Thập Tự Chinh, Tòa Án Dị Giáo, những tội ác được thực hiện nhân danh Thiên Chúa. Lập luận của anh đơn giản: nếu Thiên Chúa tốt lành và toàn năng, Ngài không bao giờ để tôn giáo của Ngài trở thành công cụ gây ra những tội ác như vậy."],["p","Mười năm sau, anh ngồi nói chuyện với một người bạn cũ đang học thần học. Người bạn đó đặt ra một câu hỏi mà Hùng không có câu trả lời ngay: \"Nếu Thiên Chúa ngăn chặn tất cả cái ác do con người gây ra, Ngài phải làm gì? Ngài phải lấy đi điều gì khỏi con người?\""],["p","Hùng ngồi yên một lúc. Và lần đầu tiên trong nhiều năm, anh bắt đầu nghĩ lại không phải về Thiên Chúa, mà về con người."],["h3","II. Tự Do Ý Chí – Không Phải Cái Cớ, Mà Là Thực Tại"],["p","Câu trả lời thần học cổ điển cho câu hỏi về cái ác đạo đức được gọi là \"biện hộ về tự do ý chí\" (free will defense). Nó lập luận rằng: Thiên Chúa tạo ra con người với khả năng thật sự lựa chọn – bao gồm khả năng lựa chọn điều ác. Và đây không phải là lỗi thiết kế; đây là điều kiện của tình yêu thật."],["p","Triết gia Alvin Plantinga, một trong những nhà biện hộ quan trọng nhất của lập luận này trong thế kỷ 20, giải thích: một Thiên Chúa toàn năng không nhất thiết phải có khả năng tạo ra một thế giới có những sinh vật tự do mà luôn luôn chọn điều tốt. Tự do mà chỉ có thể chọn một chiều không phải là tự do thật sự."],["p","Hãy nghĩ về điều này theo cách đơn giản nhất: bạn có thể yêu một người theo lệnh không? Có thể lập trình một người yêu bạn không? Câu trả lời là không – không phải vì bạn thiếu quyền lực, mà vì tình yêu thật theo bản chất đòi hỏi sự tự nguyện. Một \"tình yêu\" bị ép buộc không phải là tình yêu – đó là sự phục tùng."],["p","Nếu Thiên Chúa muốn tạo ra những sinh vật có khả năng yêu thương thật sự – yêu Ngài và yêu nhau – thì Ngài phải tạo ra những sinh vật có tự do thật sự. Và tự do thật sự bao gồm khả năng lựa chọn ngược lại."],["h3","III. Tự Do Không Phải Là Nguyên Nhân Duy Nhất"],["p","Nhưng lập luận về tự do ý chí không giải thích tất cả. Nó giải thích được tại sao con người có khả năng chọn điều ác – nhưng nó không trả lời câu hỏi: tại sao Thiên Chúa không can thiệp ít nhất là để giảm bớt hậu quả của những lựa chọn đó?"],["p","Tập 1.2 đã đề cập đến một hình ảnh quan trọng: sự sa ngã không chỉ là một lần lựa chọn sai của Ađam và Eva. Nó là sự đứt gãy của bốn mối quan hệ căn bản – với Thiên Chúa, với nhau, với thế giới, và với chính mình. Và sự đứt gãy đó có hệ quả mang tính cấu trúc: nó thay đổi không chỉ từng cá nhân, mà thay đổi bản chất của xã hội, văn hóa, và ngay cả tạo vật."],["p","Rm 5,12 mô tả điều này: \"Tội lỗi đã xâm nhập trần gian, và tội lỗi gây nên sự chết; như vậy, sự chết đã lan tràn tới mọi người, bởi vì mọi người đã phạm tội.\" Phao-lô không nói rằng mỗi người chết vì lỗi cá nhân của họ. Ông nói rằng sự chết – như là hậu quả của tội lỗi – đã trở thành một phần của thực tại con người sống trong."],["p","Chúng ta sinh ra vào một thế giới đã bị định hình bởi những lựa chọn của những người đến trước. Và những lựa chọn của chúng ta đang định hình thế giới mà những người sau sẽ được sinh vào. Đây không phải là sự bất công của Thiên Chúa – đây là bản chất của sự liên đới trong thế giới tạo vật."],["h3","IV. Cái Ác Hệ Thống – Không Phải Chỉ Là Lựa Chọn Cá Nhân"],["p","Một trong những sai lầm phổ biến khi nghĩ về cái ác là thu hẹp nó về mức độ cá nhân: mỗi người làm điều ác vì họ chọn như vậy. Nhưng Kinh Thánh nhìn nhận một thực tại phức tạp hơn: cái ác có chiều kích cấu trúc và hệ thống."],["p","Các tiên tri Cựu Ước – Amos, Isaia, Mikha – không chỉ chỉ trích tội lỗi cá nhân. Họ lên án những hệ thống kinh tế bóc lột người nghèo, những cấu trúc quyền lực che chở cho kẻ mạnh và nghiền nát người yếu, những thể chế tôn giáo đã biến thờ phượng thành công cụ duy trì bất công."],["p","Điều này có ý nghĩa quan trọng: một người tử tế, không có ý định xấu, vẫn có thể hưởng lợi từ một hệ thống bất công và góp phần duy trì nó. Cái ác không phải chỉ là những hành động ác của những cá nhân ác. Nó có thể ẩn trong cách tổ chức xã hội, trong những quy tắc được coi là hiển nhiên, trong những đặc quyền không được nhìn nhận."],["p","Đây là một trong những điểm mà Kinh Thánh đặt ra thách thức không thoải mái cho tất cả chúng ta, bất kể vị trí xã hội."],["h3","V. Vậy Thiên Chúa Đứng Ở Đâu?"],["p","Câu hỏi thật của Hùng không chỉ là triết học. Nó là câu hỏi quan hệ: Thiên Chúa ở đâu khi những điều đó xảy ra?"],["p","Kinh Thánh không trả lời câu hỏi đó bằng cách giải thích từng sự kiện cụ thể. Nó trả lời bằng cách chỉ về một sự kiện trung tâm: Thập Giá."],["p","Thiên Chúa không đứng bên ngoài nhìn vào cái ác và đau khổ của con người. Ngài bước vào trong đó. Đức Giê-su không bị đóng đinh bởi thiên tai hay vô tình – Ngài bị đóng đinh bởi hệ thống cộng tác của cái ác đạo đức: sự hèn nhát chính trị của Philatô, sự ghen tị tôn giáo của các nhà lãnh đạo, sự phản bội của người thân cận, sự thờ ơ của đám đông."],["p","Và trên Thập Giá đó, Thiên Chúa ở đâu? Ngài ở ngay đó – ở vị trí của nạn nhân, không phải của kẻ thống trị. Ở vị trí của người bị hệ thống nghiền nát, không phải người điều hành hệ thống."],["p","Đây là lời tuyên bố của Kinh Thánh: Thiên Chúa biết cái ác từ bên trong, không phải từ bên ngoài. Và điều đó không giải quyết câu hỏi triết học – nhưng nó thay đổi câu hỏi quan hệ: bạn không kêu gào về đau khổ với ai đó đang ngồi thoải mái bên ngoài. Bạn kêu gào với Đấng đã đi qua đó trước bạn."],["h3","VI. Kết Chương 2 – Hùng Và Câu Hỏi Mới"],["p","Hùng không quay lại đức tin ngay buổi hôm đó. Nhưng anh ra về với một câu hỏi khác hơn câu hỏi anh mang vào: không phải \"tại sao Thiên Chúa không ngăn chặn cái ác\", mà là \"Đấng đã chịu đóng đinh có thể là Đấng tôi tin tưởng không?\""],["p","Đó là câu hỏi dẫn đến nơi khác."],["refl","CÂU HỎI SUY NGẪM — Chương 2",["<i>Lập luận về tự do ý chí – bạn thấy nó thuyết phục hay chưa đủ? Tại sao?<\/i>","<i>Có cái ác nào trong thế giới mà bạn nghĩ mình góp phần vào mà không nhận ra không? Điều gì khiến điều đó khó nhìn thấy?<\/i>","<i>Hình ảnh Thiên Chúa ở vị trí nạn nhân trên Thập Giá – điều đó thay đổi gì trong cách bạn cầu nguyện khi đang đau khổ?<\/i>","<i>[Nhóm nhỏ] Theo bạn, sự khác biệt giữa \"cái ác cá nhân\" và \"cái ác hệ thống\" có ý nghĩa thực tế gì trong bối cảnh xã hội mà bạn đang sống?<\/i>","<i>[Nhóm nhỏ] Câu hỏi của Hùng – \"tại sao Thiên Chúa cho phép tội ác được thực hiện nhân danh tôn giáo?\" – bạn trả lời câu hỏi đó như thế nào?<\/i>","<i>[Nhóm nhỏ] Nếu Thiên Chúa muốn can thiệp vào tất cả cái ác, điều đó có nghĩa là gì cho tự do của con người? Bạn muốn Thiên Chúa can thiệp không, và ở mức độ nào?<\/i>"]]]},{"k":"ch","l":"Phần 2 · Chương 3","t":"Đau Khổ Tự Nhiên: Khi Không Có \"Thủ Phạm\"","pb":null,"b":[["q","Chúng ta biết rằng: cho đến bây giờ, muôn loài thụ tạo cùng rên siết và quằn quại như sắp sinh nở.","Rm 8,22"],["h3","I. Câu Chuyện Của Bình"],["p","Bình ba mươi lăm tuổi, và cô vừa nhận được kết quả xét nghiệm ung thư giai đoạn hai. Cô không hút thuốc, không uống rượu, tập thể dục đều đặn, ăn uống lành mạnh. Không có \"lý do\" nào theo nghĩa thông thường."],["p","Cô không tức giận với ai cụ thể. Không có thủ phạm để chỉ vào. Chỉ có tế bào trong cơ thể mình đã quyết định phân chia sai cách – một quá trình sinh học lạnh lùng, không có ý định."],["p","Và câu hỏi mà cô không thể tránh là câu hỏi khác với câu hỏi của Hùng: không phải \"tại sao con người làm điều ác\", mà là \"tại sao thế giới vật lý lại như thế này?\""],["p","Đây là loại đau khổ mà lập luận về tự do ý chí không giải thích được. Và nó đòi hỏi một cách tiếp cận khác."],["h3","II. Tạo Vật Đang Rên Siết"],["p","Rm 8,22 – câu mở đầu chương này – là một trong những câu đáng ngạc nhiên nhất trong toàn bộ Kinh Thánh. Phao-lô mô tả \"muôn loài thụ tạo\" – không chỉ con người, mà toàn bộ tạo vật – đang \"rên siết và quằn quại như sắp sinh nở\"."],["p","Đây là hình ảnh quan trọng: không phải rên siết trong cái chết, mà rên siết như đang sinh nở. Đau đớn thật – nhưng đau đớn của quá trình dẫn đến điều gì đó mới. Và Phao-lô đặt hình ảnh đó trong bối cảnh của sự kỳ vọng: toàn bộ tạo vật đang \"mong đợi\" sự cứu chuộc."],["p","Điều này không giải thích ung thư của Bình. Nhưng nó đặt đau khổ của cô vào trong một khung rộng hơn: tạo vật hiện tại – với bệnh tật, suy giảm, cái chết – không phải là tạo vật như Thiên Chúa thiết kế ban đầu, và cũng không phải là tạo vật như sẽ tồn tại sau sự cứu chuộc."],["h3","III. Sự Sa Ngã Và Tạo Vật"],["p","Gen 3,17-18 mô tả một điều đáng chú ý sau sự sa ngã của con người: đất bị nguyền rủa. \"Vì ngươi mà đất đai bị nguyền rủa, ngươi sẽ phải cực nhọc mới kiếm được miếng ăn từ đất mà ra, suốt những ngày đời ngươi. Đất đai sẽ trổ sinh gai góc và tật lê cho ngươi.\""],["p","Thần học Ki-tô giáo truyền thống hiểu rằng sự sa ngã của con người không chỉ ảnh hưởng đến mối quan hệ giữa con người với Thiên Chúa và với nhau – nó cũng ảnh hưởng đến mối quan hệ giữa con người và tạo vật, và có thể hiểu là ảnh hưởng đến tạo vật theo nghĩa nào đó."],["p","Rm 8,20-21 nói rõ hơn: \"Thật vậy, muôn loài thụ tạo đã bị lệ thuộc sự hư ảo, không phải vì chúng muốn, nhưng vì Thiên Chúa bắt chịu vậy; tuy nhiên, vẫn còn niềm trông cậy là có ngày cũng sẽ được giải thoát, không còn làm nô lệ cho sự hư nát nữa.\""],["p","Điều này gợi ý rằng thế giới tự nhiên hiện tại – với bệnh tật, thiên tai, suy giảm – là thế giới trong tình trạng \"hư ảo\" hay \"không đạt đến mục đích\", chứ không phải là thế giới như Thiên Chúa muốn nó là."],["h3","IV. Những Phần Trả Lời Không Hoàn Chỉnh"],["p","Thần học Ki-tô giáo đã đưa ra nhiều phần trả lời khác nhau cho vấn đề của cái ác tự nhiên. Không cái nào là hoàn toàn thỏa đáng – nhưng mỗi cái soi sáng một khía cạnh."],["h4","1. Đau khổ như là bối cảnh của sự phát triển"],["p","Nhà thần học John Hick đưa ra lập luận rằng thế giới không được thiết kế để là nơi hoàn toàn dễ chịu và an toàn. Nó được thiết kế là \"linh hồn-làm\" (soul-making) – một môi trường trong đó con người có thể phát triển về đức hạnh, lòng trắc ẩn, sức mạnh nội tâm, và chiều sâu nhân cách."],["p","Thế giới không có đau khổ sẽ là thế giới không có cơ hội để can đảm, hy sinh, lòng trắc ẩn, hay sự tha thứ. Những phẩm chất cao nhất của con người nảy sinh trong đối mặt với những hoàn cảnh khó khăn thật sự."],["p","Nhưng – và đây là giới hạn quan trọng – lập luận này khó áp dụng cho tất cả đau khổ. Có những đau khổ dường như quá lớn, quá vô nghĩa, quá tàn nhẫn so với bất kỳ mục đích phát triển nào có thể tưởng tượng được. Hick thừa nhận điều này."],["h4","2. Trật tự tự nhiên và hệ quả của nó"],["p","Một số nhà thần học lập luận rằng một thế giới có trật tự tự nhiên đủ vững chắc để hỗ trợ sự sống và tự do của con người cũng phải là một thế giới trong đó các quy luật vật lý vận hành một cách nhất quán. Và sự nhất quán đó có nghĩa là đôi khi con người bị tổn thương bởi chính những quy luật đó."],["p","Nước vừa cần thiết cho sự sống vừa có thể gây ra chết đuối. Lửa vừa giúp con người nấu thức ăn vừa có thể thiêu cháy. Trọng lực giữ chúng ta trên mặt đất và cũng làm chúng ta bị thương khi ngã. Một thế giới trong đó Thiên Chúa liên tục can thiệp để ngăn mọi hậu quả xấu của các quy luật tự nhiên sẽ là thế giới không thể dự đoán được – và không thể sống được theo cách con người tự do cần."],["h4","3. Sự hữu hạn của quan điểm con người"],["p","Sách Gióp kết thúc không bằng một câu trả lời thần học rõ ràng cho câu hỏi của Gióp – mà bằng sự hiện diện của Thiên Chúa và một loạt câu hỏi mà Ngài đặt cho Gióp: \"Ngươi ở đâu khi Ta đặt nền móng cho trái đất?\" Không phải để làm Gióp cảm thấy nhỏ bé, mà để gợi nhắc rằng quan điểm của con người về thực tại là rất hạn chế."],["p","Đây không phải là lý do để im lặng câu hỏi. Nhưng nó là lý do để giữ sự khiêm tốn: chúng ta không có toàn bộ thông tin. Những gì trông có vẻ hoàn toàn vô nghĩa từ góc nhìn của một khoảnh khắc trong lịch sử có thể nhìn khác đi từ một góc nhìn rộng hơn."],["h3","V. Đau Khổ Không Phải Là Ý Nghĩa – Nhưng Có Thể Mang Ý Nghĩa"],["p","Có một điều quan trọng cần phân biệt: đau khổ không có ý nghĩa tự nhiên trong bản thân nó – nhưng đau khổ có thể được mang ý nghĩa bởi cách người ta đối mặt với nó."],["p","Viktor Frankl, nhà tâm lý học người Áo sống sót sau Holocaust, viết trong cuốn \"Man's Search for Meaning\": \"Mọi thứ có thể bị lấy đi khỏi một người ngoại trừ một điều: quyền tự do cuối cùng của con người – quyền chọn thái độ của mình trong bất kỳ hoàn cảnh nào, quyền chọn con đường của mình.\""],["p","Điều này không có nghĩa là đau khổ là tốt, hay chúng ta nên chấp nhận những điều gây ra đau khổ không công bằng. Nó có nghĩa là ngay cả trong đau khổ mà con người không chọn và không gây ra, vẫn có một không gian của tự do – không gian để chọn cách đáp ứng với đau khổ đó."],["p","Và trong truyền thống Ki-tô giáo, đau khổ đó không phải là đau khổ một mình. Có Đấng đã đi qua đau khổ và đến bên kia."],["h3","VI. Kết Chương 3 – Bình Và Căn Phòng Bệnh Viện"],["p","Bình không nhận được câu trả lời cho câu hỏi của cô. Ung thư vẫn ở đó. Quá trình điều trị vẫn đau đớn. Tương lai vẫn không chắc chắn."],["p","Nhưng có điều gì đó thay đổi khi cô đọc Rm 8: cô không phải là người duy nhất rên siết. Toàn bộ tạo vật đang rên siết cùng cô. Và sự rên siết đó không phải là tiếng kêu cuối cùng – nó là tiếng kêu của điều đang chờ đợi điều gì đó mới."],["p","Đây không phải là sự an ủi rẻ tiền. Nhưng nó là một sự đồng hành: bạn không rên siết một mình, và câu chuyện chưa kết thúc."],["refl","CÂU HỎI SUY NGẪM — Chương 3",["<i>Bạn đã từng đối mặt với đau khổ mà không có \"thủ phạm\" rõ ràng chưa – bệnh tật, tai nạn, mất mát? Bạn xử lý câu hỏi \"tại sao\" đó như thế nào?<\/i>","<i>Ba phần trả lời trong chương này – linh hồn-làm, trật tự tự nhiên, giới hạn quan điểm – cái nào gần nhất với trải nghiệm của bạn?<\/i>","<i>Frankl nói về \"quyền chọn thái độ\" trong đau khổ. Bạn đã từng thấy điều đó trong thực tế – trong cuộc sống của bạn hay người khác?<\/i>","<i>[Nhóm nhỏ] Chia sẻ một người bạn đã biết – hoặc một câu chuyện bạn đã đọc – về ai đó đối mặt với đau khổ tự nhiên theo cách làm bạn ngạc nhiên hay truyền cảm hứng. Điều gì ở họ mà bạn thấy đặc biệt?<\/i>","<i>[Nhóm nhỏ] Theo bạn, có ranh giới nào giữa \"chấp nhận đau khổ theo đức tin\" và \"chấp nhận những điều gây ra đau khổ bất công\" không?<\/i>","<i>[Nhóm nhỏ] Hình ảnh \"tạo vật rên siết như sắp sinh nở\" gợi lên gì trong bạn về ý nghĩa của đau khổ hiện tại trong bức tranh lớn hơn của câu chuyện Thiên Chúa đang kể?<\/i>"]]]},{"k":"ch","l":"Phần 2 · Chương 4","t":"Thiên Chúa Ở Đâu Khi Tôi Đau Khổ?","pb":null,"b":[["q","Ngài không khinh, không ghét kẻ khốn cùng đang chịu cực khổ, không ẩn mặt trước họ, nhưng nghe tiếng họ kêu cầu.","Tv 22,25"],["h3","I. Câu Chuyện Của Lan"],["p","Lan ba mươi tuổi, và cô đã đi qua một năm dài nhất trong cuộc đời. Mẹ cô mắc bệnh Alzheimer và đang trong giai đoạn nặng. Cô là con gái một, sống một mình, không có anh chị em để chia sẻ gánh nặng chăm sóc. Mỗi tuần cô đến bệnh viện, mỗi lần mẹ cô nhìn cô như nhìn người xa lạ."],["p","Cô không ngừng đức tin. Cô vẫn cầu nguyện. Nhưng có một câu hỏi cô không nói thành tiếng với ai vì cô nghĩ nó nghe \"không đạo đức\": \"Thiên Chúa ở đâu trong căn phòng bệnh viện đó?\""],["p","Không phải câu hỏi lý thuyết. Là câu hỏi của người đang ngồi bên giường bệnh lúc hai giờ sáng, không ngủ được, và nhìn ra bóng tối."],["h3","II. Sự Hiện Diện Trong Vắng Mặt"],["p","Có một thực tế nghịch lý trong Kinh Thánh: Thiên Chúa đôi khi gần nhất khi cảm thấy xa nhất. Và ngược lại, cảm giác gần gũi không phải lúc nào cũng là bằng chứng của sự hiện diện thật."],["p","Tv 22 – bài Thánh Vịnh mà Đức Giê-su kêu lên trên Thập Giá – bắt đầu bằng tiếng kêu của sự vắng mặt: \"Lạy Thiên Chúa, lạy Thiên Chúa của con, sao Ngài bỏ con?\" Nhưng nó kết thúc bằng sự nhận thức về sự hiện diện thật: \"Ngài không ẩn mặt trước họ, nhưng nghe tiếng họ kêu cầu.\""],["p","Bài Thánh Vịnh không giải thích sự thay đổi đó diễn ra như thế nào. Không có khoảnh khắc thần hiện rõ ràng, không có câu trả lời từ trời. Chỉ là – trong khoảng giữa sự kêu gào và sự nhận thức – có điều gì đó thay đổi trong cách nhìn của người cầu nguyện."],["p","Đây là thực tế của đức tin trong đau khổ: không phải là sự vắng mặt của câu hỏi, mà là sự kiên trì trong khi câu hỏi còn chưa được trả lời."],["h3","III. Nhập Thể – Thiên Chúa Đã Đến"],["p","Câu trả lời sâu sắc nhất của Kinh Thánh cho câu hỏi \"Thiên Chúa ở đâu khi tôi đau khổ?\" không phải là câu trả lời – đó là một sự kiện: Nhập Thể."],["p","Ga 1,14 viết: \"Ngôi Lời đã trở nên người phàm và cư ngụ giữa chúng ta.\" Thiên Chúa không gửi thông điệp từ xa. Ngài bước vào trong. Ngài trở nên một con người thật, sống trong một thân xác thật, trong một thế giới thật với những đau khổ thật."],["p","Thư Do Thái 4,15 nói: \"Vị Thượng Tế của chúng ta không phải là Đấng không có khả năng cảm thương những yếu đuối của ta, vì Người đã chịu thử thách về mọi phương diện cũng như ta, nhưng không phạm tội.\" \"Về mọi phương diện\" – đây không phải là câu trả lời trừu tượng. Đây là sự tuyên bố rằng Đấng chúng ta hướng đến biết từ bên trong thế nào là mệt mỏi, thế nào là đói, thế nào là cô đơn, thế nào là bị phản bội, thế nào là chịu đựng cái chết."],["p","Điều đó không xóa bỏ đau khổ của Lan. Nhưng nó trả lời câu hỏi \"Thiên Chúa ở đâu?\" theo cách khác hơn cô tưởng: Ngài không ngồi trong một trạng thái vô cảm ở trên cao nhìn xuống. Ngài biết."],["h3","IV. Thập Giá – Điểm Gặp Gỡ Của Đau Khổ"],["p","Nhưng Nhập Thể không phải là điểm cuối cùng. Điểm cuối cùng – hay đúng hơn là điểm trung tâm – là Thập Giá."],["p","Trên Thập Giá, Đức Giê-su trải nghiệm điều mà các nhà thần học gọi là \"sự bỏ rơi của Thiên Chúa\" – Ngài kêu lên Tv 22 và cảm thấy sự vắng mặt của Cha. Đây không phải là diễn xuất. Đây là thực tại thần học sâu sắc nhất mà Ki-tô giáo tuyên bố: Con Thiên Chúa đã đi vào chỗ tối tăm nhất của trải nghiệm con người – sự xa cách hoàn toàn khỏi Thiên Chúa."],["p","Điều đó có nghĩa gì thực tế? Nó có nghĩa là không có chỗ tối tăm nào của con người mà Thiên Chúa chưa đặt chân vào. Không có đáy vực nào của đau khổ mà Ngài không biết từ bên trong. Khi Lan ngồi trong bóng tối lúc hai giờ sáng và không cảm thấy gì ngoài sự vắng mặt, Thiên Chúa không đứng bên ngoài nhìn vào – Ngài biết cái cảm giác đó."],["p","Và rồi – Phục Sinh. Không phải như câu trả lời giải thích Thập Giá, mà như sự vượt qua Thập Giá. Cái chết không phải là điểm cuối. Và điều đó thay đổi tất cả – không phải bằng cách làm cho đau khổ hiện tại biến mất, mà bằng cách tuyên bố rằng đau khổ hiện tại không phải là thực tại cuối cùng."],["h3","V. Sự Hiện Diện Của Thiên Chúa Qua Người Khác"],["p","Có một cách Thiên Chúa hiện diện trong đau khổ mà đôi khi chúng ta bỏ qua vì nó quá cụ thể, quá bình thường: Ngài hiện diện qua người khác."],["p","Mt 25,35-40 mô tả một trong những hình ảnh đáng ngạc nhiên nhất của Đức Giê-su: \"Ta đói, các ngươi đã cho ăn; Ta khát, các ngươi đã cho uống... những gì các ngươi đã làm cho một trong những anh em bé nhỏ nhất của Ta đây, là các ngươi đã làm cho chính Ta vậy.\""],["p","Thiên Chúa hiện diện trong khuôn mặt của người đang đau khổ. Và Ngài cũng hiện diện qua những người đến để ở cùng người đó."],["p","Điều này không phải là giải pháp triết học cho vấn đề của cái ác. Nhưng nó là câu trả lời thực tế cho câu hỏi \"Thiên Chúa ở đâu?\": Ngài hiện diện qua cộng đồng của những người đang cố gắng sống theo hình ảnh của Ngài. Và điều đó đặt ra trách nhiệm: chúng ta là một phần của cách Thiên Chúa hiện diện trong thế giới với đau khổ."],["h3","VI. Điều Chúng Ta Không Nên Nói"],["p","Trong tất cả những điều đã viết trong chương này, cần dừng lại và nói thẳng về điều chúng ta không nên làm với người đang đau khổ."],["p","Không phải mọi sự thật đều là điều đúng đắn để nói trong mọi hoàn cảnh. Khi Gióp đang rên siết, ba người bạn của anh – Êliphát, Bilđát, Xôpha – đến với những giải thích thần học. Và cuối cùng Thiên Chúa phán với họ: \"Ta nổi giận với anh và hai bạn anh, vì các anh đã không nói đúng về Ta, như đầy tớ Ta là Gióp đã nói.\""],["p","Đôi khi điều đúng nhất để làm là điều mà ba người bạn của Gióp đã làm trong bảy ngày đầu, trước khi họ bắt đầu giải thích: họ \"ngồi xuống bên cạnh Gióp dưới đất suốt bảy ngày bảy đêm, không ai nói với Gióp một lời, vì họ thấy nỗi đau của người quá lớn\" (Gióp 2,13)."],["p","Sự hiện diện lặng yên đôi khi là câu trả lời thật nhất cho câu hỏi \"Thiên Chúa ở đâu?\": Ngài ở đây, trong người đang ngồi cùng bạn."],["h3","VII. Kết Chương 4 – Lan Và Bóng Tối"],["p","Lan vẫn không có câu trả lời cho câu hỏi tại sao mẹ cô phải chịu bệnh này. Câu hỏi đó vẫn còn đó."],["p","Nhưng một điều đã thay đổi sau khi cô đọc Tv 22: cô nhận ra rằng câu hỏi \"Thiên Chúa ở đâu?\" không phải là câu hỏi của sự thiếu đức tin. Đức Giê-su đã hỏi câu đó. Và trong việc hỏi câu đó, Ngài không xa cách Thiên Chúa – Ngài đang kêu gọi Thiên Chúa từ chỗ sâu nhất của đau khổ con người."],["p","Đây không phải là sự an ủi rẻ. Đây là sự đồng hành thật: bạn đang hỏi câu hỏi mà chính Đức Giê-su đã hỏi. Và Ngài đi qua bóng tối và đến bên kia."],["refl","CÂU HỎI SUY NGẪM — Chương 4",["<i>Câu hỏi \"Thiên Chúa ở đâu khi tôi đau khổ?\" – bạn đã từng đặt ra câu đó chưa? Bạn đã tìm thấy câu trả lời – hay sự hiện diện – nào không?<\/i>","<i>Hình ảnh Đức Giê-su trên Thập Giá kêu lên \"sao Ngài bỏ con\" – điều đó có ý nghĩa gì với bạn trong những lúc cảm thấy Thiên Chúa im lặng?<\/i>","<i>Bạn có ai trong cuộc sống mà sự hiện diện của họ trong những khoảnh khắc khó khăn đã cảm thấy như sự hiện diện của Thiên Chúa không?<\/i>","<i>[Nhóm nhỏ] Chia sẻ về một khoảnh khắc bạn đã là \"sự hiện diện của Thiên Chúa\" cho ai đó đang đau khổ – không phải bằng câu trả lời, mà bằng sự hiện diện. Điều đó cảm thấy như thế nào?<\/i>","<i>[Nhóm nhỏ] Câu chuyện ba người bạn của Gióp – lúc đầu họ im lặng bảy ngày, rồi bắt đầu giải thích và sai. Theo bạn, ranh giới giữa \"hiện diện hỗ trợ\" và \"giải thích không cần thiết\" là ở đâu?<\/i>","<i>[Nhóm nhỏ] Trong cộng đoàn của bạn, người đang đau khổ có cảm thấy an toàn để bày tỏ sự nghi ngờ và câu hỏi không? Nếu không, điều gì cần thay đổi?<\/i>"]]]},{"k":"ch","l":"Phần 2 · Chương 5","t":"Hy Vọng Thật: Đau Khổ Không Phải Là Điểm Cuối","pb":null,"b":[["q","Tôi nghĩ rằng những đau khổ chúng ta chịu bây giờ không đáng so sánh với vinh quang mà Thiên Chúa sẽ mặc khải nơi chúng ta.","Rm 8,18"],["h3","I. Câu Chuyện Của Tâm"],["p","Tâm bốn mươi tuổi, đã đi qua mười năm trị liệu sau khi sống sót qua trầm cảm nặng. Trong những năm tồi tệ nhất, anh đã muốn kết thúc tất cả. Anh không kết thúc – nhưng bóng tối của giai đoạn đó vẫn còn đó như một ký ức thể xác."],["p","Bây giờ, nhìn lại, anh không nói rằng trầm cảm là điều tốt hay là \"ý Chúa\". Anh nói điều khác hơn: \"Tôi không hiểu tại sao tôi phải đi qua điều đó. Nhưng tôi không còn là người như cũ. Và người tôi là bây giờ không thể tách rời khỏi những gì tôi đã đi qua.\""],["p","Anh không thể đi ngược thời gian và xóa bỏ những năm đó. Nhưng anh cũng không muốn – không phải vì chúng không đau đớn, mà vì cái người anh đang là, cái chiều sâu anh có thể tiếp xúc với đau khổ của người khác, cái sự biết ơn đơn giản mà anh có với từng ngày bình thường – những điều đó mang dấu vết của hành trình đó."],["p","Câu chuyện của Tâm không phải là bằng chứng thần học. Nhưng nó gợi lên điều mà Rm 8,28 và nhiều đoạn văn khác trong Kinh Thánh cố gắng diễn đạt."],["h3","II. Rm 8,28 – Câu Văn Bị Hiểu Sai Nhiều Nhất"],["p","\"Chúng ta biết rằng: Thiên Chúa làm cho mọi sự đều sinh ích cho những ai yêu mến Người, tức là cho những kẻ được Người kêu gọi theo như ý Người định.\" – Rm 8,28 Câu văn này thường bị diễn giải sai theo hai hướng đối lập:"],["p","Hướng sai thứ nhất: \"Mọi thứ xảy ra đều là tốt\" – tức là bệnh tật, mất mát, bất công đều thực sự là tốt lành về bản chất. Nhưng đây không phải điều Phao-lô nói. Ông không nói rằng mọi thứ là tốt – ông nói Thiên Chúa làm việc trong mọi thứ để mang lại điều tốt."],["p","Hướng sai thứ hai: \"Nếu bạn đủ tin tưởng, mọi thứ sẽ ổn\" – một kiểu thần học thịnh vượng. Nhưng Phao-lô viết câu này ngay sau khi mô tả \"toàn thể tạo vật đang rên siết\" và \"chính chúng ta cũng rên siết\". Đây không phải là câu văn hứa hẹn sự tránh né đau khổ."],["p","Điều Phao-lô thực sự nói là: trong bàn tay của Thiên Chúa, ngay cả những điều không tốt – ngay cả đau khổ, mất mát, bất công – có thể được biến thành nguyên liệu của điều gì đó tốt lành. Đây không phải là lý thuyết thoải mái. Đây là tuyên bố về năng lực biến đổi của Thiên Chúa – năng lực lấy cái chết và biến nó thành sự sống, như đã xảy ra trên Thập Giá."],["h3","III. Sự Phục Sinh – Không Phải Sự Xóa Bỏ, Mà Sự Biến Đổi"],["p","Sự Phục Sinh của Đức Giê-su là trung tâm của hy vọng Ki-tô giáo về đau khổ. Nhưng cần hiểu đúng về ý nghĩa của nó."],["p","Thân xác Phục Sinh của Đức Giê-su không phải là thân xác mới hoàn toàn, không có lịch sử. Theo các trình thuật Phúc Âm, thân xác đó vẫn mang dấu vết của Thập Giá: \"Rồi Người nói với ông Tôma: 'Đặt ngón tay vào đây, và hãy nhìn xem tay Thầy. Đưa tay ra mà đặt vào cạnh sườn Thầy'\" (Ga 20,27)."],["p","Thương tích vẫn còn đó – nhưng không còn là nguồn gốc của cái chết. Chúng đã được biến đổi thành bằng chứng của tình yêu và chiến thắng. Đây là hình ảnh của hy vọng Phục Sinh: không phải là lịch sử đau khổ bị xóa đi như thể nó không bao giờ xảy ra, mà là lịch sử đau khổ được biến đổi và tích hợp vào một thực tại mới."],["p","Điều này có ý nghĩa gì cho Lan, cho Bình, cho Hà, cho Tâm? Nó không có nghĩa là đau khổ của họ là không thật hay không quan trọng. Nó có nghĩa là đau khổ đó không phải là điểm cuối của câu chuyện của họ – và trong bàn tay của Đấng đã biến Thập Giá thành Phục Sinh, không có đau khổ nào là điểm cuối."],["h3","IV. Khóc Cùng Người Khóc – Không Phải Giải Thích Cho Người Khóc"],["p","Rm 12,15 chứa một trong những mệnh lệnh ngắn gọn nhất và khó nhất của Phao-lô: \"Vui với người vui, khóc với người khóc.\""],["p","Câu này đặt ra một thách thức cụ thể cho những ai muốn đồng hành với người đang đau khổ. Cám dỗ tự nhiên khi ngồi bên người đang đau khổ là giải thích, khuyên nhủ, đưa ra câu trả lời thần học, hay cố gắng làm cho họ cảm thấy tốt hơn nhanh chóng. Tất cả những phản ứng đó thường đến từ sự khó chịu của chính chúng ta trước đau khổ của người khác."],["p","Khóc với người khóc đòi hỏi điều khác: khả năng ngồi trong sự khó chịu của đau khổ mà không vội vàng thoát ra khỏi nó. Không phải làm cho đau khổ biến đi – mà là hiện diện với người đang trong đó."],["p","Đây không chỉ là câu khuyên về thực hành. Đây là câu khuyên thần học: khi chúng ta hiện diện với ai đó đang đau khổ theo cách này, chúng ta đang làm điều Thiên Chúa đã làm qua Nhập Thể – bước vào trong, không phải nhìn từ ngoài vào."],["h3","V. Hy Vọng Thật Không Phải Là Sự Lạc Quan"],["p","Phân biệt quan trọng: hy vọng Ki-tô giáo không phải là chủ nghĩa lạc quan. Lạc quan nói \"mọi thứ rồi sẽ ổn\" mà không có cơ sở rõ ràng. Hy vọng Ki-tô giáo nói điều khác hơn – và khó hơn: \"Mọi thứ có thể không ổn trong cuộc sống này. Nhưng đây không phải là tất cả câu chuyện.\""],["p","Đây là hy vọng được neo đậu vào một sự kiện lịch sử cụ thể: Phục Sinh. Không phải hy vọng vào \"mọi thứ sẽ tốt hơn\" nói chung, mà là hy vọng vào Đấng đã đứng dậy từ cái chết và hứa rằng câu chuyện chưa kết thúc."],["p","Phao-lô có thể viết Rm 8,18 – \"những đau khổ chúng ta chịu bây giờ không đáng so sánh với vinh quang mà Thiên Chúa sẽ mặc khải\" – không phải vì ông không biết đau khổ là gì. Ông biết từ trong xương tủy: bị tù, bị đánh đòn, bị đắm tàu, bị phản bội, sống với \"cái dằm trong xác thịt\" không được cất đi. Ông không nói câu đó từ vị trí an toàn. Ông nói từ vị trí của người đã trải qua và vẫn đứng vững."],["h3","VI. Kết Chương 5 – Và Tổng Kết Phần 2"],["p","Hà mất người bạn và hỏi tại sao. Bình nhận được chẩn đoán ung thư và hỏi tại sao. Lan ngồi bên giường mẹ và hỏi Thiên Chúa ở đâu. Tâm đi qua bóng tối và không chắc có câu trả lời nào."],["sum","TỔNG KẾT PHẦN 2 – CÁI ÁC VÀ ĐAU KHỔ",["<b>Chương 1: <\/b>Câu hỏi về cái ác và đau khổ là thật và không nên bị tránh né – Kinh Thánh không tránh né nó.","<b>Chương 2: <\/b>Cái ác đạo đức có liên quan đến tự do ý chí và sự liên đới của con người – và Thiên Chúa đã trả giá cao nhất để đối mặt với nó.","<b>Chương 3: <\/b>Cái ác tự nhiên không có câu trả lời hoàn toàn thỏa đáng – nhưng tạo vật đang rên siết trong sự kỳ vọng, không phải trong tuyệt vọng.","<b>Chương 4: <\/b>Thiên Chúa hiện diện trong đau khổ – qua Nhập Thể, qua Thập Giá, qua người khác – không phải là người quan sát từ xa.","<b>Chương 5: <\/b>Hy vọng thật không xóa bỏ đau khổ nhưng không để đau khổ là điểm cuối – vì có Đấng đã đứng dậy."]],["p","Câu hỏi lớn nhất không phải là câu hỏi lý thuyết: \"Tại sao Thiên Chúa cho phép cái ác?\" Câu hỏi thật là câu hỏi quan hệ: \"Trong thế giới với cái ác và đau khổ như thế này, tôi có thể tin tưởng vào Đấng này không?\""],["p","Đó là câu hỏi mà mỗi người phải trả lời không phải bằng lập luận, mà bằng cách sống. Và hành trình của chúng ta tiếp tục."],["refl","CÂU HỎI SUY NGẪM — Chương 5",["<i>Câu chuyện của Tâm – đi qua đau khổ và trở thành người khác – bạn có trải nghiệm tương tự không? Điều gì từ những giai đoạn khó khăn nhất của bạn đã hình thành bạn theo cách bạn không thể tưởng tượng nếu không có chúng?<\/i>","<i>Sự khác biệt giữa \"lạc quan\" và \"hy vọng\" có ý nghĩa gì với bạn hôm nay?<\/i>","<i>Nếu thương tích của Đức Giê-su Phục Sinh vẫn còn đó nhưng đã được biến đổi – điều đó gợi lên gì cho bạn về những \"thương tích\" trong chính cuộc sống của bạn?<\/i>","<i>[Nhóm nhỏ] Trong nhóm, ai đang ở trong giai đoạn mà hy vọng cảm thấy xa xôi? Nhóm có thể làm gì cụ thể – không phải bằng lời giải thích – để hiện diện với người đó?<\/i>","<i>[Nhóm nhỏ] \"Khóc với người khóc\" – bạn thấy điều này khó hay dễ? Điều gì khiến bạn muốn vội vàng \"sửa chữa\" đau khổ của người khác thay vì chỉ ở cùng?<\/i>","<i>[Nhóm nhỏ] Sau tất cả những điều đã thảo luận trong Phần 2 , câu hỏi \"Tôi có thể tin tưởng vào Thiên Chúa trong thế giới như thế này không?\" đang đứng ở đâu trong bạn?<\/i>"]]]},{"k":"ch","l":"Phần 3 · Chương 1","t":"Câu Hỏi Của Người Đứng Giữa Dòng Chảy","pb":["PHẦN 3","LỊCH SỬ VÀ SỰ QUAN PHÒNG","Thiên Chúa Có Đang Làm Gì Không?"],"b":[["q","Đức Chúa phán: Tư tưởng của Ta không phải là tư tưởng của các ngươi, và đường lối các ngươi không phải là đường lối của Ta.","Is 55,8"],["h3","I. Câu Chuyện Của Khang"],["p","Khang ba mươi lăm tuổi. Anh là người theo dõi tin tức một cách nghiêm túc – không phải loại người cuộn điện thoại vô thức, mà là người thực sự đọc và suy nghĩ về những gì đang xảy ra. Và chính vì điều đó, anh thường xuyên cảm thấy một thứ gì đó nặng nề mà anh không biết đặt tên."],["p","Không phải tức giận. Không phải tuyệt vọng. Mà là một cảm giác chóng mặt – như thể đứng nhìn một dòng sông chảy quá nhanh và không thể theo kịp. Mỗi tuần lại có một sự kiện mới, một biến động mới, một khủng hoảng mới. Chính trị, chiến tranh, thiên tai, dịch bệnh, công nghệ thay đổi chóng mặt, những cấu trúc xã hội cũ đang rạn nứt."],["p","Và câu hỏi mà anh không dám hỏi thành tiếng – vì nó nghe có vẻ ngây thơ với người theo dõi tin tức mỗi ngày – là câu hỏi này:"],["h4","\"Thiên Chúa đang ở đâu trong tất cả những điều đang xảy ra?\""],["p","Không phải câu hỏi về sự tồn tại của Thiên Chúa. Anh không đặt câu hỏi đó. Mà là câu hỏi cụ thể hơn, thực tế hơn: Nếu Ngài đang làm gì đó trong lịch sử – Ngài đang làm gì? Và làm thế nào con người có thể nhận ra điều đó?"],["p","Đây là câu hỏi của Phần 3."],["h3","II. Ba Cách Hiểu Lịch Sử"],["p","Trước khi đến câu trả lời của Kinh Thánh, cần nhìn vào những khung khác nhau mà con người dùng để hiểu lịch sử – vì khung bạn dùng sẽ quyết định điều bạn thấy."],["h4","1. Lịch sử là vòng tròn"],["p","Nhiều nền văn hóa cổ đại – Hy-lạp, Ấn Độ, nhiều truyền thống Đông Á – nhìn lịch sử như một vòng tròn: các chu kỳ thịnh-suy, sinh-diệt, lên-xuống lặp đi lặp lại không ngừng. Không có điểm đến. Không có ý nghĩa tiến bộ. Chỉ là sự tuần hoàn vĩnh cửu."],["p","Quan điểm này mang lại sự bình an theo một nghĩa nào đó – chấp nhận chu kỳ. Nhưng nó không có chỗ cho khái niệm về ý nghĩa: nếu mọi thứ cuối cùng đều quay về điểm xuất phát, không có gì thực sự quan trọng về mặt vũ trụ."],["h4","2. Lịch sử là đường thẳng tiến bộ"],["p","Thế giới hiện đại, đặc biệt từ thế kỷ 18 trở đi, đã đặt một niềm tin mạnh mẽ vào tiến bộ: lịch sử đang đi về phía trước, về phía một trạng thái tốt hơn, nhờ lý trí, khoa học, và công nghệ. Con người đang trở nên văn minh hơn, nhân đạo hơn, tiến bộ hơn."],["p","Thế kỷ 20 đã làm rung chuyển niềm tin đó một cách tàn khốc: Thế Chiến I, Thế Chiến II, Holocaust, hàng chục cuộc diệt chủng lớn nhỏ, vũ khí hạt nhân. Những thành tựu công nghệ lớn nhất của nhân loại cũng tạo ra những công cụ hủy diệt lớn nhất. Chủ thuyết tiến bộ không thể giải thích tại sao những nền văn minh \"tiến bộ nhất\" lại có thể phạm những tội ác kinh khủng nhất."],["h4","3. Lịch sử là hỗn loạn vô nghĩa"],["p","Một số quan điểm hậu hiện đại kết luận rằng lịch sử không có câu chuyện lớn, không có hướng đi, không có ý nghĩa tổng thể. Chỉ là những sự kiện xảy ra, được giải thích theo cách khác nhau bởi những người có quyền lực khác nhau. Không có \"phía đúng của lịch sử\" vì không có hướng đi nào để phán xét."],["p","Quan điểm này trung thực về sự phức tạp – nhưng nó để lại con người trong trạng thái hoàn toàn mất phương hướng. Nếu không có câu chuyện lớn, không có tại sao của lịch sử, thì sự đấu tranh cho công bằng hay điều tốt lành cũng chỉ là một lựa chọn tùy tiện như bất kỳ điều gì khác."],["h3","III. Kinh Thánh Và Lịch Sử – Câu Chuyện Có Điểm Đến"],["p","Kinh Thánh đưa ra một cách nhìn lịch sử khác hoàn toàn so với ba cách trên. Nó không phải là vòng tròn, không phải là tiến bộ tự động, và không phải là hỗn loạn."],["p","Kinh Thánh nhìn lịch sử như là một câu chuyện có điểm bắt đầu (sáng tạo), có những biến cố quyết định (sa ngã, giao ước, Nhập Thể, Phục Sinh), và có điểm đến (sự hoàn tất của Vương Quốc Thiên Chúa). Và trong câu chuyện đó, Thiên Chúa không phải là khán giả – Ngài là Đấng đang hành động."],["p","Nhưng điều quan trọng cần nói ngay từ đầu: Kinh Thánh không hứa rằng chúng ta sẽ có thể đọc và hiểu từng trang của câu chuyện đó từ vị trí của mình. Is 55,8-9 nhắc nhở một cách khiêm tốn:"],["q","Tư tưởng của Ta không phải là tư tưởng của các ngươi, và đường lối các ngươi không phải là đường lối của Ta. Trời cao hơn đất bao nhiêu, đường lối của Ta cũng cao hơn đường lối các ngươi, và tư tưởng của Ta cũng cao hơn tư tưởng các ngươi bấy nhiêu.","Is 55,8-9"],["p","Sự khiêm tốn nhận thức này không phải là lý do để từ bỏ câu hỏi. Nó là khuôn khổ để tiếp cận câu hỏi một cách trung thực: chúng ta nhìn thấy một phần, không phải toàn bộ. Nhưng phần chúng ta nhìn thấy là thật – và đủ để sống."],["h3","IV. Sự Quan Phòng – Không Phải Định Mệnh"],["p","Học thuyết về sự quan phòng (Providence) là câu trả lời thần học của Ki-tô giáo cho câu hỏi \"Thiên Chúa đang làm gì trong lịch sử?\" Nhưng nó thường bị hiểu sai theo hai hướng."],["p","Hướng sai thứ nhất là định mệnh cứng nhắc: mọi thứ xảy ra đều là \"ý Chúa\" theo nghĩa Thiên Chúa trực tiếp lên kế hoạch và thực hiện mọi sự kiện, kể cả những sự kiện tàn ác. Khi đó, câu hỏi về cái ác trở nên không có câu trả lời thỏa đáng."],["p","Hướng sai thứ hai là thuyết không can thiệp: Thiên Chúa tạo ra thế giới rồi bước ra ngoài và để nó tự vận hành. Thiên Chúa hiện diện về mặt lý thuyết, nhưng không liên quan đến thực tế của lịch sử."],["p","Sự quan phòng theo Kinh Thánh là điều gì đó khác và phức tạp hơn cả hai: Thiên Chúa đang hoạt động trong lịch sử – thật sự hoạt động, không phải chỉ quan sát – nhưng Ngài làm điều đó theo cách tôn trọng tự do thực sự của con người và những quy luật tự nhiên của tạo vật. Ngài không can thiệp vào mọi quyết định nhỏ, nhưng Ngài không bỏ cuộc khi câu chuyện đi lệch hướng."],["h3","V. Kết Chương 1 – Khang Và Câu Hỏi Mới"],["p","Khang không nhận được bản đồ chi tiết của lịch sử sau khi đặt câu hỏi. Không ai có bản đồ đó."],["p","Nhưng có điều gì đó thay đổi trong cách anh đọc tin tức: thay vì hỏi \"Lịch sử đang đi đâu?\" với sự hoang mang, anh bắt đầu hỏi \"Thiên Chúa đang làm gì ở đây?\" với sự tỉnh thức. Không phải câu hỏi của người biết câu trả lời – mà câu hỏi của người đang học cách nhìn."],["p","Trong các chương tiếp theo, chúng ta sẽ đi sâu hơn: Thiên Chúa đã hành động trong lịch sử như thế nào (Chương 2), sự quan phòng trông như thế nào trong cuộc sống cụ thể (Chương 3), và chúng ta phải làm gì khi không thể nhìn thấy bàn tay Thiên Chúa (Chương 4)."],["refl","CÂU HỎI SUY NGẪM — Chương 1",["<i>Khi nhìn vào những sự kiện đang xảy ra trong thế giới hiện nay, bạn có xu hướng cảm thấy Thiên Chúa đang hiện diện hay vắng mặt? Điều gì định hình cái nhìn đó?<\/i>","<i>Ba cách hiểu lịch sử – vòng tròn, tiến bộ, hỗn loạn – cái nào gần nhất với cách bạn thực sự suy nghĩ, không phải cách bạn nghĩ mình nên suy nghĩ?<\/i>","<i>Câu hỏi \"Thiên Chúa đang làm gì?\" có khác gì với câu hỏi \"Tại sao điều này xảy ra?\" trong cách bạn tiếp cận những sự kiện khó hiểu không?<\/i>","<i>[Nhóm nhỏ] Chia sẻ một sự kiện trong lịch sử hay trong cuộc sống cá nhân bạn mà bạn cảm thấy không thể hiểu được từ góc nhìn của mình. Điều đó ảnh hưởng thế nào đến đức tin của bạn?<\/i>","<i>[Nhóm nhỏ] Theo bạn, niềm tin vào \"sự quan phòng\" có nguy cơ bị dùng để chấp nhận những điều bất công một cách thụ động không? Làm thế nào để tránh sự lạm dụng đó?<\/i>","<i>[Nhóm nhỏ] Is 55,8-9 nói về khoảng cách vô hạn giữa tư tưởng Thiên Chúa và tư tưởng con người. Điều đó làm bạn cảm thấy khiêm tốn hay nản lòng, hay cả hai?<\/i>"]]]},{"k":"ch","l":"Phần 3 · Chương 2","t":"Dấu Tích Của Thiên Chúa Trong Dòng Chảy Lịch Sử","pb":null,"b":[["q","Đây, Ta sắp làm một điều mới, điều đó đang nảy sinh, há các ngươi không nhận ra sao?","Is 43,19"],["h3","I. Câu Chuyện Của Diễm"],["p","Diễm hai mươi chín tuổi, học lịch sử ở đại học. Điều nghịch lý là học lịch sử càng nhiều, cô càng khó tin rằng có một \"ý nghĩa\" nào trong đó. Cô biết quá nhiều về những sai lầm của lịch sử – những cuộc chiến tranh nhân danh tôn giáo, những đế chế được xây dựng trên lưng người nô lệ, những nhà lãnh đạo được ca tụng rồi bị lật đổ, những \"bước tiến của văn minh\" mà hóa ra là thảm họa."],["p","Cô không phải người vô tín. Nhưng cô gặp khó khăn thật sự khi cố kết nối điều mình tin về Thiên Chúa với điều mình biết về lịch sử loài người. Làm thế nào một Đấng tốt lành và toàn năng có thể để lịch sử diễn ra như nó đã diễn ra?"],["p","Câu hỏi của Diễm không phải câu hỏi mới. Và Kinh Thánh không né tránh nó."],["h3","II. Kinh Thánh Và Lịch Sử Thật"],["p","Một trong những đặc điểm đáng chú ý nhất của Kinh Thánh là tính trung thực lịch sử của nó. Không giống nhiều văn bản tôn giáo khác, Kinh Thánh không kể câu chuyện về những vị anh hùng hoàn hảo. Nó kể câu chuyện về những con người thật, với những thất bại thật, trong những hoàn cảnh lịch sử thật."],["p","Áp-ra-ham – cha của dân tộc được chọn – đã nói dối hai lần về vợ mình vì sợ hãi. Đa-vít – \"người theo lòng Thiên Chúa\" – đã phạm tội ngoại tình và giết người. Phê-rô – \"tảng đá\" mà Giáo Hội được xây trên đó – đã chối Đức Giê-su ba lần. Các thánh tông đồ đã tranh nhau ngôi vị cao nhất ngay trong bữa tiệc ly."],["p","Và trên quy mô lớn hơn: dân Israel liên tục thất trung, các vua liên tục sa ngã, đế chế được xây dựng rồi sụp đổ, những lời hứa bị phá vỡ. Kinh Thánh không che giấu điều này. Nó ghi lại tất cả – kể cả những tội ác được thực hiện nhân danh Thiên Chúa – với sự trung thực đáng ngạc nhiên."],["p","Và trong tất cả những điều đó – câu chuyện vẫn tiếp tục. Không phải vì con người xứng đáng, mà vì Đấng đã bắt đầu câu chuyện không bỏ nó giữa chừng."],["h3","III. Những Hành Động Quyết Định Của Thiên Chúa Trong Lịch Sử"],["p","Kinh Thánh xác định một số thời điểm mà Thiên Chúa đã hành động một cách đặc biệt trong lịch sử – không phải theo nghĩa Ngài không làm gì ở những thời điểm khác, mà theo nghĩa những thời điểm này định hình toàn bộ câu chuyện."],["h4","1. Giao Ước Với Áp-ra-ham – Một Bắt Đầu Mới"],["p","Khi thế giới trong tình trạng sa ngã và hỗn loạn, Thiên Chúa gọi một người đàn ông ở Ur và nói: \"Hãy đi khỏi đất ngươi, khỏi họ hàng ngươi và khỏi nhà cha ngươi mà đi đến đất Ta sẽ chỉ cho ngươi\" (St 12,1). Đây không phải là sự khởi đầu của một chương trình tôn giáo – đây là hành động Thiên Chúa chọn một con người và qua đó bắt đầu tái lập mối quan hệ với toàn thể nhân loại."],["p","Giao ước với Áp-ra-ham mang theo một hứa hẹn rộng lớn hơn bất kỳ dân tộc nào: \"Nhờ ngươi mà mọi gia tộc trên mặt đất sẽ được chúc phúc\" (St 12,3). Ngay từ đầu, câu chuyện của Israel không phải là câu chuyện về một dân tộc đặc biệt được ưu đãi – mà là câu chuyện về phương tiện Thiên Chúa chọn để đến với toàn thể nhân loại."],["h4","2. Xuất Hành – Mẫu Hình Của Sự Giải Cứu"],["p","Cuộc Xuất Hành khỏi Ai Cập là sự kiện định hình nhất trong ký ức thần học của Israel – và theo một nghĩa nào đó, của toàn bộ thần học Ki-tô giáo. Đây là lần đầu tiên trong lịch sử được ghi lại mà Thiên Chúa hành động trực tiếp để giải phóng một dân tộc khỏi áp bức."],["p","Điều quan trọng không chỉ là sự kiện – mà là ý nghĩa thần học của nó: Thiên Chúa nghe tiếng kêu của người đau khổ. \"Ta đã thấy cảnh khổ cực của dân Ta bên Ai Cập, Ta đã nghe tiếng chúng kêu than vì những kẻ cai độc... và Ta đã xuống để giải thoát chúng\" (Xh 3,7-8). Đây là tuyên bố rằng Thiên Chúa không thờ ơ với đau khổ của con người trong lịch sử."],["h4","3. Nhập Thể, Thập Giá, Phục Sinh – Tâm Điểm Của Câu Chuyện"],["p","Phẩn.1 và 2 đã đề cập đến điều này, nhưng cần nhấn mạnh lại trong bối cảnh của lịch sử: sự kiện Đức Giê-su Ki-tô – Nhập Thể, Thập Giá, và Phục Sinh – là điểm trung tâm mà toàn bộ lịch sử nhân loại quy về."],["p","Nhà thần học N.T. Wright mô tả điều này bằng hình ảnh: nếu toàn bộ lịch sử là một vở kịch, thì Đức Giê-su Ki-tô là \"cảnh mấu chốt\" mà tất cả những gì xảy ra trước đó đều dẫn đến, và tất cả những gì xảy ra sau đó đều xuất phát từ. Không phải Ngài là nhân vật quan trọng nhất trong một câu chuyện về nhiều nhân vật – Ngài là điểm nhìn từ đó toàn bộ câu chuyện được hiểu đúng."],["p","Điều này không có nghĩa là lịch sử trước và sau Đức Ki-tô đều tự động \"có ý nghĩa\" theo nghĩa dễ hiểu. Nhưng nó có nghĩa là có một tâm điểm – và từ tâm điểm đó, ánh sáng tỏa ra để soi sáng những điều tối tăm khác."],["h3","IV. Thiên Chúa Hành Động Như Thế Nào – Không Phải Như Một Đạo Diễn Độc Đoán"],["p","Một trong những hiểu lầm phổ biến nhất về sự quan phòng là hình ảnh Thiên Chúa như một đạo diễn điều khiển mọi nhân vật theo kịch bản định sẵn. Kinh Thánh đưa ra một hình ảnh khác – phức tạp hơn và thực ra là đẹp hơn."],["p","Thiên Chúa hành động trong lịch sử qua:"],["ul",["Những lựa chọn tự do của con người – kể cả những lựa chọn sai lầm – mà Ngài dùng để tạo nên điều tốt lành theo cách con người không thể lường trước (St 50,20: \"Các anh đã định làm điều ác cho tôi, nhưng Thiên Chúa đã định làm điều tốt\")","Những con người cụ thể mà Ngài gọi và trao sứ mạng trong từng giai đoạn lịch sử","Những cộng đồng và thể chế mà Ngài dùng như phương tiện để bày tỏ bản chất Ngài trong thế giới","Những khoảnh khắc can thiệp đặc biệt mà Kinh Thánh gọi là \"thời điểm đã định\" hay \"kairós\" – không phải theo nghĩa thời gian thông thường (chronos), mà theo nghĩa thời điểm đúng của sự kiện quyết định"]],["p","Điều quan trọng là: Thiên Chúa không làm những điều này bằng cách vô hiệu hóa tự do và trách nhiệm của con người. Anh Giu-se bị bán sang Ai Cập vì sự ghen tị và độc ác của các anh – đó là tội thật. Nhưng Thiên Chúa đã dùng chính biến cố đó để cứu cả gia đình và dân tộc. Cả hai đều đúng cùng một lúc."],["h3","V. Kết Chương 2 – Diễm Và Cái Nhìn Mới"],["p","Diễm không thôi biết những điều phức tạp về lịch sử. Sự hiểu biết đó không biến mất. Nhưng có điều gì đó thay đổi trong cách cô đặt những sự kiện đó trong bức tranh lớn hơn."],["p","Thay vì nhìn lịch sử và hỏi \"Tại sao Thiên Chúa không làm cho nó tốt đẹp hơn?\", cô bắt đầu nhìn và hỏi \"Thiên Chúa đã làm gì trong chỗ này, qua những con người này, bất chấp và đôi khi ngay cả qua những thất bại của họ?\""],["p","Câu hỏi sau không dễ hơn câu hỏi trước. Nhưng nó dẫn đến một nơi khác."],["refl","CÂU HỎI SUY NGẪM — Chương 2",["<i>Bạn có cảm thấy khó tin vào sự quan phòng của Thiên Chúa khi biết nhiều về lịch sử tối tăm của nhân loại không? Điều gì cụ thể nhất làm bạn khó tin?<\/i>","<i>Câu chuyện của Giu-se – điều ác được dùng để tạo ra điều tốt – bạn có thể thấy điều tương tự xảy ra trong cuộc sống của mình không?<\/i>","<i>Nhập Thể, Thập Giá, Phục Sinh là \"tâm điểm\" của lịch sử – điều đó thay đổi gì trong cách bạn nhìn những sự kiện trước và sau đó trong lịch sử nhân loại?<\/i>","<i>[Nhóm nhỏ] Trong lịch sử mà bạn biết, có sự kiện nào mà bạn có thể nhìn thấy Thiên Chúa đang làm điều gì đó – dù không rõ ràng ngay lúc đó – không?<\/i>","<i>[Nhóm nhỏ] Theo bạn, sự khác biệt giữa \"Thiên Chúa điều khiển mọi thứ theo kịch bản\" và \"Thiên Chúa đang hoạt động trong lịch sử trong khi tôn trọng tự do con người\" có ý nghĩa gì trong cuộc sống đức tin?<\/i>","<i>[Nhóm nhỏ] Làm thế nào để học lịch sử với sự trung thực về những thất bại và tội ác, trong khi vẫn giữ được đức tin rằng Thiên Chúa đang làm gì đó có ý nghĩa?<\/i>"]]]},{"k":"ch","l":"Phần 3 · Chương 3","t":"Sự Quan Phòng Trong Cuộc Sống Cụ Thể","pb":null,"b":[["q","Chúng ta biết rằng: Thiên Chúa làm cho mọi sự đều sinh ích cho những ai yêu mến Người, tức là cho những kẻ được Người kêu gọi theo như ý Người định.","Rm 8,28"],["h3","I. Câu Chuyện Của Linh"],["p","Linh ba mươi hai tuổi. Ba năm trước, cô đã có kế hoạch rõ ràng cho cuộc sống: lập gia đình ở tuổi hai mươi chín, sinh con đầu lòng ở tuổi ba mươi mốt, tiếp tục công việc yêu thích trong lĩnh vực thiết kế đồ họa. Cô không phải người kiêu ngạo – cô chỉ là người thích kế hoạch."],["p","Rồi người cô tưởng sẽ cùng thực hiện kế hoạch đó chọn người khác. Công ty cô làm việc bị sáp nhập và cô mất việc. Và trong giai đoạn bầy tỏ nhiều nhất của cuộc đời, cô phải xây dựng lại từ đầu."],["p","Cô không mất đức tin. Nhưng cô mang theo một câu hỏi nặng nề: \"Nếu Thiên Chúa có kế hoạch, tại sao kế hoạch đó không giống kế hoạch của tôi? Và làm thế nào tôi biết được Ngài đang làm gì?\""],["p","Câu hỏi của Linh chạm vào điều mà Rm 8,28 được trích dẫn nhiều nhất – và cũng bị hiểu sai nhiều nhất."],["h3","II. Rm 8,28 – Không Phải Hứa Hẹn Mọi Thứ Sẽ Ổn"],["p","Rm 8,28 thường được trích dẫn như sự an ủi: \"Mọi sự đều sinh ích cho những ai yêu mến Thiên Chúa.\" Và điều đó là thật – nhưng thường bị hiểu theo cách quá đơn giản."],["p","Bối cảnh của câu văn này quan trọng. Phao-lô viết nó ngay sau khi mô tả toàn bộ tạo vật đang \"rên siết và quằn quại\" (Rm 8,22), và bản thân chúng ta cũng \"rên siết\" (Rm 8,23). Đây không phải bức tranh của sự dễ chịu và suôn sẻ. Đây là bức tranh của đau khổ thật, kéo dài, và chưa được giải quyết."],["p","Vậy mà Phao-lô vẫn nói: Thiên Chúa làm cho mọi sự đều sinh ích. Không phải \"mọi sự đều tốt\". Không phải \"mọi sự đều có ý nghĩa tự động\". Mà là: Thiên Chúa đang làm việc trong mọi sự – kể cả những sự không tốt – để tạo ra điều tốt lành."],["p","Đây là sự khác biệt giữa lạc quan (mọi thứ sẽ ổn thôi) và hy vọng theo Kinh Thánh (có Đấng đang làm việc ngay cả khi tôi không thể nhìn thấy). Lạc quan phụ thuộc vào hoàn cảnh. Hy vọng phụ thuộc vào Đấng đứng ngoài hoàn cảnh."],["h3","III. Sự Quan Phòng Trong Những Gì Thường Ngày"],["p","Khi nói về sự quan phòng, người ta thường nghĩ đến những phép màu lớn hay những sự kiện lịch sử vĩ đại. Nhưng Kinh Thánh cho thấy Thiên Chúa cũng quan phòng trong những điều nhỏ bé nhất của cuộc sống thường ngày."],["p","Mt 6,25-34 mô tả Đức Giê-su nói về chim trời và hoa đồng nội – những thứ không \"làm gì\" về sự sống còn của mình, nhưng vẫn được chăm sóc. Đây không phải lời kêu gọi sự thụ động hay thiếu kế hoạch. Mà là lời mời nhìn nhận rằng sự quan phòng hoạt động ở tầng căn bản nhất của sự tồn tại – không chỉ ở những khoảnh khắc khủng hoảng."],["p","Điều đó có nghĩa thực tế là:"],["ul",["Những mối quan hệ \"tình cờ\" gặp được trong những giai đoạn khó khăn có thể là phương tiện của sự quan phòng","Những kỹ năng tưởng chừng không liên quan lại trở nên cần thiết đúng lúc cần nhất","Những cánh cửa đóng lại – dù đau đớn lúc đó – có thể mở ra hướng mà người ta không bao giờ tự mình tìm đến","Những giai đoạn \"lãng phí\" hay \"thất bại\" có thể là nơi hình thành những chiều sâu mà những thành công không bao giờ tạo ra được"]],["p","Không phải lúc nào chúng ta cũng nhìn thấy điều này khi nó đang xảy ra. Thường là chỉ nhìn lại từ khoảng cách nào đó mới nhận ra. Đó là một phần của việc sống với đức tin, không phải với sự nhìn thấy."],["h3","IV. Sự Quan Phòng Và Trách Nhiệm – Không Phải Lựa Chọn"],["p","Một trong những căng thẳng thần học quan trọng nhất xung quanh sự quan phòng là: nếu Thiên Chúa đang làm mọi sự sinh ích, thì con người còn cần làm gì?"],["p","Đây là một căng thẳng thật – và Kinh Thánh không giải quyết nó bằng cách loại bỏ một trong hai vế. Cả hai đều đúng cùng lúc: Thiên Chúa đang hoạt động, và con người có trách nhiệm thật sự."],["p","Philípphê 2,12-13 diễn đạt điều này một cách đáng chú ý: \"Hãy dùng lòng kính sợ và run rẩy mà lo sao cho mình được cứu độ... vì chính Thiên Chúa tác động trong anh em, cả trong ý muốn lẫn trong hành động, theo như ý định yêu thương của Người.\" Không phải \"Thiên Chúa làm nên bạn không cần làm gì\". Không phải \"bạn làm nên Thiên Chúa không cần làm gì\". Mà là cả hai đang xảy ra cùng lúc, ở những tầng khác nhau của thực tại."],["p","Điều này có nghĩa thực tế là: tin vào sự quan phòng không phải là lý do để thụ động. Ngược lại, chính vì tin rằng Thiên Chúa đang làm việc, chúng ta có thể hành động với một sự tự do nhất định – không phải gánh tất cả trách nhiệm về kết quả, nhưng trung thực với những gì mình được giao phó để làm."],["h3","V. Kết Chương 3 – Linh Và Sự Tái Xây Dựng"],["p","Linh cuối cùng không nhận được câu trả lời cho câu hỏi \"Tại sao kế hoạch của tôi không xảy ra?\" Câu hỏi đó vẫn còn đó."],["p","Nhưng có điều gì đó thay đổi khi cô bắt đầu hỏi câu hỏi khác: \"Thiên Chúa đang làm gì trong chỗ này, trong giai đoạn này?\" Không phải để biện minh cho đau khổ – mà để chú ý đến những gì đang xảy ra thật sự."],["p","Và trong khi chú ý, cô bắt đầu nhận ra: những người cô gặp trong giai đoạn mất việc – một người sau này trở thành cộng tác viên quan trọng nhất; những kỹ năng cô học trong lúc không có việc – chính xác là những gì cô cần để khởi nghiệp một mình; sự đơn độc của giai đoạn đó – đã đào sâu hơn điều cô hiểu về mình. Cô không thể đặt tất cả những điều đó vào kế hoạch ba năm trước. Nhưng nhìn lại, cô thấy bàn tay của Đấng đang làm điều gì đó – không phải bức tranh hoàn chỉnh, nhưng là những nét đang được vẽ."],["refl","CÂU HỎI SUY NGẪM — Chương 3",["<i>Nhìn lại cuộc sống của mình, bạn có thể nhận ra những giai đoạn \"thất bại\" hay \"lãng phí\" mà giờ đây bạn thấy có vai trò quan trọng không? Điều gì làm bạn nhận ra điều đó?<\/i>","<i>Rm 8,28 – sự khác biệt giữa \"mọi thứ đều tốt\" và \"Thiên Chúa làm cho mọi sự sinh ích\" – điều đó có ý nghĩa thực tế gì với bạn trong hoàn cảnh cụ thể hiện tại?<\/i>","<i>Bạn có xu hướng nghiêng về phía thụ động (\"Thiên Chúa sẽ lo\") hay về phía tự lo tất cả (\"tôi phải kiểm soát mọi thứ\") không? Điều gì giúp bạn tìm thấy sự cân bằng?<\/i>","<i>[Nhóm nhỏ] Chia sẻ một giai đoạn trong cuộc sống mà lúc đó cảm thấy như \"lạc đường\", nhưng nhìn lại thấy có điều gì đó đã xảy ra quan trọng. Điều gì giúp bạn nhìn lại theo cách đó?<\/i>","<i>[Nhóm nhỏ] Theo bạn, làm thế nào để phân biệt giữa \"chờ đợi trong đức tin\" và \"thụ động vì sợ hãi hay lười biếng\"?<\/i>","<i>[Nhóm nhỏ] Trong cộng đoàn của bạn, người ta có chia sẻ về sự quan phòng theo cách trung thực với đau khổ thật không, hay chỉ chia sẻ những \"câu chuyện thành công\" khi mọi thứ đã ổn?<\/i>"]]]},{"k":"ch","l":"Phần 3 · Chương 4","t":"Khi Không Thể Nhìn Thấy Bàn Tay Thiên Chúa","pb":null,"b":[["q","Dù lòng con thắc mắc, dù ruột gan con đau, con vẫn ở kề bên Ngài; Ngài nắm lấy tay phải con.","Tv 73,21-23"],["h3","I. Câu Chuyện Của Tuấn"],["p","Tuấn bốn mươi mốt tuổi. Anh đã là người tin Chúa từ thời đại học, đã trải qua nhiều giai đoạn đức tin lên xuống, và nhìn chung đã có thể hòa giải niềm tin của mình với thực tế cuộc sống."],["p","Nhưng bốn năm trước, em trai anh – người duy nhất trong gia đình cũng tin Chúa, người mà anh đã cầu nguyện cho nhiều năm – qua đời sau một cơn bệnh ngắn. Không có dấu hiệu cảnh báo. Không có cơ hội chuẩn bị. Bốn mươi hai tuổi, có vợ và hai con nhỏ."],["p","Tuấn không bỏ đức tin sau biến cố đó. Nhưng anh không thể giả vờ rằng mình \"hiểu\" điều đã xảy ra. Anh không thể nói \"Đây là ý Chúa\" và cảm thấy điều đó đúng. Anh không thể giải thích sự quan phòng theo cách làm cho cái chết của em trai có ý nghĩa theo bất kỳ cách nào anh có thể chấp nhận."],["p","Câu hỏi của anh không phải là câu hỏi triết học. Đó là câu hỏi sống còn: \"Tôi có thể tin vào một Đấng mà tôi không thể nhìn thấy bàn tay Ngài trong những điều quan trọng nhất không?\""],["h3","II. Thánh Vịnh 73 – Hành Trình Từ Nghi Ngờ Đến Nắm Tay"],["p","Thánh Vịnh 73 là một trong những bài Thánh Vịnh sâu sắc và trung thực nhất về cuộc chiến đức tin trong khi không nhìn thấy bàn tay Thiên Chúa."],["p","Người viết bắt đầu bằng sự thành thật đau đớn: anh ta gần như vấp ngã khi nhìn thấy người gian ác thịnh vượng trong khi người công chính chịu khổ. \"Ích gì cho tôi khi tâm hồn trong trắng, bàn tay vô tội? Cả ngày tôi hứng chịu đòn roi, mỗi buổi sáng lại thêm hình phạt mới\" (Tv 73,13-14)."],["p","Đây là câu hỏi thật, kêu gào thật, nghi ngờ thật. Kinh Thánh không che giấu nó. Và điều quan trọng là: câu hỏi đó không dẫn người viết ra khỏi đức tin – nó dẫn anh ta vào sâu hơn trong mối quan hệ."],["p","Điểm chuyển ngoặt xảy ra khi người viết \"vào thánh điện\" (Tv 73,17) – tức là khi anh ta đưa câu hỏi vào trong sự hiện diện của Thiên Chúa thay vì để nó ở ngoài. Và từ đó, câu chuyện thay đổi không phải vì hoàn cảnh thay đổi, mà vì cái nhìn thay đổi."],["p","Câu 23 là câu mà chương này chọn làm trung tâm: \"Dù lòng con thắc mắc, dù ruột gan con đau, con vẫn ở kề bên Ngài; Ngài nắm lấy tay phải con.\" Không phải \"con hiểu mọi sự\". Không phải \"con không còn đau\". Mà là: con vẫn ở kề bên Ngài. Ngài nắm lấy tay con."],["h3","III. Đức Tin Không Phải Là Sự Hiểu Biết"],["p","Một trong những nhầm lẫn căn bản nhất về đức tin là: đức tin là niềm tin rằng bạn hiểu những gì Thiên Chúa đang làm. Khi không hiểu, đức tin lung lay."],["p","Kinh Thánh đưa ra một định nghĩa khác. Hêbơrơ 11,1 nói: \"Đức tin là sự đảm bảo của những điều chúng ta hy vọng và là bằng chứng của những điều chúng ta không thấy.\" Đức tin không phải là sự hiểu biết về những gì đang xảy ra. Đó là sự tin tưởng vào Đấng đang hoạt động ngay cả khi chúng ta không nhìn thấy."],["p","Sự khác biệt này thực tế theo cách sâu sắc: nếu đức tin phụ thuộc vào sự hiểu biết, thì nó sẽ sụp đổ trong mọi giai đoạn mà chúng ta không hiểu – và những giai đoạn như vậy thì rất nhiều. Nhưng nếu đức tin là sự tin tưởng vào một Đấng bất kể sự hiểu biết của mình, thì nó có thể đứng vững ngay cả trong bóng tối."],["h3","IV. Sống Với Câu Hỏi Chưa Được Trả Lời"],["p","Có một điều cần nói thẳng với sự khiêm tốn: không phải mọi câu hỏi sẽ được trả lời trong cuộc sống này. Không phải mọi đau khổ sẽ được giải thích theo cách thỏa mãn trí tuệ và cảm xúc của chúng ta."],["p","Sách Gióp – mà Phần 2 đã đề cập – kết thúc không phải với một câu trả lời cho câu hỏi \"tại sao\" của Gióp, mà với sự hiện diện của Thiên Chúa và một loạt câu hỏi mà Ngài đặt lại cho Gióp về sự vô hạn của Ngài. Không phải để làm Gióp cảm thấy nhỏ bé, mà để mở rộng khung nhìn của anh ta đủ để nhận ra: có những điều nằm ngoài khả năng hiểu biết của con người ở bất kỳ thời điểm nào trong lịch sử."],["p","Điều này không có nghĩa là câu hỏi là sai hay không đáng được hỏi. Nó có nghĩa là: sống với câu hỏi chưa được trả lời không phải là dấu hiệu của đức tin yếu – đó là dấu hiệu của đức tin trưởng thành. Đức tin trưởng thành có thể nói \"Tôi không hiểu điều này, nhưng tôi tin tưởng Đấng hiểu nó\" – và tiếp tục sống."],["h3","V. Khi Thiên Chúa Có Vẻ Im Lặng"],["p","Một trong những trải nghiệm khó khăn nhất trong đời sống đức tin là giai đoạn mà Thiên Chúa có vẻ hoàn toàn im lặng. Cầu nguyện mà không cảm thấy gì. Tìm kiếm mà không thấy. Đợi chờ mà không có dấu hiệu nào."],["p","Các thánh trong Kinh Thánh và trong lịch sử Giáo Hội đều trải qua điều này. Thánh Gioan Thánh Giá mô tả đó là \"đêm tối tâm hồn\" – giai đoạn mà sự hiện diện cảm nhận được của Thiên Chúa biến mất, nhưng Thiên Chúa không biến mất. Thực ra, theo Thánh Gioan Thánh Giá, đây là giai đoạn tình yêu được tinh lọc: chúng ta không còn có thể dựa vào cảm giác về Thiên Chúa, mà phải học cách tin tưởng Ngài ngay cả khi không cảm nhận được gì."],["p","Đức Giê-su trên Thập Giá kêu lên \"Lạy Thiên Chúa, lạy Thiên Chúa của con, sao Ngài bỏ con?\" – nhưng Ngài vẫn kêu với Thiên Chúa. Không phải kêu vào hư không. Kêu với Đấng mà Ngài tin rằng đang nghe, dù không cảm nhận được sự nghe đó."],["p","Đó là mẫu hình. Tiếp tục đến với Thiên Chúa ngay cả khi không cảm nhận được Ngài. Tiếp tục cầu nguyện ngay cả khi không có câu trả lời. Tiếp tục sống từ đức tin ngay cả khi không có sự xác nhận cảm xúc. Không phải vì chúng ta biết Ngài đang làm gì – mà vì chúng ta tin Ngài đang làm."],["h3","VI. Kết Chương 4 – Tuấn Và Cái Nắm Tay"],["p","Tuấn không có câu trả lời cho cái chết của em trai. Bốn năm sau, câu hỏi \"tại sao\" vẫn còn đó, vẫn đau."],["p","Nhưng có điều gì đó thay đổi khi anh đọc Thánh Vịnh 73 và dừng lại ở câu 23: \"Dù lòng con thắc mắc, dù ruột gan con đau, con vẫn ở kề bên Ngài.\" Anh nhận ra rằng đức tin không đòi hỏi anh phải có câu trả lời. Nó đòi hỏi anh ở lại."],["p","Và trong \"ở lại\" đó, anh nhận ra điều gì đó anh không nghĩ mình sẽ nhận ra: câu tiếp theo không phải là \"con nắm tay Ngài\" – mà là \"Ngài nắm lấy tay phải con.\" Không phải anh đang giữ chặt. Mà là Đấng đang giữ anh."],["p","Đây không phải là sự giải quyết. Nhưng đây là đủ để tiếp tục."],["refl","CÂU HỎI SUY NGẪM — Chương 4",["<i>Câu hỏi \"tại sao\" nào trong cuộc sống của bạn vẫn chưa có câu trả lời? Bạn đang đặt câu hỏi đó ở đâu – bên ngoài hay trong sự hiện diện của Thiên Chúa?<\/i>","<i>Sự khác biệt giữa \"đức tin là hiểu biết những gì Thiên Chúa đang làm\" và \"đức tin là tin tưởng vào Đấng đang hoạt động\" – điều đó thay đổi gì trong cách bạn tiếp cận những giai đoạn khó khăn?<\/i>","<i>Bạn có từng trải qua giai đoạn Thiên Chúa có vẻ im lặng không? Điều gì đã giúp bạn – hoặc điều gì bạn ước mình đã biết trong giai đoạn đó?<\/i>","<i>[Nhóm nhỏ] Chia sẻ về một câu hỏi \"tại sao\" mà bạn đã phải sống chung với nó trong một thời gian dài mà không có câu trả lời. Cộng đoàn đã hỗ trợ bạn thế nào – hay không hỗ trợ thế nào?<\/i>","<i>[Nhóm nhỏ] Tv 73,17 nói người viết \"vào thánh điện\" là điểm chuyển ngoặt. Bạn nghĩ điều đó có nghĩa gì thực tế – đưa câu hỏi vào sự hiện diện của Thiên Chúa trông như thế nào?<\/i>","<i>[Nhóm nhỏ] Làm thế nào cộng đoàn đức tin có thể tạo ra không gian để người ta mang câu hỏi chưa được trả lời và đau khổ chưa được giải quyết vào, thay vì cảm thấy họ cần phải \"có câu trả lời\" trước khi đến?<\/i>"]]]},{"k":"ch","l":"Phần 3 · Chương 5","t":"Chúng Ta Đang Ở Đâu Trong Câu Chuyện Này?","pb":null,"b":[["q","Vì chúng ta là tác phẩm của Thiên Chúa, được tạo dựng trong Đức Ki-tô Giê-su, để làm những công việc tốt đẹp mà Thiên Chúa đã chuẩn bị sẵn cho chúng ta.","Ep 2,10"],["h3","I. Câu Chuyện Của Hà"],["p","Hà hai mươi bảy tuổi. Cô đã đọc qua ba tập của Nhóm 2 và cảm thấy một điều gì đó đang hình thành trong mình – không hẳn là câu trả lời, mà là một khung mới để nhìn."],["p","Nhưng cô vẫn mang theo một câu hỏi thực tế chưa được giải quyết: \"Được rồi, nếu Thiên Chúa có câu chuyện lớn và đang quan phòng trong lịch sử – thì tôi có vai trò gì trong đó? Cuộc sống bình thường của tôi, với những quyết định bình thường, những công việc bình thường – có ý nghĩa gì trong bức tranh đó không?\""],["p","Đây là câu hỏi quan trọng và thực tế nhất của cả chương này."],["h3","II. Bạn Không Phải Là Khán Giả"],["p","Phần 1 đã dùng hình ảnh của John Calvin về thế giới như \"sân khấu của vinh quang Thiên Chúa\" và hình ảnh của N.T. Wright về \"vở kịch chưa viết xong\". Chương này muốn trở lại hình ảnh đó với một chiều sâu hơn."],["p","Ep 2,10 tuyên bố: bạn là \"tác phẩm của Thiên Chúa, được tạo dựng trong Đức Ki-tô Giê-su, để làm những công việc tốt đẹp mà Thiên Chúa đã chuẩn bị sẵn.\" Không phải bạn là khán giả của câu chuyện. Bạn là nhân vật trong đó – và những \"công việc tốt đẹp\" bạn làm là phần của câu chuyện mà Thiên Chúa đang kể."],["p","Điều này không có nghĩa là mỗi quyết định nhỏ của bạn đều có ý nghĩa vũ trụ theo nghĩa thần bí. Mà có nghĩa là: mỗi hành động trung thực, mỗi lựa chọn tốt lành, mỗi mối quan hệ được chăm sóc đúng cách – tất cả đều là phần của điều Thiên Chúa đang làm trong thế giới qua những con người thuộc về Ngài."],["h3","III. Vị Trí Của Chúng Ta Trong Câu Chuyện"],["p","N.T. Wright mô tả vị trí của chúng ta bằng hình ảnh một đoàn diễn viên được trao một vở kịch Shakespeare chưa viết xong. Họ biết bốn màn đầu – sáng tạo, sa ngã, lịch sử Israel, và Đức Giê-su Ki-tô. Họ biết chiều hướng chung của màn thứ năm. Nhưng họ không có kịch bản chi tiết."],["p","Nhiệm vụ của họ là ứng tấu – nhưng không phải ứng tấu tùy tiện. Ứng tấu trung thực với tính cách của từng nhân vật như đã được bộc lộ trong bốn màn trước, với chiều hướng câu chuyện như đã được chỉ ra, với tinh thần của Đấng Tác Giả mà họ đã học được qua những màn đã viết."],["p","Đây là hình ảnh của cuộc sống Ki-tô giáo: không phải tuân theo một kịch bản cứng nhắc, không phải tự do làm bất cứ điều gì. Mà là sống trung thực với những gì chúng ta biết về Đấng đang kể câu chuyện và về chiều hướng câu chuyện đang đi – và trong đó, có sự tự do thật để sáng tạo, để lựa chọn, để tham gia."],["h3","IV. Từng Người Trong Từng Chỗ"],["p","Nhưng hình ảnh về \"câu chuyện lớn\" cần được đặt cạnh một thực tế rất cụ thể: sự quan phòng của Thiên Chúa hoạt động qua những người cụ thể, ở những chỗ cụ thể, trong những thời điểm cụ thể."],["p","Ê-xơ-tê được đặt vào vị trí hoàng hậu – không phải ngẫu nhiên, mà như Mạc-đô-chê nói với cô: \"Ai biết được? Có lẽ chính vì thời điểm này mà em đã được địa vị hoàng hậu?\" (Et 4,14). Cô không được giao kịch bản. Cô được đặt vào một vị trí và phải lựa chọn có dùng nó cho điều gì hay không."],["p","Điều tương tự với chúng ta. Mỗi người chúng ta ở trong một \"chỗ\" nhất định – một gia đình, một nghề nghiệp, một cộng đồng, một khoảnh khắc lịch sử nhất định. Câu hỏi không phải là \"Tôi cần làm gì để trở nên quan trọng?\" mà là \"Trong chỗ tôi đang ở, Thiên Chúa đang mời tôi làm gì?\""],["p","Và \"chỗ\" đó không nhất thiết phải là vị trí nổi bật. Thiên Chúa đã dùng một người giúp việc tên Naaman để dẫn một người tướng lĩnh đến với Ê-li-sa. Ngài đã dùng một đứa bé với năm ổ bánh và hai con cá. Ngài đã dùng một người phụ nữ tại giếng nước Síkha để mang tin tức về Đức Giê-su đến cả thành phố. Không ai trong số đó nghĩ mình đang làm điều lịch sử. Họ chỉ đang ở đó và làm điều cần làm."],["h3","V. Sự Trung Thành Trong Những Điều Nhỏ"],["p","Lc 16,10 chứa một nguyên tắc quan trọng: \"Ai trung thành trong những việc nhỏ, thì cũng trung thành trong những việc lớn.\" Không phải việc nhỏ là bước đệm đến việc lớn. Mà là tính cách được hình thành và bộc lộ trong những việc nhỏ chính là tính cách sẽ được mang vào những việc lớn."],["p","Sự quan phòng của Thiên Chúa hoạt động qua những khoảnh khắc thường ngày của sự trung thành: người giáo viên chuẩn bị bài giảng cẩn thận dù chỉ có năm học sinh, người y tá chăm sóc bệnh nhân tận tình lúc ba giờ sáng khi không ai nhìn, người cha dành thời gian thật sự hiện diện với con dù mệt mỏi sau ngày làm việc. Những khoảnh khắc đó không xuất hiện trên trang bìa tạp chí. Nhưng chúng là vật liệu xây dựng của lịch sử thật."],["p","Và điều quan trọng là: những khoảnh khắc đó không mất đi. 1Cr 15,58 nói: \"Hãy kiên trì và bền vững, luôn luôn tận lực làm công việc của Chúa, vì biết rằng trong Chúa, sự khó nhọc của anh em sẽ không trở nên vô ích.\" Không phải \"sẽ có báo đáp xứng đáng lúc nào đó\". Mà là \"sẽ không vô ích\" – điều đó được Đấng kể câu chuyện ghi nhớ và tích hợp vào câu chuyện lớn theo cách chúng ta không thể lường trước."],["h3","VI. Kết Chương 5 – Hà Và Câu Trả Lời Bất Ngờ"],["p","Hà không nhận được bản đồ chi tiết về vai trò của mình trong câu chuyện của Thiên Chúa. Không ai có được bản đồ đó."],["p","Nhưng cô nhận ra điều gì đó đơn giản hơn và sâu sắc hơn: câu hỏi không phải là \"Cuộc sống bình thường của tôi có đủ quan trọng trong bức tranh lớn không?\" Câu hỏi là \"Trong cuộc sống bình thường của tôi, hôm nay, ở đây – tôi có đang sống trung thành không?\""],["p","Và câu trả lời cho câu hỏi đó không cần đợi đến lúc hiểu toàn bộ kế hoạch của Thiên Chúa. Nó có thể bắt đầu ngay bây giờ."],["refl","CÂU HỎI SUY NGẪM — Chương 5",["<i>\"Chỗ\" bạn đang ở trong cuộc sống hiện tại – gia đình, nghề nghiệp, cộng đồng – câu hỏi \"Thiên Chúa đang mời tôi làm gì ở đây?\" gợi lên điều gì?<\/i>","<i>Nhìn lại tuần vừa qua: có khoảnh khắc nào bạn \"sống trung thành trong điều nhỏ\" mà có thể là phần của điều Thiên Chúa đang làm không, dù nhỏ đến đâu?<\/i>","<i>Câu \"sự khó nhọc của anh em sẽ không trở nên vô ích\" (1Cr 15,58) có ý nghĩa gì với bạn trong những giai đoạn mà những nỗ lực của mình dường như không đem lại kết quả?<\/i>","<i>[Nhóm nhỏ] Hình ảnh \"ứng tấu trung thành\" – biết câu chuyện đủ để sống trong đó mà không có kịch bản chi tiết – bạn thấy hình ảnh đó thực tế hay lý tưởng không tưởng? Tại sao?<\/i>","<i>[Nhóm nhỏ
