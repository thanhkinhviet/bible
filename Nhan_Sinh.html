] Câu chuyện Ê-xơ-tê và câu \"có lẽ chính vì thời điểm này\" – bạn có cảm giác gì về \"chỗ\" mình đang ở trong giai đoạn này của cuộc sống không?<\/i>","<i>[Nhóm nhỏ] Trong cộng đoàn của bạn, những \"công việc nhỏ\" có được nhìn nhận và trân trọng không, hay chỉ những thành tích lớn mới được chú ý? Điều đó ảnh hưởng thế nào đến cách người ta tham gia vào cộng đoàn?<\/i>"]]]},{"k":"ch","l":"Phần 4 · Chương 1","t":"Câu Hỏi Cuối Cùng","pb":["PHẦN 4","CÁNH CHUNG","Thế Giới Này Sẽ Đi Về Đâu?"],"b":[["q","Bấy giờ tôi thấy trời mới đất mới, vì trời cũ đất cũ đã biến mất, và biển cũng không còn nữa.","Kh 21,1"],["h3","I. Câu Chuyện Của Khang"],["p","Khang ba mươi lăm tuổi – người đã xuất hiện trong Phần 3 với câu hỏi về bàn tay Thiên Chúa trong lịch sử. Anh đã học được điều gì đó ở đó: không phải câu trả lời, mà là cách nhìn khác. Nhưng có một câu hỏi anh chưa dám chạm vào, vì nó lớn hơn bất kỳ câu hỏi nào anh từng đặt ra."],["p","Một buổi tối anh ngồi xem những thước phim tư liệu về các nền văn minh cổ đại đã biến mất. Ai Cập. Hy Lạp. La Mã. Mỗi đế chế từng được coi là vĩnh cửu – và tất cả đều tan thành cát bụi. Rồi anh nhìn ra cửa sổ, nhìn thành phố đang nhấp nháy ánh đèn, và cảm thấy một điều gì đó rất lạnh lẽo trượt qua trong lòng."],["p","Nếu tất cả những điều này cũng sẽ biến mất – thì cuối cùng là gì? Không phải cuối cùng của Việt Nam, của nhân loại, hay của Trái Đất. Mà là cuối cùng của tất cả. Câu chuyện có điểm kết thúc không? Và nếu có – kết thúc đó trông như thế nào?"],["p","Đây là câu hỏi của cánh chung học (eschatology) – ngành thần học nghiên cứu về những điều cuối cùng. Và đây là câu hỏi mà Phần 4 bắt đầu."],["h3","II. Tại Sao Câu Hỏi Này Quan Trọng Hôm Nay?"],["p","Trong văn hóa hiện đại, cánh chung học thường bị thu hẹp thành hai loại: hoặc là bị coi là điên rồ và cuồng tín – những người dự đoán ngày tận thế với biển số xe và con số bí ẩn – hoặc là bị coi là không liên quan, một sự kiện xa xôi mơ hồ không ảnh hưởng đến cuộc sống hàng ngày."],["p","Nhưng cách bạn nghĩ về điểm đến của câu chuyện thay đổi toàn bộ cách bạn sống trong câu chuyện đó."],["p","Nếu câu chuyện kết thúc trong hư không – nếu cuối cùng là sự biến mất hoàn toàn – thì hầu hết những điều chúng ta trân trọng đều trở thành ảo ảnh. Tình yêu, công lý, sự đẹp đẽ, lòng tốt – tất cả sẽ không để lại dấu vết nào sau khi vũ trụ nguội lạnh. Nietzsche hiểu điều này rõ hơn nhiều người: nếu không có điểm đến, thì không có ý nghĩa."],["p","Ngược lại, nếu câu chuyện kết thúc theo cách mà Kinh Thánh mô tả – một sự đổi mới toàn diện, sự phục hồi của shalom, Thiên Chúa cư ngụ cùng con người mãi mãi – thì mọi hành động tốt lành hiện tại đều là sự tham dự vào điều sẽ tồn tại đời đời. Thứ bạn đang làm hôm nay có ý nghĩa vĩnh cửu."],["h3","III. Ba Cách Hiểu Điểm Đến Của Câu Chuyện"],["h4","1. Vòng tròn không điểm đến"],["p","Nhiều triết học và tôn giáo Đông phương cổ đại nhìn thực tại như một vòng tròn: sinh-diệt-sinh. Không có điểm đến, không có sự kết thúc hoàn chỉnh. Câu chuyện cứ lặp lại. Giải thoát, theo quan điểm này, là thoát ra khỏi vòng tròn đó – không phải đến một chỗ tốt hơn, mà vào sự không còn là gì nữa."],["p","Quan điểm này có sức hấp dẫn của sự nhất quán. Nhưng nó để lại một khoảng trống lớn: nếu không có điểm đến, sự đấu tranh cho công lý, sự yêu thương, và sự hi sinh đều không có ý nghĩa tích lũy. Mỗi thế hệ bắt đầu lại từ đầu, và không có gì được bảo tồn."],["h4","2. Đường thẳng không có Chúa"],["p","Chủ nghĩa duy vật thế tục nhìn lịch sử như một đường thẳng: từ Big Bang đến sự tiến hóa, đến con người, đến tiến bộ văn minh, và cuối cùng là sự nguội lạnh của vũ trụ. Không có mục đích siêu nhiên. Không có điểm đến có ý nghĩa. Câu chuyện bắt đầu không ai yêu cầu và kết thúc không ai nhớ."],["p","Triết gia Bertrand Russell mô tả con người là \"sản phẩm của những nguyên nhân không có khái niệm về điều họ tạo ra\", và câu chuyện của chúng ta sẽ \"bị chôn vùi bên dưới những đống đổ nát của vũ trụ\". Đây là quan điểm trung thực về hệ quả của chủ nghĩa vật chất thuần túy."],["h4","3. Đường thẳng có điểm đến – Câu trả lời của Kinh Thánh"],["p","Kinh Thánh đưa ra một câu trả lời hoàn toàn khác: lịch sử là một câu chuyện có điểm bắt đầu (sáng tạo), điểm giữa quyết định (Nhập Thể và Phục Sinh), và điểm đến cụ thể (sự tái lập của tạo vật trong sự vinh quang của Thiên Chúa)."],["p","Điểm đến đó không phải là sự biến mất của thế giới vật chất vào một thứ gì đó thuần túy tâm linh. Kinh Thánh nói về \"trời mới đất mới\" – không phải sự hủy bỏ tạo vật, mà là sự đổi mới và biến đổi của nó. Đây là điều quan trọng: Thiên Chúa không từ bỏ thế giới Ngài đã tạo ra. Ngài đổi mới nó."],["h3","IV. Cánh Chung Học – Không Phải Chỉ Về Tương Lai"],["p","Có một hiểu lầm phổ biến rằng cánh chung học chỉ liên quan đến tương lai – những gì sẽ xảy ra sau khi chúng ta chết hay sau ngày tận thế. Nhưng thần học Ki-tô giáo dạy điều sâu sắc hơn: tương lai đang ảnh hưởng đến hiện tại."],["p","Nhà thần học N.T. Wright mô tả điều này qua hình ảnh: hãy tưởng tượng bạn đang xây một tòa nhà và biết rằng tòa nhà đó sẽ đứng vững mãi mãi – so với biết rằng nó sẽ bị phá hủy vào ngày mai. Sự biết đó thay đổi toàn bộ cách bạn xây. Tương lai định hình cách bạn sống hiện tại."],["p","Nếu điểm đến của câu chuyện là sự đổi mới toàn diện của tạo vật, thì mọi hành động chăm sóc cho tạo vật, mọi hành động công lý, mọi mối quan hệ được nuôi dưỡng – đều là sự trước-hưởng và sự tham dự vào điều đang đến. Đây là lý do cánh chung học không phải là môn học cho những người cuồng tín – đó là nền tảng của đạo đức và của hy vọng thực tế."],["h3","V. Kết Chương 1 – Khang Và Câu Hỏi Mới"],["p","Khang tắt màn hình và ngồi trong bóng tối một lúc. Câu hỏi \"câu chuyện kết thúc như thế nào?\" không biến mất. Nhưng nó bắt đầu mang một hình dạng khác: không phải câu hỏi của sự sợ hãi mà là câu hỏi của người muốn biết điều mình đang tham dự vào là gì."],["p","Trong các chương tiếp theo, chúng ta sẽ đi vào những phần cụ thể của điều Kinh Thánh dạy về những điều cuối cùng: cái chết và điều sau đó (Chương 2), Vương Quốc Thiên Chúa đã đến và chưa trọn (Chương 3), sự phán xét cuối cùng (Chương 4), và trời mới đất mới (Chương 5)."],["refl","CÂU HỎI SUY NGẪM — Chương 1",["<i>Khi bạn nghĩ đến \"điểm cuối\" của câu chuyện – cái chết của mình, sự kết thúc của lịch sử – cảm giác đầu tiên của bạn là gì? Sợ hãi, tò mò, hay điều gì khác?<\/i>","<i>Cách bạn nghĩ về tương lai của thế giới có ảnh hưởng đến những quyết định hàng ngày của bạn không – cách bạn tiêu tiền, cách bạn đầu tư vào mối quan hệ, cách bạn chăm sóc môi trường?<\/i>","<i>Quan điểm nào trong ba cách hiểu về điểm đến của câu chuyện gần nhất với cách bạn thực sự suy nghĩ, không phải cách bạn nghĩ mình nên suy nghĩ?<\/i>","<i>[Nhóm nhỏ] Chia sẻ một khoảnh khắc bạn cảm nhận sâu sắc sự hữu hạn của cuộc sống này – cái chết của ai đó, một căn bệnh, hay một sự kiện khiến bạn dừng lại. Điều đó thay đổi gì trong cách bạn nhìn cuộc sống?<\/i>","<i>[Nhóm nhỏ] Theo bạn, nếu câu chuyện của thế giới kết thúc trong \"hư không\" như chủ nghĩa vật chất dạy, điều đó có ý nghĩa gì cho cách chúng ta đối xử với nhau?<\/i>","<i>[Nhóm nhỏ] Tại sao cánh chung học thường bị coi là \"không thực tế\" hay \"cuồng tín\"? Điều gì làm bạn ngại tiếp cận chủ đề này?<\/i>"]]]},{"k":"ch","l":"Phần 4 · Chương 2","t":"Cái Chết Và Điều Sau Đó","pb":null,"b":[["q","Đức Giê-su phán: \"Ta là sự sống lại và là sự sống. Ai tin vào Ta, thì dù đã chết, cũng sẽ được sống. Và ai sống mà tin vào Ta, sẽ không bao giờ chết.\"","Ga 11,25-26"],["h3","I. Câu Chuyện Của Thịnh"],["p","Thịnh bốn mươi sáu tuổi. Cha anh mất ba tháng trước, sau bảy năm chống chọi với ung thư. Không phải cái chết bất ngờ – gia đình đã chuẩn bị, đã nói những điều cần nói, đã có thời gian bên nhau ở những ngày cuối."],["p","Và dù vậy, khi cha anh thở hơi cuối cùng và căn phòng trở nên im lặng theo một cách khác hẳn với mọi sự im lặng trước đó, Thịnh ngồi bên giường và cảm thấy không phải buồn – mà là một sự choáng váng kỳ lạ. Cơ thể cha anh vẫn ở đó. Nhưng cái làm cho người đó là cha anh – tiếng cười, ký ức, sự hiện diện – đã không còn ở đó nữa."],["p","\"Cha đi đâu rồi?\" Không phải câu hỏi nhà thần học. Không phải câu hỏi triết học. Câu hỏi thô thiển, cấp bách, của người con đang ngồi bên cạnh người cha vừa mất."],["p","Đây là câu hỏi mà không ai có thể tránh mãi – và là câu hỏi mà Kinh Thánh không im lặng trước."],["h3","II. Cái Chết Trong Kinh Thánh – Không Phải Điều Bình Thường"],["p","Điều đầu tiên cần nói: Kinh Thánh không coi cái chết là điều bình thường hay tự nhiên. Gen 2,17 – \"ngày nào ngươi ăn, ngươi sẽ chết\" – đặt cái chết trong bối cảnh của sự sa ngã, không phải trong thiết kế ban đầu. Và Rm 5,12 nói rằng \"tội lỗi gây nên sự chết\" và \"sự chết đã lan tràn tới mọi người\"."],["p","Đây không phải là câu nói rằng cái chết là một trò chơi thần học. Đây là câu nói thần học về một thực tế hiện sinh: khi bạn đứng bên giường người thân vừa qua đời và cảm thấy rằng có điều gì đó sai – cảm giác đó không phải là yếu đuối. Đó là sự nhận biết đúng đắn rằng điều này không phải là cách mọi thứ được thiết kế để là."],["p","Đức Giê-su trước mộ La-da-rô đã không nói \"đừng lo, đây là vòng tuần hoàn tự nhiên\". Ngài khóc (Ga 11,35). Trong cùng đoạn văn đó, Gioan ghi lại rằng Ngài \"nổi giận trong lòng và xúc động\" – ngôn ngữ của sự phẫn nộ trước điều sai. Ngài chiến đấu với cái chết như với kẻ thù, không phải nhún vai chấp nhận nó như điều không thể tránh."],["h3","III. Điều Gì Xảy Ra Khi Chúng Ta Chết?"],["p","Đây là câu hỏi mà Kinh Thánh cung cấp một số điểm định hướng – nhưng không phải bản đồ chi tiết. Và điều quan trọng là không nhầm lẫn giữa điều Kinh Thánh thực sự dạy với những điều được phổ biến hóa qua văn hóa đại chúng."],["h4","1. Trạng thái trung gian"],["p","Nhiều đoạn văn Kinh Thánh gợi ý rằng những người đã qua đời đang ở trong một trạng thái nào đó trước khi sự phục sinh cuối cùng xảy ra. Lc 23,43 – Đức Giê-su nói với người trộm \"hôm nay anh sẽ ở với Ta trên thiên đàng\" – gợi ý về sự hiện diện ngay lập tức với Thiên Chúa. Pl 1,23 – Phao-lô viết về \"khao khát được ra đi mà ở với Đức Ki-tô\" – gợi ý đây là trạng thái tốt hơn sự sống hiện tại, dù chưa phải là điểm đến cuối cùng."],["p","Điều các truyền thống Ki-tô giáo đồng thuận: những người chết trong mối quan hệ với Đức Ki-tô không bị mất – họ ở với Ngài, trong sự hiện diện của Ngài, dù chi tiết của \"trạng thái trung gian\" đó như thế nào vẫn là điều các thần học gia thảo luận khác nhau."],["h4","2. Sự phục sinh thân xác – không phải chỉ linh hồn lên trời"],["p","Đây là điều mà nhiều người Ki-tô giáo hiểu nhầm: hy vọng cuối cùng của Ki-tô giáo không phải là linh hồn thoát khỏi thân xác để bay vào cõi tâm linh mờ nhạt. Đó là sự phục sinh – thân xác được biến đổi và đổi mới, sự sống trọn vẹn trong thế giới được tạo dựng lại."],["p","1Cr 15 – chương cánh chung học quan trọng nhất của Phao-lô – dành phần lớn không gian để nói về sự phục sinh thân xác. \"Nếu người chết không trỗi dậy, thì Đức Ki-tô cũng đã không trỗi dậy\" (1Cr 15,16). Sự phục sinh của Đức Ki-tô không phải là linh hồn của Ngài bay lên – đó là Ngài thật sự rời khỏi ngôi mộ, với thân xác mang dấu vết thương tích nhưng được biến đổi."],["p","Điều đó có ý nghĩa gì? Nó có nghĩa là thân xác của bạn không phải là tạm thời. Nó là phần của bạn sẽ được phục hồi. Và do đó, cách bạn đối xử với thân xác mình và thân xác người khác – trong sức khỏe, trong bệnh tật, trong sự lão hóa, trong cái chết – mang ý nghĩa vĩnh cửu."],["h3","IV. Nỗi Sợ Hãi Về Cái Chết"],["p","Một trong những đặc điểm phổ biến nhất của con người hiện đại là sự né tránh chủ đề cái chết. Chúng ta giấu người hấp hối trong bệnh viện. Chúng ta dùng những từ ngữ nhẹ nhàng thay vì nói thẳng. Chúng ta mua bảo hiểm và lập quỹ hưu trí như thể sự chuẩn bị đầy đủ có thể giải quyết điều không thể tránh né."],["p","Triết học Hy-lạp cổ đại (Epicurus) cho rằng nỗi sợ cái chết là vô lý vì \"khi cái chết đến, tôi sẽ không còn ở đó để sợ nó\". Điều đó nghe hợp lý, nhưng nó không giải quyết được cái mà chúng ta thực sự sợ: không phải là trạng thái của cái chết, mà là sự mất mát – mất mát những người chúng ta yêu, mất mát điều chúng ta đang xây dựng, mất mát chính chúng ta."],["p","Kinh Thánh tiếp cận điều này khác. Hêbơrơ 2,14-15 nói Đức Giê-su đã \"tiêu diệt kẻ có quyền lực là ma quỷ, tức là sự chết, và giải thoát những ai vì sợ chết mà suốt đời bị lệ thuộc vào cảnh nô lệ.\" Đây là tuyên bố rằng sự chế ngự nỗi sợ hãi về cái chết không đến từ sự thuyết phục triết học – mà từ điều đã xảy ra ở đây: Đấng đã vào trong cái chết và ra khỏi nó."],["h3","V. Ga 11 – Khi Hy Vọng Gặp Thực Tế"],["p","Câu chuyện La-da-rô trong Ga 11 là một trong những đoạn văn sâu sắc nhất về cái chết trong Kinh Thánh – không phải vì nó có câu trả lời dễ dàng, mà vì nó cho thấy cách Đức Giê-su đối diện với cái chết một cách thật sự."],["p","Khi Ma-ri-a nói với Ngài \"Thưa Thầy, nếu có Thầy ở đây, anh em tôi đã không chết\", đây là lời kêu than thật sự, không phải triết học. Và Đức Giê-su không bác bỏ câu hỏi của cô. Ngài không nói \"đừng lo, mọi thứ đều là ý Cha ta\". Ngài \"xúc động trong lòng và thổn thức\" rồi hỏi \"Các ngươi để xác anh ấy ở đâu?\" Và Ngài khóc."],["p","Đây là Thiên Chúa đứng trước ngôi mộ và khóc với người đang khóc. Không phải từ xa. Không phải với thái độ siêu thoát. Cùng với. Và rồi Ngài gọi: \"La-da-rô, ra đây!\""],["p","Đây không phải là câu chuyện Ngài giải quyết tất cả câu hỏi về cái chết. La-da-rô cuối cùng cũng chết lại. Nhưng đây là dấu chỉ: Đấng đứng trước ngôi mộ không phải người quan sát từ xa – Ngài là người có quyền phán \"ra đây\". Và điều đó thay đổi câu hỏi \"cha đi đâu rồi?\" thành một câu hỏi không phải trống rỗng."],["h3","VI. Kết Chương 2 – Thịnh Và Câu Trả Lời Không Hoàn Chỉnh"],["p","Thịnh không nhận được câu trả lời hoàn chỉnh cho câu hỏi của mình. Không ai có thể cung cấp điều đó."],["p","Nhưng có điều gì đó thay đổi khi anh đọc Ga 11 và nhận ra rằng Đức Giê-su không đứng trước cái chết với thái độ của người đã giải quyết xong vấn đề – Ngài đứng trước nó và khóc. Rồi Ngài hành động."],["p","Câu \"Ta là sự sống lại và là sự sống\" không phải là câu trả lời triết học. Đó là tuyên bố danh tính của người đang đứng trước ngôi mộ. Và trong sự hiện diện của Đấng đó – không phải chỉ trong lý thuyết về Đấng đó – Thịnh bắt đầu tìm thấy điều gì đó không phải là câu trả lời, mà là sự nương tựa."],["refl","CÂU HỎI SUY NGẪM — Chương 2",["<i>Câu hỏi của Thịnh – \"cha đi đâu rồi?\" – đã bao giờ là câu hỏi của bạn không? Bạn đã trả lời nó thế nào, hoặc bạn đang sống với nó như thế nào?<\/i>","<i>Nỗi sợ hãi về cái chết – của bạn hay của người bạn yêu – biểu hiện thế nào trong cuộc sống hàng ngày của bạn? Bạn tránh né nó hay đối diện với nó?<\/i>","<i>Sự khác biệt giữa \"linh hồn lên thiên đường\" và \"sự phục sinh thân xác\" có ý nghĩa gì với bạn hôm nay?<\/i>","<i>[Nhóm nhỏ] Chia sẻ về một người thân hay bạn bè đã qua đời. Bạn đã nói điều gì – hay không nói được điều gì – về điều sau cái chết? Điều đó có nghĩa gì với bạn?<\/i>","<i>[Nhóm nhỏ] Đức Giê-su khóc trước ngôi mộ La-da-rô – điều đó gợi lên gì cho bạn về cách Thiên Chúa nhìn cái chết? Điều đó ảnh hưởng gì đến cách bạn tiếp cận người đang đau buồn?<\/i>","<i>[Nhóm nhỏ] Trong cộng đoàn của bạn, chủ đề cái chết và tang lễ có được nói đến một cách thật sự và chăm sóc không, hay thường bị tránh né hay xử lý theo kiểu hình thức?<\/i>"]]]},{"k":"ch","l":"Phần 4 · Chương 3","t":"Vương Quốc Thiên Chúa: Đã Đến Và Chưa Trọn","pb":null,"b":[["q","Vậy anh em hãy cầu nguyện như thế này: Lạy Cha chúng con ở trên trời... Triều đại Cha mau đến, ý Cha thể hiện dưới đất cũng như trên trời.","Mt 6,9-10"],["h3","I. Câu Chuyện Của Ngân"],["p","Ngân hai mươi tám tuổi, vừa tốt nghiệp thạc sĩ công tác xã hội và đang làm việc với trẻ em đường phố ở một tổ chức phi lợi nhuận. Cô chọn công việc này không phải vì lương cao hay vì áp lực gia đình, mà vì cô thực sự tin rằng điều đó quan trọng."],["p","Nhưng sau hai năm, cô đang mang theo một câu hỏi nặng nề: \"Mình làm điều này để làm gì? Mỗi đứa trẻ tôi giúp được, có thêm mười đứa nữa ngoài kia. Bất công vẫn còn đó. Hệ thống vẫn hỏng. Nếu Vương Quốc Thiên Chúa sẽ đến từ trên xuống vào ngày tận thế, thì những gì tôi đang làm bây giờ có ý nghĩa gì?\""],["p","Câu hỏi của Ngân chạm vào một trong những căng thẳng thần học quan trọng nhất trong cánh chung học: mối quan hệ giữa những gì Thiên Chúa đang làm bây giờ và những gì Ngài sẽ làm vào điểm cuối của lịch sử."],["h3","II. \"Đã Đến Nhưng Chưa Trọn\" – Căng Thẳng Trung Tâm Của Cánh Chung Ki-tô Giáo"],["p","Một trong những đóng góp quan trọng nhất của thần học Ki-tô giáo thế kỷ 20 là sự làm rõ về cái mà các học giả gọi là \"eschatological tension\" – sự căng thẳng cánh chung: Vương Quốc Thiên Chúa đã đến nhưng chưa trọn."],["p","Điều này nghe mâu thuẫn nhưng thực ra là chính xác hơn bất kỳ cách nào khác để mô tả những gì Kinh Thánh dạy."],["h4","1. Đã đến"],["p","Đức Giê-su tuyên bố ngay từ đầu sứ vụ: \"Thời kỳ đã mãn, và Triều Đại Thiên Chúa đã đến gần\" (Mc 1,15). Không phải \"sẽ đến\" – mà là \"đã đến gần\", đang xảy ra. Khi Ngài đuổi quỷ, Ngài nói: \"Nếu tôi dùng ngón tay Thiên Chúa mà trừ quỷ, thì quả là Triều Đại Thiên Chúa đã đến giữa các ông rồi\" (Lc 11,20). Vương Quốc không phải là sự kiện tương lai – nó đang hiện diện ở đây, trong sự hiện diện và hành động của Đức Giê-su."],["p","Phục Sinh là sự xác nhận cuối cùng: Vương Quốc Thiên Chúa đã đột nhập vào lịch sử. Cái chết, quyền lực cuối cùng của cái ác, đã bị đánh bại. Không phải trong tương lai – mà thật sự, lịch sử, vào buổi sáng ngày thứ nhất trong tuần đó."],["h4","2. Chưa trọn"],["p","Nhưng bất kỳ ai nhìn xung quanh cũng thấy rõ: thế giới vẫn còn bệnh tật, vẫn còn cái chết, vẫn còn bất công, vẫn còn cái ác. Nếu Vương Quốc Thiên Chúa đã đến, tại sao trẻ em vẫn chết đói? Tại sao bạo lực vẫn xảy ra?"],["p","Phao-lô, sau khi tuyên bố về chiến thắng của Đức Ki-tô trong 1Cr 15, vẫn phải viết trong Rm 8,22-23 rằng \"muôn loài thụ tạo cùng rên siết và quằn quại\" và \"chính chúng ta cũng rên siết trong lòng\". Vương Quốc đã đến – nhưng sự trọn vẹn của nó vẫn chưa đến. Chúng ta sống trong khoảng giữa đó."],["p","Hình ảnh thần học hay được dùng: giống như cuộc Đổ Bộ Normandy trong Thế Chiến II (D-Day) đã quyết định kết cục của cuộc chiến, nhưng V-Day – ngày chiến thắng hoàn toàn – vẫn còn ở phía trước. Những tháng tiếp theo sau D-Day vẫn có chiến đấu và cái chết, dù kết cục đã được quyết định. Phục Sinh là \"D-Day\" của lịch sử – kết cục đã được quyết định, nhưng ngày chiến thắng trọn vẹn vẫn chưa đến."],["h3","III. Ý Nghĩa Thực Tế Của Sự Căng Thẳng Này"],["p","Nhưng điều này có ý nghĩa gì thực tế cho cuộc sống hàng ngày? Và cụ thể hơn – điều này nói gì với Ngân và công việc của cô?"],["h4","1. Công việc của chúng ta không phải là tạo ra Vương Quốc – nhưng cũng không phải vô nghĩa"],["p","Có một sai lầm phổ biến khi nghĩ rằng \"đợi Vương Quốc Thiên Chúa\" có nghĩa là thụ động. Sai lầm ngược lại là nghĩ rằng nhiệm vụ của chúng ta là \"xây dựng Vương Quốc\" như thể nó là dự án nhân loại mà chúng ta có thể hoàn thành nếu đủ nỗ lực."],["p","N.T. Wright đưa ra hình ảnh hữu ích: những gì chúng ta làm trong hiện tại – mọi hành động tốt lành, mọi sự chăm sóc, mọi công lý được thực hiện – là \"vật liệu\" của Vương Quốc. Chúng không xây nên Vương Quốc, nhưng chúng cũng không biến mất. Khi Thiên Chúa hoàn tất công việc của Ngài, Ngài sẽ không vứt bỏ những gì đã được làm trong tình yêu và sự trung thành. Ngài sẽ biến đổi và đổi mới chúng thành phần của thực tại mới."],["p","Điều đó có nghĩa là Ngân đang xây dựng điều sẽ tồn tại mãi mãi – không phải theo nghĩa là cô đang cứu thế giới, mà theo nghĩa là những đứa trẻ cô chăm sóc, những khoảnh khắc phẩm giá được phục hồi, những mối quan hệ được lành mạnh hóa – tất cả đều là những tia sáng của Vương Quốc đang đến trong thế giới hiện tại."],["h4","2. Sự thất vọng là lành mạnh nếu được định hướng đúng"],["p","Cảm giác rằng \"có quá nhiều bất công và tôi không thể giải quyết tất cả\" không phải là dấu hiệu thiếu đức tin. Đó là dấu hiệu rằng bạn đang sống trong sự căng thẳng \"đã đến nhưng chưa trọn\" một cách trung thực."],["p","Rm 8,23 nói chính các tín hữu cũng \"rên siết trong lòng, đang khi mong đợi ơn làm nghĩa tử\". Sự mong đợi và rên siết này là phản ứng đúng đắn của người biết điều gì đó tốt hơn đang đến. Không phải để nản lòng, mà để tiếp tục với sự khiêm tốn rằng công việc cuối cùng thuộc về Thiên Chúa, không phải chúng ta."],["h4","3. Cầu nguyện \"Triều đại Cha mau đến\" không phải là thụ động"],["p","Mt 6,10 đặt câu cầu nguyện này vào trung tâm của Kinh Lạy Cha: \"Triều đại Cha mau đến, ý Cha thể hiện dưới đất cũng như trên trời.\" Đây không phải là lời cầu nguyện của người ngồi chờ đợi thụ động. Đây là lời cầu nguyện của người tham gia vào điều Thiên Chúa đang làm – và xin Ngài hoàn tất những gì con người không thể tự mình hoàn tất."],["p","Khi Ngân cầu nguyện câu này, cô đang đặt công việc của mình vào bàn tay của Đấng có thể biến những nỗ lực hữu hạn của cô thành phần của điều vô hạn. Không phải để giảm bớt trách nhiệm, mà để giải phóng cô khỏi áp lực phải giải quyết tất cả một mình."],["h3","IV. Dấu Chỉ Của Vương Quốc Trong Hiện Tại"],["p","Đức Giê-su không chỉ giảng về Vương Quốc – Ngài thực hiện những dấu chỉ của nó. Chữa bệnh, đuổi quỷ, tha tội, cho người đói ăn, phục hồi phẩm giá cho người bị gạt ra ngoài lề xã hội. Mỗi điều đó là một dấu chỉ – không phải Vương Quốc trọn vẹn, mà là sự chiếu rọi của Vương Quốc vào thực tại hiện tại."],["p","Và Ngài trao cho môn đồ cùng một sứ mạng. Mt 10,7-8: \"Dọc đường hãy rao giảng rằng: Nước Trời đã đến gần. Hãy chữa lành người đau yếu, làm cho kẻ chết sống lại, làm cho người phong hủi được sạch, và trừ quỷ.\" Sứ mạng là vừa loan báo vừa thực hiện dấu chỉ."],["p","Điều này có hệ quả thực tế: mọi hành động chữa lành, mọi sự chăm sóc người yếu đuối, mọi sự phục hồi phẩm giá, mọi hành động công lý – không chỉ là \"làm việc tốt\". Chúng là những dấu chỉ của Vương Quốc đang đến. Chúng là ngôn ngữ hành động nói rằng: \"Đây không phải là cách mọi thứ phải là. Và có một Đấng đang sửa chữa điều này.\""],["h3","V. Kết Chương 3 – Ngân Và Câu Trả Lời Đủ"],["p","Ngân không có được câu trả lời làm tất cả những mệt mỏi biến mất. Công việc vẫn khó. Bất công vẫn còn. Không phải ngày nào cũng thấy kết quả."],["p","Nhưng có điều gì đó thay đổi khi cô không còn đặt câu hỏi \"công việc này có thay đổi được thế giới không?\" – mà thay vào đó hỏi \"công việc này có phải là dấu chỉ của Vương Quốc không?\" Câu trả lời cho câu hỏi sau là có – và câu trả lời đó đủ để tiếp tục."],["p","Cô không cần cứu tất cả. Cô chỉ cần trung thành với những gì được giao phó trong chỗ cô đang đứng, vào thời điểm cô đang sống. Phần còn lại thuộc về Đấng đang đến."],["refl","CÂU HỎI SUY NGẪM — Chương 3",["<i>Câu hỏi của Ngân – \"những gì tôi đang làm bây giờ có ý nghĩa gì nếu Thiên Chúa sẽ làm tất cả vào ngày tận thế?\" – bạn đã từng có câu hỏi tương tự không? Trong lĩnh vực công việc hay phục vụ nào?<\/i>","<i>Sự căng thẳng \"đã đến nhưng chưa trọn\" – điều đó thay đổi gì trong cách bạn nhìn những nỗ lực của mình khi chúng không mang lại kết quả như mong muốn?<\/i>","<i>Bạn có nhận ra \"những dấu chỉ của Vương Quốc\" trong cuộc sống hàng ngày của mình không – những khoảnh khắc nhỏ mà bạn cảm thấy \"điều gì đó đúng như thiết kế ban đầu\"?<\/i>","<i>[Nhóm nhỏ] Chia sẻ một lĩnh vực trong cuộc sống hay công việc của bạn mà bạn cảm thấy đang \"cộng tác\" với điều Thiên Chúa đang làm trong thế giới. Điều gì làm bạn cảm thấy như vậy?<\/i>","<i>[Nhóm nhỏ] Theo bạn, cân bằng thế nào giữa \"đợi Thiên Chúa hoàn tất công việc\" và \"trách nhiệm của chúng ta để hành động ngay bây giờ\"?<\/i>","<i>[Nhóm nhỏ] Câu cầu nguyện \"Triều đại Cha mau đến\" có thay đổi gì trong cách bạn hiểu lời cầu nguyện không? Bạn đang cầu nguyện điều gì khi nói câu đó?<\/i>"]]]},{"k":"ch","l":"Phần 4 · Chương 4","t":"Sự Phán Xét Cuối Cùng: Công Lý Thật Sự","pb":null,"b":[["q","Chúa không muốn cho ai bị hư mất, nhưng muốn mọi người ăn năn hối cải... Ngày của Chúa sẽ đến như kẻ trộm; trong ngày đó, trời sẽ ầm ầm tan biến, các yếu tố sẽ cháy tan, và mặt đất cùng mọi công trình trên đó sẽ bị thiêu rụi.","2Pr 3,9-10"],["h3","I. Câu Chuyện Của Dương"],["p","Dương ba mươi ba tuổi và anh có vấn đề với khái niệm sự phán xét – không phải vì anh sợ nó, mà vì anh cần nó."],["p","Cha của Dương đã lạm dụng mẹ anh trong suốt mười lăm năm. Không phải loại lạm dụng được công nhận rộng rãi – mà là loại lạm dụng tinh vi, kiên nhẫn, được che giấu bởi một vẻ ngoài đáng kính. Không ai bên ngoài biết. Khi cha anh qua đời năm ngoái, rất nhiều người nói những điều tốt đẹp về ông trong đám tang."],["p","Dương không phải người thù hận. Nhưng anh cần biết: có điều gì đó sẽ đúng lại những điều sai đó không? Có một sự công nhận nào đó rằng những gì đã xảy ra với mẹ anh là thật, là sai, và không thể bị xóa bỏ chỉ bằng cái chết không?"],["p","\"Nếu không có phán xét, thì những kẻ làm ác trốn thoát. Và những người bị tổn thương không bao giờ được đền bù. Sự tha thứ thì tốt – nhưng tha thứ không phải là xóa bỏ tất cả. Phải có điều gì đó gọi là công lý thật sự.\""],["p","Câu hỏi của Dương không phải là câu hỏi lý thuyết. Đó là câu hỏi của trái tim con người đang khao khát công lý thật sự."],["h3","II. Tại Sao Sự Phán Xét Là Tin Tốt – Không Phải Tin Xấu"],["p","Trong nền văn hóa phương Tây hiện đại, \"ngày phán xét\" thường được hiểu như một mối đe dọa đáng sợ – Thiên Chúa như một thẩm phán nghiêm khắc chờ để kết tội. Nhưng trong bối cảnh Kinh Thánh, sự phán xét của Thiên Chúa thường được các nạn nhân đón nhận như tin tốt."],["p","Các Thánh Vịnh trong Cựu Ước – đặc biệt những bài được viết bởi người bị áp bức và bất công – đầy những lời cầu xin Thiên Chúa đến để phán xét. \"Lạy Thiên Chúa, xin đứng lên phán xét trái đất\" (Tv 82,8). Đây không phải lời cầu xin từ người sợ bị xét xử – đây là lời của người bị bất công và đang kêu gọi sự can thiệp của Đấng công bình."],["p","Kh 6,9-10 mô tả những linh hồn của người tử vì đạo dưới bàn thờ kêu gào: \"Lạy Chúa, Đấng Thánh Thiện và chân thật, Ngài còn chờ đến bao giờ mới xét xử và đòi nợ máu của chúng con?\" Đây là những người đang đợi sự phán xét của Thiên Chúa như điều mà họ khao khát, không phải điều họ sợ hãi."],["p","Điều này có nghĩa là: sự phán xét cuối cùng không chủ yếu là về sự hình phạt tùy tiện – đó là về sự phục hồi của công lý thật sự. Đó là Thiên Chúa nói: \"Tất cả những điều sai đã được ghi nhận. Tất cả những điều tốt lành được làm trong bóng tối cũng được ghi nhận. Không có gì bị bỏ qua.\""],["h3","III. Điều Kinh Thánh Dạy Về Sự Phán Xét"],["h4","1. Mọi người đều được xét xử"],["p","2Cr 5,10: \"Vì tất cả chúng ta đều phải được đưa ra ánh sáng trước tòa Đức Ki-tô, để mỗi người lãnh nhận những gì tương xứng với các việc tốt hay xấu đã làm khi còn ở trong thân xác này.\""],["p","Điều quan trọng là: Kinh Thánh không dạy rằng tín hữu không bị xét xử – mà dạy rằng họ bước vào sự xét xử đó với một địa vị khác. Rm 8,1: \"Hiện nay không còn án phạt nào cho những ai ở trong Đức Ki-tô Giê-su.\""],["h4","2. Sự xét xử dựa trên những gì thật sự xảy ra"],["p","Mt 25,31-46 mô tả một trong những hình ảnh phán xét nổi tiếng nhất – và điều đáng chú ý là tiêu chí không phải là những tuyên bố thần học hay những nghi thức tôn giáo. Tiêu chí là: \"khi Ta đói, các ngươi đã cho ăn; khi Ta khát, các ngươi đã cho uống; khi Ta là khách lạ, các ngươi đã tiếp rước.\""],["p","Và người được khen – điều ngạc nhiên nhất – không biết mình đã làm điều đó: \"Lạy Chúa, có bao giờ chúng con đã thấy Chúa đói mà cho ăn?\" Đây là hình ảnh của người đã sống tốt không phải để được điểm số, mà vì đó là con người họ đang trở thành."],["h4","3. Sự phán xét và sự tha thứ không mâu thuẫn"],["p","Một trong những lo ngại phổ biến là: nếu Thiên Chúa xét xử mọi người, thì ân sủng và sự tha thứ có nghĩa gì? Câu trả lời thần học Ki-tô giáo là: chúng ta được biện hộ – không phải vì hồ sơ của chúng ta trong sạch, mà vì Đấng biện hộ cho chúng ta đã trả giá cho những gì sai trong hồ sơ đó. Rm 8,33-34: \"Ai sẽ buộc tội những người Thiên Chúa đã chọn? Đức Giê-su Ki-tô đã chết, hơn nữa đã được phục sinh và đang ngự bên hữu Thiên Chúa, Đấng đang chuyển cầu cho chúng ta.\""],["p","Điều này không có nghĩa là hành vi không quan trọng – nó vẫn quan trọng sâu sắc. Nhưng nó có nghĩa là: nền tảng của vị thế trong sự phán xét là mối quan hệ, không phải thành tích."],["h3","IV. Câu Hỏi Khó: Điều Gì Xảy Ra Với Những Người Chưa Nghe?"],["p","Đây là một trong những câu hỏi thật nhất và khó nhất: điều gì xảy ra với những người sống trước khi Tin Mừng đến, hay những người chưa bao giờ nghe về Đức Giê-su Ki-tô theo bất kỳ nghĩa có ý nghĩa nào?"],["p","Kinh Thánh không cung cấp câu trả lời đầy đủ và chi tiết cho câu hỏi này. Nhưng có một số điểm định hướng quan trọng:"],["p","Trước hết, Thiên Chúa là Đấng công bình – \"Đấng xét xử cả trái đất lại không làm điều công chính sao?\" (Gen 18,25). Sự phán xét của Ngài sẽ không tùy tiện hay bất công."],["p","Thứ hai, Rm 2,14-16 gợi ý rằng những người không có Luật Mô-se vẫn có \"luật được ghi khắc trong lòng họ\" và sẽ được phán xét theo đó."],["p","Thứ ba, cần nhận ra giới hạn của sự hiểu biết con người: chúng ta không có bản đồ đầy đủ của sự phán xét của Thiên Chúa. Điều chúng ta biết là Thiên Chúa \"muốn mọi người được cứu và nhận biết chân lý\" (1Tm 2,4) – và điều đó đủ để tin tưởng vào sự công bình của Ngài đối với những trường hợp chúng ta không có câu trả lời rõ ràng."],["h3","V. Sự Phán Xét Và Cuộc Sống Hiện Tại"],["p","Nhận thức về sự phán xét cuối cùng không phải để tạo ra nỗi sợ hãi tê liệt – mà để định hướng lại trách nhiệm. 2Cr 5,9-10 nói: \"Vì thế, dù ở nhà hay xa cách, chúng tôi cũng tha thiết muốn đẹp lòng Người. Vì tất cả chúng ta đều phải được đưa ra ánh sáng trước tòa Đức Ki-tô.\""],["p","Đây là sự thay đổi quan trọng: nếu tôi tin rằng mọi hành động của mình sẽ được nhìn thấy và ghi nhận – cả những điều tốt lành lẫn những điều sai – điều đó thay đổi cách tôi hành xử không phải khi có người nhìn, mà đặc biệt khi không có ai nhìn."],["p","Đây cũng là nguồn của sự an ủi đối với Dương: những điều cha anh đã làm trong bóng tối với mẹ anh không bị bỏ qua. Chúng đã được ghi nhận. Và sự tha thứ mà đức tin Ki-tô giáo mời gọi không có nghĩa là xóa bỏ thực tế của chúng – mà là trao chúng vào tay của Đấng có thể xử lý chúng theo cách công bình hơn bất kỳ sự phán xét nhân loại nào."],["h3","VI. Kết Chương 4 – Dương Và Công Lý Thật Sự"],["p","Dương không nhận được sự giải quyết mà anh muốn – không ai có thể trao điều đó trong cuộc sống này. Nhưng có điều gì đó thay đổi khi anh nhận ra rằng sự phán xét của Thiên Chúa không phải là mối đe dọa mà anh cần sợ, mà là sự bảo đảm mà mẹ anh xứng đáng được có."],["p","Những điều đã xảy ra là thật. Và có một Đấng nhìn thấy tất cả và sẽ làm điều đúng với tất cả – theo cách mà không hệ thống pháp lý nào của con người có thể làm. Đó không phải là sự trốn tránh trách nhiệm. Đó là sự trao tay – từ bàn tay của người không thể giải quyết, sang bàn tay của Đấng có thể."],["refl","CÂU HỎI SUY NGẪM — Chương 4",["<i>Câu hỏi của Dương – \"có điều gì sẽ đúng lại những điều sai không?\" – bạn có mang câu hỏi tương tự không? Trong hoàn cảnh nào?<\/i>","<i>Tại sao sự phán xét lại là tin tốt cho người bị áp bức và bất công, trong khi lại là tin đáng sợ cho người đang sống bất công?<\/i>","<i>Nhận thức về sự phán xét cuối cùng thay đổi gì – nếu có – trong cách bạn hành xử khi không ai nhìn thấy?<\/i>","<i>[Nhóm nhỏ] Bạn nghĩ tại sao câu chuyện về sự phán xét trong Mt 25 (cho ăn người đói, tiếp đón khách lạ) lại lấy những hành động cụ thể và thực tế làm tiêu chí, thay vì những tuyên bố thần học?<\/i>","<i>[Nhóm nhỏ] Làm thế nào để dạy về sự phán xét của Thiên Chúa theo cách tạo ra trách nhiệm và hy vọng – thay vì nỗi sợ hãi tê liệt hay sự thờ ơ?<\/i>","<i>[Nhóm nhỏ] Câu hỏi về những người chưa nghe – bạn đang đứng ở đâu với câu hỏi đó? Bạn cảm thấy thế nào khi không có câu trả lời rõ ràng?<\/i>"]]]},{"k":"ch","l":"Phần 4 · Chương 5","t":"Trời Mới Đất Mới: Hơn Cả Những Gì Chúng Ta Có Thể Hình Dung","pb":null,"b":[["q","Bấy giờ tôi thấy trời mới đất mới, vì trời cũ đất cũ đã biến mất... Tôi thấy Thành Thánh là Giê-ru-sa-lem Mới, từ trời, từ nơi Thiên Chúa mà xuống, sáng láng như tân nương trang điểm để đón tân lang. Tôi nghe từ phía ngai có tiếng hô to: \"Đây là nhà tạm Thiên Chúa ở cùng nhân loại... Thiên Chúa sẽ lau sạch nước mắt họ. Sẽ không còn sự chết; cũng chẳng còn tang tóc, kêu than và đau khổ nữa, vì những điều cũ đã biến mất.\"","Kh 21,1-4"],["h3","I. Câu Chuyện Của Hà – Nhìn Về Phía Trước"],["p","Hà hai mươi bảy tuổi. Cô đã đi qua Phần 1 với câu hỏi về Thiên Chúa và thế giới. Cô đã đi qua Phần 2 với câu hỏi về cái ác và đau khổ sau cái chết của người bạn thân. Cô đã đi qua Phần 3 với câu hỏi về bàn tay Thiên Chúa trong lịch sử."],["p","Bây giờ, bốn năm sau khi người bạn mất, cô ngồi trong một buổi chiều yên tĩnh và đặt ra câu hỏi khác hơn tất cả những câu hỏi trước: \"Điểm cuối của câu chuyện là gì? Và điểm cuối đó có nghĩa gì cho những người tôi đã mất?\""],["p","Không phải câu hỏi trừu tượng. Câu hỏi của người đang khao khát được thấy tên người bạn đó trong điều gì đó lớn hơn sự kết thúc của một cuộc sống."],["p","Và Kh 21 bắt đầu trả lời – không phải bằng một hệ thống thần học gọn gàng, mà bằng một hình ảnh: trời mới đất mới, nơi Thiên Chúa cư ngụ với con người, và không còn nước mắt nào nữa."],["h3","II. Điều Kh 21 Không Nói – Và Điều Nó Thực Sự Nói"],["p","Có những hiểu lầm phổ biến về \"thiên đàng\" mà cần được làm rõ trước khi chúng ta đến với điều Kinh Thánh thực sự nói."],["h4","Điều Kh 21 không nói:"],["p","\"Thiên đàng\" không phải là nơi linh hồn bay lơ lửng trong những đám mây vô định. Không phải là nơi con người trở thành thiên thần với cánh trắng. Không phải là nơi mà thực tại vật chất biến mất để lại chỉ còn \"điều tâm linh thuần túy\"."],["h4","Điều Kh 21 thực sự nói:"],["p","Kh 21 không mô tả con người được đưa lên trời. Nó mô tả trời mới xuống đất – \"Thành Thánh là Giê-ru-sa-lem Mới, từ trời, từ nơi Thiên Chúa mà xuống\". Không phải chúng ta thoát khỏi thế giới này. Mà là thế giới này được đổi mới và Thiên Chúa đến ở cùng."],["p","Câu then chốt là Kh 21,3: \"Đây là nhà tạm Thiên Chúa ở cùng nhân loại; Người sẽ cư ngụ cùng với họ. Họ sẽ là dân của Người, còn chính Người sẽ là Thiên-Chúa-ở-cùng-họ.\" Đây là sự hoàn tất của điều đã bắt đầu trong Gen 3 – khi Thiên Chúa đi dạo trong vườn cùng con người trước khi sự đứt gãy xảy ra. Toàn bộ câu chuyện Kinh Thánh là về Thiên Chúa tìm cách trở về với điều đó."],["h3","III. Sự Liên Tục Và Sự Gián Đoạn – Đổi Mới, Không Phải Xóa Bỏ"],["p","Một trong những câu hỏi thần học thú vị nhất về trời mới đất mới là: điều đó có liên tục với thế giới hiện tại không, hay là sự tạo dựng hoàn toàn mới từ đầu?"],["p","Từ Hy-lạp trong Kh 21,1 – \"kainos\" (mới) – không có nghĩa là \"khác hoàn toàn, không có liên hệ\". Nó có nghĩa là \"đổi mới, được làm mới lại\". Điều này khác với \"neos\" – nghĩa là mới hoàn toàn, chưa từng tồn tại. Thiên Chúa không vứt bỏ tạo vật cũ để tạo ra cái gì đó không liên quan. Ngài đổi mới nó."],["p","N.T. Wright dùng hình ảnh tái chế: khi một công ty lấy nguyên liệu cũ và biến đổi thành thứ hoàn toàn mới và tốt hơn, đó không phải là \"làm lại từ đầu\" – đó là sự biến đổi của cái đã có. Tương tự, thế giới mới không phải là thế giới hoàn toàn xa lạ – đó là thế giới này được biến đổi và đổi mới theo cách vượt qua khả năng tưởng tượng của chúng ta."],["p","Và điều quan trọng – nếu điều này đúng, thì những gì đang diễn ra trong thế giới này không biến mất. 1Cr 15,58 nói: \"Sự khó nhọc của anh em sẽ không trở nên vô ích trong Chúa.\" Những mối quan hệ được nuôi dưỡng, những hành động tốt lành, những công trình nghệ thuật và sự đẹp đẽ, những khoảnh khắc phẩm giá được phục hồi – chúng là \"vật liệu\" của thế giới mới. Thiên Chúa sẽ không vứt bỏ chúng."],["h3","IV. \"Sẽ Không Còn Sự Chết Nữa\" – Hơn Cả Sự Tha Thứ"],["p","Kh 21,4 là một trong những câu mạnh mẽ nhất trong toàn bộ Kinh Thánh: \"Sẽ không còn sự chết; cũng chẳng còn tang tóc, kêu than và đau khổ nữa, vì những điều cũ đã biến mất.\""],["p","Chú ý: không phải \"Thiên Chúa sẽ giải thích tại sao tất cả những điều đó phải xảy ra.\" Không phải \"những đau khổ đó đã có lý do xứng đáng.\" Mà là: chúng sẽ biến mất. Những điều cũ – tất cả những điều đó – sẽ không còn nữa."],["p","C.S. Lewis, trong \"The Great Divorce\", gợi ý một hình ảnh táo bạo: trong ánh sáng của niềm vui trọn vẹn cuối cùng, ngay cả những đau khổ của quá khứ sẽ không bị \"giải thích\" theo nghĩa trí tuệ – chúng sẽ bị \"hấp thụ\" vào trong điều tốt lành lớn hơn đến mức chúng trở thành phần của hành trình, không phải những vết thương không bao giờ lành. Nhưng Lewis cũng thận trọng: đây là hình ảnh, không phải hệ thống."],["p","Điều Kinh Thánh dạy rõ ràng hơn là: điểm cuối của câu chuyện không phải là sự giải thích của Thiên Chúa về lý do mọi điều xảy ra – đó là sự hiện diện của Thiên Chúa trong một thực tại mà \"những điều cũ đã biến mất\". Và sự hiện diện đó – \"Thiên-Chúa-ở-cùng-họ\" – là đủ."],["h3","V. Kh 22,20 – \"Xin Hãy Đến, Lạy Chúa Giê-su\""],["p","Kinh Thánh kết thúc với một trong những câu ngắn nhất và sâu sắc nhất: \"Marana tha – Xin hãy đến, lạy Chúa Giê-su!\" (Kh 22,20). Đây là lời cầu nguyện của cánh chung học Ki-tô giáo."],["p","Không phải \"xin Ngài giải thích tất cả.\" Không phải \"xin Ngài chứng minh rằng tất cả đều có ý nghĩa.\" Mà là: xin Ngài đến. Sự hiện diện là câu trả lời cuối cùng – không phải lý thuyết, mà là Đấng."],["p","Đây là điều quan trọng để nói với Hà, và với tất cả những ai đã mất người thân và đang mang câu hỏi: điểm cuối của câu chuyện không phải là chúng ta hiểu tất cả. Đó là chúng ta ở cùng Đấng hiểu tất cả. Và trong sự hiện diện đó – không còn nước mắt nữa."],["h3","VI. Sống Với Hy Vọng Này Hôm Nay"],["p","Hy vọng về trời mới đất mới không phải là trốn thoát khỏi hiện tại – ngược lại, nó là nền tảng để dấn thân vào hiện tại."],["p","1Cr 15,58 – câu kết của chương cánh chung học quan trọng nhất của Phao-lô – không nói \"vì vậy hãy đợi\". Mà nói: \"Bởi vậy, anh em thân mến, anh em hãy kiên tâm bền chí, và càng ngày càng tích cực tham gia vào công việc của Chúa, vì biết rằng: trong Chúa, sự khó nhọc của anh em sẽ không trở nên vô ích.\""],["p","Việc biết điểm đến không làm bạn thụ động – nó giải phóng bạn. Bạn không cần hoàn thành câu chuyện. Bạn chỉ cần trung thành với phần được giao phó cho mình trong câu chuyện đó."],["p","Ngân có thể tiếp tục làm việc với trẻ em đường phố dù không thể giải quyết tất cả bất công – vì những gì cô đang làm sẽ không vô ích. Thịnh có thể đau buồn vì cha mà vẫn có hy vọng – vì cái chết không phải là điểm cuối của câu chuyện. Dương có thể trao điều không thể giải quyết vào tay Đấng sẽ làm điều công bình – vì sự phán xét cuối cùng không thuộc về anh. Hà có thể tiếp tục sống và yêu – vì người bạn cô mất không bị xóa khỏi câu chuyện."],["p","Đây là điều hy vọng Ki-tô giáo thực sự là: không phải sự lạc quan rẻ tiền, không phải sự né tránh hiện thực. Mà là sự biết rằng Đấng kể câu chuyện biết điểm đến, rằng điểm đến đó là tốt lành, và rằng không có gì được làm trong tình yêu và sự trung thành sẽ bị mất."],["h3","VII. Kết Chương 5 – Và Tổng Kết Phần 4"],["p","Hà đóng cuốn sách lại trong buổi chiều đó không phải với sự giải quyết hoàn toàn. Câu hỏi của cô vẫn còn đó. Người bạn vẫn không còn đây."],["p","Nhưng cô mang về điều gì đó: một khung mới. Câu chuyện chưa kết thúc. Điểm đến của câu chuyện là sự hiện diện của Thiên Chúa cùng con người trong một thực tại đổi mới – không còn nước mắt, không còn cái chết, \"vì những điều cũ đã biến mất.\""],["p","Và trong điểm đến đó, tên người bạn của cô không bị mất. Nó được ghi."],["sum","TỔNG KẾT PHẦN 4 – CÁNH CHUNG",["<b>Chương 1: <\/b>Câu hỏi về điểm đến của câu chuyện – và tại sao nó quan trọng hôm nay.","<b>Chương 2: <\/b>Cái chết không phải là điều bình thường – và Đấng đứng trước ngôi mộ và khóc.","<b>Chương 3: <\/b>Vương Quốc Thiên Chúa đã đến nhưng chưa trọn – và công việc hiện tại của chúng ta là có ý nghĩa.","<b>Chương 4: <\/b>Sự phán xét cuối cùng là tin tốt cho những người khao khát công lý thật sự.","<b>Chương 5: <\/b>Trời mới đất mới – không phải sự xóa bỏ tạo vật mà là sự đổi mới, nơi Thiên Chúa cư ngụ cùng con người."]],["p","Đây là điểm đến của câu chuyện. Và từ điểm đến đó – từ Kh 21-22 nhìn trở lại hiện tại – mọi thứ mang ý nghĩa khác."],["refl","CÂU HỎI SUY NGẪM — Chương 5",["<i>Hình ảnh \"trời mới đất mới\" trong Kh 21 – nơi Thiên Chúa đến ở cùng con người – gợi lên gì trong bạn? Niềm vui, hoài nghi, khao khát, hay điều gì khác?<\/i>","<i>Nếu những gì bạn đang làm hôm nay \"sẽ không trở nên vô ích\" (1Cr 15,58), điều đó thay đổi gì trong cách bạn nhìn những công việc và mối quan hệ của mình hiện tại?<\/i>","<i>Lời cầu nguyện \"Marana tha – Xin hãy đến, lạy Chúa Giê-su\" có ý nghĩa gì với bạn – đó là lời cầu nguyện bạn thực sự muốn cầu không?<\/i>","<i>[Nhóm nhỏ] Trong nhóm, ai đang mang nỗi đau của sự mất mát – người thân, giấc mơ, hay điều gì khác? Hy vọng về trời mới đất mới có ý nghĩa gì cụ thể với người đó?<\/i>","<i>[Nhóm nhỏ] N.T. Wright nói những hành động tốt lành của chúng ta là \"vật liệu\" của thế giới mới – chúng không bị vứt bỏ. Điều đó thay đổi gì trong cách cộng đoàn của bạn nhìn việc phục vụ xã hội, chăm sóc môi trường, hay thực hiện nghệ thuật và sáng tạo?<\/i>","<i>[Nhóm nhỏ] Sau toàn bộ Phần 4, câu hỏi \"thế giới này sẽ đi về đâu?\" đang đứng ở đâu trong bạn so với khi bắt đầu đọc?<\/i>"]]]},{"k":"end","l":"Kết","t":"Kết Tập 2","pb":null,"b":[["orn"],["c","<b><i>Tiếp theo: Tập 3 – Đức Giê-su Ki-tô<\/i><\/b>"],["c","<i>« Ai Là Người Đó? »<\/i>"],["q","Còn anh em, anh em bảo Thầy là ai?","Mt 16,15"],["orn"],["c","<i>Tập 2 là một phần của bộ sách<\/i>"],["c","<b>KIẾP NHÂN SINH – Dưới Góc Nhìn Kinh Thánh<\/b>"],["c","<i>7 Tập • 28 Chính Đề • Một Hành Trình Trọn Đời<\/i>"],["c","<b>Bửu Hòa<\/b>"],["c","Hạ, 2026"]]}]},{"id":"tap-3","n":3,"title":"Đức Giê-su Ki-tô","tag":"« Ai Là Người Đó? »","pages":[{"k":"front","l":"Mở đầu","t":"Lời Mở Đầu Tập 3","pb":null,"b":[["p","Tập 1 đưa chúng ta vào hành trình về bản chất con người – chúng ta là ai, từ đâu đến, và mang trong mình danh tính gì. Tập 2 quay hướng nhìn ra bên ngoài – thế giới này là gì, lịch sử đang đi về đâu, và câu chuyện lớn mà chúng ta đang là một phần trong đó."],["p","Tập 3 đặt ra câu hỏi trọng tâm của toàn bộ bộ sách, và cũng là câu hỏi trọng tâm của lịch sử nhân loại: Đức Giê-su Ki-tô là ai?"],["p","Đây không phải là câu hỏi học thuật. Đó là câu hỏi mà theo Kinh Thánh, Đức Giê-su đã hỏi trực tiếp các môn đệ của mình: \"Phần anh em, anh em nói Thầy là ai?\" (Matthew 16,15). Và đó vẫn là câu hỏi mà mỗi người phải đối mặt theo cách riêng của mình."],["p","Tập 3 không cố gắng trả lời câu hỏi đó thay cho bạn. Nó mời bạn cùng hành trình – khám phá nhân vật lịch sử và thần học qua bốn chiều kích: Nhập Thể, sứ vụ và lời giảng, Thập Giá, và Phục Sinh."],["box","Cấu trúc 4 Phần",["<b>Phần 1 – Nhập Thể: <\/b>Thiên Chúa Đã Đến Trong Xác Thịt","<b>Phần 2 – Sứ Vụ: <\/b>Người Dạy Gì Và Làm Gì?","<b>Phần 3 – Thập Giá: <\/b>Tại Sao Người Phải Chết?","<b>Phần 4 – Phục Sinh: <\/b>Và Điều Đó Thay Đổi Gì?"]]]},{"k":"ch","l":"Phần 1 · Chương 1","t":"Câu Hỏi Không Thể Tránh","pb":["PHẦN 1","NHẬP THỂ","Thiên Chúa Đã Đến Trong Xác Thịt"],"b":[["q","Ngôi Lời đã trở nên người phàm và cư ngụ giữa chúng ta. Chúng tôi đã được nhìn thấy vinh quang của Người.","John 1,14"],["h3","I. Câu Chuyện Của Hạnh"],["story","Câu chuyện: Hạnh – 25 tuổi",["Hạnh hai mươi lăm tuổi, vừa tốt nghiệp đại học và đang đi làm năm đầu tiên. Cô lớn lên trong một gia đình có đạo, đọc Kinh Thánh từ nhỏ, và luôn cảm thấy mình \"biết\" về Đức Giê-su – theo nghĩa nắm được các thông tin quan trọng. Cho đến một buổi Chúa Nhật, khi cô nghe câu hỏi từ người giảng: \"Nhưng Đức Giê-su có thật sự là người không – người đói, người mệt, người khóc?\" Câu hỏi đó dừng cô lại. Cô biết câu trả lời đúng. Nhưng cô không chắc mình thật sự tin điều đó."]],["h3","II. Tại Sao Câu Hỏi Về Đức Giê-su Khác Mọi Câu Hỏi Khác"],["p","Trong lịch sử nhân loại, có nhiều nhà tư tưởng vĩ đại, nhiều người sáng lập tôn giáo, nhiều lãnh tụ tinh thần. Điều khiến câu hỏi về Đức Giê-su khác biệt không phải là những lời dạy của Ngài – dù những lời dạy đó có chiều sâu phi thường. Điều khiến câu hỏi này đặc biệt là tuyên bố nằm ở trung tâm của nó: rằng người thợ mộc từ Nazareth là Thiên Chúa đã trở thành xác thịt."],["p","C.S. Lewis từng chỉ ra rằng không thể giải quyết câu hỏi này bằng cách nói \"Đức Giê-su là một nhà giáo tốt nhưng không phải là Thiên Chúa\". Bởi vì những gì Đức Giê-su tuyên bố về bản thân mình – nếu không phải là thật – sẽ không phải là lời của một nhà giáo tốt, mà là lời của một kẻ điên hoặc một kẻ lừa đảo."],["box","Ba khả năng mà C.S. Lewis đặt ra:",["<b>Kẻ lừa đảo: <\/b>Ngài biết mình không phải Thiên Chúa nhưng vẫn nói vậy","<b>Kẻ điên rồ: <\/b>Ngài thật sự tin mình là Thiên Chúa nhưng không phải vậy","<b>Chúa: <\/b>Những gì Ngài tuyên bố là thật"]],["h3","III. Ngôi Lời Đã Trở Nên Xác Thịt – Không Phải Ngôi Lời Mặc Xác Thịt"],["p","John 1,14 dùng một từ khiến nhiều người phải dừng lại: \"sarx\" – xác thịt. Không phải \"mặc lấy thân xác\", như mặc một bộ quần áo có thể cởi ra. Mà là \"trở nên\" – một sự biến đổi thực sự, một sự hiện diện thực sự trong giới hạn của thân xác con người."],["p","Đây là điều mà thần học gọi là Nhập Thể – và đây là một trong những tuyên bố táo bạo nhất trong lịch sử tư tưởng nhân loại: Thiên Chúa vô hạn đã trở nên hữu hạn. Đấng không phụ thuộc vào bất cứ điều gì đã chọn trở nên phụ thuộc. Đấng tạo dựng không gian và thời gian đã chọn sinh ra trong một thời điểm cụ thể, tại một địa điểm cụ thể, trong một gia đình cụ thể."],["h3","IV. Đức Giê-su Là Con Người Thật"],["p","Một trong những điều người đọc Phúc Âm có thể ngạc nhiên là mức độ \"con người\" của Đức Giê-su được mô tả trong đó. Ngài đói (Matthew 4,2). Ngài mệt và ngủ (Mark 4,38). Ngài khóc (John 11,35). Ngài cảm thấy đau đớn và cô đơn trong vườn Gethsemane: \"Lạy Cha, nếu có thể được, xin cho chén này qua khỏi con\" (Matthew 26,39)."],["p","Đây không phải là diễn xuất. Và điều đó quan trọng – vì nó có nghĩa là bất cứ điều gì bạn trải qua với tư cách là một con người, Đức Giê-su đã trải qua điều đó trước bạn."],["q","Vì chúng ta không có một thượng tế không có khả năng cảm thông với sự yếu đuối của chúng ta; trái lại, Người đã chịu mọi thử thách như chúng ta, nhưng không phạm tội.","Hebrews 4,15"],["h3","V. Kết Chương 1"],["p","Câu hỏi \"Đức Giê-su Ki-tô là ai?\" không thể được trả lời từ xa. Tập 3 mời bạn bước vào bốn chiều kích của câu hỏi đó – và để câu hỏi đó chạm đến cuộc sống thực của bạn, không chỉ ở tầng thông tin."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi \"Nhưng Đức Giê-su có thật sự là người không?\" – nó chạm đến điều gì trong bạn?","Trong \"ba khả năng\" của C.S. Lewis, bạn đang đứng ở đâu?","Hebrews 4,15 nói Đức Giê-su đã \"chịu mọi thử thách như chúng ta\" – điều đó có ý nghĩa gì với bạn trong những khó khăn bạn đang đối mặt?","[Nhóm nhỏ] Điều gì khiến Nhập Thể – Thiên Chúa thật sự trở nên xác thịt – trở nên khó tin? Điều gì khiến nó trở nên đáng tin?"]]]},{"k":"ch","l":"Phần 1 · Chương 2","t":"Thiên Chúa Đã Chọn Chuồng Bò","pb":null,"b":[["q","Hôm nay, một Đấng Cứu Độ đã sinh ra cho anh em trong thành vua Đa-vít, Người là Đấng Ki-tô, là Đức Chúa.","Luke 2,11"],["h3","I. Câu Chuyện Của Hoàng"],["story","Câu chuyện: Hoàng – 31 tuổi",["Hoàng ba mươi mốt tuổi, là kỹ sư xây dựng. Anh thường ngồi trong các buổi lễ Giáng Sinh và nghe câu chuyện về máng cỏ với cảm giác quen thuộc đến mức không còn nghe nữa. Một năm, con gái nhỏ anh hỏi: \"Ba ơi, tại sao Chúa Giê-su không sinh ra trong một căn nhà đẹp?\" Hoàng chưa bao giờ thực sự suy nghĩ về câu hỏi đó. Nhưng câu hỏi của đứa trẻ bốn tuổi đó không rời khỏi anh suốt năm đó."]],["h3","II. Bethlehem – Điều Mà Ngôn Sứ Đã Nói"],["p","Micah 5,1 được viết hơn bảy trăm năm trước khi Đức Giê-su sinh ra: \"Phần ngươi, hỡi Bethlehem Ephrata, ngươi nhỏ bé nhất trong các thị tộc Giuđa, chính từ ngươi, Ta sẽ cho xuất hiện một vị có sứ mạng thống lãnh Israel.\" Khi Herodes hỏi các thầy tư tế về nơi Đấng Ki-tô sẽ sinh ra, họ trả lời không chút do dự: Bethlehem."],["p","Điều thú vị không chỉ là Đức Giê-su sinh ra ở Bethlehem – điều thú vị là Ngài sinh ra như thế nào ở đó. Không có phòng trong nhà trọ. Chuồng bò. Máng cỏ. Những người đến thờ phượng đầu tiên không phải là triều đình hay các học giả – mà là những người chăn chiên, những người thuộc tầng lớp thấp nhất trong xã hội thời đó."],["h3","III. Cái Lộn Ngược Của Thiên Chúa"],["p","Luca ghi lại bài ca của Maria – thường gọi là Magnificat – ngay từ trước khi Đức Giê-su ra đời. Trong đó, Maria nói một điều đáng chú ý về bản chất của Thiên Chúa:"],["q","Chúa hạ bệ những ai quyền thế, Ngài nâng cao mọi kẻ khiêm nhường. Kẻ đói nghèo, Chúa ban của đầy dư, người giàu có, lại đuổi về tay trắng.","Luke 1,52-53"],["p","Nhập Thể không chỉ là Thiên Chúa đến thế giới. Nó là Thiên Chúa đến thế giới theo cách cụ thể này – từ dưới lên, không phải từ trên xuống. Điều đó nói lên điều gì đó căn bản về bản tính của Ngài."],["h3","IV. Ý Nghĩa Của Sự Khiêm Nhường Thần Thiêng"],["p","Philippians 2,6-8 mô tả Nhập Thể như là một sự \"tự trút bỏ\" – Đức Giê-su, \"dù là Thiên Chúa, đã không nghĩ phải giành cho được địa vị ngang hàng với Thiên Chúa, nhưng đã hoàn toàn trút bỏ vinh quang\". Từ Hy-lạp là \"kenosis\" – sự làm trống chính mình."],["p","Đây không phải là yếu đuối. Đây là sự chọn lựa. Và sự chọn lựa đó – chuồng bò thay vì cung điện, chăn chiên thay vì quan chức, người thợ mộc thay vì học giả – nói lên một điều về Thiên Chúa mà không có hệ thống triết học nào có thể đặt ra: Ngài gần gũi với những điều nhỏ bé."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi của đứa trẻ Hoàng – \"tại sao Chúa Giê-su không sinh ra trong căn nhà đẹp?\" – bạn trả lời thế nào?","Hình ảnh chuồng bò và máng cỏ nói với bạn điều gì về bản tính của Thiên Chúa?","[Nhóm nhỏ] \"Kenosis\" – sự tự trút bỏ – có thể trở thành mô hình sống cho người tin không?"]]]},{"k":"ch","l":"Phần 1 · Chương 3","t":"Con Người Thật, Thiên Chúa Thật","pb":null,"b":[["q","Điều đã có ngay từ lúc khởi đầu, điều chúng tôi đã nghe, điều chúng tôi đã thấy tận mắt, điều chúng tôi đã chiêm ngưỡng, và tay chúng tôi đã chạm đến – đó là Lời mang lại sự sống.","1 John 1,1"],["h3","I. Câu Chuyện Của Trâm"],["story","Câu chuyện: Trâm – 29 tuổi",["Trâm hai mươi chín tuổi, có nền tảng học thuật về lịch sử. Câu hỏi của cô không phải là liệu Đức Giê-su có tồn tại trong lịch sử hay không – đó là điều ngay cả các học giả không theo Kitô giáo đều xác nhận. Câu hỏi của cô là: \"Có thể tin những gì được viết về Ngài không? Bốn Phúc Âm đáng tin cậy đến mức nào?\""]],["h3","II. Đức Giê-su Lịch Sử – Điều Chúng Ta Biết Chắc"],["p","Nhà sử học người Do Thái Josephus, viết vào cuối thế kỷ 1, đề cập đến Đức Giê-su như một nhân vật lịch sử thực có. Tacitus, sử gia La-mã, đề cập đến việc Đức Ki-tô bị xử tử dưới thời Pontius Pilatus. Sự tồn tại của Đức Giê-su như một nhân vật lịch sử là một trong những điều được xác nhận chắc chắn nhất của thế giới cổ đại."],["p","Nhưng lịch sử không thể trả lời câu hỏi: Ngài là ai thật sự? Đó là nơi Phúc Âm bắt đầu."],["h3","III. Tín Điều Chalcedon – Khuôn Khổ Để Hiểu"],["p","Năm 451 sau Công Nguyên, Công Đồng Chalcedon đã xác định một khung thần học sau nhiều thế kỷ tranh luận: Đức Giê-su Ki-tô là một Ngôi vị duy nhất trong hai bản tính – hoàn toàn là Thiên Chúa và hoàn toàn là con người. Không pha trộn. Không hòa tan. Không bị giảm bớt."],["box","Hai cám dỗ thần học luôn tồn tại:",["<b>Nhấn mạnh tính thần linh đến mức tính nhân loại bị mờ: <\/b>Đức Giê-su chỉ \"giả vờ\" là người","<b>Nhấn mạnh tính nhân loại đến mức tính thần linh biến mất: <\/b>Đức Giê-su chỉ là một con người tốt đẹp","<i>Kinh Thánh giữ cả hai trong sức căng: <\/i>Ngài đói thật sự (con người) và thổi lại sự sống cho người chết (Thiên Chúa)"]],["h3","IV. Tại Sao Cả Hai Đều Cần Thiết"],["p","Nếu Đức Giê-su chỉ là con người – thì cái chết của Ngài không có trọng lượng vũ trụ, và sự phục sinh của Ngài chỉ là một kỳ tích kỳ lạ. Nếu Đức Giê-su chỉ là Thiên Chúa – thì sự đồng hành của Ngài với những đau khổ con người là xa lạ, và sự chết của Ngài là diễn xuất, không phải thật."],["p","Cả hai cùng lúc là điều duy nhất có thể giải thích tại sao sự kiện Thập Giá và Phục Sinh mang ý nghĩa mà nó mang."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi của Trâm về độ tin cậy của Phúc Âm – bạn đã từng có câu hỏi tương tự không?","Trong hai cám dỗ thần học – nhấn mạnh thần linh hay nhân loại – bạn thường nghiêng về phía nào hơn?","\"Hoàn toàn là Thiên Chúa và hoàn toàn là con người\" – điều này thay đổi gì trong cách bạn đến gần Đức Giê-su?"]]]},{"k":"ch","l":"Phần 1 · Chương 4","t":"Giao Ước Mới: Thiên Chúa Đến Gần","pb":null,"b":[["q","Thiên Chúa yêu thế gian đến nỗi đã ban Con Một, để ai tin vào Con của Người thì khỏi phải chết, nhưng được sống muôn đời.","John 3,16"],["h3","I. Lời Hứa Qua Các Thế Kỷ"],["p","Từ Genesis 3, sau sự sa ngã, đã có một lời hứa ẩn – một \"Proto-Evangelium\", một Phúc Âm đầu tiên: dòng dõi người đàn bà sẽ đạp đầu con rắn (Genesis 3,15). Câu chuyện Kinh Thánh từ đó là câu chuyện về lời hứa đó đang được triển khai – qua Abraham, qua Moses, qua các ngôn sứ – hướng đến sự hoàn tất."],["p","Jeremiah 31,31-34 nói trước về \"Giao Ước Mới\" – khác với Giao Ước Sinai, không ghi trên đá mà ghi trên trái tim. Và trong Luke 22,20, trong buổi Tiệc Ly, Đức Giê-su cầm chén và nói: \"Chén này là giao ước mới lập bằng máu Thầy, máu đổ ra vì anh em.\""],["h3","II. Tại Sao John 3,16 Không Đơn Giản Như Ta Tưởng"],["p","John 3,16 là câu Kinh Thánh được trích dẫn nhiều nhất thế giới. Và chính vì thế, nó dễ bị đọc qua mà không cảm nhận sức nặng của nó. Hãy đọc lại từng từ: \"Thiên Chúa yêu thế gian\" – không phải \"những người tốt\", không phải \"những người theo đạo\", mà là \"thế gian\" – thực tại với toàn bộ sự méo mó của nó. \"Đến nỗi đã ban Con Một\" – đây không phải là món quà từ xa. Đây là trao đi điều quý nhất."],["box","Ý nghĩa thực tế của John 3,16",["Tình yêu của Thiên Chúa không có điều kiện trước. Ngài không yêu vì bạn tốt – Ngài yêu vì Ngài là tình yêu (1 John 4,16).","Nhập Thể là chứng cớ của tình yêu đó – không phải lời tuyên bố trống rỗng, mà là hành động lịch sử cụ thể.","\"Ai tin\" không có nghĩa là ai biết đủ thông tin – mà là ai đặt tin tưởng, phó thác."]],["sum","TỔNG KẾT PHẦN 1 – Nhập Thể",["<b>Chương 1: <\/b>Đức Giê-su Ki-tô là người thật và Thiên Chúa thật – và câu hỏi đó không thể bị né tránh","<b>Chương 2: <\/b>Thiên Chúa đã chọn đến từ dưới lên – chuồng bò, chăn chiên, người bị coi thường","<b>Chương 3: <\/b>\"Hoàn toàn là Thiên Chúa, hoàn toàn là con người\" – không phải công thức khô khan mà là nền tảng sống động","<b>Chương 4: <\/b>Nhập Thể là sự hoàn tất của lời hứa – Giao Ước Mới ghi trên trái tim, không phải đá"]]]},{"k":"ch","l":"Phần 2 · Chương 1","t":"Bài Giảng Trên Núi: Lật Ngược Tất Cả","pb":["PHẦN 2","SỨ VỤ","Người Dạy Gì Và Làm Gì?"],"b":[["q","Phúc thay ai có tâm hồn nghèo khó, vì Nước Trời là của họ. Phúc thay ai hiền lành, vì họ sẽ được Đất Hứa làm gia nghiệp.","Matthew 5,3.5"],["h3","I. Câu Chuyện Của Long"],["story","Câu chuyện: Long – 34 tuổi",["Long ba mươi bốn tuổi, là một nhà quản lý cấp trung. Anh đã theo đạo từ nhỏ nhưng lớn lên tin rằng đức tin là công cụ để sống đúng đắn: làm người tốt, chăm chỉ, giữ quy tắc. Rồi một lần anh đọc Bài Giảng Trên Núi thật chậm và nhận ra điều kỳ lạ: những người được gọi là \"phúc\" trong đó không phải là những người thành công theo nghĩa anh vẫn nghĩ. Họ là những người đang ở trong những tình huống mà anh sẽ gọi là thất bại."]],["h3","II. Bát Phúc – Cuộc Lật Đổ Cầu Thang Xã Hội"],["p","Matthew 5,3-12 mở đầu Bài Giảng Trên Núi bằng tám câu tuyên bố, mỗi câu bắt đầu bằng \"Phúc thay\". Điều kỳ lạ của danh sách này là những người được tuyên bố là \"phúc\" đều không phải là những người mà xã hội thường gọi là thành công: người nghèo khó trong tâm hồn, người đang than khóc, người hiền lành, người bị bách hại."],["p","Các học giả gọi đây là \"cuộc lật đổ giá trị\" – Đức Giê-su không nói rằng nghèo khổ là tốt về bản thân nó, hay bị bách hại là mục tiêu. Ngài đang nói điều gì đó khác: rằng Vương Quốc Thiên Chúa vận hành theo một logic khác với logic thế gian."],["h3","III. \"Nhưng Thầy Bảo Cho Anh Em Biết...\""],["p","Sau Bát Phúc, Đức Giê-su đi qua một loạt đề tài – giận dữ, ngoại tình, ly hôn, lời thề, trả thù, yêu thù địch. Mỗi lần, Ngài dùng cấu trúc: \"Anh em đã nghe Luật dạy rằng... Nhưng Thầy bảo cho anh em biết...\""],["p","Đây không phải là bác bỏ Lề Luật. Đức Giê-su nói rõ điều này: \"Đừng tưởng Thầy đến để bãi bỏ Luật Mô-sê... Thầy đến không phải để bãi bỏ, nhưng để kiện toàn\" (Matthew 5,17). Ngài đang đào sâu hơn lớp hành động bên ngoài để chạm đến gốc rễ bên trong của trái tim."],["q","Anh em đã nghe Luật dạy rằng: Mắt đền mắt, răng đền răng. Nhưng Thầy bảo cho anh em biết: đừng chống cự người ác, và nếu bị ai vả má bên phải, thì hãy giơ cả má bên trái ra nữa.","Matthew 5,38-39"],["h3","IV. Khó Nghe Vì Đi Ngược Với Bản Năng"],["p","Không phải ngẫu nhiên mà ngay sau Bài Giảng Trên Núi, Matthew ghi lại: \"Đám đông sửng sốt về cách Người giảng dạy, vì Người giảng dạy như một Đấng có thẩm quyền\" (Matthew 7,28-29). Những gì Đức Giê-su dạy không chỉ khó thực hành – nó cũng khó nghe, vì nó đi ngược lại những phản xạ sâu nhất của bản tính con người."],["refl","CÂU HỎI SUY NGẪM",["Trong Bát Phúc, câu nào chạm đến bạn nhất – vì bạn khao khát nó, hay vì bạn thấy nó khó tin?","Cấu trúc \"Anh em đã nghe... nhưng Thầy bảo...\" – nó thách thức điều gì trong bạn?","[Nhóm nhỏ] Bài Giảng Trên Núi có thể được sống trong thực tế không, hay chỉ là lý tưởng không thể đạt?"]]]},{"k":"ch","l":"Phần 2 · Chương 2","t":"Đức Giê-su Và Những Người Bị Gạt Ra Lề","pb":null,"b":[["q","Người khỏe mạnh không cần thầy thuốc, người đau ốm mới cần. Tôi không đến để kêu gọi người công chính, mà để kêu gọi người tội lỗi.","Mark 2,17"],["h3","I. Câu Chuyện Của Mai"],["story","Câu chuyện: Mai – 27 tuổi",["Mai hai mươi bảy tuổi, lớn lên trong môi trường tôn giáo nơi cô thường nghe những người \"không xứng\" bị loại trừ. Bạn thân của cô bị từ chối trong một cộng đoàn vì lý do mà cô không nghĩ là đáng. Và cô bắt đầu đặt câu hỏi: Đức Giê-su trong Phúc Âm có thực sự như những gì cộng đồng tôn giáo mà cô quen biết thể hiện không?"]],["h3","II. Những Người Mà Đức Giê-su Chọn Ngồi Ăn Cùng"],["p","Trong thế giới thế kỷ 1, ngồi ăn cùng nhau không chỉ là ăn uống – đó là tuyên bố quan hệ và sự chấp nhận. Người Pharisêu ăn với người Pharisêu. Người tinh sạch ăn với người tinh sạch. Và Đức Giê-su ăn với ai?"],["p","Với người thu thuế – những kẻ bị coi là phản quốc vì cộng tác với đế quốc La-mã. Với người có tội – những người bị xã hội tôn giáo gạt ra lề. Với người Samaritanô – nhóm bị người Do Thái coi là không thuần khiết. Với phụ nữ – trong một xã hội mà chứng tá của phụ nữ không có giá trị pháp lý."],["q","Ông Giê-su bèn đến Giêricô và đi ngang qua thành. Ở đó có một người tên là Dakêu; ông đứng đầu những người thu thuế, và là người giàu có. Ông Giê-su bảo: \"Này anh Dakêu, xuống mau đi, vì hôm nay tôi phải ở lại nhà anh!\"","Luke 19,1-5"],["h3","III. Sự Khác Biệt Giữa Chấp Nhận Và Đồng Lõa"],["p","Điều quan trọng cần phân biệt: khi Đức Giê-su ngồi ăn với người tội lỗi, Ngài không phủ nhận rằng họ đang sống sai. Ngài vẫn nói: \"Hãy đi và đừng phạm tội nữa\" (John 8,11). Nhưng Ngài chọn sự tiếp cận trước – sự hiện diện trước – thay vì đặt sự thay đổi như điều kiện tiên quyết để được tiếp nhận."],["p","Đây là trật tự quan trọng: không phải \"hãy thay đổi rồi tôi sẽ đến gần bạn\", mà là \"tôi đến gần bạn, và sự gần gũi đó là điều dẫn đến thay đổi\"."],["h3","IV. Cộng Đoàn Đức Giê-su Và Sự Gạt Ra Lề"],["p","Nếu Đức Giê-su là chuẩn mực, thì cộng đoàn của Ngài không phải là nơi của những người \"đã đủ tiêu chuẩn\" – mà là nơi của những người đang trên đường. Sự khác biệt căn bản không phải là giữa \"người tốt\" và \"người xấu\", mà là giữa người biết mình cần ơn và người nghĩ mình không cần."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi của Mai – giữa Đức Giê-su trong Phúc Âm và những gì cộng đoàn thể hiện – bạn có thấy khoảng cách đó không?","Trong cuộc sống của bạn, ai là \"người Dakêu\" mà bạn có xu hướng tránh gần?","Trật tự \"đến gần trước, thay đổi sau\" – điều đó thách thức hay giải phóng bạn?"]]]},{"k":"ch","l":"Phần 2 · Chương 3","t":"Những Phép Lạ: Dấu Chỉ Hay Biểu Diễn?","pb":null,"b":[["q","Còn nếu tôi dựa vào Thần Khí của Thiên Chúa mà trừ quỷ, thì quả là Triều Đại Thiên Chúa đã đến giữa các ông.","Matthew 12,28"],["h3","I. Cách Hiểu Phép Lạ Trong Phúc Âm"],["p","Người đọc hiện đại thường tiếp cận những câu chuyện phép lạ trong Phúc Âm theo hai cực: hoặc chấp nhận tất cả theo nghĩa đen mà không suy nghĩ, hoặc gạt bỏ tất cả như huyền thoại. Cả hai đều bỏ lỡ điều quan trọng: các phép lạ trong Phúc Âm không phải là biểu diễn quyền năng, chúng là \"dấu chỉ\" – những hành động mang nghĩa."],["p","Từ Hy-lạp mà John dùng cho phép lạ là \"semeion\" – dấu chỉ. Mỗi phép lạ chỉ về điều gì đó lớn hơn bản thân hành động đó."],["box","Các dấu chỉ và điều chúng trỏ đến:",["<b>Hóa bánh cho năm ngàn người: <\/b>Ngài là \"bánh của sự sống\" (John 6,35)","<b>Chữa người mù: <\/b>Ngài là \"ánh sáng của thế gian\" (John 9,5)","<b>Làm sống lại Lazarus: <\/b>Ngài là \"sự sống lại và là sự sống\" (John 11,25)","<b>Làm lặng cơn bão: <\/b>Ngài có thẩm quyền trên cả thiên nhiên – người bước trên nước là Đấng tạo dựng nước"]],["h3","II. Phép Lạ Và Lòng Thương Xót"],["p","Một chi tiết thường bị bỏ qua: trước mỗi phép lạ chữa lành lớn trong Phúc Âm, thường có cụm từ: \"Đức Giê-su chạnh lòng thương\". Từ Hy-lạp là \"splanchnizomai\" – một từ mô tả sự rung động tận ruột gan. Đây không phải là lòng thương hại từ xa. Đây là lòng thương xót đến mức bị lay động sâu bên trong."],["p","Điều đó có nghĩa là: đằng sau mỗi phép lạ không phải là một màn trình diễn quyền năng, mà là sự đáp lại của tình yêu trước nỗi đau con người."],["h3","III. Khi Phép Lạ Không Xảy Ra"],["p","Điều cũng cần nói thẳng: không phải mọi người bệnh đều được Đức Giê-su chữa lành. Không phải mọi người chết đều sống lại. Phao-lô cầu nguyện ba lần để \"cái dằm trong xác\" được lấy đi – và không được (2 Corinthians 12,8). Điều này không mâu thuẫn với đức tin. Các phép lạ là dấu chỉ của Vương Quốc đang đến – không phải là bảo đảm rằng tất cả đau khổ sẽ bị xóa bỏ ngay bây giờ."],["refl","CÂU HỎI SUY NGẪM",["Khi đọc về phép lạ trong Phúc Âm, phản ứng đầu tiên của bạn là gì?","Hình ảnh Đức Giê-su \"chạnh lòng thương\" – bị lay động đến tận ruột gan – nói với bạn điều gì về bản tính của Ngài?","[Nhóm nhỏ] Khi cầu nguyện không nhận được điều mình cầu xin, điều đó thách thức đức tin của bạn như thế nào?"]]]},{"k":"ch","l":"Phần 2 · Chương 4","t":"\"Tôi Là\": Bảy Tuyên Bố Làm Thay Đổi Tất Cả","pb":null,"b":[["q","Đức Giê-su đáp: \"Thật, tôi bảo thật các ông: trước khi có ông Abraham, thì tôi, Tôi Hằng Hữu.\"","John 8,58"],["h3","I. Ngôn Ngữ Mà Người Nghe Hiểu Ngay"],["p","Trong John, Đức Giê-su dùng bảy lần tuyên bố \"Tôi là\" đi kèm với hình ảnh: bánh sự sống, ánh sáng thế gian, cửa chuồng chiên, mục tử nhân lành, sự sống lại và sự sống, con đường và sự thật và sự sống, cây nho thật. Nhưng trong John 8,58, không có hình ảnh đi kèm – chỉ là: \"Tôi Hằng Hữu.\""],["p","Người nghe – những người Do Thái trong đền thờ – hiểu ngay điều đó muốn nói gì. Đây là cách dịch tiếng Hy-lạp của danh Thiên Chúa mặc khải với Moses ở bụi gai: \"Ta là Đấng Hằng Hữu\" (Exodus 3,14). Phản ứng của họ không phải là thắc mắc – họ \"nhặt đá lên để ném Người.\""],["h3","II. Bảy Hình Ảnh – Bảy Chiều Của Mối Quan Hệ"],["box","Bảy \"Tôi là\" trong Phúc Âm John:",["<b>\"Tôi là bánh sự sống\" (John 6,35): <\/b>Đáp ứng nhu cầu căn bản nhất – không chỉ thể xác","<b>\"Tôi là ánh sáng thế gian\" (John 8,12): <\/b>Định hướng giữa bóng tối","<b>\"Tôi là cửa chuồng chiên\" (John 10,9): <\/b>Lối vào sự an toàn và sự sống","<b>\"Tôi là mục tử nhân lành\" (John 10,11): <\/b>Ngài tìm kiếm, Ngài biết tên từng con chiên","<b>\"Tôi là sự sống lại và sự sống\" (John 11,25): <\/b>Thẩm quyền trên cái chết","<b>\"Tôi là con đường, sự thật và sự sống\" (John 14,6): <\/b>Không phải một lý thuyết – là một Ngôi Vị","<b>\"Tôi là cây nho thật\" (John 15,1): <\/b>Sự kết nối sinh sự sống – không phải nỗ lực độc lập"]],["h3","III. Không Có Lựa Chọn Trung Dung"],["p","Dorothy Sayers, nhà văn người Anh, viết: \"Người ta không đóng đinh những nhà giáo đạo đức vào thập giá. Những lời dạy của Đức Giê-su không gây ra vấn đề. Chính Ngài gây ra vấn đề – vì Ngài tuyên bố điều mà không nhà giáo đạo đức nào có thể tuyên bố mà không bị coi là điên.\""],["p","Bảy tuyên bố \"Tôi là\" không cho phép người nghe tiếp tục coi Đức Giê-su như một giáo viên tốt và dừng lại ở đó."],["refl","CÂU HỎI SUY NGẪM",["Trong bảy hình ảnh \"Tôi là\", hình ảnh nào chạm đến bạn nhất ngay lúc này?","Tuyên bố trong John 8,58 – \"trước khi có Abraham, tôi Hằng Hữu\" – đặt bạn vào thế nào?","[Nhóm nhỏ] Sự khác biệt giữa \"theo giáo lý của Đức Giê-su\" và \"theo Đức Giê-su\" – điều đó có nghĩa gì trong thực tế?"]]]},{"k":"ch","l":"Phần 3 · Chương 1","t":"Tuần Cuối: Con Đường Đến Gethsemane","pb":["PHẦN 3","THẬP GIÁ","Tại Sao Người Phải Chết?"],"b":[["q","Linh hồn Thầy buồn đến chết được. Anh em ở lại đây mà canh thức với Thầy.","Matthew 26,38"],["h3","I. Câu Chuyện Của Bảo"],["story","Câu chuyện: Bảo – 38 tuổi",["Bảo ba mươi tám tuổi, đã theo đạo nhiều năm. Anh biết câu chuyện Thương Khó rất rõ – nhưng biết theo nghĩa nắm được trình tự các sự kiện. Một lần anh đọc lại Matthew 26, đặc biệt câu: \"Linh hồn Thầy buồn đến chết được\" – và dừng lại. Đây là Đức Giê-su – Đấng Ngài tin là Thiên Chúa – đang nói điều đó. Và lần đầu tiên, điều đó cảm thấy thật theo một nghĩa khác hẳn."]],["h3","II. Tuần Lễ Thương Khó – Hành Trình Có Ý Thức"],["p","Điều đặc biệt của câu chuyện Thương Khó không phải là Đức Giê-su bị bắt bất ngờ và bị giết. Điều đặc biệt là Ngài biết – và vẫn đi về phía trước. Từ Luke 9,51: \"Khi đã tới ngày Đức Giê-su được rước lên trời, Người nhất quyết đi lên Giêrusalem.\""],["p","Ngài dự báo về cái chết của mình ít nhất ba lần (Mark 8,31; 9,31; 10,33-34). Và vẫn tiến về phía trước. Đây không phải là bi kịch xảy ra với Ngài. Đây là lựa chọn có ý thức."],["h3","III. Gethsemane – Khoảnh Khắc Quan Trọng Nhất"],["p","Vườn Gethsemane là một trong những khoảnh khắc thần học quan trọng nhất trong Tân Ước. Đức Giê-su cầu nguyện: \"Lạy Cha, nếu có thể được, xin cho chén này qua khỏi con. Tuy vậy, xin đừng theo ý con, mà xin theo ý Cha\" (Matthew 26,39)."],["p","Đây không phải là nghi lễ. Đây là cuộc đấu tranh thật sự. Luke 22,44 mô tả: \"Người lâm cơn xao xuyến bồi hồi, nên càng khẩn nguyện hơn; và mồ hôi Người như những giọt máu rơi xuống đất.\" Đức Giê-su thực sự không muốn chết. Và Ngài đã chọn vâng phục."],["q","Đây chính là điều răn của Cha Thầy: đó là Thầy hy sinh mạng sống mình. Mạng sống của Thầy, không ai lấy đi được, nhưng chính Thầy tự ý hy sinh mạng sống mình.","John 10,17-18"],["refl","CÂU HỎI SUY NGẪM",["Hình ảnh Đức Giê-su trong Gethsemane – \"buồn đến chết được\", \"mồ hôi như giọt máu\" – chạm đến bạn như thế nào?","Lời cầu nguyện \"không phải ý con, mà ý Cha\" – bạn đã từng cầu nguyện trong hoàn cảnh nào tương tự không?","[Nhóm nhỏ] Sự kiện Gethsemane có thay đổi gì trong cách bạn nhìn nhận đức tin không phải là sự vắng mặt của đấu tranh?"]]]},{"k":"ch","l":"Phần 3 · Chương 2","t":"Thập Giá: Tại Sao Cần Thiết?","pb":null,"b":[["q","Đức Ki-tô đã chết vì tội lỗi chúng ta, đúng như lời Kinh Thánh, rồi Người đã được mai táng, và ngày thứ ba đã trỗi dậy, đúng như lời Kinh Thánh.","1 Corinthians 15,3-4"],["h3","I. Câu Chuyện Của Hoa"],["story","Câu chuyện: Hoa – 32 tuổi",["Hoa ba mươi hai tuổi. Câu hỏi của cô không phải là \"Có phải Đức Giê-su đã chết trên Thập Giá không?\" – điều đó cô chấp nhận. Câu hỏi của cô là: \"Tại sao? Tại sao cách đó? Nếu Thiên Chúa muốn tha thứ, sao Ngài không đơn giản tha thứ – tại sao cần Thập Giá?\""]],["h3","II. Câu Hỏi Của Hoa Là Câu Hỏi Của Nhiều Người"],["p","Câu hỏi này không phải là dấu hiệu của sự thiếu đức tin – đó là câu hỏi thần học nghiêm túc. Và Kinh Thánh không cho một câu trả lời duy nhất. Nó sử dụng nhiều ngôn ngữ và nhiều hình ảnh để nói về ý nghĩa của Thập Giá."],["box","Bốn hình ảnh chính về ý nghĩa Thập Giá trong Kinh Thánh:",["<b>1. Thế mạng (Substitution): <\/b>Đức Giê-su chịu những gì tội lỗi chúng ta đáng phải chịu (Isaiah 53,5; Romans 3,25)","<b>2. Giao hòa (Reconciliation): <\/b>Khoảng cách giữa Thiên Chúa và con người được xóa bỏ (2 Corinthians 5,19)","<b>3. Chuộc lại (Redemption): <\/b>Như trả giá chuộc người nô lệ được tự do (Mark 10,45)","<b>4. Chiến thắng (Christus Victor): <\/b>Đức Giê-su chiến thắng tội lỗi, cái chết, và quyền lực của kẻ thù (Colossians 2,15)"]],["h3","III. Không Phải Thiên Chúa Bị Thuyết Phục Bởi Đức Giê-su"],["p","Một hiểu lầm phổ biến là: Đức Giê-su bị đặt giữa Thiên Chúa Cha đang tức giận và loài người cần được cứu – và Ngài chịu hình phạt để thuyết phục Cha tha thứ. Đây là cách đọc sai, và đây là điều Romans 5,8 điều chỉnh: \"Khi chúng ta còn là tội nhân, Đức Ki-tô đã chết vì chúng ta.\" Ai đã sai Đức Ki-tô? Thiên Chúa Cha. Đây là sáng kiến của tình yêu Thiên Chúa – không phải sự nhượng bộ của Thiên Chúa trước Đức Giê-su."],["h3","IV. Đức Giê-su Và Bóng Tối Lớn Nhất"],["p","Trong ba giờ trên Thập Giá, bóng tối bao phủ. Và Đức Giê-su kêu lên: \"Thiên Chúa của con, Thiên Chúa của con, sao Ngài bỏ con?\" (Matthew 27,46 – trích từ Psalms 22,2). Đây là tiếng kêu của người đang trải nghiệm sự chia cắt – khoảng tối sâu nhất của sự xa cách. Các học giả thần học nói rằng đây là Đức Giê-su đang mang vào bản thân mình toàn bộ trọng lượng của sự xa cách khỏi Thiên Chúa mà tội lỗi gây ra – và trải nghiệm nó từ bên trong."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi của Hoa – \"tại sao cần Thập Giá?\" – bạn trả lời thế nào cho bản thân mình?","Trong bốn hình ảnh về ý nghĩa Thập Giá, hình ảnh nào nói với bạn mạnh nhất?","Tiếng kêu của Đức Giê-su \"Thiên Chúa của con, sao Ngài bỏ con?\" – bạn đã từng cảm thấy điều gì tương tự không?","[Nhóm nhỏ] Việc Thiên Chúa Cha là người sai Đức Giê-su đến – điều đó thay đổi gì trong cách bạn hiểu Thập Giá?"]]]},{"k":"ch","l":"Phần 3 · Chương 3","t":"Dưới Chân Thập Giá: Những Người Ở Đó","pb":null,"b":[["q","Đứng gần thập giá Đức Giê-su, có thân mẫu Người, chị của thân mẫu, bà Maria vợ ông Cơlopát, cùng với bà Maria Mácđala.","John 19,25"],["h3","I. Những Người Đã Không Bỏ Đi"],["p","Khi Đức Giê-su bị bắt, các môn đệ trốn chạy. Phêrô chối. Giuđa phản nộp. Nhưng John 19,25 ghi lại: có người vẫn ở đó. Không phải người quyền thế. Không phải những người có thể bảo vệ Ngài hay thay đổi gì. Phụ nữ – những người mà thế giới thế kỷ 1 coi là không đáng kể."],["p","Và người môn đệ Đức Giê-su yêu mến. Từ trên Thập Giá, Đức Giê-su nhìn xuống và nói với người môn đệ đó: \"Đây là mẹ của anh.\" Ngay cả trong khoảnh khắc đau khổ tột cùng, Ngài quan tâm đến mối quan hệ và sự chăm sóc cụ thể."],["h3","II. Tên Trộm Bên Cạnh – Ân Sủng Đến Tận Phút Cuối"],["p","Luke 23,39-43 kể câu chuyện về hai người bị đóng đinh cùng với Đức Giê-su. Một người nhạo báng. Người kia – không biết tên, không có lịch sử đức tin, đang trong những giây phút cuối của cuộc đời – nói: \"Giê-su ơi, khi ông vào Nước của ông, xin nhớ đến tôi.\""],["p","Câu trả lời của Đức Giê-su không có điều kiện: \"Tôi bảo thật anh, hôm nay, anh sẽ ở với tôi trên Thiên Đàng.\" Không phải \"nếu anh có thể chứng minh mình thành tâm\". Không phải \"sau khi anh hoàn thành một số bước\". Mà là: hôm nay."],["q","Thiên Chúa của chúng ta là Đấng cứu độ; Đức Chúa là Chúa Thượng thoát khỏi cái chết, tuỳ tay Người.","Psalms 68,21"],["h3","III. \"Đã Hoàn Tất\" – Ba Chữ Kết Thúc Một Hành Trình"],["p","John 19,30 ghi lại những lời cuối của Đức Giê-su trên Thập Giá: \"Mọi sự đã hoàn tất\". Từ Hy-lạp là \"tetelestai\" – một từ dùng trong thương mại thế kỷ 1 để đóng dấu vào hóa đơn đã được thanh toán đầy đủ. Không còn nợ. Hoàn tất."],["p","Đây không phải là tiếng thở dài của một người đang chết kiệt sức. Đây là tuyên bố: sứ mạng đã hoàn thành. Điều Ngài đến để làm – đã làm."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện về người trộm lành – điều đó nói với bạn điều gì về bản tính của ân sủng?","\"Tetelestai – Đã hoàn tất\" – cảm giác bạn có khi đọc điều đó là gì?","Trong cuộc sống của bạn hiện nay, có điều gì bạn đang cố gắng \"hoàn thành\" để cảm thấy được chấp nhận không?"]]]},{"k":"ch","l":"Phần 3 · Chương 4","t":"Thập Giá Và Cuộc Sống Hàng Ngày","pb":null,"b":[["q","Nếu ai muốn theo Thầy, phải từ bỏ chính mình, vác thập giá mình mà theo Thầy.","Matthew 16,24"],["h3","I. Câu Chuyện Của Phúc"],["story","Câu chuyện: Phúc – 40 tuổi",["Phúc bốn mươi tuổi. Anh đã theo đạo hai mươi năm và mang trong mình một sự căng thẳng mà anh không biết cách nói thành lời: anh biết câu chuyện về Thập Giá, anh tin vào Thập Giá về mặt thần học – nhưng điều đó thực sự có nghĩa gì với cuộc sống hàng ngày của anh?"]],["h3","II. \"Vác Thập Giá Mình\" – Không Phải Phép Ẩn Dụ Cho Nặng Nề"],["p","Khi Đức Giê-su nói \"vác thập giá mình mà theo Thầy\", người nghe biết thập giá là gì – không phải hình ảnh thi ca, mà là công cụ xử tử của đế quốc La-mã. Người vác thập giá đang đi về phía cái chết – và trong thế kỷ 1, điều đó có nghĩa là từ bỏ quyền kiểm soát, từ bỏ khả năng tự bảo vệ, bước vào sự phụ thuộc hoàn toàn."],["p","Điều Đức Giê-su đang mời là: đặt xuống nhu cầu được đặt mình làm trung tâm – nhu cầu kiểm soát, nhu cầu được chứng minh, nhu cầu được an toàn bằng cái giá của người khác."],["box","Thập Giá trong cuộc sống thực tế:",["Không phải mọi khó khăn đều là \"thập giá\" – bệnh tật, tai nạn, thất bại trong kinh doanh không phải là thập giá theo nghĩa Đức Giê-su dùng.","\"Thập giá\" theo nghĩa Kinh Thánh là khó khăn xuất phát từ việc theo Đức Giê-su – khi sự trung thực, lòng thương xót, hay sự công chính khiến bạn mất điều gì đó.","Đây không phải là sự tự trừng phạt – mà là sự tham gia vào một con đường mà Đức Giê-su đã đi trước."]],["sum","TỔNG KẾT PHẦN 3 – Thập Giá",["<b>Chương 1: <\/b>Thập Giá không phải là điều xảy ra với Đức Giê-su – đó là lựa chọn có ý thức của Ngài","<b>Chương 2: <\/b>Bốn hình ảnh về ý nghĩa Thập Giá – mỗi hình ảnh chiếu sáng một chiều kích khác nhau","<b>Chương 3: <\/b>Ân sủng đến tận phút cuối – \"hôm nay, anh sẽ ở với tôi trên Thiên Đàng\"","<b>Chương 4: <\/b>Thập Giá không chỉ là sự kiện quá khứ – nó là con đường sống hiện tại"]]]},{"k":"ch","l":"Phần 4 · Chương 1","t":"Ngôi Mộ Trống: Sự Kiện Và Ý Nghĩa","pb":["PHẦN 4","PHỤC SINH","Và Điều Đó Thay Đổi Gì?"],"b":[["q","Sao các bà lại tìm Người Sống ở giữa kẻ chết? Người không còn đây nữa, nhưng đã trỗi dậy rồi.","Luke 24,5-6"],["h3","I. Câu Chuyện Của Tuyết"],["story","Câu chuyện: Tuyết – 35 tuổi",["Tuyết ba mươi lăm tuổi, là giáo viên dạy văn. Cô không có vấn đề với đạo đức hay giáo lý Ki-tô giáo – những điều đó cô thấy sâu sắc. Nhưng câu hỏi cô không thể vượt qua là: \"Tôi có thể tin rằng ai đó đã thật sự sống lại từ cõi chết không?\""]],["h3","II. Phục Sinh Là Gì Và Không Phải Là Gì"],["p","Hy vọng Ki-tô giáo không phải là linh hồn bay lên thiên đàng khi thân xác chết. Điều đó là quan điểm Hy-lạp, không phải quan điểm Kinh Thánh. Phục Sinh theo Kinh Thánh là sự phục hồi thực sự của toàn bộ con người – thân xác được biến đổi, nhưng vẫn là thân xác."],["p","Phục Sinh cũng không phải là \"hồi sinh\" – như Lazarus, người đã sống lại nhưng sẽ chết lại. Phục Sinh của Đức Giê-su là một loại sự sống hoàn toàn mới – đã đi qua cái chết và bước ra bên kia, không thể bị cái chết chạm đến nữa."],["h3","III. Bằng Chứng Lịch Sử Mà Sử Học Công Nhận"],["p","Nhà sử học và học giả Tân Ước N.T. Wright, sau nhiều năm nghiên cứu, kết luận rằng có hai sự kiện mà hầu hết các học giả lịch sử – kể cả những người không theo Ki-tô giáo – đồng ý: (1) ngôi mộ trống – không ai trong thế kỷ 1 phủ nhận điều này, và (2) các môn đệ thật sự tin rằng họ đã gặp Đức Giê-su Phục Sinh, và điều đó biến đổi hoàn toàn con người họ."],["box","Những điều khó giải thích nếu Phục Sinh không xảy ra:",["Tại sao không ai – kể cả đối thủ của Đức Giê-su – đem xác Ngài ra để bác bỏ?","Tại sao những người chứng kiến Phục Sinh, theo ghi nhận, sẵn sàng chết vì điều đó – không phải vì niềm tin mù quáng, mà vì họ nói họ đã thấy?","Tại sao cộng đoàn Ki-tô giáo đầu tiên – người Do Thái tin vào sự phục sinh cuối cùng – lại chọn ngày thứ nhất trong tuần thay vì Sabbath làm ngày thờ phượng?","Tại sao Phêrô – người đã chối Đức Giê-su ba lần – trở thành người rao giảng can đảm?"]],["h3","IV. Đức Giê-su Phục Sinh – Không Phải Hồn Ma"],["p","Các câu chuyện Phục Sinh trong bốn Phúc Âm nhấn mạnh sự thật thể xác của Phục Sinh: Đức Giê-su ăn cá nướng (Luke 24,42-43). Ngài mời Thomas sờ vào dấu đinh và vết thương (John 20,27). Điều này không phải là sự bịa đặt của người muốn khẳng định học thuyết – trong thế giới cổ đại, nếu muốn bịa đặt về linh hồn, người ta không bịa đặt ăn cá nướng."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi của Tuyết – \"có thể tin rằng ai đó thật sự sống lại không?\" – bạn đang đứng ở đâu với câu hỏi đó?","Trong những \"điều khó giải thích nếu Phục Sinh không xảy ra\", điều nào làm bạn dừng lại?","[Nhóm nhỏ] Niềm tin vào Phục Sinh ảnh hưởng thế nào đến cách bạn đối mặt với cái chết?"]]]},{"k":"ch","l":"Phần 4 · Chương 2","t":"Những Cuộc Gặp Gỡ Phục Sinh","pb":null,"b":[["q","\"Maria!\" Cô quay lại và nói bằng tiếng Do Thái: \"Rabbuni!\" – nghĩa là \"Lạy Thầy!\"","John 20,16"],["h3","I. Maria Mácđala – Được Gọi Đích Danh"],["p","John 20 kể về Maria Mácđala đứng khóc bên ngôi mộ trống. Người làm vườn đứng sau cô hỏi: \"Chị tìm ai?\" Rồi: \"Maria!\" Một chữ. Tên của cô. Và cô nhận ra ngay."],["p","Đây là hình ảnh mà chúng ta đã thấy trước đó trong Tập này – ở Phần 1 của Tập 3: Đức Giê-su là \"mục tử nhân lành\" biết tên từng con chiên. Phục Sinh không thay đổi điều đó. Đức Giê-su Phục Sinh vẫn biết tên Maria. Vẫn gọi đích danh."],["h3","II. Emmaus – Khi Không Nhận Ra"],["p","Luke 24,13-35 kể câu chuyện hai môn đệ trên đường Emmaus – bước đi thất vọng, nói về những hy vọng đã tan vỡ: \"Phần chúng tôi, chúng tôi đã hy vọng rằng chính Người là Đấng sẽ cứu chuộc Israel.\" Người lạ đi cùng họ. Giải thích Kinh Thánh cho họ. Họ không nhận ra cho đến khi Ngài bẻ bánh."],["p","Điều thú vị không phải là sự nhận ra – mà là điều xảy ra trước đó: \"Dọc đường, khi Người nói chuyện và giải thích Kinh Thánh cho chúng ta, lòng chúng ta không bừng cháy lên sao?\" (Luke 24,32). Đức Giê-su hiện diện với họ ngay cả khi họ không nhận ra. Và trái tim cảm nhận trước khi mắt thấy."],["h3","III. Thomas – Đức Tin Không Phải Là Vắng Mặt Của Nghi Ngờ"],["p","John 20,24-29 kể câu chuyện Thomas – người thường bị gán nhãn \"Thomas hoài nghi\". Nhưng cần đọc lại: Thomas không phải là người từ chối – anh là người đang chịu đựng một nỗi đau cụ thể. Các môn đệ khác đã gặp Đức Giê-su Phục Sinh, còn anh thì không. Sự đòi hỏi bằng chứng của anh không phải là sự cứng đầu – đó là lời kêu của một người không muốn bị lừa dối thêm lần nữa."],["p","Và Đức Giê-su đến với Thomas. Không quở trách. Đưa tay Ngài ra. \"Đừng cứng lòng nữa, nhưng hãy tin.\" Và Thomas đáp lại với lời tuyên xưng đầy đủ nhất trong Phúc Âm John: \"Lạy Chúa của con, lạy Thiên Chúa của con!\""],["refl","CÂU HỎI SUY NGẪM",["Ba cuộc gặp gỡ – Maria (được gọi tên), Emmaus (không nhận ra), Thomas (nghi ngờ) – bạn đồng cảm nhất với ai?","Hình ảnh \"lòng bừng cháy\" khi nghe Kinh Thánh được giải thích – bạn đã có trải nghiệm như vậy chưa?","Đức Giê-su đến với Thomas thay vì đợi Thomas đủ đức tin – điều đó thay đổi gì trong cách bạn nhìn sự nghi ngờ của mình?"]]]},{"k":"ch","l":"Phần 4 · Chương 3","t":"Phục Sinh Và Cuộc Sống Hôm Nay","pb":null,"b":[["q","Nếu Đức Ki-tô đã không trỗi dậy, thì lời rao giảng của chúng tôi trống rỗng, và cả đức tin của anh em cũng trống rỗng.","1 Corinthians 15,14"],["h3","I. Câu Chuyện Của Tuấn Anh"],["story","Câu chuyện: Tuấn Anh – 44 tuổi",["Tuấn Anh bốn mươi bốn tuổi. Anh đã trải qua giai đoạn mà anh gọi là \"sáu năm trong đêm tối của tâm hồn\" – không phải mất đức tin, nhưng không còn cảm thấy Thiên Chúa hiện diện. Anh vẫn đi nhà thờ, vẫn cầu nguyện – nhưng như người đi trong sương mù. Điều anh giữ lạ
