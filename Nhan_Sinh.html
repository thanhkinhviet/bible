 đây là câu hỏi thực tế cho người tin: Giê-ru-sa-lem của bạn là ở đâu? Với Nhã ở chương 1, đó là văn phòng kế toán và gia đình. Với Sơn, đó là lớp học và phòng giáo viên. Với Thu, đó là nhóm bạn bè thiết kế và mạng lưới khách hàng. “Tận cùng trái đất” không có nghĩa là bạn phải đến đó trước khi sứ mệnh thật sự bắt đầu."],["h3","IV. 1 Peter 3,15 – Sẵn Sàng Trả Lời, Không Phải Luôn Luôn Chủ Động"],["p","1 Peter 3,15 đưa ra một khuôn khổ thực tế hơn cho nhiều người: “Hãy tôn Đức Ki-tô là Chúa trong lòng anh em. Hãy luôn sẵn sàng trả lời cho bất cứ ai hỏi anh em về lý do của niềm hy vọ ng trong anh em.” Câu này giả định rằng người hỏi sẽ đến – không phải bạn phải tìm cách khởi xướng mọi cuộc trò chuyện. Điều làm cho câu hỏi đó xuất hiện là cách bạn sống: khi cuộc sống của bạn đủ khác biệt để tạo ra câu hỏi, bạn sẽ có cơ hội làm chứng."],["h3","V. Câu Trả Lời Cho Thu"],["p","Điều Thu làm khi kể lại câu chuyện của mình cho bạn – không có kế hoạch, không có bài thuyết trình – là chính xác điều Acts 1,8 và 1 Peter 3,15 mô tả. Cô là chứng nhân, không phải luật sư. Và điều xảy ra sau đó – người bạn muốn biết thêm – không phải là kết quả của khả năng thuyết phục của cô. Đó là điều Đức Thánh Linh làm với lời chứng thật."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Thu – “tôi không thuyết phục ai cả, tôi chỉ làm chứng” – bạn có thể kể lại câu chuyện đức tin của chính mình không, theo cách như Thu đã làm với bạn cô? Bạn sẽ nói điều gì?","Sự khác biệt giữa thuyết phục và làm chứng – điều nào bạn cảm thấy thoải mái hơn? Tại sao?","“Giê-ru-sa-lem” của bạn là ở đâu – vòng tròn tiếp xúc gần nhất mà sứ mệnh đang bắt đầu?","[Nhóm nhỏ] 1 Peter 3,15 nói “hãy sẵn sàng trả lời khi người ta hỏi” – trong vòng tháng vừa rồi, có ai hỏi bạn về đức tin của bạn không? Nếu có, điều gì tạo ra câu hỏi đó?"]]]},{"k":"ch","l":"Phần 4 · Chương 4","t":"Cộng Đoàn Là Chứng Tá: Sứ Mệnh Không Đi Một Mình","pb":null,"b":[["q","Qua điều này, mọi người sẽ nhận biết anh em là môn đệ Thầy: là anh em có lòng yêu thương nhau.","John 13,35"],["h3","I. Câu Chuyện Của Anh Dương"],["story","Câu chuyện: Dương – 52 tuổi",["Dương năm mươi hai tuổi, là kỹ sư xây dựng, đã phục vụ trong cộng đoàn nhiều năm. Anh là người tin có đức tin vững chắc, nhưng có một điều anh quan sát mà không hoàn toàn hiểu được: trong những năm qua, một số người đến với cộng đoàn của anh không phải vì họ nghe một bài giảng thuyết phục, hay đọc một cuốn sách thần học. Họ đến vì họ quan sát thấy điều gì đó trong cộng đoàn đó – cách người ta đối xử với nhau khi đang có xung đột, cách người ta ở bên nhau khi ai đó đang trong khủng hoảng, cách người ta nói về những người không có mặt.","Anh nói: “Tôi nghĩ bằng chứng thuyết phục nhất của đức tin không phải là bài giảng hay tranh luận. Nó là điều người ta nhìn thấy khi họ quan sát một cộng đoàn sống với nhau qua thời gian.”"]],["h3","II. John 13,35 – Tình Yêu Là Bằng Chứng"],["p","Đức Giê-su không nói “mọi người sẽ nhận biết anh em là môn đệ Thầy” bởi những lập luận bạn đưa ra, hay những chương trình bạn tổ chức, hay những công việc tốt bạn làm riêng lẻ. Ngài nói dấu hiệu nhận biết là “anh em có lòng yêu thương nhau” – tình yêu trong cộng đoàn, được người ngoài quan sát."],["p","Điều đó đặt cộng đoàn ở trung tâm của sứ mệnh – không chỉ là nơi người tin tập hợp để được cung cấp, mà là thực thể sống có khả năng làm chứng bằng chính cách nó tồn tại. Một cộng đoàn trong đó người ta thật sự biết nhau, yêu nhau qua xung đột, chịu đựng lẫn nhau, và ở bên nhau trong khổ đau – là bằng chứng sống của điều Tin Mừng tạo ra, theo cách mà không một bài giảng đơn lẻ nào có thể thay thế."],["box","",["<b>Acts 2,42-47 – Cộng Đoàn Đầu Tiên Như Chứng Tá:<\/b> Cộng đoàn đầu tiên sau Lễ Ngũ Tuần sống với nhau: bẻ bánh cùng nhau, bán tài sản để chia sẻ với người cần, thờ phượng cùng nhau. Kết quả (Acts 2,47): “Họ được toàn dân thương mến. Và Chúa cho cộng đoàn mỗi ngày có thêm những người được cứu độ.” Không phải cộng đoàn đi ra và tuyển dụng thêm người – Chúa thêm vào, khi cộng đoàn sống đúng với nhau.","<b>Sự Tha Thứ Trong Cộng Đoàn – Bằng Chứng Cao Nhất:<\/b> Khi người ngoài quan sát một cộng đoàn trong đó người ta thật sự tha thứ cho nhau sau xung đột nghiêm trọng, trong đó người ta tiếp tục yêu thương người đã gây tổn thương cho mình – đó là điều không thể giải thích bằng động lực xã hội thông thường. Và chính sự không thể giải thích đó là cơ hội cho câu hỏi xuất hiện: điều gì đang giữ những người này lại với nhau?"]],["h3","III. Câu Trả Lời Cho Anh Dương"],["p","Quan sát của Dương – rằng những người đến với cộng đoàn thường đến vì điều họ quan sát, không phải điều họ nghe – phản ánh chính xác điều John 13,35 và Acts 2 mô tả. Cộng đoàn không phải là cơ sở hỗ trợ cho sứ mệnh cá nhân – nó là một hình thức chứng tá riêng. Điều anh và cộng đoàn của anh đang xây dựng với nhau – qua những xung đột, những giai đoạn khó khăn, và những khoảnh khắc chia sẻ – không phải là bối cảnh của sứ mệnh. Nó là sứ mệnh."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Dương – người đến với cộng đoàn vì điều họ quan sát – bạn có nhớ lần nào điều bạn quan sát trong một cộng đoàn hay gia đình tạo ra câu hỏi trong bạn không?","John 13,35 – tình yêu trong cộng đoàn là dấu hiệu nhận biết – điều đó có nghĩa gì với cách bạn đối xử với người trong cộng đoàn của mình vào ngày thứ Hai, không phải chỉ ngày Chủ Nhật?","Acts 2,42-47 – Chúa thêm vào khi cộng đoàn sống đúng cách với nhau – điều gì trong mô tả đó cộng đoàn của bạn đang có? Điều gì đang thiếu?","[Nhóm nhỏ] Có một xung đột hay khó khăn trong cộng đoàn của bạn mà nếu được xử lý theo cách Matthew 18 mô tả – thẳng thắn, tôn trọng, hướng đến hòa giải – sẽ trở thành bằng chứng cho người ngoài không?"]]]},{"k":"ch","l":"Phần 4 · Chương 5","t":"“Thầy Ở Cùng Anh Em Mọi Ngày”: Đích Đến Là Sự Hiện Diện","pb":null,"b":[["q","Và đây, Thầy ở cùng anh em mọi ngày cho đến tận thế.","Matthew 28,20b"],["h3","I. Câu Chuyện Của Chị Mai"],["story","Câu chuyện: Mai – 60 tuổi",["Mai sáu mươi tuổi. Cô đã theo đạo bốn mươi năm, nuôi bốn con một mình sau khi chồng mất sớm, sống qua nhiều giai đoạn khó khăn của cá nhân và gia đình. Khi nhóm nhỏ học Matthew 28 và ai đó hỏi “câu nào trong đoạn này nói với chị nhiều nhất?”, cô không trả lời “hãy đi” hay “làm cho muôn dân trở thành môn đệ”.","Cô trả lời: “Câu cuối. ‘Thầy ở cùng anh em mọi ngày.’ Bốn mươi năm qua, câu đó là điều giữ tôi lại. Không phải vì tôi hiểu tất cả mọi thứ. Không phải vì mọi chuyện đã tốt đẹp. Mà vì khi không còn gì khác, câu đó vẫn đứng vững.”"]],["h3","II. “Mọi Ngày” – Không Phải Chỉ Những Ngày Đặc Biệt"],["p","Từ Hy Lạp trong Matthew 28,20 là “pasas tas hemeras” – nghĩa đen là “tất cả những ngày” – không phải “những ngày lớn”, không phải “những ngày bạn cảm thấy Ngài hiện diện”, không phải “những ngày bạn làm tốt trong sứ mệnh”. Tất cả những ngày – kể cả những ngày bình thường nhất, những ngày anh Sơn đứng dạy toán cho học sinh không quan tâm, những ngày Nhã làm kế toán không có gì đặc biệt xảy ra, những ngày chị Mai chỉ đơn giản là tiếp tục sống."],["p","Đây là điều làm cho lời hứa cuối của Đức Giê-su không phải là động viên cho sứ mệnh – mà là nền tảng của sứ mệnh. Sứ mệnh không đến từ sức người. Nó đến từ người đang sống trong sự hiện diện của Đấng đã nói “Thầy ở cùng anh em mọi ngày” – và tin điều đó đủ để đi tiếp dù không có tất cả câu trả lời."],["h3","III. “Cho Đến Tận Thế” – Hành Trình Có Điểm Cuối"],["p","Câu kết của Matthew 28 không phải là kết thúc mở. Nó là câu có điểm cuối rõ ràng: “cho đến tận thế.” Điều đó nhắc lại điều Kiếp Nhân Sinh đã đặt ra từ những chính đề đầu tiên – chúng ta đang sống trong một câu chuyện có đích đến. Không phải một vòng lặp vô tận của nỗ lực và thất bại. Không phải một hành trình mà không ai biết nó dẫn đến đâu."],["p","Revelation 21 – được nhắc đến trong Chính đề 26 – mô tả điểm cuối đó: “Và đây Ta đổi mới tất cả mọi sự.” Sứ mệnh của người tin không phải là xây dựng Nước Thiên Chúa bằng sức người. Nó là sống và làm chứng trong khoảng thời gian giữa hiện tại và điểm cuối đó – và tin rằng Đấng đã hứa “cho đến tận thế” sẽ ở đó cho đến khi điều đó xảy ra."],["h3","IV. Hebrews 12,1-2 – Đám Mây Chứng Nhân Và Đích Đến"],["p","Hebrews 12,1-2 đặt toàn bộ hành trình đức tin vào một không gian lớn hơn: “Vì thế, khi chúng ta có một đám mây chứng nhân vĩ đại bao quanh như thế, chúng ta cũng phải trút bỏ mọi gánh nặng và tội lỗi quấn lấy mình, mà bền chí chạy cuộc đua dành cho chúng ta. Hãy nhìn vào Đức Giê-su, Đấng đứng đầu và kiện toàn đức tin chúng ta.”"],["p","“Đám mây chứng nhân” là những người đã đi trước – Abraham, Moses, Rahab, những người được Hebrews 11 nhắc đến, và cả những người mà không ai ghi tên. Họ không phải đám đông ngồi xem. Họ là những người đã đi cùng con đường và đang chờ đợi điểm cuối của câu chuyện chung. Sứ mệnh không bắt đầu với thế hệ này – nó là phần tiếp theo của một hành trình dài hơn nhiều. Và điểm cuối không phải là điều bạn tạo ra, mà là điều bạn đang đi về hướng."],["h3","V. Câu Trả Lời Cho Chị Mai – Và Tổng Kết Chính Đề 28"],["p","Điều chị Mai tìm thấy trong bốn mươi năm đó – rằng câu cuối của Matthew 28 đứng vững khi mọi thứ khác không đứng – là điều mà toàn bộ Kiếp Nhân Sinh đã chuẩn bị để nói. Đích đến của hành trình không phải là một danh sách thành tích hay một bộ câu trả lời hoàn chỉnh. Đích đến là điều Đức Giê-su hứa: sự hiện diện mọi ngày, cho đến tận thế."],["p","Từ sự hiện diện đó mà Nhã, Sơn, Thu, Dương, và Mai có thể sống sứ mệnh của mình – không phải vì họ đủ mạnh, mà vì Đấng đang ở cùng họ đủ để giữ họ lại và sai họ đi."],["sum","TỔNG KẾT CHÍNH ĐỀ 28 – Đích Đến Của Hành Trình: Được Sai Đi Và Không Đi Một Mình",["<b>Chương 1: <\/b>Matthew 28,19-20 – Đại Mệnh Lệnh được trao cho những người bình thường đang có câu hỏi, không phải cho những người đã hoàn hảo. “Hãy đi” là participle – “khi bạn đang đi” – sứ mệnh diễn ra trong cuộc sống đang sống, không phải ngoài nó. “Muôn dân” bắt đầu ở vòng tròn tiếp xúc gần nhất.","<b>Chương 2: <\/b>2 Corinthians 5,14-15 – Tình yêu Đức Ki-tô “thúc bách” từ bên trong, không phải mệnh lệnh từ bên ngoài. Sứ mệnh từ tình yêu khác với sứ mệnh từ nghĩa vụ: nó xuất phát từ điều đã nhận được, quan tâm đến người cụ thể, và có thể bền vững vì không chạy bằng sức người.","<b>Chương 3: <\/b>Acts 1,8 và 1 Peter 3,15 – Người tin được kêu gọi làm chứng nhân, không phải luật sư. Làm chứng là kể lại điều đã trải nghiệm và tin tưởng Đức Thánh Linh làm phần còn lại. Sứ mệnh lan rộng từ “Giê-ru-sa-lem” của mỗi người ra đến những vòng tròn tiếp xúc xa hơn – theo thứ tự, không bỏ qua gần để đến xa.","<b>Chương 4: <\/b>John 13,35 và Acts 2,42-47 – Cộng đoàn là chứng tá theo cách riêng của nó. Tình yêu trong cộng đoàn – đặc biệt qua xung đột và khó khăn – là bằng chứng không thể giả mạo. Acts 2 cho thấy khi cộng đoàn sống đúng với nhau, Chúa thêm vào – sứ mệnh không chỉ là nỗ lực con người.","<b>Chương 5: <\/b>Matthew 28,20b – “Thầy ở cùng anh em mọi ngày cho đến tận thế” là nền tảng của sứ mệnh, không chỉ là lời khích lệ. Sứ mệnh không đến từ sức người – nó đến từ người đang sống trong sự hiện diện của Đấng đã hứa không bao giờ rời bỏ. Hebrews 12,1-2 đặt toàn bộ hành trình trong đám mây chứng nhân đang đi trước, và hướng đến Đấng là đích đến thật sự."]],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của chị Mai – câu nào trong Matthew 28 nói với bạn nhiều nhất? Tại sao?","“Mọi ngày” – không phải chỉ những ngày đặc biệt – điều đó thay đổi gì trong cách bạn hiểu về sự hiện diện của Đức Ki-tô trong cuộc sống hằng ngày?","Hebrews 12,1-2 – “đám mây chứng nhân” và “nhìn vào Đức Giê-su” – điều đó giúp bạn nhìn hành trình sứ mệnh của mình như thế nào khác đi?","[Nhóm nhỏ] Nhìn lại toàn bộ hành trình từ Chính đề 1 đến Chính đề 28 – câu hỏi nào bạn mang vào hành trình này đã được trả lời? Câu hỏi nào bạn vẫn đang tiếp tục sống với?","[Nhóm nhỏ] Từ tất cả những điều đã học – về bản chất con người, về Đức Giê-su, về Đức Thánh Linh, về đau khổ và lịch sử và văn hóa và sứ mệnh – một câu bạn mang theo sau hành trình này là gì?"]]]},{"k":"end","l":"Kết","t":"Kết Tập 7","pb":null,"b":[["sum","TỔNG KẾT TẬP 7 – Đức Tin Giữa Thế Gian",["<b>Phần 1 – Khổ Đau Và Đức Tin: <\/b>Đau khổ không phải bằng chứng Thiên Chúa vắng mặt – Romans 8,28 không nói mọi thứ đều tốt, Job cho thấy câu hỏi cũng là đức tin, và Đức Giê-su đã đi qua câu hỏi từ thập giá","<b>Phần 2 – Đức Tin Và Lịch Sử: <\/b>Đau khổ tập thể cũng được Kinh Thánh đặt trước mặt Thiên Chúa – từ sách Ai Ca đến Joseph và Esther – và hy vọng Ki-tô giáo là phục sinh chiến thắng thập giá mà không xóa bỏ nó","<b>Phần 3 – Đức Tin Và Văn Hóa: <\/b>Không rập theo đời này nhưng cũng không chống lại mọi điều mới – phân định, sống như muối và ánh sáng giữa thế gian, và đặt sự chắc chắn nơi Đức Ki-tô không đổi thay","<b>Phần 4 – Đích Đến Của Hành Trình: <\/b>Đại Mệnh Lệnh được trao cho người bình thường, được sai đi bởi tình yêu, làm chứng cùng cộng đoàn – và nền tảng của tất cả là lời hứa “Thầy ở cùng anh em mọi ngày”"]],["orn"],["c","<b>KẾT THÚC HÀNH TRÌNH<\/b>"],["c","<i>Kiếp Nhân Sinh bắt đầu với câu hỏi: “Tôi là ai?” Nó kết thúc không phải với câu trả lời hoàn chỉnh, mà với một lời mời: sống câu trả lời đó trong sứ mệnh, với sự hiện diện của Đấng đã hứa đi cùng mọi ngày, cho đến tận thế.<\/i>"],["c","<i>Hành trình học hỏi kết thúc. Hành trình sống tiếp tục.<\/i>"],["orn"],["c","<i>Tập 7 là một phần của bộ sách<\/i>"],["c","<b>KIẾP NHÂN SINH – Dưới Góc Nhìn Kinh Thánh<\/b>"],["c","<i>7 Tập • 28 Chính Đề • Một Hành Trình Trọn Đời<\/i>"],["c","<b>Bửu Hòa<\/b>"],["c","Hạ, 2026"]]}]}];

    case 'refl':return '<div class="bx refl"><div class="bt">💬 '+esc(b[1])+'</div>'+b[2].map(function(x){return '<div class="it">▸ '+x+'</div>'}).join('')+'</div>';
    case 'story':return '<div class="bx story"><div class="bt">📖 '+esc(b[1])+'</div>'+b[2].map(function(x){return '<div class="it">'+x+'</div>'}).join('')+'</div>';
    case 'sum':return '<div class="bx sum"><div class="bt">'+esc(b[1])+'</div>'+b[2].map(function(x){return '<div class="it">'+x+'</div>'}).join('')+'</div>';
    case 'box':return '<div class="bx">'+(b[1]?'<div class="bt">'+esc(b[1])+'</div>':'')+b[2].map(function(x){return '<div class="it">'+x+'</div>'}).join('')+'</div>';
    case 'c':return '<div class="ctr">'+b[1]+'</div>';
    case 'orn':return '<div class="orn">✦ ✦ ✦</div>';
  }
  return '';
}
function home(){
  T.textContent='Kiếp Nhân Sinh';CB.style.display='none';
  var s='<h2>Kiếp Nhân Sinh</h2><div class="tag">Dưới Góc Nhìn Kinh Thánh</div><div class="sub">Bửu Hòa · 7 Tập · 28 Chính Đề · Một Hành Trình Trọn Đời</div>';
  var last=ls('knslast');
  if(last){var q=last.split('/'),vi=IDX[q[0]];if(vi!==undefined&&DATA[vi].pages[q[1]-1])s+='<a class="resume" href="#/'+last+'">Đọc tiếp: Tập '+DATA[vi].n+' · '+esc(DATA[vi].pages[q[1]-1].t)+' →</a>'}
  s+='<a class="resume" href="#/tim" style="background:var(--card)">🔍 Tìm kiếm từ khoá…</a><div class="grp">Các tập</div><div class="bk">';
  for(var n=1;n<=TOTAL;n++){
    var vi=-1;DATA.forEach(function(v,i){if(v.n===n)vi=i});
    if(vi>=0){var v=DATA[vi],cs=v.pages.filter(function(p){return p.k==='ch'}).length;
      s+='<a href="#/'+v.id+'"><span class="bn">Tập '+v.n+'.</span> '+esc(v.title)+'<small>'+esc(v.tag)+' · '+cs+' chương</small></a>'}
    else s+='<div class="soon"><span class="bn">Tập '+n+'.</span> Sắp ra mắt</div>';
  }
  s+='</div><div class="foot">Bấm tên tập để xem mục lục · bấm 🔍 để tìm từ khoá trong toàn bộ bộ sách<br>Hạ, 2026</div>';
  M.innerHTML=s;
}
function vol(vi){
  var v=DATA[vi];T.textContent='Tập '+v.n+' · '+v.title;CB.style.display='none';
  var s='<div class="sub">Kiếp Nhân Sinh · Tập '+v.n+'</div><h2>'+esc(v.title)+'</h2><div class="tag">'+esc(v.tag)+'</div><div class="sub">Bửu Hòa</div>';
  v.pages.forEach(function(g,j){
    if(g.pb)s+='<div class="grp">'+esc(g.pb[0])+' – '+esc(g.pb[1])+(g.pb[2]?'<small>'+esc(g.pb[2])+'</small>':'')+'</div>';
    else if(j===0)s+='<div class="grp">Mở đầu</div>';
    else if(g.k==='end')s+='<div class="grp">Kết</div>';
    s+='<a class="r" href="'+pgLink(vi,j)+'"><b>'+esc(g.l)+'</b>'+esc(g.t)+'</a>';
  });
  M.innerHTML=s;
}
function page(vi,pi){
  var v=DATA[vi],g=v.pages[pi],s='';
  if(g.pb)s+='<div class="pb"><div class="pn1">'+esc(g.pb[0])+'</div><div class="pn2">'+esc(g.pb[1])+'</div>'+(g.pb[2]?'<div class="pn3">'+esc(g.pb[2])+'</div>':'')+'</div>';
  s+='<h2>'+esc(g.t)+'</h2><div class="sub"><a href="#/'+v.id+'">Tập '+v.n+' · '+esc(v.title)+'</a> · '+esc(g.l)+'</div>';
  g.b.forEach(function(b,i){s+='<div class="b" data-b="'+i+'">'+blk(b)+'</div>'});
  var f=FLAT.findIndex(function(p){return p[0]===vi&&p[1]===pi}),pv=FLAT[f-1],nx=FLAT[f+1];
  function nm(p){return DATA[p[0]].pages[p[1]].t}
  s+='<div class="pn">'+(pv?'<a class="btn" href="'+pgLink(pv[0],pv[1])+'">← '+esc(nm(pv))+'</a>':'<a class="btn off">←</a>')+(nx?'<a class="btn p" href="'+pgLink(nx[0],nx[1])+'">'+esc(nm(nx))+' →</a>':'<a class="btn off">→</a>')+'</div>';
  M.innerHTML=s;T.textContent='T'+v.n+' · '+g.l;
  var h='';v.pages.forEach(function(x,j){h+='<a href="'+pgLink(vi,j)+'"'+(j===pi?' class="c"':'')+'><small>'+esc(x.l)+'</small>'+esc(x.t)+'</a>'});
  G.innerHTML=h;CB.style.display='';document.querySelector('#tt-p h3').textContent='Tập '+v.n+' – '+v.title;
  ls('knslast',v.id+'/'+(pi+1));
}
function build(){if(IX)return;IX=[];
  DATA.forEach(function(v,vi){v.pages.forEach(function(g,pi){g.b.forEach(function(b,bi){
    var t=[];switch(b[0]){
      case 'p':case 'c':t.push(plain(b[1]));break;
      case 'h3':case 'h4':t.push(b[1]);break;
      case 'ul':b[1].forEach(function(x){t.push(plain(x))});break;
      case 'q':t.push(b[1]+(b[2]?' ('+b[2]+')':''));break;
      case 'refl':case 'story':case 'sum':case 'box':t.push(b[1]);b[2].forEach(function(x){t.push(plain(x))});break;
    }
    t.forEach(function(x){if(x&&x.trim())IX.push([vi,pi,bi,x])})
  })})});
  NZ=IX.map(function(e){return nz(e[3])})}
function mark(t,n,toks){var r=[],o='',p=0;toks.forEach(function(k){var a=0,i;while((i=n.indexOf(k,a))>=0){r.push([i,i+k.length]);a=i+k.length}});r.sort(function(a,b){return a[0]-b[0]});var m=[];r.forEach(function(x){var l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push(x.slice())});m.forEach(function(x){o+=esc(t.slice(p,x[0]))+'<mark>'+esc(t.slice(x[0],x[1]))+'</mark>';p=x[1]});return o+esc(t.slice(p))}
function runSearch(){
  var box=$('tt-res'),q=SQ.trim();
  if(!q){box.innerHTML='<div class="note">Nhập từ khoá tiếng Việt (không cần gõ dấu), ví dụ: hinh anh thien chua, thap gia. Dùng nhiều từ để lọc kết quả chứa tất cả các từ đó; đặt trong dấu "…" để tìm đúng cụm từ.</div>';return}
  build();
  var ph=/^"(.+)"$/.exec(q),toks=ph?[nz(ph[1].trim())]:nz(q).split(/\s+/).filter(Boolean),res=[];
  IX.forEach(function(e,k){var n=NZ[k];for(var i=0;i<toks.length;i++)if(n.indexOf(toks[i])<0)return;res.push(k)});
  var s='<div class="note">'+res.length+' kết quả'+(res.length>SLIM?' (hiện '+SLIM+' kết quả đầu)':'')+'</div>';
  res.slice(0,SLIM).forEach(function(k){
    var e=IX[k],t=e[3],n=NZ[k],i=n.indexOf(toks[0]),st=Math.max(0,i-70),en=Math.min(t.length,st+220);
    var sn=(st>0?'…':'')+mark(t.slice(st,en),n.slice(st,en),toks)+(en<t.length?'…':'');
    s+='<a class="r" href="'+pgLink(e[0],e[1],e[2])+'"><b>'+esc(lab([e[0],e[1]]))+' · '+esc(DATA[e[0]].pages[e[1]].t)+'</b>'+sn+'</a>'});
  if(res.length>SLIM)s+='<button class="more" id="tt-more">Hiện thêm</button>';
  box.innerHTML=s;var mb=$('tt-more');if(mb)mb.onclick=function(){SLIM+=100;runSearch()};
}
function search(q){
  T.textContent='Tìm kiếm';CB.style.display='none';if(q!==undefined)SQ=q;
  M.innerHTML='<h2>Tìm kiếm</h2><div class="sub">Tìm từ khoá trong toàn bộ các tập đã có</div><div class="sbox"><input type="search" id="tt-q" placeholder="Nhập từ khoá…" autocomplete="off"></div><div id="tt-res"></div>';
  var qi=$('tt-q');qi.value=SQ;
  qi.oninput=function(){SQ=qi.value;clearTimeout(stm);stm=setTimeout(function(){SLIM=100;try{history.replaceState(null,'','#/tim/'+encodeURIComponent(SQ))}catch(e){}runSearch()},250)};
  runSearch();if(!SQ)qi.focus();
}
function route(){
  var p=location.hash.replace(/^#\/?/,'').split('/'),vi=IDX[p[0]];S.classList.remove('o');
  if(p[0]==='tim'){var q='';try{q=decodeURIComponent(p[1]||'')}catch(e){}search(q);window.scrollTo(0,0);return}
  if(!p[0]||vi===undefined)home();
  else if(!p[1])vol(vi);
  else{var pi=parseInt(p[1],10)-1;
    if(isNaN(pi)||pi<0||pi>=DATA[vi].pages.length)vol(vi);
    else{page(vi,pi);if(p[2]!==undefined){var el=M.querySelector('[data-b="'+p[2]+'"]');if(el){el.classList.add('fl');el.scrollIntoView({block:'center'});return}}}}
  window.scrollTo(0,0);
}
CB.onclick=function(){S.classList.add('o')};
S.onclick=function(e){if(e.target===S||e.target.closest('a'))S.classList.remove('o')};
function z(x){pt=Math.max(10,Math.min(24,x));A.style.fontSize=pt+'pt'}
$('tt-sm').onclick=function(){z(pt-1)};
$('tt-lg').onclick=function(){z(pt+1)};
window.addEventListener('hashchange',route);
route();
})();
</script>
