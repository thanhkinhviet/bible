NGẪM",["Câu hỏi của Hiền – \"bao giờ tôi mới thoát khỏi điều này?\" – bạn đã từng hỏi điều tương tự không? Trong lĩnh vực nào?","Romans 7 – cuộc chiến nội tâm là bình thường, không phải thất bại – điều đó thay đổi gì trong cảm giác của bạn về những lần bạn thất bại?","Ba cạm bẫy – giả vờ, từ bỏ, hay tự sức – bạn thường sa vào điều nào nhất?","[Nhóm nhỏ] 1 John 1,9 – sự thú nhận như hành động tương quan – điều đó có thay đổi cách bạn xử lý thất bại không? Tại sao hoặc tại sao không?"]]]},{"k":"ch","l":"Phần 2 · Chương 5","t":"Vâng Phục Trong Cộng Đồng Và Đời Sống Hàng Ngày","pb":null,"b":[["q","Anh em đừng có rập theo đời này, nhưng hãy cải biến con người anh em bằng cách đổi mới tâm thần, hầu có thể nhận ra đâu là ý Thiên Chúa: cái gì là tốt, cái gì đẹp lòng Chúa, cái gì hoàn hảo.","Romans 12,2"],["h3","I. Câu Chuyện Của Quân"],["story","Câu chuyện: Quân – 38 tuổi",["Quân ba mươi tám tuổi, kỹ sư phần mềm. Anh đã tin vào Đức Giê-su bảy năm và câu hỏi anh mang đến nhóm nhỏ là thực tế: tôi biết điều Kinh Thánh nói nhưng tôi không biết vâng phục Thiên Chúa có nghĩa là gì trong đời sống hàng ngày. Không chỉ là không trộm cắp hay ngoại tình – mà là trong những quyết định kinh doanh mờ nhạt về đạo đức, trong cách xử sự với đồng nghiệp khó chịu, trong việc dùng thời gian và tiền bạc – điều gì là vâng phục trong đó? Đây không phải câu hỏi lý thuyết."]],["h3","II. Romans 12,2 – Sự Biến Đổi Của Tư Duy"],["p","Romans 12,2 đưa ra một câu trả lời không phải là danh sách hành vi – mà là quá trình: đổi mới tâm thần. Phao-lô không nói \"hãy làm những điều này và tránh những điều kia.\" Ông nói: để tâm thần được đổi mới, để bạn có khả năng nhận ra (phân biệt) đâu là ý Thiên Chúa trong mỗi tình huống cụ thể."],["p","Từ Hy-lạp ở đây là \"dokimazein\" – nghĩa là kiểm tra, thử nghiệm, phân biệt. Đây là từ dùng trong ngành luyện kim để mô tả việc thử vàng. Vâng phục trong cuộc sống hàng ngày không phải là áp dụng công thức – mà là đức tính phân biệt được phát triển qua việc tư duy được đổi mới bởi Lời Chúa và Đức Thánh Linh."],["box","Bốn chiều kích của vâng phục hàng ngày:",["<b>1. Vâng phục trong lời nói:<\/b> Ephesians 4,29 – \"đừng nói lời tục tĩu, nhưng nói điều gì tốt lành.\" Không chỉ là không nói điều xấu – mà là chủ động dùng lời để xây dựng người khác.","<b>2. Vâng phục trong quan hệ:<\/b> Romans 12,18 – \"hãy tìm cách sống thuận hòa với mọi người.\" Không phải tránh xung đột bằng cách im lặng – mà là chủ động tìm sự hòa giải và lành mạnh trong quan hệ.","<b>3. Vâng phục trong tiền bạc và thời gian:<\/b> Luke 16,10 – \"ai trung tín trong việc rất nhỏ thì cũng trung tín trong việc lớn.\" Cách dùng tài nguyên phản ánh điều thật sự quan trọng với bạn.","<b>4. Vâng phục trong đau khổ:<\/b> James 1,2-4 – thử thách được đón nhận không phải với sự vui mừng giả tạo, mà với sự tin tưởng rằng Thiên Chúa đang làm điều gì đó qua đó."]],["h3","III. Cộng Đoàn Như Nơi Học Vâng Phục"],["p","Hebrews 10,24-25 nói về sự tụ họp cộng đoàn không phải như nghĩa vụ tôn giáo, mà như sự cần thiết cho đời sống Ki-tô hữu: \"Hãy chú ý đến nhau để khuyến khích nhau yêu thương và làm điều thiện, đừng bỏ qua việc nhóm họp nhau lại.\" Vâng phục không chỉ là chuyện riêng tư giữa bạn và Thiên Chúa."],["p","Cộng đoàn là nơi sự vâng phục được thực hành trong điều kiện khó nhất: người thật, với tính cách thật, với xung đột thật, với nhu cầu thật. Việc tha thứ người làm tổn thương mình trong cộng đoàn không thể học từ sách – nó phải được luyện tập trong tình huống cụ thể. Việc phục vụ người không hấp dẫn, không có ích lợi rõ ràng, không được ghi nhận – đó là môi trường để sự vâng phục trở thành đức tính thật sự chứ không chỉ là ý định."],["h3","IV. Câu Trả Lời Cho Quân – Và Tổng Kết Chính Đề 22"],["p","Câu hỏi thực tế của Quân không có câu trả lời là một danh sách quy tắc. Câu trả lời là một quá trình: đến đủ gần Thiên Chúa qua cầu nguyện và Lời Ngài để tư duy của bạn dần dần được đổi mới – đủ để bạn có khả năng nhận ra điều tốt trong từng tình huống cụ thể, thay vì cần ai đó nói cho bạn biết. Đó là sự trưởng thành mà Hebrews 5,14 mô tả: \"thức ăn đặc là dành cho người trưởng thành, những người đã luyện tập để phân biệt thiện ác.\""],["sum","TỔNG KẾT CHÍNH ĐỀ 22 – Sự Vâng Phục: Yêu Thương Hay Tuân Thủ?",["<b>Chương 1: <\/b>Vâng phục là hoa quả của tình yêu, không phải điều kiện để được yêu. Thứ tự trong John 14,15 – yêu trước, vâng phục sau – thay đổi hoàn toàn nền tảng của đời sống đạo.","<b>Chương 2: <\/b>Ách của Đức Giê-su êm ái không có nghĩa là không có thách thức – có nghĩa là được mang cùng với Ngài. Sự kiệt sức mạn tính thường là dấu hiệu của vâng phục dựa trên sợ hãi, không phải tình yêu.","<b>Chương 3: <\/b>Sự vâng phục và tự do không đối lập nhau. Tự do thật sự không phải là không có giới hạn – mà là được giải phóng khỏi quyền lực của điều phá hủy bạn, để sống trong điều tốt lành.","<b>Chương 4: <\/b>Cuộc chiến nội tâm là thực tế bình thường của đời sống người tin – không phải thất bại. Kinh Thánh cung cấp con đường quay về qua sự thú nhận, không phải danh sách nỗ lực cố gắng thêm.","<b>Chương 5: <\/b>Vâng phục trong đời sống hàng ngày đòi hỏi tư duy được đổi mới – khả năng phân biệt điều tốt trong từng tình huống cụ thể. Cộng đoàn là môi trường không thể thiếu để điều đó trở thành đức tính thật sự."]],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi của Quân về vâng phục trong đời sống hàng ngày – lĩnh vực nào trong cuộc sống của bạn đang cần sự \"phân biệt\" đó nhiều nhất?","Bốn chiều kích của vâng phục hàng ngày – điều nào bạn cảm thấy đang thiếu sự chú ý nhất trong đời sống của mình?","Cộng đoàn như nơi học vâng phục – điều đó có phản ánh trải nghiệm của bạn trong cộng đoàn hiện tại không?","[Nhóm nhỏ] Nhìn lại toàn bộ Chính đề 22: điều gì thay đổi nhiều nhất trong cách bạn hiểu sự vâng phục?","[Nhóm nhỏ] Câu hỏi mở ra cho Chính đề 23: nếu vâng phục là cách tình yêu với Thiên Chúa được biểu hiện trong hành động – sự phục vụ người khác có phải là cách tình yêu đó được biểu hiện ra ngoài không?"]]]},{"k":"front","l":"Phần 3 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 3","SỰ PHỤC VỤ","Yêu Người Bằng Đôi Tay – Không Phải Chỉ Bằng Lời"],"b":[["p","Chính đề 22 kết thúc với một câu hỏi được đặt ra: nếu vâng phục là cách tình yêu với Thiên Chúa được biểu hiện trong hành động – sự phục vụ người khác có phải là cách tình yêu đó được biểu hiện ra ngoài không?"],["p","Câu trả lời Kinh Thánh đưa ra là có – nhưng không phải theo cách mà nhiều người quen nghĩ. Phục vụ trong Kinh Thánh không phải là nghĩa vụ từ thiện. Không phải là tiêu chí để được xét vào thiên đàng. Không phải là cách để cảm thấy tốt về bản thân. Nó là cái gì đó căn bản hơn và kỳ lạ hơn: nó là cách Đức Giê-su sống – và cách Ngài mô tả lý do Ngài đến."],["p","Mark 10,45 – \"Con Người đến không phải để được người ta phục vụ, nhưng là để phục vụ, và hiến mạng sống làm giá chuộc muôn người\" – không phải là câu nói đạo đức. Đây là tuyên bố về bản sắc: Đấng có mọi quyền được phục vụ đã chọn làm ngược lại. Và Ngài mời những người theo Ngài vào cùng một cách sống đó."],["p","Chính đề 23 không hỏi \"bạn đã làm đủ việc từ thiện chưa?\" Nó hỏi một câu khác hơn: sự phục vụ xuất phát từ đâu trong bạn – và điều đó thay đổi gì trong cách bạn phục vụ?"]]},{"k":"ch","l":"Phần 3 · Chương 1","t":"Phục Vụ Và Quyền Lực: Đức Giê-su Đảo Ngược Thứ Bậc","pb":null,"b":[["q","Vì Con Người đến không phải để được người ta phục vụ, nhưng là để phục vụ, và hiến mạng sống làm giá chuộc muôn người.","Mark 10,45"],["h3","I. Câu Chuyện Của Tuấn"],["story","Câu chuyện: Tuấn – 47 tuổi",["Tuấn bốn mươi bảy tuổi, giám đốc điều hành một công ty vừa. Anh đã tin vào Đức Giê-su mười hai năm và là người lãnh đạo trong cộng đoàn. Nhưng câu hỏi anh mang theo âm thầm là: \"Tôi không biết mình đang phục vụ người khác hay đang quản lý họ. Ranh giới mờ quá.\" Trong một buổi tĩnh tâm, khi đọc đến cảnh Đức Giê-su rửa chân cho các môn đệ, Tuấn dừng lại khá lâu. Không phải vì không hiểu – mà vì ông hiểu rất rõ điều đó đòi hỏi gì, và điều đó khó hơn ông nghĩ."]],["h3","II. Mark 10,35-45 – Cuộc Tranh Luận Về Địa Vị"],["p","Ngữ cảnh của Mark 10,45 thường bị bỏ qua. Câu này không xuất hiện trong chân không – nó là kết luận của một cuộc tranh luận: Gia-cô-bê và Gio-an đã xin Đức Giê-su cho họ ngồi bên phải và bên trái Ngài trong vinh quang. Khi các môn đệ còn lại nghe điều đó, họ tức giận – không phải vì ý tưởng đó sai, mà vì hai người kia đã xin trước."],["p","Đức Giê-su không phạt họ vì điều đó. Ngài nói thẳng: \"Anh em biết rằng những ai được coi là thủ lãnh các dân thì áp đặt quyền hành trên họ... Giữa anh em thì không như vậy: ai muốn làm lớn giữa anh em thì phải làm người phục vụ anh em.\" (Mark 10,42-43). Và rồi Ngài đưa ra lý do bằng tấm gương của chính mình: Ngài, Đấng có mọi quyền được phục vụ, đã đến để phục vụ."],["box","",["<b>Mô hình quyền lực của thế giới:<\/b> Người có địa vị cao được phục vụ. Lãnh đạo là người có quyền ra lệnh. Uy quyền được chứng minh bằng sự phục tùng của người khác.","<b>Mô hình quyền lực của Đức Giê-su:<\/b> Người lãnh đạo phục vụ. Địa vị thật sự được đo bằng sự sẵn sàng hạ mình. Uy quyền được thể hiện qua sự hy sinh, không phải áp đặt.","<b>Tại sao điều này căn bản:<\/b> Đức Giê-su không chỉ dạy đạo đức phục vụ như là luật tốt. Ngài mô tả một trật tự hoàn toàn khác – nơi mà phục vụ không làm giảm địa vị, mà là cách địa vị thật sự được biểu hiện."]],["h3","III. John 13 – Rửa Chân Như Hành Động Thần Học"],["p","Cảnh rửa chân trong John 13 thường được đọc như một câu chuyện về sự khiêm nhường. Nhưng John 13,3 tiết lộ một điều khác thường: \"Đức Giê-su biết rằng Chúa Cha đã đặt tất cả mọi sự trong tay Ngài, và Ngài bởi Thiên Chúa mà đến và sẽ trở về cùng Thiên Chúa\" – và rồi Ngài đứng dậy rửa chân. Sự phục vụ đó không xuất phát từ sự không biết mình là ai. Nó xuất phát từ sự biết chắc chắn hoàn toàn mình là ai."],["p","Đây là điểm then chốt: Đức Giê-su không phục vụ vì Ngài không có lựa chọn, hoặc vì Ngài cần được chấp nhận, hoặc vì Ngài cảm thấy tội lỗi nếu không. Ngài phục vụ từ vị trí an toàn và đầy đủ. Và đó là lý do sự phục vụ của Ngài không mang theo sự mệt mỏi hay oán giận."],["h3","IV. Câu Trả Lời Cho Tuấn"],["p","Sự phân biệt Tuấn đang tìm kiếm không phải là \"phục vụ hay quản lý\" – mà là nền tảng bên dưới. Ai biết chắc mình là ai có thể phục vụ mà không cần được ghi nhận, không cần người khác biết ơn, không cần điều đó xác nhận giá trị của mình. Ai không chắc mình là ai sẽ phục vụ nhưng đang đợi điều gì đó đổi lại – dù là sự tôn trọng, lòng biết ơn, hay chỉ là cảm giác đã làm đủ."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi Tuấn đặt ra – \"tôi đang phục vụ hay đang quản lý?\" – câu trả lời trung thực của bạn trong các mối quan hệ chính của mình là gì?","John 13,3 – Đức Giê-su biết mình là ai trước khi phục vụ – điều đó thay đổi gì trong cách bạn hiểu sự phục vụ đích thực?","Mô hình quyền lực của Đức Giê-su – phục vụ là địa vị cao, không phải thấp – điều đó kỳ lạ hay hấp dẫn với bạn? Tại sao?","[Nhóm nhỏ] Trong công việc hoặc gia đình của bạn, sự phục vụ và quản lý/kiểm soát trông như thế nào khi chúng lẫn lộn nhau? Điều gì giúp phân biệt?"]]]},{"k":"ch","l":"Phần 3 · Chương 2","t":"Ai Là Người Hàng Xóm? Phục Vụ Người Ngoài Vòng Tròn","pb":null,"b":[["q","Ai đã tỏ ra là người thân cận với người đã bị rơi vào tay kẻ cướp?","Luke 10,36"],["h3","I. Câu Chuyện Của Lan"],["story","Câu chuyện: Lan – 34 tuổi",["Lan ba mươi bốn tuổi, làm việc trong lĩnh vực giáo dục. Cô phục vụ tích cực trong cộng đoàn – dạy Kinh Thánh, giúp đỡ thành viên khi có nhu cầu, tham gia các hoạt động từ thiện định kỳ. Nhưng trong một buổi nhóm, khi được hỏi \"người cuối cùng bạn giúp đỡ ngoài vòng tròn quen biết của mình là ai?\", Lan dừng lại. Cô nhận ra câu trả lời: tất cả những người cô phục vụ đều là những người cô đã biết, trong những tình huống cô đã quen, theo những cách cô đã thoải mái. \"Tôi có phục vụ thật sự không,\" cô hỏi, \"hay tôi chỉ đang chăm sóc vòng tròn của mình?\""]],["h3","II. Luke 10,25-37 – Dụ Ngôn Người Sa-ma-ri Nhân Lành"],["p","Câu hỏi dẫn đến dụ ngôn này không phải là câu hỏi vô hại: một luật sĩ hỏi \"ai là người thân cận của tôi?\" – câu hỏi thực chất là: \"ai thuộc vòng trách nhiệm của tôi và ai không?\" Đức Giê-su trả lời không phải bằng định nghĩa – mà bằng câu chuyện."],["p","Điều đáng chú ý trong câu chuyện là ai đã bỏ qua: thầy tư tế và người Lê-vi – hai người có lý do tôn giáo hợp lệ để không dừng lại (chạm vào xác chết làm ô uế theo Luật). Và ai đã dừng: người Sa-ma-ri – nhóm mà người Do Thái coi là dị giáo và ô uế. Đức Giê-su không chỉ nói hãy phục vụ người ngoài vòng tròn; Ngài làm cho người phục vụ trong câu chuyện là người bị coi thường nhất."],["box","",["<b>Câu hỏi người luật sĩ hỏi:<\/b> \"Ai là người thân cận của tôi?\" – câu hỏi tìm cách thu hẹp trách nhiệm.","<b>Câu hỏi Đức Giê-su đặt lại:<\/b> \"Ai trong ba người đó đã là người thân cận?\" – câu hỏi thay đổi từ định nghĩa sang hành động.","<b>Điều thay đổi:<\/b> \"Người thân cận\" không phải là danh mục người mà bạn có nghĩa vụ phục vụ – mà là vị trí bạn chọn đứng đối với người cần giúp đỡ, bất kể ai họ là.","<b>Hệ quả thực tế:<\/b> Phục vụ theo Kinh Thánh không tìm cách thu hẹp vòng trách nhiệm – nó tìm cách mở rộng sự hiện diện đến với ai đang cần, dù họ là ai."]],["h3","III. Giới Hạn Của Phục Vụ Có Điều Kiện"],["p","Phục vụ có điều kiện là phục vụ với danh sách tiêu chí ngầm: người xứng đáng, người biết ơn, người cùng nhóm, người mà sự giúp đỡ của tôi sẽ được ghi nhận. Điều đó không xấu hoàn toàn – đó là cách tự nhiên con người phân bổ năng lượng. Nhưng Kinh Thánh gọi đó là điểm khởi đầu, không phải điểm đến."],["p","Matthew 5,46-47 – \"Nếu anh em yêu những kẻ yêu mình, thì anh em được thưởng gì? Ngay cả những người thu thuế cũng chẳng làm như vậy sao?\" – không nhằm làm người đọc xấu hổ. Đức Giê-su đang chỉ ra rằng phục vụ trong vòng tròn quen là điều bình thường của con người – nhưng điều Ngài dạy vượt qua điều bình thường đó."],["h3","IV. Câu Trả Lời Cho Lan – Và Giới Hạn Thực Tế"],["p","Câu nhận ra của Lan không có nghĩa là cô phải từ bỏ mọi ranh giới và giúp đỡ tất cả mọi người mọi lúc – điều đó không thực tế và không lành mạnh. Nhưng nó mở ra một câu hỏi thường xuyên cần được hỏi: trong tháng này, trong tuần này – có ai ngoài vòng tròn quen của tôi mà tôi đã thật sự nhìn thấy không? Không phải như dự án từ thiện – mà như người hàng xóm theo nghĩa của dụ ngôn: người tôi chọn đứng gần khi hoàn cảnh đặt họ vào tầm nhìn của tôi."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi Lan nhận ra – \"tôi có phục vụ thật sự không, hay chỉ đang chăm sóc vòng tròn của mình?\" – câu trả lời trung thực của bạn là gì?","Đức Giê-su đặt lại câu hỏi – từ 'ai là người thân cận của tôi?' sang 'tôi đã là người thân cận với ai?' – điều đó thay đổi gì trong cách bạn nghĩ về trách nhiệm phục vụ?","Matthew 5,46-47 – phục vụ trong vòng tròn quen là điểm khởi đầu, không phải điểm đến – điều đó thách thức thực tế của bạn như thế nào?","[Nhóm nhỏ] Ai là người ngoài vòng tròn quen của bạn mà bạn đã 'nhìn thấy' gần đây? Điều gì ngăn cản bạn đứng gần hơn?"]]]},{"k":"ch","l":"Phần 3 · Chương 3","t":"Phục Vụ Từ Sức Mạnh Hay Từ Trống Rỗng?","pb":null,"b":[["q","Anh em hãy mang gánh nặng cho nhau, như vậy là anh em chu toàn luật Đức Ki-tô.","Galatians 6,2"],["h3","I. Câu Chuyện Của Phúc"],["story","Câu chuyện: Phúc – 39 tuổi",["Phúc ba mươi chín tuổi, đã tin vào Đức Giê-su tám năm. Anh là người phục vụ tích cực – luôn có mặt khi cần, luôn tình nguyện trước tiên, luôn nhận thêm khi người khác từ chối. Nhưng trong một kỳ nghỉ hiếm hoi, khi không có gì để làm cho ai, anh nhận ra một điều gây bối rối: anh không biết mình là ai khi không đang phục vụ. \"Tôi nghĩ tôi phục vụ vì tôi yêu người khác,\" anh nói với người cố vấn, \"nhưng tôi bắt đầu tự hỏi mình phục vụ có phải vì tôi cần được cần đến không.\""]],["h3","II. Hai Nền Tảng Của Sự Phục Vụ"],["p","Có một sự khác biệt quan trọng mà Kinh Thánh không nói thẳng trong một câu duy nhất, nhưng xuất hiện xuyên suốt: phục vụ từ sức mạnh và phục vụ từ trống rỗng."],["p","Phục vụ từ sức mạnh là phục vụ từ vị trí của người đã nhận đủ – đã được yêu, đã biết mình là ai, đã có nguồn lực bên trong. Người này có thể cho đi vì có điều để cho. Có thể dừng lại vì không cần sự phục vụ để hoàn chỉnh bản sắc mình."],["p","Phục vụ từ trống rỗng là phục vụ để lấp đầy điều thiếu: cần được cần đến để cảm thấy có giá trị, cần sự biết ơn để cảm thấy được nhìn thấy, cần bận rộn để tránh đối mặt với điều gì đó bên trong. Người này có thể phục vụ rất nhiều – nhưng cuối cùng sẽ kiệt sức hoặc oán giận, vì bản thân cũng đang cần."],["box","",["<b>Dấu hiệu phục vụ từ sức mạnh:<\/b> Có thể nói không mà không cảm thấy tội lỗi. Không cần được biết ơn để tiếp tục. Có thể nghỉ và không cảm thấy bản sắc bị đe dọa. Phục vụ thường đi kèm với niềm vui thật, không phải kiệt sức mạn tính.","<b>Dấu hiệu phục vụ từ trống rỗng:<\/b> Khó nói không dù biết mình đang cạn sức. Dễ bị tổn thương khi sự giúp đỡ không được ghi nhận. Cảm thấy không có lý do tồn tại khi không có ai cần. Phục vụ gắn với sự kiệt sức và đôi khi oán giận.","<b>Điều Kinh Thánh nói:<\/b> Galatians 6,2 kêu gọi 'gánh nặng cho nhau' – nhưng Galatians 6,5 ngay sau đó nói 'mỗi người phải gánh lấy trọng tải của chính mình.' Có ranh giới giữa phục vụ lẫn nhau và từ chối chăm sóc chính mình."]],["h3","III. 2 Corinthians 9,7 – Người Cho Vui Lòng"],["p","2 Corinthians 9,7 – \"Mỗi người hãy cho tùy theo lòng mình đã quyết định, không phải miễn cưỡng hay bắt buộc, vì Thiên Chúa yêu thương người cho vui lòng\" – thường được áp dụng cho tiền bạc, nhưng nguyên tắc mở rộng sang mọi hình thức phục vụ. Từ Hy-lạp \"hilarón\" – gốc của từ \"hilarious\" (vui vẻ) trong tiếng Anh – mô tả sự cho đi tự nguyện, tràn ra, không phải bị ép ra."],["p","Điều này không có nghĩa là phục vụ lúc nào cũng phải cảm thấy tuyệt vời – nhiều khi phục vụ đòi hỏi nỗ lực và hy sinh thật sự. Nhưng có sự khác biệt giữa sự nỗ lực đến từ tình yêu và sự nỗ lực đến từ sự sợ hãi hoặc nhu cầu bên trong chưa được đáp ứng."],["h3","IV. Câu Trả Lời Cho Phúc"],["p","Câu hỏi Phúc đặt ra cho chính mình không phải là câu hỏi thất bại – đó là câu hỏi của sự trưởng thành. Nhận ra rằng mình đang phục vụ từ trống rỗng không có nghĩa là dừng phục vụ. Có nghĩa là bắt đầu hỏi: điều gì đang cần được lấp đầy trước, và ai có thể lấp đầy nó? Câu trả lời Kinh Thánh đưa ra là: không phải sự phục vụ – mà là sự nhận lãnh. Được Thiên Chúa yêu, được cộng đoàn chăm sóc, được biết mình là ai trước khi làm gì. Và từ chỗ được lấp đầy đó, sự phục vụ có thể trở thành điều tràn ra thay vì điều bị vắt ra."],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi Phúc hỏi chính mình – \"tôi phục vụ vì yêu người khác hay vì tôi cần được cần đến?\" – bạn thấy phần nào trong câu hỏi đó quen với bạn?","Hai dấu hiệu của phục vụ từ sức mạnh và từ trống rỗng – bạn đang đứng ở đâu trong phần lớn thời gian?","2 Corinthians 9,7 – người cho vui lòng, không phải miễn cưỡng – điều đó mô tả trải nghiệm phục vụ của bạn không?","[Nhóm nhỏ] Điều gì đang lấp đầy bạn trong mùa này – và điều gì đang cạn kiệt bạn? Điều đó ảnh hưởng thế nào đến cách bạn phục vụ?"]]]},{"k":"ch","l":"Phần 3 · Chương 4","t":"Phục Vụ Và Công Lý: Khi Yêu Thương Đòi Hỏi Hành Động","pb":null,"b":[["q","Hỡi người, bạn đã được nói cho biết điều nào là tốt, điều nào Đức Chúa hỏi bạn: đó chính là thực thi công bình, quý yêu nhân nghĩa và khiêm nhường bước đi với Thiên Chúa của bạn.","Micah 6,8"],["h3","I. Câu Chuyện Của Nhung"],["story","Câu chuyện: Nhung – 42 tuổi",["Nhung bốn mươi hai tuổi, làm việc trong lĩnh vực xã hội. Cô tin vào Đức Giê-su từ lâu và phục vụ tích cực. Nhưng có một câu hỏi cô chưa biết cách trả lời: giữa việc giúp đỡ cá nhân và việc thay đổi cấu trúc tạo ra người cần giúp, cô nên đứng ở đâu? \"Tôi có thể đưa cơm cho người đói,\" cô nói, \"nhưng tôi bắt đầu tự hỏi: tại sao họ đói? Và có phải người Ki-tô hữu chỉ nên lo phần cứu trợ, hay có phần nào khác?\""]],["h3","II. Micah 6,8 – Ba Chiều Kích Không Thể Tách Rời"],["p","Micah 6,8 là một trong những câu được trích dẫn nhiều nhất trong Cựu Ước về đời sống đức tin – và nó đặt ba điều cạnh nhau: thực thi điều công bình (mishpat), quý trọng điều nghĩa thiết/tình yêu thương trung tín (hesed), và khiêm nhường bước đi với Thiên Chúa."],["p","Từ \"mishpat\" trong tiếng Hê-bơ-rơ không chỉ là \"công bằng\" theo nghĩa chia đều. Nó bao gồm việc bảo vệ người dễ bị tổn thương, phục hồi điều đã bị lấy đi, sửa chữa những cấu trúc gây ra bất công. \"Hesed\" – lòng thương xót trung tín – là tình yêu gắn bó không bỏ cuộc. Hai điều đó không mâu thuẫn nhau: một mình không đủ."],["box","",["<b>Phục vụ cứu trợ (mercy):<\/b> Đáp ứng nhu cầu ngay trước mắt – cho người đói ăn, cho người không có chỗ ở nơi trú, chăm sóc người bệnh. Cần thiết và trực tiếp.","<b>Phục vụ công lý (justice):<\/b> Đặt câu hỏi về nguyên nhân – tại sao người đó đói, ai hoặc điều gì tạo ra hoàn cảnh đó, và làm thế nào để thay đổi. Cần thiết và dài hơi hơn.","<b>Mối quan hệ:<\/b> Amos 5,21-24, Isaiah 58, Matthew 25 – Kinh Thánh không cho phép tách rời lòng đạo đức cá nhân khỏi công lý xã hội. Đức tin thật được biểu hiện trong cả hai chiều.","<b>Giới hạn cần nhận biết:<\/b> Không phải ai cũng được gọi để làm mọi thứ. Nhưng mọi người Ki-tô hữu được gọi để không ngoảnh mặt đi trước bất công – dù hình thức tham gia cụ thể là gì."]],["h3","III. Matthew 25,31-46 – Nhìn Thấy Đức Giê-su Trong Người Cần Giúp"],["p","Matthew 25 là một trong những đoạn gây tranh luận nhiều nhất về thần học phục vụ. Đức Giê-su mô tả cảnh phán xét cuối cùng – và tiêu chí không phải là học thuyết đúng hay nghi lễ đầy đủ, mà là: \"Ta đói, các ngươi đã cho ăn. Ta khát, các ngươi đã cho uống. Ta là khách lạ, các ngươi đã tiếp rước.\""],["p","Điều gây sốc là cả hai nhóm đều không nhận ra mình đang làm gì với Đức Giê-su: \"Lạy Chúa, có bao giờ chúng con thấy Chúa đói...?\" Điều Đức Giê-su nói không phải là người Ki-tô hữu phải tìm Ngài trong người nghèo như một bài tập tâm linh. Ngài đang tuyên bố rằng Ngài thật sự hiện diện trong những người bị tổn thương và bị bỏ quên – và cách ta đối xử với họ phản ánh điều gì đó thật về ta."],["h3","IV. Câu Trả Lời Cho Nhung"],["p","Câu hỏi của Nhung không có câu trả lời là \"một trong hai\" – cứu trợ hay công lý. Câu trả lời là cả hai, theo những cách mà mỗi người được định vị để đóng góp. Không phải ai cũng làm chính trị hay vận động xã hội – nhưng ai cũng có thể hỏi: trong phạm vi ảnh hưởng của tôi, có cấu trúc nào gây ra bất công mà tôi đang ngoảnh mặt không? Và điều gì, dù nhỏ, tôi có thể làm khác?"],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi Nhung đặt ra – \"tôi có phần nào trong việc thay đổi cấu trúc, không chỉ cứu trợ?\" – điều đó chạm đến điều gì trong bạn?","Micah 6,8 – ba chiều kích: công lý, tình yêu thương, khiêm nhường – bạn đang mạnh ở chiều nào và thiếu ở chiều nào?","Matthew 25 – Đức Giê-su hiện diện trong người bị tổn thương – điều đó thay đổi gì trong cách bạn nhìn người cần giúp đỡ?","[Nhóm nhỏ] Trong bối cảnh cụ thể của bạn – gia đình, công việc, cộng đoàn, khu phố – có điều gì bạn đang thấy là bất công nhưng chưa biết mình có thể làm gì không?"]]]},{"k":"ch","l":"Phần 3 · Chương 5","t":"Phục Vụ Lâu Dài: Khi Lửa Không Còn Bùng Cháy","pb":null,"b":[["q","Khi làm điều thiện, chúng ta đừng nản chí, vì đến mùa chúng ta sẽ được gặt, nếu không sờn lòng.","Galatians 6,9"],["h3","I. Câu Chuyện Của Hải"],["story","Câu chuyện: Hải – 51 tuổi",["Hải năm mươi mốt tuổi, đã phục vụ trong cộng đoàn hơn hai mươi năm. Ông bắt đầu với nhiệt huyết lớn – dạy Kinh Thánh, tổ chức hoạt động, thăm viếng người bệnh, tham gia mọi sáng kiến. Nhưng sau hai mươi năm, ông ngồi trước cố vấn với một câu nói thẳng thắn: \"Tôi vẫn làm. Nhưng tôi không còn cảm thấy gì. Tôi không biết đây là sự trưởng thành hay sự kiệt sức. Và tôi không biết có được phép cảm thấy thế này không.\""]],["h3","II. Galatians 6,9 – Đừng Nản Lòng Trong Việc Làm Lành"],["p","Galatians 6,9 giả định điều quan trọng: Phao-lô viết \"đừng nản lòng\" có nghĩa là nản lòng là điều thật và có thể xảy ra. Lời khích lệ này không dành cho người mới bắt đầu – nó dành cho người đã đủ lâu để biết rằng phục vụ không phải lúc nào cũng cảm thấy tốt."],["p","\"Đến mùa chúng ta sẽ gặt hái\" – từ Hy-lạp \"kairo\" không phải là thời gian tuyến tính thông thường mà là thời điểm đúng của Thiên Chúa. Phao-lô đang nói: sự kiên trì trong phục vụ có mùa gặt – nhưng mùa đó không phải lúc nào cũng là mùa bạn đang trong đó. Điều đó đòi hỏi một loại đức tin khác: tin vào kết quả mà bạn chưa thấy, từ hạt giống bạn không chắc đã nảy mầm."],["box","",["<b>Sự khác biệt giữa trưởng thành và kiệt sức:<\/b> Trưởng thành: phục vụ không còn dựa vào cảm xúc – bạn phục vụ từ sự chọn lựa và cam kết, không phải từ hứng khởi. Kiệt sức: cảm xúc không còn vì sức lực bên trong đã cạn – tiếp tục mà không được bồi dưỡng là dấu hiệu cần chú ý.","<b>Câu hỏi cần hỏi:<\/b> Khi tôi không còn cảm thấy gì trong phục vụ: tôi có đang được nuôi dưỡng từ bên trong không? Tôi có đang phục vụ một mình không, hay tôi đang trong cộng đoàn?","<b>Elijah và bài học nghỉ ngơi:<\/b> 1 Kings 19 – sau chiến thắng lớn nhất và thất vọng nặng nhất, Elijah muốn chết. Thiên Chúa không thuyết phục ông bằng thần học – Ngài cho ông ngủ, cho ông ăn, và cho ông ngủ thêm. Sau đó mới nói chuyện. Thiên Chúa công nhận thân xác và sự kiệt sức là thật."]],["h3","III. John 15,1-8 – Gắn Kết Với Cây Nho"],["p","John 15 đưa ra hình ảnh về phục vụ bền vững không phải là \"cố gắng thêm\" mà là \"ở lại\": \"Thầy là cây nho, anh em là cành. Ai ở lại trong Thầy và Thầy ở lại trong người ấy thì người ấy sinh nhiều hoa trái.\" Hoa quả – kết quả của sự phục vụ – không đến từ cành cố sức tạo ra quả. Nó đến từ cành được nuôi dưỡng bởi thân."],["p","Điều này thay đổi câu hỏi từ \"tôi cần làm gì thêm?\" sang \"tôi đang được nối kết với nguồn nuôi dưỡng không?\". Người phục vụ lâu dài không phải là người có ý chí mạnh nhất – mà là người học cách quay về nguồn lực đủ thường xuyên để không bị cạn kiệt hoàn toàn trước khi nghỉ."],["h3","IV. Câu Trả Lời Cho Hải – Và Tổng Kết Chính Đề 23"],["p","Câu hỏi của Hải – \"đây là trưởng thành hay kiệt sức?\" – có thể là cả hai cùng lúc. Phục vụ không còn dựa vào cảm hứng là một dấu hiệu của sự trưởng thành. Không còn được nuôi dưỡng từ bên trong là một dấu hiệu cần chú ý. Hải không cần được nói \"cố gắng thêm\". Anh cần được hỏi: trong hai mươi năm phục vụ đó, anh đã được chăm sóc bởi ai? Anh đã cho phép mình được nhận lãnh như thế nào? Và nếu câu trả lời là ít – thì đây là thời điểm không phải để dừng phục vụ, mà để học cách đồng thời nhận lãnh và cho đi, thay vì chỉ cho đến khi cạn."],["sum","TỔNG KẾT CHÍNH ĐỀ 23 – Sự Phục Vụ: Yêu Người Bằng Đôi Tay – Không Phải Chỉ Bằng Lời",["<b>Chương 1: <\/b>Đức Giê-su đảo ngược mô hình quyền lực: người lớn nhất là người phục vụ. Và điều đó không xuất phát từ sự không biết mình là ai – mà từ sự chắc chắn hoàn toàn về bản sắc. John 13 cho thấy Ngài biết rõ Ngài là ai trước khi cúi xuống rửa chân.","<b>Chương 2: <\/b>Người thân cận không phải là danh mục cố định – mà là vị trí ta chọn đứng. Dụ ngôn người Sa-ma-ri nhân lành mở rộng sự phục vụ ra ngoài vòng tròn quen, không thu hẹp nó vào những người xứng đáng hay quen biết.","<b>Chương 3: <\/b>Phục vụ từ sức mạnh và phục vụ từ trống rỗng có thể giống nhau bề ngoài nhưng có nền tảng hoàn toàn khác. Được lấp đầy trước khi cho đi – qua tương quan với Thiên Chúa và cộng đoàn – là điều kiện cho sự phục vụ bền vững.","<b>Chương 4: <\/b>Phục vụ theo Kinh Thánh có hai chiều không thể tách rời: cứu trợ (đáp ứng nhu cầu trực tiếp) và công lý (đặt câu hỏi về nguyên nhân và cấu trúc). Micah 6,8 và Matthew 25 đặt cả hai cạnh nhau như đòi hỏi của đức tin.","<b>Chương 5: <\/b>Phục vụ lâu dài không đòi hỏi lửa liên tục bùng cháy – nhưng đòi hỏi sự kết nối thường xuyên với nguồn nuôi dưỡng. John 15 mô tả điều đó bằng hình ảnh cành nho ở lại trong cây: hoa quả đến từ sự nối kết, không phải từ sự cố sức."]],["refl","CÂU HỎI SUY NGẪM",["Câu hỏi của Hải – \"đây là trưởng thành hay kiệt sức?\" – bạn đang ở đâu trong phổ đó trong giai đoạn này?","Galatians 6,9 – phục vụ có mùa gặt nhưng không phải luôn là mùa bạn đang trong đó – điều đó có an ủi bạn không? Hay khó chấp nhận?","John 15 – ở lại trong Đức Giê-su như điều kiện sinh hoa quả – điều đó cụ thể nghĩa là gì với bạn trong mùa này?","[Nhóm nhỏ] Nhìn lại toàn bộ Chính đề 23: điều gì thay đổi nhiều nhất trong cách bạn hiểu sự phục vụ?","[Nhóm nhỏ] Câu hỏi mở ra cho Chính đề 24: nếu phục vụ là cách tình yêu được biểu hiện ra ngoài – thì sự tha thứ là cách tình yêu được giữ lại bên trong khi bị tổn thương. Điều đó nghĩa là gì?"]]]},{"k":"front","l":"Phần 4 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 4","SỰ THA THỨ","Khi Tình Yêu Gặp Vết Thương"],"b":[["p","Chính đề 23 đã khép lại với hình ảnh phục vụ như tình yêu được biểu hiện ra ngoài – qua đôi tay, qua sự hiện diện, qua hành động cụ thể cho người khác. Nhưng có một tình huống mà tình yêu không được biểu hiện ra ngoài một cách dễ dàng – đó là khi người ta nhận lại không phải là sự đáp lại, mà là vết thương."],["p","Khi ai đó làm tổn thương ta – bằng lời nói, bằng sự phản bội, bằng sự bỏ rơi, hay bằng điều tồi tệ hơn – tình yêu không biến mất ngay lập tức để nhường chỗ cho hận thù. Nhưng nó cũng không thể tiếp tục như không có gì xảy ra. Có một khoảng giữa – nơi tình yêu bị giữ lại, bị thử thách, và phải tìm cách tồn tại cùng với vết thương."],["p","Đó là nơi Chính đề 24 bắt đầu: sự tha thứ là gì – và không phải là gì? Tại sao Kinh Thánh đặt nó ở vị trí trung tâm đến vậy trong đời sống đức tin? Và làm thế nào để tha thứ thật, khi nỗi đau vẫn còn thật?"],["q","Anh em hãy thiết tha ăn ở nhân hậu và thương xót nhau, hãy tha thứ cho nhau, như Thiên Chúa đã tha thứ cho anh em trong Đức Ki-tô.","Ephesians 4,32"]]},{"k":"ch","l":"Phần 4 · Chương 1","t":"Tha Thứ Không Phải Là Giả Vờ Không Đau","pb":null,"b":[["q","Thưa Thầy, nếu anh em con cứ xúc phạm đến con, thì con phải tha thứ đến mấy lần? Có phải đến bảy lần không? Đức Giê-su đáp: Thầy không bảo là đến bảy lần, nhưng là đến bảy mươi lần bảy.","Matthew 18,21-22"],["h3","I. Câu Chuyện Của Mai"],["story","Câu chuyện: Mai – 36 tuổi",["Mai ba mươi sáu tuổi, có một người bạn thân quen mười năm. Khi Mai trải qua một giai đoạn khó khăn trong hôn nhân và chia sẻ điều đó với người bạn này trong sự tin tưởng, người bạn đã kể lại câu chuyện đó cho người khác – và nó lan ra trong nhóm bạn chung. Khi Mai biết được, cô không chỉ đau vì chuyện bị lộ, mà đau vì người cô tin tưởng nhất đã làm điều đó. Trong nhóm cầu nguyện, khi Mai chia sẻ điều này, một người nói: \"Mình phải tha thứ thôi, đúng không?\" Mai gật đầu – nhưng tối đó, cô viết trong nhật ký: \"Tôi đã nói câu 'tôi tha thứ' ba lần hôm nay. Nhưng mỗi lần nhắc lại chuyện đó, tôi vẫn run lên. Tôi có đang tha thứ giả không?\""]],["h3","II. Bảy Mươi Lần Bảy – Không Phải Là Con Số"],["p","Khi Phê-rô hỏi Đức Giê-su về giới hạn của sự tha thứ – \"đến bảy lần có đủ không?\" – ông đã đưa ra một con số đã được xem là rộng lượng theo chuẩn của thời đó (các thầy dạy luật thời ấy thường nói ba lần là đủ). Câu trả lời của Đức Giê-su – \"bảy mươi lần bảy\" – không phải là một con số để đếm đến rồi dừng. Đó là cách nói trong văn hóa Do Thái để chỉ \"không giới hạn\"."],["p","Nhưng điều quan trọng hơn con số là điều Đức Giê-su đang định nghĩa lại: tha thứ không phải là một giao dịch có hạn mức – nơi mỗi lần tha thứ là một lần \"rút\" từ một tài khoản hữu hạn, và đến một lúc tài khoản cạn, người ta được phép ngừng tha thứ. Đức Giê-su đang mô tả một loại tha thứ khác hẳn về bản chất – tha thứ như một tư thế sống, không phải một hành động đếm được."],["box","",["<b>Tha thứ như giao dịch:<\/b> Mỗi lần bị xúc phạm là một \"khoản nợ\" được xóa. Có giới hạn về số lần. Khi giới hạn hết, người bị xúc phạm \"có quyền\" giữ oán.","<b>Tha thứ như tư thế:<\/b> Là cách người tin sống trước Thiên Chúa và người khác – phản ánh cách họ đã được đối xử. Không đo bằng số lần, vì nó không phải là sổ sách."]],["h3","III. Tha Thứ Không Phải Là Phủ Nhận Vết Thương"],["p","Một trong những hiểu lầm phổ biến nhất về tha thứ – và có thể là điều đang làm Mai bối rối – là cho rằng tha thứ nghĩa là cảm thấy ổn ngay, là không còn đau, là coi như chuyện chưa từng xảy ra. Nếu hiểu như vậy, thì mỗi lần Mai run lên khi nhớ lại chuyện đó sẽ là dấu hiệu cô \"chưa tha thứ thật\" – và điều đó sẽ khiến cô cảm thấy thất bại lặp đi lặp lại."],["p","Nhưng Kinh Thánh không định nghĩa tha thứ theo cảm giác. Tha thứ, theo Kinh Thánh, là một quyết định – một sự lựa chọn không giữ lại điều người khác đã làm như một món nợ cần phải trả, không tìm cách trả đũa, và giao việc xét xử lại cho Thiên Chúa. Đó là quyết định của ý chí, được thực hiện trước Thiên Chúa – không phải là sự xóa bỏ cảm xúc, vốn vận hành theo một tiến trình khác và thường chậm hơn rất nhiều."],["box","",["<b>Giả vờ không đau:<\/b> Hành xử như chuyện không xảy ra, đè nén cảm xúc, tránh nói về nó. Bên trong vẫn còn nguyên vết thương – chỉ là không được nhìn thấy.","<b>Tha thứ thật:<\/b> Là một quyết định trước Thiên Chúa: không giữ điều đó như món nợ, không tìm cách trả đũa. Cảm xúc đau vẫn có thể còn – và được thừa nhận, không bị chối bỏ.","<b>Hệ quả thực tế:<\/b> Một người có thể đã tha thứ thật – theo nghĩa Kinh Thánh – và vẫn cảm thấy đau khi nhớ lại. Hai điều đó không loại trừ nhau."]],["h3","IV. Colossians 3,13 – Khuôn Mẫu Của Sự Tha Thứ"],["q","Hãy chịu đựng và tha thứ cho nhau, nếu trong anh em người này có điều gì phải trách móc người kia. Chúa đã tha thứ cho anh em, thì anh em cũng vậy, anh em phải tha thứ cho nhau.","Colossians 3,13"],["p","Câu này đặt khuôn mẫu của sự tha thứ con người vào tha thứ của Thiên Chúa – \"như Chúa đã tha thứ cho anh em\". Đây không phải là một tiêu chuẩn nhẹ nhàng. Tha thứ của Thiên Chúa không đến từ việc Ngài không thấy tội là nghiêm trọng – mà đến từ một cái giá thật đã được trả (qua thập giá). Tha thứ của con người, theo khuôn mẫu đó, cũng không phải là việc coi vết thương là nhỏ – mà là một sự lựa chọn được thực hiện dù vết thương là thật và lớn."],["h3","V. Câu Trả Lời Cho Mai"],["p","Điều Mai cần nghe không phải là \"bạn chưa tha thứ thật vì bạn vẫn còn đau\". Điều cô cần nghe là: tha thứ không phải là một cảm giác đến tức thì, mà là một quyết định được lặp lại – có thể mỗi ngày, mỗi lần ký ức trở lại – rằng cô sẽ không giữ điều đó như món nợ để trả đũa, và sẽ giao việc xét xử cho Thiên Chúa. Việc run lên khi nhớ lại không phải là thất bại của tha thứ. Đó là dấu hiệu rằng vết thương là thật – và tha thứ thật không cần vết thương phải biến mất để tồn tại."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Mai – \"tôi có đang tha thứ giả không?\" – bạn có từng tự hỏi điều tương tự về một sự tha thứ của mình không?","\"Bảy mươi lần bảy\" – tha thứ như tư thế sống, không phải giao dịch có hạn mức – điều đó thay đổi gì trong cách bạn nghĩ về những vết thương lặp lại?","Sự khác biệt giữa giả vờ không đau và tha thứ thật – bạn nhận ra mình đang ở đâu với một vết thương cụ thể trong đời mình?","[Nhóm nhỏ] Colossians 3,13 – \"như Chúa đã tha thứ cho anh em\" – điều đó đặt tiêu chuẩn nào cho cách bạn tha thứ người khác?"]]]},{"k":"ch","l":"Phần 4 · Chương 2","t":"Mười Nghìn Yến Vàng Và Một Trăm Đồng Bạc","pb":null,"b":[["q","Vậy thì, Nước Trời cũng giống như chuyện một vua kia muốn đòi các đầy tớ của mình thanh toán sổ sách.","Matthew 18,23"],["h3","I. Câu Chuyện Của Quang"],["story","Câu chuyện: Quang – 44 tuổi",["Quang bốn mươi bốn tuổi. Mười năm trước, anh đã trải qua một giai đoạn tan vỡ trong hôn nhân do lỗi của chính anh – một mối quan hệ ngoài hôn nhân kéo dài gần một năm. Khi mọi sự được phơi bày, vợ anh – sau một thời gian dài đau đớn – đã chọn tha thứ và ở lại. Cộng đoàn cũng đã đón nhận anh trở lại mà không xa lánh. Quang biết mình đã được tha một điều rất lớn. Nhưng gần đây, một đồng nghiệp đã nói dối về anh trong một việc nhỏ ở công ty – không gây hậu quả nghiêm trọng, chỉ là một lời nói dối khiến Quang bị hiểu lầm trong vài ngày. Quang phát hiện ra mình giữ điều đó trong lòng cả tuần, không thể bỏ qua. Một buổi tối, anh nhận ra: \"Tôi đã được tha một món nợ khổng lồ. Sao tôi không thể tha một món nợ nhỏ như thế này?\""]],["h3","II. Dụ Ngôn Trong Matthew 18,23-35"],["p","Đức Giê-su kể dụ ngôn này ngay sau câu trả lời \"bảy mươi lần bảy\" cho Phê-rô – như một lời giải thích cho con số đó. Một vua quyết toán sổ sách với các đầy tớ. Một người mắc nợ vua mười nghìn ta-lâng – một số tiền khổng lồ, vượt xa khả năng trả nợ của bất kỳ cá nhân nào trong cả đời (theo các học giả, tương đương hàng chục nghìn năm lương của một người lao động bình thường). Vua, vì lòng thương xót, đã tha hết nợ đó."],["p","Nhưng ngay sau khi ra ngoài, người đầy tớ đó gặp một người khác mắc nợ mình một trăm đơ-na-ri – một số tiền nhỏ, tương đương vài tháng lương. Người đầy tớ đã được tha món nợ khổng lồ lại tống giam người mắc nợ nhỏ vì không trả được. Khi vua biết được, ông gọi người đầy tớ đó lại và nói: \"Ta đã tha cho ngươi... thế thì ngươi không phải thương xót đồng bạn ngươi sao?\""],["box","",["<b>Mười nghìn ta-lâng:<\/b> Một con số được Đức Giê-su dùng có chủ ý để vượt khỏi mọi khả năng trả – không phải để so sánh chính xác, mà để cho thấy: món nợ của con người với Thiên Chúa là loại không thể tự trả, bất kể cố gắng thế nào.","<b>Một trăm đơ-na-ri:<\/b> Một số tiền thật, có thể gây bất tiện thật – không phải là \"chuyện nhỏ không đáng để ý\". Nhưng đặt cạnh mười nghìn ta-lâng, sự chênh lệch là không thể so sánh.","<b>Điều dụ ngôn không nói:<\/b> Dụ ngôn không nói rằng tổn thương nhỏ của Quang \"không đáng tính\". Nó nói về tỷ lệ – và về việc người đã nhận một sự tha thứ lớn lao mà quên đi điều đó khi đối diện với một sự tha thứ nhỏ hơn."]],["h3","III. Trí Nhớ Về Món Nợ Đã Được Tha"],["p","Điều khiến người đầy tớ trong dụ ngôn trở nên tàn nhẫn không phải là việc anh ta xấu bản chất từ đầu. Đó là việc anh ta đã quên. Ngay sau khi nhận được sự tha thứ lớn nhất có thể tưởng tượng, anh ta hành xử như thể nó chưa từng xảy ra – như thể anh ta vẫn đứng ở vị trí có quyền đòi nợ người khác theo đúng luật."],["p","Đây là điều Quang đang chạm tới. Vấn đề không phải là Quang \"phải\" tha thứ vì đó là luật. Vấn đề là: Quang đã từng đứng ở vị trí của người được tha món nợ khổng lồ – và khi đối diện với một món nợ nhỏ hơn từ người khác, ký ức đó có còn sống trong anh hay không. Sự tha thứ không xuất phát từ nghĩa vụ phải tha – nó xuất phát từ ký ức về điều mình đã nhận."],["h3","IV. Khi Tổn Thương Không Cùng \"Quy Mô\""],["p","Một sự thận trọng cần có ở đây: dụ ngôn này đôi khi bị dùng sai để nói với người bị tổn thương nặng (lạm dụng, phản bội nghiêm trọng, tổn hại lâu dài) rằng \"tổn thương của bạn chỉ là một trăm đơ-na-ri so với mười nghìn ta-lâng bạn đã được tha – nên đừng coi nó là lớn\". Đó không phải là điều dụ ngôn dạy."],["p","Dụ ngôn không so sánh mức độ đau của các tổn thương với nhau. Nó so sánh vị trí của người đầy tớ trước và sau khi được tha – và đặt câu hỏi: điều đã xảy ra với anh ta (được tha một món nợ không thể trả) có làm thay đổi cách anh ta đối xử với người khác không? Với những tổn thương rất nặng, câu trả lời của Kinh Thánh không phải là \"hãy coi nhẹ nó\" – mà là quá trình tha thứ có thể dài hơn, sâu hơn, và cần nhiều sự đồng hành hơn (xem Chương 3)."],["h3","V. Câu Trả Lời Cho Quang"],["p","Câu hỏi Quang đặt ra cho chính mình – \"sao tôi không thể tha một món nợ nhỏ như thế này?\" – không phải là câu hỏi để anh tự trách. Đó là câu hỏi đang mở ra đúng hướng: khi ký ức về điều mình đã được tha trở nên sống động, sự tha thứ cho người khác không còn là một mệnh lệnh từ bên ngoài – nó trở thành điều tự nhiên chảy ra từ một người đã thật sự nhận biết mình đã được cho gì."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Quang – nhớ lại một sự tha thứ lớn mình đã nhận, rồi đối diện một tổn thương nhỏ từ người khác – điều đó có quen với bạn không?","Dụ ngôn người đầy tớ mắc nợ – điều gì khiến người đầy tớ \"quên\" món nợ khổng lồ của mình đã được tha?","Phần \"Khi tổn thương không cùng quy mô\" – nếu bạn đang mang một tổn thương rất nặng, điều đó thay đổi gì trong cách bạn đọc dụ ngôn này?","[Nhóm nhỏ] Trong đời bạn, đâu là \"mười nghìn ta-lâng\" – điều lớn nhất bạn đã được tha (bởi Thiên Chúa, hoặc bởi người khác)? Ký ức đó còn sống trong bạn đến mức nào?"]]]},{"k":"ch","l":"Phần 4 · Chương 3","t":"Tha Thứ Là Một Hành Trình, Không Phải Một Khoảnh Khắc","pb":null,"b":[["q","Tôi là Giô-xếp, em các anh, người mà các anh đã bán sang Ai-cập. Nhưng bây giờ, các anh đừng buồn phiền, đừng tự trách mình về việc đã bán tôi sang đây.","Genesis 45,4-5 (lược trích)"],["h3","I. Câu Chuyện Của Hằng"],["story","Câu chuyện: Hằng – 29 tuổi",["Hằng hai mươi chín tuổi. Cha cô bỏ gia đình khi cô mười hai tuổi, để lại mẹ cô nuôi ba con. Mười bảy năm sau, trong một buổi tĩnh tâm, người hướng dẫn nói về sự tha thứ, và Hằng – muốn \"giải quyết xong\" – đã cầu nguyện một lời cầu nguyện tha thứ cho cha mình, cảm thấy nhẹ nhõm, và tin rằng vậy là xong. Hai năm sau, cha cô liên lạc lại, muốn gặp mặt. Khi điều đó xảy ra, tất cả sự giận dữ mà Hằng nghĩ đã \"xong\" lại trào lên – mạnh hơn cô tưởng. Cô hoảng sợ: \"Tôi đã tha thứ rồi. Tại sao nó vẫn còn đây? Có phải lời cầu nguyện đó không có tác dụng?\""]],["h3","II. Câu Chuyện Giô-xếp – Một Tiến Trình Kéo Dài Hàng Chục Năm"],["p","Câu chuyện về Giô-xếp (Genesis 37-50) là một trong những trình tự dài nhất trong Kinh Thánh về tha thứ – và điều đáng chú ý là nó không xảy ra trong một khoảnh khắc. Các anh của Giô-xếp đã bán ông làm nô lệ vì ganh ghét. Nhiều năm sau, khi họ gặp lại nhau ở Ai-cập trong hoàn cảnh đói kém, Giô-xếp – giờ có quyền lực lớn – đã không tha thứ ngay lập tức."],["p","Trước khi đến câu nói \"tôi là Giô-xếp, em các anh\" (Genesis 45), có nhiều chương mô tả Giô-xếp thử thách các anh, giữ một người làm con tin, khóc một mình nhiều lần (Genesis 42,24; 43,30), và trải qua một quá trình rõ ràng không hề đơn giản. Khi cuối cùng ông nói với họ, ông không nói \"không có gì xảy ra\" – ông đặt điều đã xảy ra trong một khung nhìn lớn hơn: \"Thiên Chúa đã gửi tôi đến đây trước các anh để bảo tồn sự sống\" (Genesis 45,5.7)."],["box","",["<b>Tha thứ như một khoảnh khắc:<\/b> Một quyết định, một lời cầu nguyện, và xong – cảm xúc liên quan không còn xuất hiện lại. Nếu nó xuất hiện lại, điều đó có nghĩa là tha thứ \"chưa có tác dụng\".","<b>Tha thứ như một hành trình:<\/b> Một quyết định ban đầu thật – mở ra một tiến trình, trong đó cảm xúc có thể trở lại (đặc biệt khi gặp lại người đó, hoặc khi hoàn cảnh gợi nhớ), và mỗi lần đó là một cơ hội để chọn lại quyết định ấy, không phải dấu hiệu nó thất bại.","<b>Trường hợp Giô-xếp:<\/b> Nhiều năm, nhiều cuộc gặp, nhiều lần khóc riêng – trước khi đến lời tuyên bố công khai. Tha thứ không làm cho hành trình đó trở nên không cần thiết; nó là con đường của hành trình đó."]],["h3","III. Đau Buồn Không Phải Là Đối Lập Của Tha Thứ"],["p","Một điều quan trọng cần phân biệt: đau buồn (grief), giận dữ khi nhớ lại, hoặc cảm giác mất mát – những điều này không phải là dấu hiệu của việc \"chưa tha thứ\". Chúng là phản ứng tự nhiên của con người trước một mất mát hoặc tổn thương thật. Một người có thể đã thật sự tha thứ – theo nghĩa đã đưa ra quyết định trước Thiên Chúa không giữ điều đó như món nợ – và vẫn trải qua đau buồn mỗi khi đối diện với những gì đã mất (một người cha không có mặt, những năm tháng không thể lấy lại)."],["p","Thánh Vịnh, như đã thấy trong Chính đề 21, dành rất nhiều không gian cho sự than thở – và điều đó cũng áp dụng ở đây. Tha thứ không yêu cầu Hằng phải không buồn về việc không có cha trong tuổi thơ của mình. Nó chỉ yêu cầu cô không giữ điều đó như một món nợ cần cha phải trả – và việc đó có thể đúng, ngay cả khi nỗi buồn về những gì đã mất vẫn còn."],["h3","IV. Khi Gặp Lại Khơi Dậy Lại Mọi Thứ"],["p","Việc cảm xúc trào lên mạnh khi Hằng gặp lại cha mình không có nghĩa là lời cầu nguyện tha thứ hai năm trước \"không có tác dụng\". Quyết định đó vẫn là thật và vẫn có giá trị. Điều xảy ra là: quyết định đó giờ đang được thử thách trong thực tế – và đó là một bước khác của cùng một hành trình, không phải sự khởi đầu lại từ con số không."],["p","Trong thực tế, gặp lại người đã làm mình tổn thương thường là lúc tha thứ được kiểm tra ở mức sâu hơn so với khi chỉ cầu nguyện trong riêng tư. Điều cần ở Hằng không phải là một lời cầu nguyện \"mạnh hơn\" để \"xong việc lần này cho thật\" – mà là sự nhận biết rằng cô đang ở một chặng mới của cùng một con đường, và có thể tiếp tục chọn lại quyết định đã chọn, lần này trong một hoàn cảnh khó hơn."],["h3","V. Câu Trả Lời Cho Hằng"],["p","Lời cầu nguyện của Hằng hai năm trước không sai và không vô nghĩa. Điều cô cần hiểu lại không phải là \"phải tha thứ lại từ đầu\" mà là: tha thứ không phải là một công việc làm một lần để cảm xúc không bao giờ trở lại – nó là một quyết định mở ra một con đường, và con đường đó có những chặng khó hơn chặng khác. Sự trào lên của cảm xúc khi gặp cha không phải là thất bại của lời cầu nguyện trước đó. Đó là dấu hiệu cô đang bước vào một chặng mới – và chặng đó cũng có thể được đi qua, không phải một mình."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Hằng – tha thứ một lần rồi cảm xúc trở lại mạnh hơn khi gặp lại – bạn đã từng trải nghiệm điều tương tự với một vết thương nào không?","Câu chuyện Giô-xếp – một tiến trình kéo dài nhiều năm trước khi đến lời tuyên bố tha thứ – điều đó cho phép bạn điều gì về tốc độ của hành trình tha thứ của riêng mình?","Sự khác biệt giữa đau buồn và \"chưa tha thứ\" – bạn có đang nhầm lẫn hai điều đó với một mất mát nào trong đời mình không?","[Nhóm nhỏ] Có một quyết định tha thứ nào trong đời bạn mà bạn nghĩ là \"đã xong\" nhưng thực ra vẫn đang là một hành trình? Chặng tiếp theo của hành trình đó có thể là gì?"]]]},{"k":"ch","l":"Phần 4 · Chương 4","t":"Tha Thứ Và Hòa Giải: Hai Điều Khác Nhau","pb":null,"b":[["q","Hãy làm tất cả những gì có thể làm được, để sống hòa thuận với mọi người.","Romans 12,18"],["h3","I. Câu Chuyện Của Sơn"],["story","Câu chuyện: Sơn – 47 tuổi",["Sơn bốn mươi bảy tuổi. Cha của ông – đã qua đời mười năm trước – từng là người nghiện rượu và có những hành vi gây tổn thương sâu sắc cho gia đình trong suốt thời niên thiếu của Sơn. Sau nhiều năm, qua tư vấn và đời sống đức tin, Sơn đã đến được một nơi mà ông có thể nói: \"Tôi đã tha thứ cho cha tôi. Tôi không còn mang sự cay đắng đó nữa.\" Nhưng khi một người trong cộng đoàn hỏi: \"Vậy giờ anh thấy gần gũi với hình ảnh người cha hơn chưa?\" – ông trả lời: \"Không. Và tôi cảm thấy có gì sai khi nói điều đó. Nếu tôi đã thật sự tha thứ, sao tôi vẫn không muốn gần gũi – dù chỉ là trong ký ức?\""]],["h3","II. Hai Khái Niệm Thường Bị Gộp Lại"],["p","Một trong những sự nhầm lẫn phổ biến nhất về tha thứ là gộp nó với hòa giải – coi như hai từ chỉ cùng một điều, chỉ là mức độ khác nhau. Nhưng Kinh Thánh, khi nhìn kỹ, cho thấy đây là hai điều khác nhau, dù liên quan."],["box","",["<b>Tha thứ (forgiveness):<\/b> Là một quyết định bên trong, được thực hiện trước Thiên Chúa – không giữ điều đã xảy ra như món nợ, không tìm cách trả đũa, giao việc xét xử cho Thiên Chúa. Có thể thực hiện một phía – không cần người gây tổn thương biết, đồng ý, hay thay đổi.","<b>Hòa giải (reconciliation):<\/b> Là việc khôi phục một mối quan hệ – đòi hỏi hai phía, đòi hỏi sự thừa nhận từ phía gây tổn thương, và đòi hỏi một mức độ an toàn để mối quan hệ có thể tồn tại trở lại. Không phải lúc nào cũng có thể, và không phải lúc nào cũng nên.","<b>Mối liên hệ:<\/b> Tha thứ là điều kiện cần cho hòa giải – nhưng không phải là điều kiện đủ. Một người có thể tha thứ thật mà không có hòa giải, vì hòa giải cần điều mà chỉ người tha thứ không thể tự cung cấp: sự thay đổi và an toàn từ phía bên kia."]],["h3","III. \"Nếu Có Thể Được\" – Một Cụm Từ Quan Trọng"],["p","Romans 12,18 thường được trích dẫn để nói rằng người tin phải luôn tìm cách hòa giải với mọi người, trong mọi hoàn cảnh. Nhưng câu này có một cụm từ thường bị bỏ qua: \"hãy làm tất cả những gì có thể làm được\" – ngụ ý rằng có những hoàn cảnh mà điều đó không thể làm được, hoặc không nên làm, ít nhất không phải lúc này."],["p","Phao-lô không đặt gánh nặng vô hạn lên người bị tổn thương để họ phải khôi phục mối quan hệ bất kể điều gì. Ông thừa nhận giới hạn thực tế: \"trong khả năng của anh em\" (như một số bản dịch khác diễn đạt). Điều này đặc biệt quan trọng trong những trường hợp có lạm dụng, thao túng, hoặc khi người gây tổn thương không thừa nhận hoặc không thay đổi – nơi việc \"hòa giải\" theo nghĩa khôi phục mối quan hệ gần gũi có thể không an toàn hoặc không khôn ngoan."],["h3","IV. Ranh Giới Có Thể Cùng Tồn Tại Với Tha Thứ"],["p","Một hệ quả quan trọng: một người có thể tha thứ thật – không còn mang cay đắng, không tìm cách trả đũa, đã giao việc xét xử cho Thiên Chúa – và đồng thời vẫn chọn giữ khoảng cách, không tìm kiếm sự gần gũi, hoặc thiết lập ranh giới rõ ràng trong mối quan hệ (hoặc với ký ức về mối quan hệ, như trong trường hợp người đã qua đời)."],["p","Đây không phải là \"tha thứ một nửa\". Ranh giới không phải là sự cay đắng được ngụy trang. Ranh giới là sự khôn ngoan thực tế về điều gì là lành mạnh và an toàn – và Kinh Thánh không yêu cầu người bị tổn thương phải xóa bỏ sự khôn ngoan đó để chứng minh mình đã tha thứ."],["box","",["<b>Dấu hiệu của cay đắng còn lại:<\/b> Mong điều xấu xảy đến với người đó. Kể lại câu chuyện để khiến người nghe đứng về phía mình chống lại họ. Cảm thấy thỏa mãn khi nghĩ về sự trừng phạt của họ.","<b>Dấu hiệu của ranh giới lành mạnh kèm tha thứ:<\/b> Không mong điều xấu xảy đến với họ – nhưng cũng không tìm cách gần gũi trở lại nếu điều đó không an toàn hoặc không lành mạnh. Có thể nói về điều đã xảy ra một cách bình thản, không phải để \"kéo phe\"."]],["h3","V. Câu Trả Lời Cho Sơn"],["p","Điều Sơn đang trải nghiệm không phải là một sự tha thứ chưa hoàn chỉnh. Ông đã làm điều khó nhất – buông bỏ cay đắng đối với một người đã gây tổn thương sâu sắc, qua nhiều năm, mà không cần người đó còn sống để thừa nhận điều gì. Việc ông không muốn \"gần gũi hơn\" với hình ảnh người cha không phải là dấu hiệu của tha thứ chưa xong – đó có thể đơn giản là sự thật rằng tha thứ và mong muốn gần gũi là hai điều khác nhau, và một người có thể có điều thứ nhất mà không cần điều thứ hai."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Sơn – tha thứ thật nhưng không muốn gần gũi trở lại – điều đó có khiến bạn cảm thấy \"có gì sai\" như Sơn cảm thấy không? Vì sao?","Sự khác biệt giữa tha thứ và hòa giải – bạn có một mối quan hệ nào mà điều thứ nhất đã xảy ra nhưng điều thứ hai chưa (và có thể không) xảy ra không?","Romans 12,18 – \"nếu có thể được\" – điều đó giải phóng bạn khỏi áp lực nào, nếu có?","[Nhóm nhỏ] Dấu hiệu của cay đắng còn lại so với ranh giới lành mạnh – làm sao bạn phân biệt hai điều đó trong một tình huống cụ thể của chính mình?"]]]},{"k":"ch","l":"Phần 4 · Chương 5","t":"Nhận Tha Thứ: Chiều Còn Lại Của Tình Yêu","pb":null,"b":[["q","Tội của chị rất nhiều, nhưng đã được tha, vì chị đã yêu mến nhiều. Còn ai được tha ít, thì yêu mến ít.","Luke 7,47"],["h3","I. Câu Chuyện Của Đức"],["story","Câu chuyện: Đức – 52 tuổi",["Đức năm mươi hai tuổi, đã tin vào Đức Giê-su hơn hai mươi năm. Trong cộng đoàn, ông được biết đến là người dễ tha thứ – khi người khác làm điều gì xúc phạm ông, ông thường là người đầu tiên nói \"không sao đâu, mình bỏ qua\". Nhưng trong một buổi chia sẻ riêng với một người bạn lâu năm, ông tiết lộ một điều: ba mươi năm trước, trước khi tin vào Đức Giê-su, ông đã làm một điều khiến một người khác bị tổn hại nghiêm trọng – một điều ông chưa bao giờ nói với ai trong cộng đoàn. \"Tôi tin Chúa tha thứ cho người khác,\" ông nói, \"tôi giảng về điều đó. Nhưng phần đó của tôi – tôi không nghĩ nó được tha. Tôi nghĩ tôi chỉ đang được Chúa chịu đựng, không phải được tha.\""]],["h3","II. Người Phụ Nữ Trong Nhà Người Pha-ri-sêu"],["p","Luke 7,36-50 kể về một người phụ nữ – được mô tả là \"một người tội lỗi\" trong thành – đến nhà một người Pha-ri-sêu nơi Đức Giê-su đang dự tiệc. Bà khóc, rửa chân Ngài bằng nước mắt, lau bằng tóc mình, và xức dầu thơm – một hành động bị người chủ nhà coi là không thích hợp và đáng xấu hổ."],["p","Đức Giê-su, biết suy nghĩ của người Pha-ri-sêu, kể một dụ ngôn ngắn về hai người mắc nợ – một mắc nợ nhiều, một mắc nợ ít, cả hai được tha – và hỏi ai sẽ yêu người chủ nợ nhiều hơn. Sau đó Ngài nói câu được trích ở trên: \"Tội của chị rất nhiều, nhưng đã được tha, vì chị đã yêu mến nhiều.\""],["box","",["<b>Điều dễ hiểu sai:<\/b> Có thể đọc câu này như \"chị được tha NHIỀU vì chị đã yêu NHIỀU\" – tức là tình yêu là điều kiện để được tha. Nhưng trình tự trong câu chuyện đi ngược lại: hành động yêu mến của bà xảy ra SAU, như một phản ứng đối với điều bà đã nhận.","<b>Điều câu này thật sự nói:<\/b> Bà đã được tha (có thể trước đó, trong một cuộc gặp không được ghi lại, hoặc bà đã tin trước khi đến) – và tình yêu lớn lao của bà là HOA QUẢ của việc nhận biết mình đã được tha một món nợ lớn, không phải điều kiện để được tha.","<b>Đối lập với người Pha-ri-sêu:<\/b> Người chủ nhà – tin rằng mình không có món nợ lớn cần được tha – không thể hiện một hành động yêu mến nào tương tự. Không phải vì ông ít tội hơn về bản chất, mà vì ông không nhận biết mình cần được tha."]],["h3","III. 1 John 1,9 – Sự Tha Thứ Có Thật, Không Phải Sự Chịu Đựng"],["q","Nếu chúng ta xưng nhận tội lỗi, Thiên Chúa là Đấng trung tín và công chính sẽ tha tội cho chúng ta, và sẽ thanh tẩy chúng ta sạch mọi điều bất chính.","1 John 1,9"],["p","Điều Đức đang tin – rằng phần tội lỗi sâu kín nhất của mình \"không được tha, chỉ được chịu đựng\" – không phải là một hình thức khiêm nhường. Đó là một sự từ chối lời hứa của 1 John 1,9, vốn không có điều kiện về mức độ nghiêm trọng của tội. Câu này không nói \"Thiên Chúa sẽ tha những tội nhỏ và chịu đựng những tội lớn\". Nó nói: xưng nhận – Ngài tha, và thanh tẩy hoàn toàn."],["p","\"Chịu đựng\" ngụ ý một mối quan hệ trong đó điều xấu vẫn còn đó, chỉ được dung thứ vì lý do nào khác. \"Tha thứ\" – theo nghĩa Kinh Thánh, dựa trên cái giá đã được trả qua thập giá – nghĩa là món nợ đã thật sự được xử lý, không phải bị che đi hay bỏ qua. Sự khác biệt này không phải là chi tiết thần học nhỏ; nó quyết định liệu một người có thể sống tự do hay sống dưới một gánh nặng âm thầm suốt đời."],["h3","IV. Khi Tha Thứ Người Khác Dễ Hơn Tha Thứ Cho Mình"],["p","Có một mô thức thường gặp: một người có thể tha thứ cho người khác – đôi khi những điều rất nặng – tương đối dễ dàng, nhưng lại không thể tin rằng chính mình được tha cho một điều cụ thể trong quá khứ. Điều này có thể xuất phát từ nhiều nguồn: cảm giác rằng \"việc của tôi khác\", sự xấu hổ sâu đến mức không thể đối diện trực tiếp, hoặc – như trường hợp Đức – một niềm tin ngầm rằng tha thứ của Thiên Chúa có giới hạn mà tội của mình đã vượt qua."],["p","Nhưng đây chính là điều dụ ngôn về người phụ nữ trong Luke 7 chỉ ra theo chiều ngược lại: người nhận biết mình được tha NHIỀU là người yêu mến NHIỀU. Nếu Đức tiếp tục giữ một phần của mình ngoài vòng tha thứ, không chỉ phần đó bị ảnh hưởng – mà cả khả năng yêu mến và tự do của ông cũng bị giới hạn, vì một phần của ông vẫn đang sống như người Pha-ri-sêu trong câu chuyện: không nhận biết mình cần (và đã nhận) một món nợ được tha."],["h3","V. Câu Trả Lời Cho Đức – Và Tổng Kết Chính Đề 24"],["p","Điều Đức cần không phải là được nói rằng điều ông đã làm \"không tệ đến vậy\" – điều đó sẽ không chạm đến vết thương thật. Điều ông cần là đối diện với 1 John 1,9 không như một câu Kinh Thánh ông đã giảng cho người khác, mà như một lời hứa dành cho chính ông: nếu xưng nhận – không phải để xứng đáng được tha, mà vì món nợ đã được trả bởi một Đấng khác – thì sự tha thứ đó là có thật, không phải sự chịu đựng. Và giống như người phụ nữ trong Luke 7, việc nhận biết điều đó không làm Đức trở nên ít đáng tin hơn trong cộng đoàn – nó có thể trở thành nguồn của một tình yêu sâu hơn những gì ông đã thể hiện trước đó."],["sum","TỔNG KẾT CHÍNH ĐỀ 24 – Sự Tha Thứ: Khi Tình Yêu Gặp Vết Thương",["<b>Chương 1: <\/b>Tha thứ là một quyết định trước Thiên Chúa – không giữ điều đã xảy ra như món nợ, không tìm cách trả đũa – không phải là sự xóa bỏ cảm xúc đau. \"Bảy mươi lần bảy\" mô tả tha thứ như một tư thế sống, không phải một giao dịch có hạn mức.","<b>Chương 2: <\/b>Dụ ngôn người đầy tớ mắc nợ (Matthew 18) cho thấy: sự tha thứ cho người khác chảy ra tự nhiên từ ký ức sống động về món nợ lớn lao mình đã được tha – không phải từ nghĩa vụ phải tha.","<b>Chương 3: <\/b>Tha thứ là một hành trình, không phải một khoảnh khắc duy nhất. Cảm xúc có thể trở lại – đặc biệt khi gặp lại người đó – và điều đó không phải là thất bại, mà là một chặng mới của cùng một con đường. Đau buồn không đối lập với tha thứ.","<b>Chương 4: <\/b>Tha thứ và hòa giải là hai điều khác nhau. Tha thứ có thể thực hiện một phía; hòa giải cần hai phía và sự an toàn. Ranh giới có thể cùng tồn tại với tha thứ thật – và Romans 12,18 (\"nếu có thể được\") không đặt gánh nặng vô hạn để khôi phục mọi mối quan hệ.","<b>Chương 5: <\/b>Nhận tha thứ là chiều còn lại của tình yêu. 1 John 1,9 hứa sự tha thứ thật, không phải sự chịu đựng – không có điều kiện về mức độ nghiêm trọng. Người nhận biết mình được tha nhiều, như người phụ nữ trong Luke 7, là người yêu mến nhiều."]],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Đức – một phần của quá khứ mà bạn tin \"chỉ được chịu đựng, không được tha\" – bạn có một phần như vậy không?","1 John 1,9 – \"sẽ tha tội... và thanh tẩy sạch mọi điều bất chính\" – không có điều kiện về mức độ – điều đó là tin mừng hay khó tin với bạn? Tại sao?","Luke 7 – người được tha nhiều thì yêu mến nhiều – nếu điều đó đúng, điều gì có thể thay đổi trong cách bạn yêu, nếu bạn thật sự tin mình đã được tha?","[Nhóm nhỏ] Nhìn lại toàn bộ Chính đề 24: trong năm chương – tha thứ không phải giả vờ, ký ức về món nợ đã được tha, tha thứ là hành trình, tha thứ khác hòa giải, và nhận tha thứ – chương nào chạm đến bạn nhiều nhất lúc này?","[Nhóm nhỏ] Câu hỏi mở ra cho Chính đề 25: nếu tha thứ là cách tình yêu tồn tại qua vết thương do người khác gây ra – thì khi vết thương đến không từ một người, mà từ chính cuộc đời (bệnh tật, mất mát, đau khổ không ai có lỗi) – đức tin đứng ở đâu?"]]]},{"k":"end","l":"Kết","t":"Kết Tập 6","pb":null,"b":[["sum","TỔNG KẾT TẬP 6 – Sự Cầu Nguyện Và Sự Vâng Phục",["<b>Phần 1 – Sự Cầu Nguyện: <\/b>Cầu nguyện là tương quan, không phải nghi lễ – Thiên Chúa chào đón sự thành thật, và đời sống cầu nguyện thật cần sự liên tục chứ không cần sự hoàn hảo","<b>Phần 2 – Sự Vâng Phục: <\/b>Vâng phục là hoa quả của tình yêu, không phải điều kiện để được yêu – ách của Đức Giê-su êm ái, và tự do thật là được giải phóng để sống điều tốt lành","<b>Phần 3 – Sự Phục Vụ: <\/b>Đức Giê-su đảo ngược mô hình quyền lực – phục vụ vượt khỏi vòng tròn quen thuộc, xuất phát từ sự được lấp đầy, gồm cả cứu trợ lẫn công lý, và bền bỉ nhờ ở lại trong Cây Nho","<b>Phần 4 – Sự Tha Thứ: <\/b>Tha thứ là một quyết định và cũng là một hành trình, khác với hòa giải – bắt nguồn từ ký ức về món nợ lớn đã được tha, và gồm cả việc nhận lấy sự tha thứ"]],["orn"],["c","<i>Tiếp theo: Tập 7 – Đức Tin Giữa Thế Gian<\/i>"],["c","<i>« Sống Đức Tin Đến Cùng Hành Trình »<\/i>"],["q","Người công chính kêu cầu, và CHÚA đã nhận lời, giải thoát khỏi mọi nỗi lo âu của họ.","Psalm 34,18"],["orn"],["c","<i>Tập 6 là một phần của bộ sách<\/i>"],["c","<b>KIẾP NHÂN SINH – Dưới Góc Nhìn Kinh Thánh<\/b>"],["c","<i>7 Tập • 28 Chính Đề • Một Hành Trình Trọn Đời<\/i>"],["c","<b>Bửu Hòa<\/b>"],["c","Hạ, 2026"]]}]},{"id":"tap-7","n":7,"title":"Đức Tin Giữa Thế Gian","tag":"« Sống Đức Tin Đến Cùng Hành Trình »","pages":[{"k":"front","l":"Mở đầu","t":"Tổng Quan Tập 7","pb":null,"b":[["box","Cấu trúc 4 Phần",["<b>Phần 1 – Khổ Đau Và Đức Tin: <\/b>Khi Không Ai Có Lỗi","<b>Phần 2 – Đức Tin Và Lịch Sử: <\/b>Khi Đau Khổ Thuộc Về Cả Một Dân Tộc","<b>Phần 3 – Đức Tin Và Văn Hóa: <\/b>Khi Thế Giới Đang Thay Đổi","<b>Phần 4 – Đích Đến Của Hành Trình: <\/b>Được Sai Đi Và Không Đi Một Mình"]]]},{"k":"front","l":"Phần 1 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 1","KHỔ ĐAU VÀ ĐỨC TIN","Khi Không Ai Có Lỗi"],"b":[["p","Chính đề 24 đã đặt câu hỏi cuối: nếu tha thứ là cách tình yêu tồn tại qua vết thương do người khác gây ra – thì khi vết thương đến không từ một người, mà từ chính cuộc đời (bệnh tật, mất mát, đau khổ không ai có lỗi) – đức tin đứng ở đâu?"],["p","Đó là câu hỏi của Chính đề 25. Và đây là câu hỏi khó nhất trong toàn bộ series: không phải khó về mặt thần học – mà khó vì nó không dừng lại ở lý thuyết. Ai sống đủ lâu cũng sẽ đứng trước một mất mát hoặc đau khổ mà không có đối tượng để đổ lỗi, không có người để tha thứ, không có hành động nào để \"sửa lại\" – chỉ có thực tế trước mắt và câu hỏi: Thiên Chúa đang ở đâu trong điều này?"],["p","Chính đề 25 không tìm cách trả lời câu hỏi đó bằng một công thức thần học gọn gàng. Thay vào đó, nó tìm cách ngồi với câu hỏi đó – và nhìn xem Kinh Thánh nói gì, không phải để xóa đau, mà để đức tin không bị xóa bởi đau."]]},{"k":"ch","l":"Phần 1 · Chương 1","t":"Đau Khổ Không Phải Là Bằng Chứng Thiên Chúa Vắng Mặt","pb":null,"b":[["q","Người công chính kêu cầu, và CHÚA đã nhận lời, giải thoát khỏi mọi nỗi lo âu của họ.","Psalm 34,18"],["h3","I. Câu Chuyện Của Lan"],["story","Câu chuyện: Lan – 44 tuổi",["Lan bốn mươi bốn tuổi, đã tin vào Đức Giê-su mười sáu năm. Khi con trai út của cô – bảy tuổi – được chẩn đoán ung thư máu, điều đầu tiên cô nghe từ một số người trong cộng đoàn là: \"Chị phải cầu nguyện nhiều hơn\", \"Chắc có tội lỗi nào đó cần xét lại\", hoặc \"Thiên Chúa đang thử thách để làm chị mạnh hơn.\" Không câu nào trong số đó giúp cô. Câu hỏi thật sự của Lan không phải là \"con tôi bệnh vì tội gì?\" Câu hỏi thật sự là: \"Khi tôi ngồi bên giường bệnh viện lúc ba giờ sáng và không biết nói gì – Thiên Chúa có ở đó không? Hay Ngài đang nhìn từ xa?\""]],["h3","II. Những Điều Thường Được Nói – Và Tại Sao Chúng Không Đủ"],["p","Khi đau khổ xảy đến, có một số phản ứng phổ biến thường được đưa ra với thiện ý nhưng lại gây thêm gánh nặng cho người đang đau:"],["box","",["\"Thiên Chúa đang thử thách bạn.\" – Ngụ ý đau khổ là bài kiểm tra được thiết kế để bạn vượt qua. Nếu bạn không \"vượt qua được\", kết luận ngầm là bạn đã thất bại.","\"Đây là ý Thiên Chúa.\" – Đúng theo nghĩa Thiên Chúa có chủ quyền – nhưng nguy hiểm khi được dùng để tắt câu hỏi, thay vì ngồi với câu hỏi đó.","\"Bạn phải cầu nguyện nhiều hơn / tin nhiều hơn.\" – Đặt gánh nặng lên người đang đau: nếu tình hình không thay đổi, lý do là đức tin chưa đủ.","\"Thiên Chúa không cho bạn điều gì quá sức chịu đựng.\" – Câu này thường được dùng như sự an ủi, nhưng thực ra không có câu nào trong Kinh Thánh nói điều đó. Phao-lô viết trong 2 Corinthians 1,8 rằng ông đã bị \"đè nặng quá sức chịu đựng\" – và đó không phải là thất bại đức tin."]],["p","Những phản ứng này không phải lúc nào cũng sai về mặt thần học. Vấn đề là chúng thường được dùng để \"giải thích\" đau khổ thay vì ở bên người đang đau – và điều đó không phải là điều Kinh Thánh dạy làm đầu tiên."],["h3","III. Job Và Những Người Bạn"],["p","Sách Job là một trong những văn bản đối diện trực tiếp nhất với câu hỏi về đau khổ không có lý do. Job là người công chính – Thiên Chúa chính Ngài xác nhận điều đó (Job 1,8) – và ông mất con cái, tài sản, sức khỏe. Ba người bạn đến và làm chính xác điều nhiều người trong cộng đoàn Lan đã làm: cố giải thích tại sao Job đang chịu đau khổ."],["box","",["Eliphaz (Job 4): \"Bạn đang bị phạt vì tội lỗi của mình.\"","Bildad (Job 8): \"Nếu bạn trong sáng, Thiên Chúa sẽ phục hồi bạn ngay.\"","Zophar (Job 11): \"Thiên Chúa thậm chí đang xử nhẹ với bạn so với tội của bạn đáng nhận.\""]],["p","Cuối sách Job, Thiên Chúa nói thẳng với Eliphaz: \"Ta nổi cơn thịnh nộ với ngươi và hai bạn ngươi, vì các ngươi đã không nói về Ta những điều đúng như tôi tớ Ta là Job.\" (Job 42,7). Những lời giải thích của ba người bạn – dù nghe có vẻ thần học đúng đắn – đã bị Thiên Chúa từ chối. Điều đúng không phải là giải thích đau khổ của Job. Điều đúng là Job kêu cầu trực tiếp với Thiên Chúa – dù đó là lời kêu cầu đầy đau đớn và nghi ngờ."],["h3","IV. Psalm 34,18 – Sự Gần Gũi, Không Phải Sự Vắng Mặt"],["p","Câu Psalm 34,18 không hứa rằng Thiên Chúa sẽ giải thích tại sao đau khổ xảy ra, hoặc lấy đau khổ đi ngay lập tức. Nó nói điều gì khác hẳn: \"CHÚA ở gần những tâm hồn tan vỡ, cứu thoát những ai có tâm thần thống hối\" (bản đầy đủ của câu 18-19)."],["p","Từ \"gần\" là từ quan trọng. Đau khổ thường tạo ra cảm giác Thiên Chúa đang ở xa – hoặc không có mặt. Psalm 34 không phủ nhận cảm giác đó. Nó tuyên bố một thực tế không phụ thuộc vào cảm giác: sự hiện diện của Thiên Chúa gần nhất không phải ở những khoảnh khắc tất cả đều tốt – mà ở những khoảnh khắc tan vỡ."],["h3","V. Câu Trả Lời Cho Lan"],["p","Điều Lan cần lúc ba giờ sáng bên giường bệnh viện không phải là giải thích tại sao con cô bệnh. Điều cô cần nghe là: Thiên Chúa đang ở đó – không phải từ xa, không phải đang quan sát, mà đang gần với tâm hồn tan vỡ của cô ngay lúc đó. Và câu hỏi của cô – \"Ngài có ở đó không?\" – không phải là thiếu đức tin. Đó là đức tin đang kêu cầu đúng hướng."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Lan – những điều người khác nói khi cô đau khổ – bạn đã từng nghe (hoặc từng nói) những câu tương tự chưa? Chúng cảm thấy thế nào với người đang đau?","Phản ứng của Thiên Chúa với ba người bạn của Job – Ngài phán rằng họ nói sai – điều đó thay đổi gì trong cách bạn tiếp cận việc \"giải thích\" đau khổ cho người khác?","Psalm 34,18 – \"CHÚA ở gần những tâm hồn tan vỡ\" – bạn đã từng cảm nghiệm điều đó không? Hoặc bạn đang khó tin điều đó lúc này?","[Nhóm nhỏ] Khi bạn đang đau, điều bạn thật sự cần người khác làm là gì – giải thích hay đồng hành? Hai điều đó khác nhau như thế nào?"]]]},{"k":"ch","l":"Phần 1 · Chương 2","t":"Romans 8,28 Và Điều Nó Không Có Nghĩa Là","pb":null,"b":[["q","Chúng tôi biết rằng Thiên Chúa làm cho mọi sự đều sinh lợi ích cho những ai yêu mến Người, tức là cho những kẻ được gọi theo ý định của Người.","Romans 8,28"],["h3","I. Câu Chuyện Của Hùng"],["story","Câu chuyện: Hùng – 51 tuổi",["Hùng năm mươi mốt tuổi. Vợ anh mất vì ung thư sau hai năm chiến đấu – bà mất năm bốn mươi tám tuổi, để lại anh với hai con ở tuổi thiếu niên. Trong tang lễ, một người trong cộng đoàn đến và nói: Anh ơi, Thiên Chúa làm mọi sự sinh ích. Chị ấy mất vì Thiên Chúa có kế hoạch tốt hơn cho gia đình anh. Hùng không trả lời. Nhưng sau đó anh nói với người bạn thân: Tôi biết câu đó. Tôi thuộc lòng câu đó. Nhưng đêm đó, câu đó nghe như một vũ khí chứ không phải sự an ủi. Làm sao vợ tôi chết là lợi ích cho con tôi?"]],["h3","II. Romans 8,28 Trong Ngữ Cảnh"],["p","Romans 8,28 là một trong những câu Kinh Thánh bị dùng nhiều nhất trong hoàn cảnh đau khổ – và cũng là một trong những câu bị hiểu lầm nhiều nhất. Để hiểu câu này đúng, cần đặt nó trong ngữ cảnh của cả chương 8 của thư Romans."],["p","Phao-lô đang viết về \"những đau khổ trong thời hiện tại\" (8,18) và sự rên xiết của toàn bộ tạo thành đang chờ đợi sự cứu chuộc (8,22). Ông không nói đau khổ không có thật hoặc không nghiêm trọng. Ông nói rằng trong bối cảnh đó – đau khổ thật, mất mát thật – Thiên Chúa đang làm việc hướng đến một kết quả mà chúng ta chưa thể nhìn thấy toàn bộ."],["box","",["Romans 8,28 KHÔNG có nghĩa là: \"Mọi việc xảy ra đều tốt.\" Vợ Hùng mất không phải là \"tốt\". Bệnh tật của con Lan không phải là \"tốt\". Thiên Chúa không định nghĩa điều đó là tốt.","Romans 8,28 KHÔNG có nghĩa là: \"Thiên Chúa đã gây ra điều này để có mục đích tốt.\" Câu này không nói về nguyên nhân của đau khổ – nó nói về phản ứng của Thiên Chúa với đau khổ.","Romans 8,28 CÓ nghĩa là: Thiên Chúa, trong chủ quyền của Ngài, có khả năng làm cho ngay cả những điều tệ nhất – đau khổ, mất mát, đổ vỡ – trở thành phương tiện của điều tốt lành trong khuôn khổ của kế hoạch lớn hơn của Ngài. Điều này không xóa bỏ đau – nó đặt đau vào một khung nhìn lớn hơn."]],["h3","III. Câu Tiếp Theo Mà Ít Người Nhắc"],["p","Ngay sau Romans 8,28, Phao-lô viết: \"Vì những ai Người đã biết từ trước, thì Người đã tiền định cho họ nên đồng hình đồng dạng với Con của Người.\" (8,29). Đây là chìa khóa để hiểu \"lợi ích\" Phao-lô đang nói đến: không phải sự thuận lợi bề ngoài, không phải sức khỏe được phục hồi hay tình hình được cải thiện – mà là sự biến đổi để trở nên giống Đức Giê-su hơn."],["p","Điều đó không biến đau khổ thành điều tốt theo nghĩa đen. Nhưng nó mở ra một khả năng: ngay cả trong đau khổ, có điều gì đó đang xảy ra trong người tin mà không thể xảy ra bằng cách nào khác – không phải vì đau khổ là tốt, mà vì Thiên Chúa đang làm việc ngay trong đó."],["h3","IV. 2 Corinthians 1,3-4 – Đức Chúa Trời Của Mọi Sự An Ủi"],["p","Phao-lô mở đầu thư 2 Corinthians bằng một mô tả về Thiên Chúa đáng chú ý: \"Chúc tụng Thiên Chúa là Thân Phụ Đức Giê-su Ki-tô, Chúa chúng ta! Người là Cha giàu lòng từ bi lân ái, và là Thiên Chúa hằng sẵn sàng nâng đỡ ủi an. Người đã an ủi chúng tôi trong mọi cơn gian nan khốn khó, để chúng tôi cũng có thể an ủi những ai lâm cảnh gian nan khốn khó, bằng chính niềm an ủi mà chúng tôi nhận được từ Thiên Chúa.\" (2 Cor 1,3-4)."],["p","Đây là một cấu trúc quan trọng: đau khổ → sự an ủi nhận được → khả năng an ủi người khác. Phao-lô không giả vờ đau khổ không thật. Ông nói rằng đau khổ đã được trải qua – với sự đồng hành của Thiên Chúa – trở thành nguồn của điều gì đó không thể có được theo cách nào khác: khả năng ở bên người đang đau theo cách mà chỉ người đã đau mới có thể làm được."],["h3","V. Câu Trả Lời Cho Hùng"],["p","Điều Hùng cần không phải là được nghe Romans 8,28 như một lời giải thích cho cái chết của vợ. Điều anh cần là không gian để đau – và sự đồng hành của người hiểu rằng câu đó không xóa bỏ mất mát, mà đặt mất mát vào bàn tay của Đấng đang làm việc ngay trong đó theo những cách anh chưa thể nhìn thấy. Và điều đó không cần được nói trong tang lễ – đôi khi nó chỉ cần được sống ra, dần dần, qua thời gian."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Hùng – Romans 8,28 được dùng như \"vũ khí\" thay vì sự an ủi – bạn đã từng trải qua điều tương tự với một câu Kinh Thánh nào đó không?","Sự phân biệt giữa \"mọi thứ đều tốt\" và \"Thiên Chúa làm cho mọi sự sinh lợi ích\" – điều đó thay đổi gì trong cách bạn hiểu câu này trong hoàn cảnh đau khổ thật?","\"Lợi ích\" trong Romans 8,28 là gì theo ngữ cảnh (8,29)? Điều đó có phải là điều bạn muốn không? Tại sao hay tại sao không?","[Nhóm nhỏ] 2 Corinthians 1,3-4 – đau khổ đã trải qua trở thành nguồn an ủi cho người khác – bạn có một trải nghiệm đau khổ nào mà sau đó bạn có thể ở bên người khác theo cách đặc biệt không?"]]]},{"k":"ch","l":"Phần 1 · Chương 3","t":"Job: Khi Câu Hỏi Là Đức Tin","pb":null,"b":[["q","Nhưng tôi biết rằng Đấng bênh vực tôi vẫn còn sống, và Ngài sẽ đứng dậy sau cùng trên đất bụi.","Job 19,25"],["h3","I. Câu Chuyện Của Tâm"],["story","Câu chuyện: Tâm – 38 tuổi",["Tâm ba mươi tám tuổi, tin vào Đức Giê-su mười năm. Cô bị sảy thai lần thứ ba – và lần này, sau nhiều năm điều trị vô sinh. Trong cộng đoàn, có người nói với cô phải \"tin nhiều hơn\", có người nói \"đây là thập giá Chúa gửi cho chị\". Cô không còn khả năng phản ứng với những câu đó nữa. Điều cô nói với chồng: \"Tôi không mất đức tin vào Thiên Chúa. Tôi chỉ không biết còn có thể nói với Ngài điều gì nữa không. Tôi đã nói hết rồi. Tôi đã xin hết rồi. Giờ tôi chỉ còn biết ngồi đó.\""]],["h3","II. Job Không Chịu Im Lặng"],["p","Sách Job kéo dài 42 chương – và phần lớn trong số đó là Job đang tranh luận, kêu cầu, phàn nàn, và đặt câu hỏi trực tiếp với Thiên Chúa. Điều đáng chú ý là Job không bị yêu cầu im lặng – và khi cuối cùng Thiên Chúa phán, Ngài không trả lời các câu hỏi của Job theo nghĩa thông thường. Thay vào đó, Ngài hiện diện – và sự hiện diện đó là câu trả lời."],["p","Job 38,1: \"Bấy giờ CHÚA lên tiếng trả lời ông Job từ giữa cơn lốc.\" Thiên Chúa không đến trong sự im lặng êm đềm. Ngài đến trong cơn lốc – đúng nơi đau khổ của Job đang ở. Và điều Ngài nói không phải là lời giải thích về tại sao Job phải chịu khổ – mà là một cuộc triển khai toàn bộ quy mô của sự sáng tạo, như thể đang nói: \"Ta lớn hơn những gì con đang thấy. Và Ta vẫn đang ở đây.\""],["box","",["Job trước khi Thiên Chúa phán (Job 3-37): Kêu cầu, phàn nàn, tranh luận, muốn Thiên Chúa xuất hiện để nghe anh. Điều đó là đức tin – không phải đức tin của sự kiên nhẫn hoàn hảo, mà đức tin đủ để tiếp tục hướng về Thiên Chúa dù không hiểu.","Job sau khi Thiên Chúa phán (Job 42): Không có câu hỏi nào được trả lời – nhưng Job nói: \"Trước đây, tai con đã nghe nói về Ngài; nhưng bây giờ, chính mắt con được thấy Ngài.\" (42,5). Điều thay đổi không phải là hoàn cảnh – mà là sự hiện diện đã được biết đến theo một cách mới.","Điều Thiên Chúa xác nhận (Job 42,7): Thiên Chúa nói với ba người bạn rằng Job – không phải họ – đã nói điều đúng về Ngài. Job kêu cầu, phàn nàn, đặt câu hỏi: điều đó được Thiên Chúa xác nhận là hành động đúng."]],["h3","III. Đức Tin Không Yêu Cầu Câu Trả Lời"],["p","Một trong những điều Sách Job dạy – điều không thoải mái cho người muốn mọi thứ được giải thích gọn gàng – là đức tin không đòi hỏi phải có câu trả lời trước khi có thể tiếp tục. Job 19,25-26 là một trong những tuyên bố đức tin mạnh mẽ nhất trong toàn bộ Kinh Thánh – và nó nằm ở giữa, không phải ở cuối, khi Job vẫn đang ở trong đau khổ, chưa có gì được phục hồi, chưa có câu hỏi nào được trả lời: \"Nhưng tôi biết rằng Đấng bênh vực tôi vẫn còn sống.\""],["p","Đây không phải là sự chắc chắn về kết quả. Đây là sự tin tưởng vào một Đấng vẫn còn sống và vẫn đang ở đó – ngay giữa đau khổ, không phải sau khi đau khổ qua đi."],["h3","IV. Lamentations – Khi Kinh Thánh Chứa Đựng Sự Tuyệt Vọng"],["p","Sách Lamentations (Ai Ca) là một trong những văn bản ít được nhắc đến trong đời sống Giáo hội thông thường – nhưng là một trong những văn bản quan trọng nhất để hiểu đức tin trong đau khổ. Toàn bộ sách là một bài than thở dài về sự sụp đổ của Jerusalem – tất cả mọi thứ đã bị mất, không có câu trả lời nào được đưa ra."],["p","Nhưng ở giữa sách – Lamentations 3,21-23 – có một đoạn thường được trích dẫn: \"Điều tôi ghi nhớ trong lòng, điều đó đã cho tôi hy vọng: Tình yêu thương của CHÚA không bao giờ cạn, lòng thương xót của Người không bao giờ dứt; chúng mới mẻ mỗi sáng.\" Điều đáng chú ý là đoạn này không đến sau khi đau khổ qua đi. Nó đến ở chương 3 của 5 chương – tất cả phần còn lại của sách vẫn là đau khổ. Đây là đức tin không phải ở phía bên kia của đau – mà là đức tin ở giữa đau."],["h3","V. Câu Trả Lời Cho Tâm"],["p","Điều Tâm đang trải qua – \"đã nói hết, đã xin hết, giờ chỉ biết ngồi đó\" – không phải là sự thất bại của đức tin. Đó có thể là mô tả chính xác nhất của điều Job đã trải qua. Và điều Sách Job dạy là: ngồi đó, dù không có lời, vẫn là hành động hướng về Thiên Chúa. Sự im lặng sau khi đã nói hết không phải là từ bỏ – đó là kiệt sức trong tương quan, và tương quan vẫn đang tồn tại."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Tâm – \"tôi đã nói hết, đã xin hết, giờ chỉ biết ngồi đó\" – bạn đã từng ở trong vị trí đó không? Điều đó cảm thấy thế nào?","Job kêu cầu, phàn nàn, đặt câu hỏi – và Thiên Chúa nói ông đã nói điều đúng. Điều đó cho phép bạn làm gì trong cầu nguyện khi đang đau?","Job 19,25 – \"Đấng bênh vực tôi vẫn còn sống\" – được nói giữa đau khổ, không phải sau khi qua đi. Bạn có thể nói câu đó không lúc này? Điều gì giúp hay cản trở bạn?","[Nhóm nhỏ] Lamentations 3 – đức tin ở giữa đau, không phải ở phía bên kia của đau – bạn thấy điều đó khác như thế nào so với cách bạn thường được dạy về đức tin?"]]]},{"k":"ch","l":"Phần 1 · Chương 4","t":"Đức Giê-su Và Câu Hỏi Từ Thập Giá","pb":null,"b":[["q","Vào giờ thứ chín, Đức Giê-su kêu lớn tiếng: \"Ê-li, Ê-li, lê-ma xa-bác-tha-ni\", nghĩa là \"Lạy Thiên Chúa, lạy Thiên Chúa của con, sao Ngài bỏ rơi con?\"","Matthew 27,46"],["h3","I. Câu Chuyện Của Bình"],["story","Câu chuyện: Bình – 57 tuổi",["Bình năm mươi bảy tuổi. Ông sống với bệnh tiểu đường và suy thận mãn tính nhiều năm nay. Không phải bệnh gây ra bởi lối sống sai trái – bác sĩ xác nhận đây là vấn đề di truyền. Ông tiếp tục phục vụ trong cộng đoàn, tiếp tục cầu nguyện, nhưng có một câu hỏi ông chưa bao giờ dám nói thành lời vì sợ bị phán xét: \"Tôi đôi khi cảm thấy Thiên Chúa đã để tôi lại một mình với điều này. Tôi ngại nói điều đó vì tôi không muốn ai nghĩ tôi mất đức tin.\" Vị linh mục ngồi nghe ông rồi nói: \"Ông có biết ai đã nói câu đó trước ông không?\""]],["h3","II. Câu Hỏi Của Đức Giê-su"],["p","Matthew 27,46 và Mark 15,34 đều ghi lại rằng từ trên thập giá, Đức Giê-su kêu lên bằng câu mở đầu của Psalm 22: \"Lạy Thiên Chúa, lạy Thiên Chúa của con, sao Ngài bỏ rơi con?\" Đây là câu hỏi của sự bị bỏ rơi, của sự cô đơn tuyệt đối, của cảm giác Thiên Chúa không ở đó."],["p","Điều quan trọng là câu này không bị cắt khỏi Kinh Thánh. Hai tác giả Tin Mừng đã bảo tồn nó. Đức Giê-su – không phải một người đức tin yếu, không phải một người đang mất đức tin – đã nói câu đó từ thập giá. Và điều đó có nghĩa là: cảm giác bị Thiên Chúa bỏ rơi không phải là bằng chứng của đức tin thiếu sót. Nó là một phần của những gì đức tin phải đi qua."],["box","",["Điều Đức Giê-su đang cảm nghiệm: Sự cô đơn tuyệt đối – mang gánh nặng của tất cả tội lỗi nhân loại trong sự tách biệt khỏi Cha. Đây là điều duy nhất trong lịch sử mà sự bỏ rơi đó là hoàn toàn thật theo nghĩa thần học.","Điều câu này có nghĩa với người đang đau: Cảm giác bị Thiên Chúa bỏ rơi đã được Đức Giê-su trải qua trước – và Ngài đã trải qua nó bằng cách dùng ngôn ngữ của Psalm 22 để nói với Cha. Ngay cả trong cảm giác bị bỏ rơi, Ngài vẫn đang nói chuyện với Thiên Chúa.","Phần còn lại của Psalm 22: Psalm 22 không kết thúc ở câu hỏi đó. Nó tiếp tục với sự tin tưởng (22,4-5), rồi lại với đau khổ (22,6-19), và cuối cùng với lời ca ngợi (22,22-31). Đây là cấu trúc của toàn bộ hành trình – không phải đường thẳng từ đau đến vui, mà là những đợt sóng, và Thiên Chúa hiện diện trong suốt."]],["h3","III. Hebrews 4,15 – Đấng Thượng Tế Đã Từng Ở Đó"],["q","Vị Thượng Tế của chúng ta không phải là Đấng không có khả năng cảm thông với những yếu đuối của ta, vì Người đã chịu thử thách về mọi phương diện cũng như ta, nhưng không phạm tội.","Hebrews 4,15"],["p","Hebrews 4,15 đưa ra một nền tảng quan trọng cho đức tin trong đau khổ: Đức Giê-su không phải là một Thiên Chúa đứng từ xa và gọi người ta phải chịu đau. Ngài là Đấng đã từng ở trong đau – đã từng trải qua sự mệt mỏi, đói khát, sự từ chối, mất đi người thân (John 11,35: Đức Giê-su đã khóc), nỗi sợ hãi (Gethsemane), và cuối cùng là cái chết trong đau đớn."],["p","\"Cảm thông với những yếu đuối của ta\" – từ Hy Lạp \"sumpatheo\" có nghĩa là cùng chịu đựng, cảm nhận từ bên trong. Không phải là sự đồng cảm từ khoảng cách, mà là sự đồng hành của người đã đứng đúng chỗ đó."],["h3","IV. Câu Trả Lời Cho Bình"],["p","Vị linh mục hỏi Bình: \"Ông có biết ai đã nói câu đó trước ông không?\" – và câu trả lời là Đức Giê-su từ thập giá. Điều Bình cần nghe không phải là \"ông không nên cảm thấy điều đó\". Điều ông cần là nhận ra rằng cảm giác bị bỏ rơi – đã được Đức Giê-su trải qua và đặt vào lời Kinh Thánh – không phải là bằng chứng ông đang mất đức tin. Đó là bằng chứng ông đang đứng trong cùng một nơi mà Đức Giê-su đã đứng. Và Đức Giê-su đã đứng đó không phải để ở lại mãi trong đó – mà để không ai phải đứng đó một mình."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Bình – một câu hỏi không dám nói vì sợ bị phán xét – bạn có một câu hỏi tương tự về Thiên Chúa mà bạn chưa bao giờ dám nói không?","Matthew 27,46 – Đức Giê-su kêu \"sao Ngài bỏ rơi con?\" từ thập giá – điều đó thay đổi gì trong cách bạn nhìn nhận cảm giác bị Thiên Chúa bỏ rơi của chính mình?","Hebrews 4,15 – Đức Giê-su đã từng ở trong đau – điều đó an ủi bạn hay bạn cần thêm thời gian để tin điều đó không chỉ là câu thần học?","[Nhóm nhỏ] Psalm 22 đi từ câu hỏi bị bỏ rơi đến lời ca ngợi – nhưng không đi theo đường thẳng. Hành trình đức tin của bạn trông giống điều đó như thế nào không?"]]]},{"k":"ch","l":"Phần 1 · Chương 5","t":"Sống Trong Câu Hỏi: Khi Đức Tin Không Đòi Hỏi Câu Trả Lời","pb":null,"b":[["q","Thật vậy, tôi tin tưởng sẽ được nhìn xem ân lộc của CHÚA trong cõi đất dành cho kẻ sống. Hãy đợi chờ CHÚA, hãy can đảm lên, hãy phấn chấn tâm hồn và đợi chờ CHÚA.","Psalm 27,13-14"],["h3","I. Câu Chuyện Của Hà"],["story","Câu chuyện: Hà – 46 tuổi",["Hà bốn mươi sáu tuổi. Mười hai năm trước, em trai cô mất trong một tai nạn giao thông khi hai mươi bảy tuổi
