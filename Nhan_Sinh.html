hục vụ, nhưng cốt để phục vụ, và hiến mạng sống làm giá chuộc muôn người\" (20,28)."],["p","Đây là mô hình Đức Giê-su đã sống, đặc biệt rõ ràng trong John 13 khi Ngài rửa chân cho các môn đệ – công việc của người nô lệ thấp nhất – và sau đó nói: \"Thầy đã làm gương cho anh em\" (13,15)."],["h3","III. 1 Phêrô 5 – Người Chăn Dắt Thật"],["box","",["<b>1 Phêrô 5,2-3 – Người lãnh đạo cộng đoàn được mô tả như thế nào:<\/b> \"Hãy chăn dắt đoàn chiên mà Thiên Chúa đã giao phó cho anh em,","lo lắng cho họ không phải vì bị ép buộc, nhưng là hoàn toàn tự nguyện,","như Thiên Chúa muốn; không phải vì ham lợi lộc thấp hèn, nhưng vì lòng nhiệt thành;","không phải như những kẻ thống trị những người được trao cho anh em,","nhưng hãy nêu gương sáng cho đoàn chiên.\"","<b>Ba điều phân biệt người lãnh đạo đúng:<\/b>","– Tự nguyện, không vì bị ép – lãnh đạo xuất phát từ tiếng gọi, không phải địa vị","– Nhiệt thành, không vì lợi lộc – mục đích là ích lợi của cộng đoàn, không phải bản thân","– Nêu gương, không thống trị – quyền lực là ảnh hưởng từ đời sống, không phải từ chức vụ"]],["h3","IV. Trách Nhiệm Của Người Được Lãnh Đạo"],["p","Hebrews 13,17 nói với người được lãnh đạo: \"Hãy vâng phục những người lãnh đạo anh em và hãy phục tùng họ, vì họ thức khuya lo lắng cho linh hồn anh em, như những người sẽ phải trình bày kết quả công việc trước mặt Thiên Chúa.\""],["p","Sự vâng phục được đề cập ở đây không phải là vâng phục mù quáng – mà là sự tôn trọng có ý thức đối với người đang gánh trách nhiệm và sẽ phải giải trình. Nhưng câu này cũng đặt một gánh nặng nghiêm túc lên người lãnh đạo: họ không chỉ quản lý hoạt động – họ \"lo lắng cho linh hồn\" người được giao phó. Đó là trách nhiệm không thể thực hiện mà không biết tên vợ của người mình lãnh đạo."],["h3","V. Khi Lãnh Đạo Lạm Dụng Quyền Lực"],["p","Cần nói thẳng: lãnh đạo Ki-tô giáo lạm dụng quyền lực là vấn đề thật sự và đã gây tổn hại nghiêm trọng cho nhiều người trong Hội Thánh. Những trường hợp đó không phải là ví dụ của mô hình lãnh đạo Kinh Thánh bị làm dụng – chúng là sự từ chối hoàn toàn mô hình đó."],["p","Matthew 18,6 – \"ai làm cớ cho một trong những kẻ bé mọn này vấp ngã... thà buộc cối đá lớn vào cổ nó mà xô xuống biển còn hơn\" – không có nghĩa là người lãnh đạo được miễn trách. Ngược lại, sách Ezekiel 34 dành cả một chương cho sự phán xét của Thiên Chúa đối với những \"người chăn dắt\" tệ bạc. Người trong cộng đoàn có quyền và trách nhiệm đặt câu hỏi về lãnh đạo không minh bạch hay gây hại."],["refl","CÂU HỎI SUY NGẪM — Chương 3",["Câu hỏi của người trẻ hỏi Quân – điều đó gợi lên điều gì với bạn, dù là người lãnh đạo hay người được lãnh đạo?","Ba điều phân biệt người lãnh đạo đúng theo 1 Phêrô 5 – điều nào bạn thấy khó nhất để sống theo?","[Nhóm nhỏ] Làm thế nào để giữ người lãnh đạo có trách nhiệm mà không phá hoại sự tôn trọng chính đáng dành cho họ?","[Nhóm nhỏ] Nếu bạn từng bị tổn thương bởi lãnh đạo trong Hội Thánh – điều đó ảnh hưởng đến đức tin của bạn như thế nào? Và điều gì đã giúp bạn?"]]]},{"k":"ch","l":"Phần 4 · Chương 4","t":"\"Một Với Nhau\": Cộng Đoàn Trong Thế Giới Cá Nhân","pb":null,"b":[["q","Hãy mang gánh nặng cho nhau, như vậy anh em sẽ chu toàn luật của Đức Ki-tô.","Galatians 6,2"],["h3","I. Câu Chuyện Của Linh"],["story","Câu chuyện: Linh – 30 tuổi",["Linh ba mươi tuổi. Sau giai đoạn khủng hoảng mà cô đã đề cập ở những tập trước, cô có hai lựa chọn: giải quyết một mình – như cô đã làm với mọi thứ trước đó – hoặc cho phép những người trong nhóm nhỏ thấy cô đang thật sự như thế nào.","Cô chọn điều thứ hai. Và điều xảy ra tiếp theo – không phải ai giải quyết vấn đề của cô, không phải lời khuyên hoàn hảo, mà chỉ là người ta ở đó, lắng nghe, cầu nguyện cùng, và gọi điện hỏi thăm tuần sau – trở thành điều cô mô tả là: \"Lần đầu tiên tôi cảm thấy Hội Thánh là thật.\""]],["h3","II. Hơn 50 \"Một Với Nhau\" Trong Tân Ước"],["p","Tân Ước chứa đựng hơn năm mươi cụm từ \"một với nhau\" (one another / allelous) – những mệnh lệnh cụ thể mô tả đời sống cộng đoàn Ki-tô giáo đích thực. Chúng không phải là những lý tưởng đẹp đẽ trừu tượng – chúng là những hành động cụ thể, đòi hỏi sự hiện diện thật sự của người này với người kia."],["box","Một số \"một với nhau\" quan trọng trong Tân Ước:",["\"Yêu thương nhau\" (John 13,34) – cam kết hành động, không phải cảm xúc","\"Mang gánh nặng cho nhau\" (Galatians 6,2) – đòi biết gánh nặng của người khác","\"Thú tội với nhau và cầu nguyện cho nhau\" (James 5,16) – dễ tổn thương thật sự","\"Khuyến khích nhau\" (Hebrews 10,25) – \"càng ngày càng hơn khi thấy ngày đó đến gần\"","\"Phục vụ lẫn nhau\" (Galatians 5,13) – tự do không phải để làm điều mình muốn","\"Tha thứ cho nhau\" (Ephesians 4,32) – như Thiên Chúa đã tha thứ bạn","\"Lấy tình bác ái chịu đựng nhau\" (Ephesians 4,2) – không phải thụ động mà là chủ động","\"Không phán xét nhau\" (Romans 14,13) – một \"một với nhau\" bằng cách KHÔNG làm gì"]],["h3","III. Tại Sao Thời Đại Này Khó Hơn"],["p","Văn hóa đô thị hiện đại và văn hóa kỹ thuật số đang đẩy mạnh chủ nghĩa cá nhân theo những cách chưa từng có. Bạn có thể sống trong tòa chung cư suốt một năm mà không biết tên hàng xóm. Bạn có thể có hàng nghìn \"bạn\" trên mạng xã hội và không có ai biết thật sự bạn đang trải qua gì. Bạn có thể tham dự nhà thờ hàng tuần mà không ai biết tên bạn."],["p","Điều này không có nghĩa là thế hệ trước sống cộng đoàn tốt hơn – họ có những vấn đề khác. Nhưng nó có nghĩa là xây dựng cộng đoàn thật sự trong bối cảnh hiện đại đòi hỏi nỗ lực có chủ đích, chống lại dòng chảy mặc định. Những \"một với nhau\" của Tân Ước không xảy ra tự nhiên trong bối cảnh đó – chúng phải được chọn lựa tích cực."],["h3","IV. Từ Khán Giả Đến Người Tham Dự"],["p","Một trong những thay đổi quan trọng nhất trong tư duy về Hội Thánh là từ mô hình \"người xem\" (audience model) sang mô hình \"người tham gia\" (participant model). Trong mô hình khán giả, Hội Thánh là nơi bạn đến xem và nghe – và bạn đánh giá nó như một dịch vụ: bài giảng có hay không, nhạc có tốt không, thái độ tiếp đón có thân thiện không."],["p","Nhưng những \"một với nhau\" của Tân Ước không thể thực hiện trong mô hình khán giả. Bạn không thể \"mang gánh nặng cho nhau\" với người bạn ngồi cách hai ghế và không biết tên. Cộng đoàn thật đòi hỏi bạn không chỉ là người tiêu thụ dịch vụ tôn giáo – mà là người tích cực đầu tư vào đời sống của người khác và cho phép người khác đầu tư vào đời sống của bạn."],["refl","CÂU HỎI SUY NGẪM — Chương 4",["Trải nghiệm của Linh – cho phép người khác thấy mình đang thật sự như thế nào – điều đó khó đến mức nào với bạn?","Trong danh sách \"một với nhau\", điều nào bạn đang thực hiện tốt? Điều nào bạn đang né tránh?","Sự khác biệt giữa \"mô hình khán giả\" và \"mô hình người tham gia\" – cộng đoàn bạn đang thuộc về gần mô hình nào hơn?","[Nhóm nhỏ] Điều gì cụ thể bạn có thể thay đổi trong tuần tới để đầu tư vào đời sống của một người trong cộng đoàn?"]]]},{"k":"ch","l":"Phần 4 · Chương 5","t":"Khi Mọi Thứ Khó: Bền Bỉ Trong Cộng Đoàn","pb":null,"b":[["q","Chúng ta hãy chú ý đến nhau để khuyến khích nhau sống bác ái và làm việc thiện. Chúng ta đừng bỏ các buổi nhóm họp, như có người quen làm, nhưng phải khuyến khích nhau.","Hebrews 10,24-25"],["h3","I. Câu Chuyện Của Minh"],["story","Câu chuyện: Minh – 41 tuổi",["Minh bốn mươi mốt tuổi, đã là người tin hai mươi năm và đã rời khỏi ít nhất ba cộng đoàn khác nhau – mỗi lần đều có lý do chính đáng. Xung đột với lãnh đạo. Cộng đoàn thay đổi hướng đi. Bạn bè thân thiết rời đi.","Anh không nghi ngờ đức tin của mình. Anh nghi ngờ điều khác: \"Có phải tôi đang có vấn đề với cam kết không? Hay việc rời khỏi cộng đoàn khi không còn phù hợp là điều bình thường và lành mạnh?\""]],["h3","II. Khi Nào Nên Ở Lại – Khi Nào Nên Rời Đi"],["p","Đây là một trong những câu hỏi khó nhất của đời sống cộng đoàn, và không có câu trả lời đơn giản. Kinh Thánh không nói \"hãy ở lại bất kỳ cộng đoàn nào mãi mãi bất kể điều gì\". Nhưng Kinh Thánh cũng không hỗ trợ thói quen rời đi khi gặp bất đồng hay khó khăn."],["box","",["<b>Những lý do có thể chính đáng để rời cộng đoàn:<\/b>","– Giáo lý cốt lõi sai lầm nghiêm trọng (phủ nhận sự Phục Sinh, thần thánh hóa lãnh đạo...)","– Lạm dụng quyền lực gây hại thật sự và không được giải quyết","– Hoàn cảnh địa lý thay đổi","– Giai đoạn cuộc sống đòi hỏi cộng đoàn khác (ví dụ: chuyển thành phố)","<b>Những lý do KHÔNG chính đáng để rời cộng đoàn:<\/b>","– Xung đột cá nhân chưa được giải quyết theo Matthew 18","– Cảm thấy không được phục vụ đủ tốt (mô hình khán giả)","– Bạn bè thân thiết đã rời đi","– Cộng đoàn không hoàn hảo – không có cộng đoàn nào là hoàn hảo"]],["h3","III. Bền Bỉ – Một Phẩm Chất Thuộc Linh"],["p","Hebrews 10,25 cảnh báo \"đừng bỏ các buổi nhóm họp\" trong bối cảnh cộng đoàn đang bị bức hại – những người có lý do nguy hiểm thật sự để không đến. Lời khuyên vẫn là: đừng bỏ, và hãy khuyến khích nhau. Bền bỉ trong cộng đoàn là phẩm chất thuộc linh, không phải chỉ là trung thành xã hội."],["p","Bền bỉ không có nghĩa là thụ động chịu đựng mọi thứ. Điều đó có nghĩa là cam kết ở lại và làm việc cho sự chữa lành và tăng trưởng của cộng đoàn, ngay cả khi nó khó. Revelation 2-3 chứa đựng bảy bức thư Đức Giê-su gửi cho bảy cộng đoàn – và mỗi bức thư vừa nhận ra thực tế của cộng đoàn (kể cả những vấn đề nghiêm trọng) vừa kêu gọi hoặc ở lại và thay đổi, hoặc tiếp tục bền bỉ."],["h3","IV. Niềm Vui Trong Cộng Đoàn – Không Phải Chỉ Là Gánh Nặng"],["p","Điều quan trọng cần kết thúc bằng: cộng đoàn Ki-tô giáo không được thiết kế chỉ để là gánh nặng phải chịu đựng. Khi nó đang hoạt động đúng cách – dù không hoàn hảo – nó là nơi của niềm vui thật sự. Acts 2,46-47 mô tả cộng đoàn đầu tiên \"dùng bữa với nhau trong niềm vui và sự đơn thành của tâm hồn, ca ngợi Thiên Chúa\"."],["p","Psalms 133,1: \"Thật hạnh phúc, thật tốt đẹp thay, anh em được sống vui vẻ bên nhau!\" Đây là một trong những bức tranh đẹp nhất trong Kinh Thánh về cộng đoàn – không phải bức tranh hoàn hảo không có xung đột, mà là bức tranh của sự gắn kết thật sự. Và đó là điều mà Đức Thánh Linh – Đấng đã được khám phá trong suốt Tập 4 – đang xây dựng trong và qua những con người thật, trong những cộng đoàn thật, hôm nay."],["sum","TỔNG KẾT CHÍNH ĐỀ 16 – Sống Cùng Nhau: Thực Tế Và Thách Thức",["<b>Chương 1: <\/b>Hiệp nhất không phải là đồng nhất – phân biệt vấn đề nền tảng và vấn đề lương tâm","<b>Chương 2: <\/b>Tha thứ là hành động ý chí, không phải cảm giác – và khác với hòa giải","<b>Chương 3: <\/b>Lãnh đạo là phục vụ theo mẫu Đức Giê-su – không phải thống trị","<b>Chương 4: <\/b>Hơn 50 \"một với nhau\" đòi hỏi sự hiện diện thật và chủ động","<b>Chương 5: <\/b>Bền bỉ trong cộng đoàn là phẩm chất thuộc linh – và cộng đoàn thật mang lại niềm vui thật"]],["refl","CÂU HỎI SUY NGẪM — Chương 5",["Câu hỏi của Minh – \"tôi có vấn đề với cam kết, hay rời đi là bình thường và lành mạnh?\" – bạn trả lời thế nào?","Trong danh sách lý do chính đáng và không chính đáng để rời cộng đoàn – bạn có thêm gì không?","Acts 2,46-47 – niềm vui trong cộng đoàn – bạn có kinh nghiệm về điều đó không? Nó trông như thế nào?","[Nhóm nhỏ] Nhìn lại toàn bộ Tập 4 (CD 13-16): điều gì thay đổi nhiều nhất trong cách bạn nghĩ về Đức Thánh Linh và cộng đoàn?"]]]},{"k":"end","l":"Kết","t":"Kết Tập 4","pb":null,"b":[["sum","TỔNG KẾT TẬP 4 – Đức Thánh Linh Và Cộng Đoàn",["<b>Phần 1 – Đức Thánh Linh: <\/b>Ngài là Ngôi Vị thứ Ba của Ba Ngôi, Đấng Đức Giê-su hứa để lại – hiện diện sâu hơn, không bị giới hạn bởi không gian và thời gian, dẫn dắt về Đức Giê-su, không phải về bản thân Ngài.","<b>Phần 2 – Thánh Linh Trong Cuộc Sống: <\/b>Tái sinh, ban ân tứ cho cộng đoàn, hình thành hoa quả trong con người, cầu thay khi ta không thể, biến đổi dần dần, và chiến đấu cùng ta.","<b>Phần 3 – Cộng Đoàn: <\/b>Thân Thể Đức Ki-tô, Đền Thờ Đức Thánh Linh, Gia Đình Thiên Chúa – được triệu tập, không tự chọn; tồn tại vì thế giới, không phải vì bản thân.","<b>Phần 4 – Sống Cùng Nhau: <\/b>Hiệp nhất trong đa dạng, tha thứ thật sự, lãnh đạo như phục vụ, mang gánh nặng cho nhau, và bền bỉ vì cộng đoàn là đáng giá."]],["p","Tập 4 bắt đầu bằng câu hỏi của Thảo: \"Ai đang thật sự ở với tôi?\" Và kết thúc bằng câu trả lời không phải là một khái niệm hay một học thuyết – mà là hai thực tại sống động: Đức Thánh Linh đang ở trong bạn, và những anh chị em đang ở bên cạnh bạn."],["p","Không có đời sống Ki-tô hữu đúng nghĩa nếu thiếu một trong hai. Đức Thánh Linh không đến để tạo ra những cá nhân tâm linh cô độc – Ngài đến để xây dựng một thân thể. Và thân thể đó, với tất cả những yếu đuối và không hoàn hảo của nó, là kế hoạch của Thiên Chúa cho thế giới này."],["p","John 17,21 – lời cầu nguyện cuối cùng của Đức Giê-su trước khi chịu chết – là lời cầu nguyện cho điều này: \"Để tất cả nên một... để thế gian tin rằng Cha đã sai con.\" Sự hiệp nhất của Hội Thánh không chỉ là mục tiêu nội bộ. Đó là bằng chứng của Tin Mừng – và là sứ mạng của Đức Thánh Linh đang tiếp tục hôm nay."],["orn"],["c","<i>Tiếp theo: Tập 5 – Ơn Cứu Độ Và Đức Tin<\/i>"],["c","<i>« Làm Sao Để Được Cứu? »<\/i>"],["q","Vì chính do ân sủng và nhờ lòng tin mà anh em được cứu độ: đây không phải bởi sức anh em, mà là ân huệ của Thiên Chúa; cũng không phải bởi việc anh em làm, để không ai có thể tự hào.","Ephesians 2,8-9"],["orn"],["c","<i>Tập 4 là một phần của bộ sách<\/i>"],["c","<b>KIẾP NHÂN SINH – Dưới Góc Nhìn Kinh Thánh<\/b>"],["c","<i>7 Tập • 28 Chính Đề • Một Hành Trình Trọn Đời<\/i>"],["c","<b>Bửu Hòa<\/b>"],["c","Hạ, 2026"]]}]},{"id":"tap-5","n":5,"title":"Ơn Cứu Độ Và Đức Tin","tag":"« Làm Sao Để Được Cứu? »","pages":[{"k":"front","l":"Mở đầu","t":"Lời Dẫn Vào Tập 5","pb":null,"b":[["p","Bốn tập đầu đã đặt nền tảng cho một bức tranh lớn. Tập 1 hỏi: Tôi là ai? Tập 2 hỏi: Thế giới này là gì? Tập 3 hỏi: Đức Giê-su là ai? Tập 4 hỏi: Đức Thánh Linh và cộng đoàn là gì? Tất cả những câu hỏi đó dẫn đến câu hỏi trung tâm nhất của Tập 5: Làm sao để được cứu?"],["p","Đây không phải là câu hỏi học thuật. Đây là câu hỏi mà con người đặt ra từ hàng nghìn năm nay – và câu hỏi mà mỗi người sớm hay muộn sẽ phải đối mặt theo cách riêng của mình. Và Tập 5 tin rằng Kinh Thánh có câu trả lời – không phải câu trả lời dễ dãi, không phải câu trả lời né tránh sự thật về tình trạng con người, mà là câu trả lời đủ sâu và đủ đẹp để thay đổi mọi thứ."],["box","Tập 5 gồm bốn chính đề:",["<b>Phần 1 – Ân Sủng: <\/b>Tin Mừng Thật Sự Là Gì?","<b>Phần 2 – Đức Tin: <\/b>Tin Là Gì – Và Tin Như Thế Nào?","<b>Phần 3 – Sự Xưng Công Chính: <\/b>Thiên Chúa Tuyên Bố Điều Gì?","<b>Phần 4 – Sự Thánh Hóa: <\/b>Sau Khi Tin – Thì Sao?"]]]},{"k":"front","l":"Phần 1 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 1","ÂN SỦNG","Tin Mừng Thật Sự Là Gì?"],"b":[["p","Có một câu hỏi mà nhiều người đã theo đạo nhiều năm vẫn chưa thật sự biết câu trả lời: Tin Mừng là gì? Không phải câu trả lời học thuộc, mà là câu trả lời họ thật sự sống theo. Vì có sự khác biệt lớn giữa \"biết\" Tin Mừng và \"sống từ\" Tin Mừng."],["p","Chính đề 17 đi vào trung tâm của điều Kinh Thánh gọi là \"euangelion\" – Tin Mừng. Không phải vì nó chưa quen thuộc, mà vì nó quá quen đến mức chúng ta có nguy cơ không còn thật sự nghe nó nữa. Và khi Tin Mừng bị thay thế bởi điều gì khác – dù điều đó có vẻ giống Tin Mừng – hậu quả là đời sống Ki-tô hữu chạy bằng sức người thay vì ân sủng."]]},{"k":"ch","l":"Phần 1 · Chương 1","t":"Tin Mừng Không Phải Là Lời Khuyên","pb":null,"b":[["q","Vì chính do ân sủng và nhờ lòng tin mà anh em được cứu độ: đây không phải bởi sức anh em, mà là ân huệ của Thiên Chúa; cũng không phải bởi việc anh em làm, để không ai có thể tự hào.","Ephesians 2,8-9"],["h3","I. Câu Chuyện Của Lan"],["story","Câu chuyện: Lan – 33 tuổi",["Lan ba mươi ba tuổi, đã là người tin mười hai năm. Cô chăm chỉ đọc Kinh Thánh, cầu nguyện đều đặn, và tham gia tích cực vào cộng đoàn. Nhưng trong buổi nhóm nhỏ gần đây, có người hỏi: \"Nếu Thiên Chúa hỏi tại sao Ngài nên cho bạn vào Thiên Đàng, bạn sẽ trả lời gì?\"Lan trả lời: \"Vì tôi đã cố gắng sống tốt, đi lễ, làm việc thiện.\" Người đặt câu hỏi im lặng một lúc rồi nói: \"Câu trả lời đó không phải là Tin Mừng. Đó là câu trả lời của người chưa thật sự nghe Tin Mừng.\"Lan không biết phải trả lời thế nào. Câu hỏi cô mang về nhà: \"Tôi đang tin vào điều gì, thật ra?\""]],["h3","II. Sự Khác Biệt Cốt Lõi: Tin Mừng Và Lời Khuyên"],["p","Một trong những sự phân biệt quan trọng nhất trong thần học là sự khác biệt giữa \"tin mừng\" (gospel) và \"lời khuyên\" (advice). Lời khuyên nói: \"Đây là điều bạn cần làm để đạt được điều bạn cần.\" Tin Mừng nói: \"Đây là điều đã được thực hiện cho bạn – và nó thay đổi tất cả.\""],["p","Khi câu trả lời của Lan cho câu hỏi về Thiên Đàng là danh sách những điều cô đã làm, cô đang sống theo lời khuyên, không phải Tin Mừng. Không phải vì những điều đó là xấu – đọc Kinh Thánh, cầu nguyện, làm việc thiện đều tốt. Mà vì cô đặt chúng như nền tảng cho vị trí của mình trước mặt Thiên Chúa."],["box","",["<b>Lời khuyên:<\/b> \"Hãy làm X để đạt Y.\" Đặt gánh nặng lên người nghe. Tạo ra sự lo lắng: tôi có làm đủ không?","<b>Tin Mừng:<\/b> \"X đã được thực hiện. Nhận lấy.\" Tháo bỏ gánh nặng. Tạo ra niềm vui và lòng biết ơn.","<b>Hệ quả thực tế:<\/b> Người sống theo lời khuyên luôn không chắc mình \"đủ\". Người sống từ Tin Mừng biết mình không đủ – và biết điều đó không phải là vấn đề nữa."]],["h3","III. \"Euangelion\" – Tin Tức Tốt Lành Về Điều Đã Xảy Ra"],["p","Từ Hy-lạp \"euangelion\" – Tin Mừng – không có nghĩa là \"lời khuyên tốt\" hay \"hướng dẫn tốt\". Nghĩa đen là \"tin tức tốt lành\". Trong thế giới Hy-Lạp-La Mã, từ này được dùng để loan báo chiến thắng quân sự – sứ giả chạy từ chiến trường về thành phố để báo tin: trận chiến đã kết thúc, kẻ thù đã bị đánh bại. Người nghe không cần làm gì thêm để giành chiến thắng – họ chỉ cần đón nhận tin tức đó."],["p","Phao-lô dùng cùng từ đó để mô tả những gì đã xảy ra qua Thập Giá và Phục Sinh của Đức Giê-su. Không phải là \"hướng dẫn về cách sống tốt hơn\". Mà là tin tức về điều đã thật sự xảy ra trong lịch sử – và thay đổi tình trạng của tất cả mọi người."],["h3","IV. 1 Corinthians 15 – Tóm Tắt Ngắn Nhất Của Tin Mừng"],["q","Trước hết, tôi đã truyền lại cho anh em điều mà chính tôi đã lãnh nhận: đó là Đức Ki-tô đã chết vì tội lỗi chúng ta, đúng như lời Kinh Thánh, rồi Người đã được mai táng, và ngày thứ ba đã trỗi dậy, đúng như lời Kinh Thánh.","1 Corinthians 15,3-4"],["p","Phao-lô gói Tin Mừng trong bốn động từ: đã chết, đã được mai táng, đã trỗi dậy, đã hiện ra. Tất cả đều là hành động trong quá khứ – những sự kiện đã xảy ra. Không phải là \"hãy chết đi cho tội lỗi\" hay \"hãy phục sinh trong lòng bạn\". Mà là: Đức Giê-su đã chết, đã sống lại, và điều đó là thật."],["p","Điều \"đúng như lời Kinh Thánh\" xuất hiện hai lần trong đoạn đó – nhấn mạnh rằng những sự kiện này không phải là bất ngờ. Chúng là sự hoàn thành của kế hoạch từ lâu, được loan báo trước – Thiên Chúa đang làm điều Ngài đã hứa làm."],["h3","V. Tại Sao Câu Trả Lời Của Lan Là Vấn Đề Nghiêm Trọng"],["p","Nhà thần học Martin Luther mô tả đây là hai hướng vận động hoàn toàn đối lập. \"Công trình của con người\" (opus operatum) là nỗ lực xây dựng con đường đến với Thiên Chúa từ phía con người. \"Ân sủng\" (gratia) là Thiên Chúa xây dựng cây cầu từ phía Ngài. Câu trả lời của Lan không phải là khiêm tốn – nó thật ra là kiêu ngạo theo một nghĩa thần học: nó đặt điều Lan làm lên ngai mà chỉ điều Đức Ki-tô làm mới có thể ngồi."],["p","Ephesians 2,9 kết thúc bằng một lý do quan trọng: \"để không ai có thể tự hào.\" Nếu cứu độ là kết quả của những gì bạn làm, bạn có lý do để tự hào. Nếu nó là ân huệ, thì không. Và khi không ai có thể tự hào – điều duy nhất còn lại là lòng biết ơn, và tình yêu thương xuất phát từ sự biết ơn, không phải từ nghĩa vụ."],["refl","CÂU HỎI SUY NGẪM — Chương 1",["Câu hỏi của Lan – nếu Thiên Chúa hỏi tại sao Ngài nên cho bạn vào Thiên Đàng, bạn trả lời thế nào? Câu trả lời đó nói lên điều gì về điều bạn thật sự tin?","Sự khác biệt giữa \"lời khuyên\" và \"tin mừng\" – điều đó thay đổi gì trong cách bạn nghĩ về mối quan hệ với Thiên Chúa?","Hình ảnh sứ giả báo tin chiến thắng – điều đó giúp bạn hiểu Tin Mừng như thế nào khác đi?","[Nhóm nhỏ] Trong cuộc sống đức tin của bạn, bạn đang chạy bằng \"nghĩa vụ\" hay bằng \"lòng biết ơn\"? Sự khác biệt đó biểu hiện ra sao trong thực tế?"]]]},{"k":"ch","l":"Phần 1 · Chương 2","t":"Ân Sủng: Điều Không Ai Kiếm Được","pb":null,"b":[["q","Thiên Chúa yêu thế gian đến nỗi đã ban Con Một, để ai tin vào Con của Người thì khỏi phải chết, nhưng được sống muôn đời.","John 3,16"],["h3","I. Câu Chuyện Của Hưng"],["story","Câu chuyện: Hưng – 29 tuổi",["Hưng hai mươi chín tuổi, lớn lên trong gia đình không có tôn giáo. Khi bạn bè mời anh đến nhà thờ lần đầu, anh ngồi nghe và một câu nói làm anh dừng lại: \"Thiên Chúa yêu bạn – không phải vì bạn xứng đáng, mà dù bạn không xứng đáng.\"Anh về nhà và suy nghĩ về câu đó cả tuần. Anh biết rõ mình không phải là người tốt theo bất kỳ tiêu chuẩn nào. Điều làm anh bối rối không phải là ý tưởng về Thiên Chúa – mà là ý tưởng về một loại tình yêu không dựa trên điều kiện. Anh chưa bao giờ gặp điều đó từ bất kỳ ai."]],["h3","II. \"Charis\" – Từ Đằng Sau Ân Sủng"],["p","Từ Hy-lạp \"charis\" được dịch là \"ân sủng\". Trong tiếng Hy-lạp thế tục, nó có nghĩa là sự duyên dáng, vẻ đẹp, và đặc biệt là món quà được trao một cách tự do – không phải vì người nhận xứng đáng. Phao-lô nhận lấy từ đó và đặt nó vào trung tâm của ngôn ngữ thần học."],["p","Điều làm cho \"charis\" trở thành ân sủng theo nghĩa Ki-tô giáo là: nó không chỉ là tình yêu dành cho người vô tội hay người đáng yêu. Romans 5,8 nói: \"Đức Ki-tô đã chết vì chúng ta, ngay khi chúng ta còn là người tội lỗi.\" Không phải sau khi chúng ta cải thiện. Không phải khi chúng ta xứng đáng. Mà là khi chúng ta đang là đối lập của xứng đáng."],["box","",["<b>Ân sủng khác với:<\/b> \"Phần thưởng\" – vì phần thưởng được kiếm được. Ân sủng là quà tặng không có điều kiện.","<b>Ân sủng khác với:<\/b> \"Khoan dung\" – vì khoan dung bỏ qua tội lỗi. Ân sủng giải quyết tội lỗi một cách công bình, qua Thập Giá.","<b>Ân sủng khác với:<\/b> \"Cơ hội\" – vì cơ hội là điều kiện để bạn làm gì đó. Ân sủng là điều đã xong, không chờ bạn làm gì.","<b>Ân sủng là:<\/b> Thiên Chúa trao cho bạn điều bạn không xứng đáng, vì Đức Giê-su đã nhận lấy điều Ngài không đáng phải nhận."]],["h3","III. John 3,16 – Câu Kinh Thánh Nổi Tiếng Nhất Và Hay Bị Hiểu Sai Nhất"],["p","John 3,16 là câu Kinh Thánh được trích dẫn nhiều nhất trong lịch sử – đến mức người ta có thể đọc nó mà không còn thật sự nghe nó nữa. Hãy đọc lại chậm hơn: \"Thiên Chúa yêu thế gian.\" Không phải \"những người tốt\". Không phải \"những người tìm kiếm Ngài\". Mà là \"thế gian\" – từ Hy-lạp \"kosmos\", thường dùng trong văn học Hy-lạp để chỉ trật tự tạo dựng đang đối kháng với Thiên Chúa."],["p","\"Đến nỗi đã ban Con Một\" – động từ \"ban\" là aorist – một hành động đã hoàn thành trong quá khứ. Không phải \"đang cân nhắc ban\" hay \"sẵn sàng ban nếu bạn đủ điều kiện\". Mà là: đã ban rồi. Quyết định đã được thực hiện. Điều duy nhất còn lại là câu hỏi của bạn với quà tặng đó."],["h3","IV. Romans 5 – Bốn Tình Trạng, Một Quyết Định"],["p","Romans 5,6-10 mô tả bốn tình trạng của con người khi Đức Ki-tô chết cho họ: \"còn yếu đuối\", \"tội lỗi\", \"thù địch với Thiên Chúa\", và \"chưa kính sợ Ngài\". Không phải một trong số đó là điều kiện tốt để nhận ân sủng. Tất cả đều là những tình trạng đối nghịch với ân sủng. Và đó chính xác là thời điểm Đức Ki-tô chết."],["box","",["\"Quả vậy, khi chúng ta không có sức làm được gì, thì đúng theo kỳ hạn, Đức Ki-tô đã chết vì những kẻ vô đạo.\" (Romans 5,6)","\"Nhưng Thiên Chúa chứng tỏ tình yêu của Người đối với chúng ta ở chỗ này: khi chúng ta còn là người tội lỗi, thì Đức Ki-tô đã chết vì chúng ta.\" (Romans 5,8)","Hệ quả: nếu Đức Ki-tô đã yêu bạn khi bạn là kẻ thù, bạn không cần sợ Ngài sẽ ngừng yêu khi bạn thất bại."]],["h3","V. Ân Sủng Không Có Nghĩa Là Thiếu Nghiêm Túc Về Tội Lỗi"],["p","Một phản đối thường gặp: \"Nếu mọi thứ đều là ân sủng, thì sao cần cố gắng?\" Phao-lô đặt câu hỏi đó trong Romans 6,1: \"Chúng ta sẽ ở lại trong tội lỗi, để ân sủng được chan chứa hơn sao?\" Câu trả lời của ông: \"Hoàn toàn không!\""],["p","Ân sủng không làm tội lỗi trở thành không quan trọng – nó làm tội lỗi trở thành điều đi ngược lại điều bạn đã trở thành. Khi bạn hiểu rằng Đức Ki-tô đã chết vì tội lỗi bạn, và điều đó có giá đắt như vậy – thì tội lỗi không trở nên ít nghiêm trọng hơn. Nó trở nên nghiêm trọng hơn, đồng thời đã được giải quyết rồi."],["refl","CÂU HỎI SUY NGẪM — Chương 2",["Câu chuyện của Hưng – \"tình yêu không dựa trên điều kiện\" – bạn đã thật sự tin vào điều đó chưa, hay vẫn còn cảm thấy cần phải kiếm được nó?","Sự khác biệt giữa ân sủng, phần thưởng, khoan dung, và cơ hội – điều nào bạn thường nhầm lẫn nhất với ân sủng?","Romans 5,8 – Đức Ki-tô chết khi chúng ta \"còn là người tội lỗi\" – điều đó thay đổi gì trong cách bạn đến với Thiên Chúa sau khi phạm lỗi?","[Nhóm nhỏ] Phản đối \"nếu mọi thứ là ân sủng thì sao cần cố gắng?\" – bạn trả lời bạn bè thế nào khi họ nói điều này?"]]]},{"k":"ch","l":"Phần 1 · Chương 3","t":"Tin Mừng Và Luật Pháp: Không Phải Kẻ Thù","pb":null,"b":[["q","Vậy chúng ta có phủ nhận Lề Luật không? Chắc chắn là không! Trái lại, chúng ta đặt Lề Luật vào đúng chỗ của nó.","Romans 3,31"],["h3","I. Câu Chuyện Của Minh"],["story","Câu chuyện: Minh – 37 tuổi",["Minh ba mươi bảy tuổi, đã chuyển từ gia đình Công Giáo sang một cộng đoàn Tin Lành được ba năm. Anh nghe giảng nhiều về ân sủng và tự do trong Đức Ki-tô – và dần dần bắt đầu cảm thấy những thực hành trước đây: kiêng ăn, đọc kinh, thực hành kỷ luật tâm linh – là \"dựa vào công việc\" và không còn cần thiết. Người hướng dẫn tâm linh của anh đặt câu hỏi: \"Minh nghĩ ân sủng và kỷ luật là đối nghịch không? Nếu vậy, tại sao Phao-lô viết 'hãy dùng lòng kính sợ mà lo sao cho mình được cứu' (Philippians 2,12) ngay sau khi giải thích Thiên Chúa đang làm việc trong họ?\""]],["h3","II. Ba Vai Trò Của Lề Luật Trong Kinh Thánh"],["p","Lề Luật – những điều Thiên Chúa truyền dạy – không phải là kẻ thù của Tin Mừng. Nhưng để hiểu đúng vai trò của nó cần phân biệt ba chức năng khác nhau mà các nhà thần học đã nhận ra."],["box","",["<b>1. Gương soi (Mirror):<\/b> Lề Luật cho thấy tình trạng thật của con người trước mặt Thiên Chúa. Romans 3,20: \"Vì nhờ Lề Luật, người ta nhận thức được tội lỗi.\" Đây không phải là mục đích tiêu cực – đây là điều cần thiết để hiểu tại sao ân sủng cần đến.","<b>2. Hàng rào (Fence/Curb):<\/b> Lề Luật giữ cho cái ác không lan tràn không kiểm soát trong xã hội – chức năng dân sự. Ngay cả người không tin cũng sống trong cấu trúc này.","<b>3. Hướng dẫn (Guide):<\/b> Lề Luật cho người đã được cứu biết cách sống phù hợp với điều họ đã trở thành. Psalms 119,105: \"Lời Ngài là ngọn đèn soi cho con bước, là ánh sáng chỉ đường con đi.\""]],["h3","III. Galatians Và Cái Bẫy Của \"Cả Hai\""],["p","Thư Galatians là phản ứng mạnh mẽ nhất của Phao-lô trước một vấn đề cụ thể: những người đang thêm yêu cầu tuân giữ Lề Luật vào Tin Mừng như điều kiện để được cứu. Không phải họ nói Tin Mừng là sai – họ nói \"Tin Mừng cộng thêm điều này nữa.\" Phao-lô gọi điều đó là \"một Tin Mừng khác – thực ra không phải là Tin Mừng\" (Galatians 1,7)."],["p","Galatians 3,10-11 phân tích vấn đề: nếu bạn muốn được xưng công chính dựa trên Lề Luật, bạn phải giữ tất cả – không phải một phần. Và Habakkuk 2,4 đã nói rõ: \"Người công chính sẽ sống nhờ đức tin.\" Hai con đường không thể kết hợp: hoặc là được cứu hoàn toàn bởi điều Đức Ki-tô đã làm, hoặc là được cứu hoàn toàn bởi điều bạn làm. Cộng thêm điều gì đó vào Tin Mừng thật ra là phủ nhận Tin Mừng."],["h3","IV. Sau Ân Sủng – Lề Luật Trở Thành Điều Gì?"],["p","Điều thú vị là sau khi nói mạnh mẽ nhất về sự tự do trong Đức Ki-tô, Phao-lô thường dành nhiều chương cho những hướng dẫn rất cụ thể về cách sống – gọi là \"paraenesis\" trong học thuật thần học. Ephesians 1-3 là thần học sâu về ân sủng; Ephesians 4-6 là hướng dẫn cụ thể về cuộc sống. Không phải vì tuân theo hướng dẫn đó sẽ kiếm được ân sủng – mà vì người đã nhận ân sủng sẽ muốn sống phù hợp với điều mình đã trở thành."],["p","Đây là sự khác biệt quan trọng: trước ân sủng, Lề Luật là người canh gác. Sau ân sủng, Lề Luật là người bạn đồng hành – không phải để xác định vị trí của bạn, mà để hướng dẫn bước đi của bạn. Câu hỏi không còn là \"tôi phải làm gì để được chấp nhận?\" mà là \"tôi được tạo dựng để sống như thế nào?\""],["h3","V. Kỷ Luật Tâm Linh – Không Phải Để Kiếm, Mà Để Đón Nhận"],["p","Trở lại với câu hỏi của Minh: kỷ luật tâm linh – đọc Kinh Thánh, cầu nguyện, kiêng ăn – không mâu thuẫn với ân sủng. Chúng mâu thuẫn với ân sủng khi bạn dùng chúng để kiếm vị trí trước mặt Thiên Chúa. Nhưng khi bạn hiểu rằng vị trí đó đã được ban rồi – những thực hành đó trở thành cách bạn mở lòng ra để đón nhận điều Đức Thánh Linh muốn làm trong bạn."],["p","John Wesley gọi những thực hành này là \"phương tiện ân sủng\" – không phải nguồn của ân sủng, mà là kênh bạn mở ra. Cái cây không kiếm được ánh sáng mặt trời hay nước – nhưng cái cây bám rễ sâu và hướng lá về phía mặt trời sẽ nhận được nhiều hơn cái cây cụp lá và quay đi."],["refl","CÂU HỎI SUY NGẪM — Chương 3",["Câu chuyện của Minh – bạn có xu hướng hoặc là thêm điều kiện vào Tin Mừng, hoặc là bỏ đi kỷ luật vì nghĩ nó mâu thuẫn với ân sủng không?","Ba vai trò của Lề Luật – vai trò nào bạn quen thuộc nhất? Vai trò nào bạn chưa bao giờ nghĩ đến?","Sự khác biệt giữa kỷ luật \"để kiếm\" và kỷ luật \"để đón nhận\" – điều đó thay đổi gì trong cách bạn tiếp cận thực hành tâm linh?","[Nhóm nhỏ] Có thực hành tôn giáo nào trong cuộc sống bạn đang dần trở thành cách kiếm sự chấp thuận từ Thiên Chúa, thay vì đón nhận điều Ngài đã ban?"]]]},{"k":"ch","l":"Phần 1 · Chương 4","t":"Tình Yêu Thiên Chúa Và Sự Công Bình Của Ngài: Không Phải Mâu Thuẫn","pb":null,"b":[["q","Thiên Chúa đã đặt Người làm của lễ xá tội nhờ máu Người để đạt được ơn tha tội cho những kẻ tin. Như thế, Thiên Chúa tỏ ra công chính... và tuyên bố kẻ tin vào Đức Giê-su là công chính.","Romans 3,25-26"],["h3","I. Câu Chuyện Của Khanh"],["story","Câu chuyện: Khanh – 42 tuổi",["Khanh bốn mươi hai tuổi, từng là người vô thần cho đến năm ba mươi lăm tuổi. Câu hỏi cản trở anh lâu nhất không phải là \"Thiên Chúa có tồn tại không?\" mà là: \"Tại sao cần Thập Giá? Nếu Thiên Chúa toàn năng và yêu thương, tại sao Ngài không đơn giản tha thứ mà không cần ai phải chết?\"Sau khi trở thành người tin, câu hỏi đó vẫn đeo đuổi anh – nhưng bây giờ anh đặt nó từ bên trong: \"Nếu Thiên Chúa đã biết Ngài sẽ tha thứ tất cả qua Đức Ki-tô, tại sao phải có cái giá đắt như vậy?\""]],["h3","II. Vấn Đề Thật Sự: Thiên Chúa Không Thể Chỉ \"Nhìn Qua\" Tội Lỗi"],["p","Câu hỏi của Khanh phát sinh từ một hình dung sai về tội lỗi – như thể tội lỗi là sự xúc phạm nhỏ nhặt mà một vị Thiên Chúa nhân từ có thể bỏ qua. Nhưng Kinh Thánh trình bày tội lỗi không phải như lỗi lầm có thể bỏ qua – mà là sự phá vỡ trật tự đạo đức thật sự, sự từ chối vị trí của mình trong tương quan với Đấng Tạo Hóa, và hậu quả thật của nó là sự chết."],["p","Thiên Chúa \"bỏ qua\" tội lỗi mà không giải quyết nó sẽ không phải là một Thiên Chúa yêu thương hơn – mà là một Thiên Chúa ít công bình hơn. Hình ảnh: một thẩm phán tha bổng kẻ giết người vô tội vì \"anh ta là người tốt về nhiều mặt khác\" không phải là thẩm phán nhân từ – đó là thẩm phán tham nhũng. Tình yêu không xóa bỏ sự công bình; sự công bình không xóa bỏ tình yêu. Thập Giá là điểm nơi cả hai được thỏa mãn cùng lúc."],["h3","III. \"Hilasterion\" – Nắp Thi Ân"],["p","Romans 3,25 dùng từ \"hilasterion\" – thường được dịch là \"của lễ xá tội\" hay \"nắp thi ân\". Đây là từ Kinh Thánh Cựu Ước dùng cho nắp Hòm Giao Ước, nơi máu của con vật dâng tế được rảy vào Ngày Xá Tội (Lễ Yom Kippur). Đây là nơi Thiên Chúa gặp con người – và là nơi tội lỗi của dân được \"che phủ\" (nghĩa đen của từ Hebrew \"kippur\")."],["p","Phao-lô nói Đức Giê-su là \"hilasterion\" đó trong thực tế tối hậu. Tất cả những tế lễ trong Đền Thờ suốt hàng nghìn năm là những hình bóng chỉ về điều này – khi Chiên Thiên Chúa chịu chết một lần cho tất cả (Hebrews 9,26-28). Không phải Thiên Chúa Cha trút giận lên Đức Giê-su như một nạn nhân vô tội – mà là Ba Ngôi Thiên Chúa cùng nhau giải quyết vấn đề tội lỗi từ bên trong, từ phía Thiên Chúa."],["box","",["Thiên Chúa không đòi bạn tự trả giá cho tội lỗi của mình.","Thiên Chúa không bỏ qua tội lỗi của bạn như thể nó không nghiêm trọng.","Thiên Chúa tự mình trả giá – trong Con Ngài, qua Thập Giá.","Romans 3,26: \"để tuyên bố... cả Ngài công bình lẫn người được xưng công chính nhờ đức tin vào Đức Giê-su.\" Cả hai – công bình VÀ xưng công chính – được thỏa mãn cùng lúc."]],["h3","IV. 2 Corinthians 5,21 – Sự Trao Đổi Vĩ Đại"],["q","Đấng chẳng hề biết tội lỗi, thì Thiên Chúa đã làm cho Người trở thành hiện thân của tội lỗi vì chúng ta, để nhờ Người chúng ta được trở nên sự công chính của Thiên Chúa.","2 Corinthians 5,21"],["p","Martin Luther gọi đây là \"die fröhliche Wechsel\" – sự trao đổi hạnh phúc. Đức Ki-tô mang lấy những gì là của chúng ta: tội lỗi, sự lên án, sự chết. Chúng ta nhận lấy những gì là của Ngài: sự công chính, sự chấp nhận, sự sống. Không phải bởi vì chúng ta xứng đáng, mà bởi vì Ngài tự nguyện trao đổi vị trí."],["p","Hình ảnh Luther: như một đám cưới – khi cô dâu và chú rể kết hôn, những gì thuộc về người này trở thành thuộc về người kia. Nợ của cô dâu trở thành nợ của chú rể. Tài sản của chú rể trở thành của cô dâu. Trong Đức Ki-tô, tội lỗi của chúng ta trở thành của Ngài – và sự công chính của Ngài trở thành của chúng ta."],["h3","V. Điều Này Có Nghĩa Gì Với Khanh – Và Với Tất Cả Chúng Ta"],["p","Câu hỏi của Khanh \"tại sao cần Thập Giá?\" nhận được câu trả lời không phải từ logic trừu tượng, mà từ sự hiểu biết sâu hơn về cả tình trạng con người lẫn bản tính Thiên Chúa. Thập Giá không phải là điều Thiên Chúa cần để có thể tha thứ – Thập Giá là điều Thiên Chúa đã làm để có thể tha thứ một cách công bình, không xóa bỏ sự công chính mà thực hiện nó."],["p","Và khi điều đó được hiểu, những từ như \"cứu độ\", \"tha thứ\", \"ân sủng\" không còn là những từ tôn giáo trừu tượng. Chúng là mô tả về điều đã xảy ra thật sự – cho một người thật sự, tại một nơi thật sự, vào một thời điểm thật sự trong lịch sử."],["refl","CÂU HỎI SUY NGẪM — Chương 4",["Câu hỏi của Khanh – \"tại sao cần Thập Giá?\" – bạn đã từng hỏi hoặc bị hỏi câu đó không? Bạn trả lời thế nào?","Hình ảnh \"thẩm phán tha bổng kẻ giết người\" – điều đó giúp bạn hiểu tại sao Thiên Chúa không thể đơn giản \"bỏ qua\" tội lỗi như thế nào?","\"Sự trao đổi vĩ đại\" theo Luther – điều đó có nghĩa gì với bạn cá nhân trong cuộc sống hiện tại?","[Nhóm nhỏ] Có người bạn biết đang vật lộn với câu hỏi \"tại sao cần Thập Giá?\" không? Sau chương này, bạn sẽ tiếp cận câu hỏi đó của họ như thế nào?"]]]},{"k":"ch","l":"Phần 1 · Chương 5","t":"Sống Từ Tin Mừng: Không Phải Hướng Đến, Mà Là Từ","pb":null,"b":[["q","Vì tình yêu của Đức Ki-tô thúc đẩy chúng tôi... Đức Ki-tô đã chết thay cho mọi người, để những ai đang sống không còn sống cho chính mình nữa, mà sống cho Đấng đã chết và sống lại vì họ.","2 Corinthians 5,14-15"],["h3","I. Câu Chuyện Của Phương"],["story","Câu chuyện: Phương – 36 tuổi",["Phương ba mươi sáu tuổi. Cô đã là người tin được tám năm và, nhìn lại, nhận ra một vòng lặp trong đời sống đức tin: nghe Tin Mừng – vui mừng – cố gắng sống tốt hơn để \"xứng đáng\" – thất bại – cảm thấy tội lỗi – quay lại nghe Tin Mừng. Vòng lặp đó đã lặp đi lặp lại đến mức cô bắt đầu cảm thấy mệt mỏi. Một người hướng dẫn tâm linh đặt câu hỏi: \"Phương nghĩ Tin Mừng là điểm khởi đầu để sau đó bạn cố gắng sống xứng đáng với nó, hay là Tin Mừng là cái bạn sống từ đó mỗi ngày, không phải hướng đến nó?\""]],["h3","II. Sự Khác Biệt Quyết Định: \"Hướng Đến\" Và \"Từ\""],["p","Sự phân biệt mà người hướng dẫn tâm linh của Phương đặt ra là một trong những sự phân biệt quan trọng nhất trong thực hành đức tin. Nhiều người Ki-tô hữu sống trong một mô hình tâm lý như thế này: Tin Mừng là điều đã xảy ra một lần và tôi nhớ về nó với lòng biết ơn – nhưng bây giờ tôi cần tiến về phía trước bằng sức của mình."],["p","Nhưng đây không phải là cách Kinh Thánh mô tả đời sống Ki-tô hữu. Colossians 2,6: \"Anh em đã lãnh nhận Đức Ki-tô Giê-su là Chúa, thì hãy sống kết hợp với Người.\" Chú ý: từ \"đã lãnh nhận\" là aorist, một lần; từ \"hãy sống\" là present continuous – tiếp diễn. Cùng một cách bạn đã tiếp nhận Đức Ki-tô – bởi đức tin, không phải bởi công việc – là cách bạn tiếp tục sống trong Ngài."],["h3","III. 2 Corinthians 5 – Sự Thúc Đẩy Từ Bên Trong"],["p","2 Corinthians 5,14 nói \"tình yêu của Đức Ki-tô thúc đẩy chúng tôi\". Từ Hy-lạp \"sunechō\" có nghĩa là \"chèn ép\", \"thúc đẩy từ bên trong\" – như áp lực nội tại, không phải quy tắc bên ngoài. Điều Phao-lô mô tả không phải là sự vâng phục do sợ hãi hay nghĩa vụ – mà là sự thúc đẩy nội tại xuất phát từ việc hiểu điều Đức Ki-tô đã làm."],["p","Đây là sự khác biệt giữa sự vâng phục của người nô lệ và sự vâng phục của người con. Cả hai đều làm những việc giống nhau về mặt bên ngoài – nhưng từ nguồn gốc hoàn toàn khác nhau. Người nô lệ làm vì sợ hậu quả. Người con làm vì biết ơn và tình yêu."],["box","",["<b>Vâng phục từ ngoài vào:<\/b> \"Tôi phải\" – quy tắc, sợ hãi, hay tìm kiếm sự chấp thuận. Kiệt sức theo thời gian vì không có nguồn nội tại.","<b>Vâng phục từ trong ra:<\/b> \"Tôi muốn\" – xuất phát từ sự hiểu biết về điều Đức Ki-tô đã làm. Romans 12,1: \"vì đã được xót thương\" là lý do đằng sau sự vâng phục.","<b>Dấu hiệu phân biệt:<\/b> Khi bạn thất bại, bạn đến với Thiên Chúa từ nơi nào? Từ sự sợ hãi và xấu hổ (vâng phục từ ngoài), hay từ sự ăn năn và tin tưởng (vâng phục từ trong)?"]],["h3","IV. Romans 12,1 – Vì Đã Được Xót Thương"],["q","Thưa anh em, vì Thiên Chúa đã thương xót chúng ta, tôi khuyên nhủ anh em hãy hiến dâng thân mình làm của lễ sống động, thánh thiện và đẹp lòng Thiên Chúa. Đó là cách thờ phượng thiêng liêng của anh em.","Romans 12,1"],["p","Sau mười một chương thần học sâu về ân sủng, sự xưng công chính, và kế hoạch cứu độ của Thiên Chúa, Phao-lô bắt đầu phần thực hành của Romans bằng cụm từ này: \"vì Thiên Chúa đã thương xót chúng ta\". Đây là nền tảng của tất cả những gì sẽ đến sau đó – hàng loạt những hướng dẫn cụ thể về cách sống."],["p","Nếu bạn lấy cụm từ đó ra, những hướng dẫn tiếp theo trở thành nghĩa vụ. Nhưng với cụm từ đó, chúng trở thành phản ứng tự nhiên của người đã hiểu mình đã nhận được gì. Đây là cấu trúc cơ bản của đạo đức Ki-tô giáo: không phải \"hãy làm điều này để được chấp thuận\", mà là \"vì đã được chấp thuận rồi, đây là cách sống phù hợp với điều bạn đã trở thành.\""],["h3","V. Tổng Kết Chính Đề 17 – Và Câu Hỏi Nó Mở Ra"],["p","Chính đề 17 đã đặt nền tảng: Tin Mừng là tin tức về điều đã xảy ra, không phải lời khuyên về điều bạn cần làm. Ân sủng là quà tặng không điều kiện, không phải phần thưởng bạn kiếm được. Thập Giá là nơi tình yêu và sự công bình của Thiên Chúa gặp nhau. Và đời sống Ki-tô hữu là cuộc sống từ Tin Mừng, không phải hướng đến Tin Mừng."],["p","Nhưng điều đó tạo ra câu hỏi tiếp theo: nếu đây là những gì đã được ban – làm thế nào để nhận lấy? Câu hỏi đó là chủ đề của Chính đề 18: đức tin là gì, và tin như thế nào?"],["sum","TỔNG KẾT CHÍNH ĐỀ 17 – Ân Sủng: Tin Mừng Thật Sự Là Gì?",["<b>Chương 1: <\/b>Tin Mừng là tin tức về điều đã xảy ra – không phải lời khuyên về điều bạn cần làm. \"Euangelion\" là sứ điệp của chiến thắng đã được thực hiện.","<b>Chương 2: <\/b>Ân sủng là quà tặng không điều kiện từ Thiên Chúa – \"charis\" – trao cho người không xứng đáng khi còn là người tội lỗi và thù địch.","<b>Chương 3: <\/b>Lề Luật và ân sủng không phải kẻ thù – nhưng Lề Luật không thể cứu. Kỷ luật tâm linh là cách đón nhận ân sủng, không phải kiếm nó.","<b>Chương 4: <\/b>Thập Giá là nơi tình yêu và sự công bình của Thiên Chúa gặp nhau – \"sự trao đổi vĩ đại\" nơi tội lỗi của chúng ta trở thành của Ngài và sự công chính của Ngài trở thành của chúng ta.","<b>Chương 5: <\/b>Đời sống Ki-tô hữu là sống từ Tin Mừng – không phải hướng đến nó. Sự vâng phục thật xuất phát từ lòng biết ơn, không phải từ sợ hãi hay nghĩa vụ."]],["refl","CÂU HỎI SUY NGẪM — Chương 5",["Câu hỏi người hướng dẫn hỏi Phương – bạn đang sống \"hướng đến\" Tin Mừng hay \"từ\" Tin Mừng? Điều gì trong cuộc sống tuần này cho thấy điều đó?","2 Corinthians 5,14 – \"tình yêu Đức Ki-tô thúc đẩy\" – điều gì đang thật sự thúc đẩy sự vâng phục của bạn lúc này?","Romans 12,1 – \"vì đã được xót thương\" – khi bạn đọc những đòi hỏi trong cuộc sống đức tin, bạn có nghe câu đó đằng sau chúng không?","[Nhóm nhỏ] Nhìn lại toàn bộ Chính đề 17: điều gì thay đổi nhiều nhất trong cách bạn hiểu Tin Mừng sau khi đọc và thảo luận?","[Nhóm nhỏ] Câu hỏi mở ra cho Chính đề 18: đức tin là gì, và bạn đang tin vào điều gì thật sự?"]]]},{"k":"front","l":"Phần 2 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 2","ĐỨC TIN","Tin Là Gì – Và Tin Như Thế Nào?"],"b":[["p","Chính đề 17 đã đặt câu hỏi về Tin Mừng và ân sủng. Nhưng ân sủng – dù được ban tặng trọn vẹn – vẫn cần được nhận lấy. Và điều đó dẫn đến câu hỏi trung tâm của Chính đề 18: nhận lấy bằng cách nào? Kinh Thánh có một từ cho điều đó: đức tin."],["p","Nhưng \"đức tin\" là một trong những từ bị hiểu sai nhiều nhất trong ngôn ngữ tôn giáo. Với nhiều người, đức tin có nghĩa là cố gắng tin vào điều không chắc chắn – một loại nỗ lực tinh thần để đẩy sự nghi ngờ ra. Với người khác, nó là tập hợp những điều phải chấp nhận về mặt giáo lý. Và với nhiều người khác nữa, nó chỉ đơn giản là cảm giác."],["p","Chính đề 18 đề nghị rằng cả ba cách hiểu đó đều thiếu điều gì đó quan trọng. Đức tin theo nghĩa Kinh Thánh không phải là nỗ lực tinh thần, không phải chỉ là tập hợp tín điều, và không phải chỉ là cảm giác. Nó là điều gì đó có hình dạng cụ thể hơn – và điều đó tạo ra sự khác biệt thực tế trong đời sống."]]},{"k":"ch","l":"Phần 2 · Chương 1","t":"Đức Tin Không Phải Là Cảm Giác","pb":null,"b":[["q","Đức tin là bảo đảm về những điều người ta hy vọng, là bằng chứng về những thực tại người ta không nhìn thấy.","Hebrews 11,1"],["h3","I. Câu Chuyện Của Tuấn"],["story","Câu chuyện: Tuấn – 31 tuổi",["Tuấn ba mươi mốt tuổi, đã tin vào Đức Giê-su được hai năm. Trong những tháng đầu, cảm giác rất mạnh – anh cảm thấy hiện diện Thiên Chúa rõ ràng, cầu nguyện dễ dàng, và đọc Kinh Thánh thấy thú vị.","Nhưng sau khoảng sáu tháng, những cảm giác đó dần nhạt đi. Cầu nguyện trở nên khô khan. Anh bắt đầu tự hỏi: \"Có phải tôi đã không còn tin nữa? Vì tôi không còn cảm thấy gì như trước?\"","Một người trưởng lão nghe câu hỏi đó và hỏi lại: \"Tuấn nghĩ đức tin là gì – là cảm giác trong lòng, hay là điều gì đó khác?\""]],["h3","II. \"Pistis\" – Từ Kinh Thánh Đằng Sau Đức Tin"],["p","Từ Hy-lạp \"pistis\" được dịch là \"đức tin\" hay \"lòng tin\". Trong tiếng Hy-lạp thế tục, nó không chỉ là cảm giác chủ quan – nó có nghĩa là sự tin tưởng có cơ sở, sự trông cậy dựa trên bằng chứng, và sự trung thành với cam kết. Cùng từ đó được dùng để mô tả sự tin cậy vào một người bạn đáng tin, sự trông cậy vào một con tàu vững chắc, hay lòng trung thành với một giao ước."],["p","Hebrews 11,1 định nghĩa đức tin không bằng cảm giác, mà bằng hai từ: \"bảo đảm\" (hypostasis – nền tảng vững chắc) và \"bằng chứng\" (elegchos – sự thuyết phục dựa trên bằng chứng). Đây không phải là ngôn ngữ của cảm xúc – đây là ngôn ngữ của sự chắc chắn có cơ sở, như nền móng nhà và hồ sơ pháp lý."],["box","",["<b>Đức tin KHÔNG phải là:<\/b> Cảm giác nồng nhiệt hay trải nghiệm cảm xúc mãnh liệt","Nỗ lực tinh thần để đẩy sự nghi ngờ ra khỏi đầu","Chấp nhận điều bạn không thể kiểm chứng bằng ý chí","<b>Đức tin LÀ:<\/b> Sự tin tưởng có cơ sở đặt vào đối tượng đáng tin cậy","Sự trông cậy: hành động nghiêng người trọng lượng vào điều đó","Cam kết sống theo những gì bạn tin là thật, bất kể cảm giác"]],["h3","III. Đức Tin Như Là Ghế – Không Phải Như Là Cảm Giác Ấm"],["p","Nhà thần học R.C. Sproul dùng một hình ảnh đơn giản: đức tin giống như ngồi vào ghế. Bạn không \"cảm thấy\" ghế theo một nghĩa sâu xa nào – bạn đặt trọng lượng lên nó. Vấn đề không phải là mức độ cảm xúc của bạn khi ngồi, mà là ghế có chịu được không. Sức mạnh của đức tin không nằm trong đức tin – nó nằm trong đối tượng của đức tin."],["p","Đây là điều giải phóng: đức tin yếu đặt vào đối tượng đáng tin thì an toàn hơn đức tin mạnh đặt vào đối tượng không đáng tin. Một người run run leo lên cầu vững chắc sẽ qua sông an toàn. Một người tự tin bước lên cầu mục sẽ chìm. Vấn đề là cầu, không phải cảm giác khi bước."],["h3","IV. Khi Cảm Giác Cạn Kiệt – Đức Tin Vẫn Còn"],["p","Martin Luther gọi những giai đoạn cảm giác xa cách là \"Anfechtung\" – thử thách tâm linh. Ông mô tả những khoảnh khắc khi Thiên Chúa cảm thấy im lặng và xa vắng. Nhưng câu trả lời của ông không phải là \"cố tạo ra cảm giác tốt hơn\" – mà là \"quay lại với điều đã xảy ra, không phải điều tôi đang cảm thấy.\""],["p","Psalms là tập sách cầu nguyện trung thực nhất trong Kinh Thánh – và phần lớn trong số đó là những lời cầu nguyện của người không cảm thấy gì cả, hay cảm thấy Thiên Chúa đã quay đi. Điều đặc biệt là họ vẫn cầu nguyện. Không phải vì họ đang cảm thấy đức tin – mà vì họ đang thực hành đức tin bất kể cảm giác."],["h3","V. Trở Lại Với Tuấn – Và Định Nghĩa Mới"],["p","Câu trả lời cho Tuấn không phải là \"cố gắng cảm thấy nhiều hơn\". Câu trả lời là: đức tin không phải là cảm giác trong giai đoạn cao điểm tâm linh. Đức tin là sự tin tưởng có cơ sở đặt vào Đức Giê-su – và điều đó không thay đổi khi cảm giác thay đổi. Sự thật về những gì Đức Ki-tô đã làm không trở nên ít thật hơn khi bạn không cảm thấy nó."],["p","Điều Tuấn đang trải qua có một tên gọi: anh đang trưởng thành trong đức tin. Giai đoạn đầu của đức tin thường có nhiều cảm xúc – như tình yêu mới. Giai đoạn sâu hơn ít cảm xúc hơn nhưng bám rễ hơn – như hôn nhân lâu năm. Không phải kém hơn; sâu hơn."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Tuấn – bạn đã từng trải qua giai đoạn cảm giác đức tin cạn kiệt không? Bạn phản ứng thế nào?","Hình ảnh ghế và trọng lượng – điều đó thay đổi gì trong cách bạn nghĩ về đức tin?","Hebrews 11,1 – \"bảo đảm\" và \"bằng chứng\" – từ nào nói với bạn nhiều hơn? Tại sao?","[Nhóm nhỏ] Nếu đức tin không phải là cảm giác, điều gì là dấu hiệu cho thấy đức tin đang có mặt trong cuộc sống bạn?"]]]},{"k":"ch","l":"Phần 2 · Chương 2","t":"Ba Chiều Kích Của Đức Tin: Biết, Đồng Ý, Tin Cậy","pb":null,"b":[["q","Vì anh em được cứu độ nhờ ân sủng, thông qua đức tin. Điều này không đến từ anh em, mà là quà tặng của Thiên Chúa.","Ephesians 2,8"],["h3","I. Câu Chuyện Của Ngọc"],["story","Câu chuyện: Ngọc – 28 tuổi",["Ngọc hai mươi tám tuổi, lớn lên trong gia đình theo đạo. Cô biết giáo lý, có thể trả lời hầu hết câu hỏi về Kinh Thánh, và đồng ý với những điều đó về mặt trí tuệ. Nhưng trong một buổi tĩnh tâm, khi được hỏi: \"Bạn có thật sự tin tưởng Thiên Chúa trong tình huống hiện tại của mình không?\" – cô dừng lại.","Cô biết câu trả lời đúng là \"có\". Nhưng khi nhìn vào bên trong, cô nhận ra: cô biết về Thiên Chúa và cô đồng ý Ngài tốt lành – nhưng trong thực tế, cô đang sống như thể hoàn toàn phụ thuộc vào bản thân. \"Tôi tin bằng đầu,\" cô nói. \"Nhưng tôi không chắc tôi có tin bằng cuộc sống không.\""]],["h3","II. Ba Từ La-tinh – Ba Chiều Kích Của Đức Tin"],["p","Các nhà thần học Cải Chánh đã phân tích đức tin thành ba chiều kích bổ sung nhau, dùng ba từ La-tinh: notitia, assensus, và fiducia. Đây không phải là ba loại đức tin khác nhau – đây là ba yếu tố cần thiết của một đức tin hoàn chỉnh, như ba cạnh của một tam giác."],["box","",["<b>NOTITIA – Biết:<\/b> Hiểu biết về nội dung của những gì mình tin. Đức Giê-su là ai? Ngài đã làm gì? Tại sao điều đó quan trọng?","Đức tin không thể hoạt động trong sự trống rỗng về nhận thức. Bạn không thể tin tưởng ai đó mà bạn không biết gì về họ.","<b>ASSENSUS – Đồng Ý:<\/b> Sự đồng ý về mặt trí tuệ rằng những điều đó là thật. Không chỉ biết chúng là tuyên bố của người khác, mà xác nhận: \"Điều này là thật.\"","Cả hai đặc vụ ngồi nghe bài giảng như nhau – nhưng một người chỉ nghe như tình báo, một người gật đầu: đây là thật.","<b>FIDUCIA – Tin Cậy:<\/b> Sự tin tưởng cá nhân – bước ra khỏi biết và đồng ý để đặt bản thân mình vào. Không chỉ biết ghế chắc chắn và đồng ý ghế chắc chắn – mà ngồi xuống.","Đây là yếu tố cứu rỗi – không phải vì nó là công việc bạn làm, mà vì đây là cách bạn tiếp nhận điều đã được ban."]],["h3","III. Tại Sao Thiếu Fiducia Là Vấn Đề"],["p","James 2,19 nói một điều nghe có vẻ gây sốc: \"Anh tin rằng chỉ có một Thiên Chúa? Anh làm phải. Nhưng cả ma quỷ cũng tin như vậy, và chúng run sợ.\" Câu đó không phủ nhận tầm quan trọng của notitia và assensus – nó chỉ ra rằng chúng không đủ."],["p","Các thần linh ác trong Kinh Thánh biết Đức Giê-su là ai (Mark 1,24: \"Tôi biết ông là ai – Đấng Thánh của Thiên Chúa\"). Họ đồng ý với sự thật đó về mặt thực tế. Nhưng họ không đặt sự tin tưởng vào Ngài. Sự khác biệt không nằm ở lượng thông tin hay sự đồng ý về mặt thực tế – nó nằm ở fiducia: sự đầu phục và tin tưởng cá nhân."],["h3","IV. Đức Tin Và Sự Hiểu Biết – Không Phải Đối Địch"],["p","Một lo ngại thường gặp: \"Nếu đức tin không phải là cảm giác và cần có nội dung (notitia), thì có phải những người biết ít hơn có đức tin kém hơn không?\" Câu trả lời là không – vì đức tin không tỉ lệ với lượng kiến thức thần học. Đứa trẻ đặt tay vào tay cha khi qua đường không cần hiểu cơ học giao thông – nhưng đức tin đó là thật và đủ."],["p","Điều notitia đòi hỏi không phải là bằng thần học – mà là đủ để biết bạn đang tin vào ai và tin vào điều gì. Đức tin không phải là nhảy vào bóng tối; đó là bước vào ánh sáng đủ để nhìn thấy điểm tựa. Và điều đó có thể đơn giản hoặc phức tạp tùy người – nhưng không thể hoàn toàn trống rỗng."],["h3","V. Ngọc Và Câu Hỏi Về Fiducia"],["p","Điều Ngọc nhận ra trong buổi tĩnh tâm không phải là cô không có đức tin – mà là đức tin của cô đang dừng ở assensus mà không đi đến fiducia. Cô biết Thiên Chúa tốt lành, cô đồng ý điều đó là thật – nhưng trong thực tế cuộc sống, cô đang điều khiển mọi thứ bằng sức riêng, không đặt trọng lượng lên Ngài."],["p","Câu hỏi thực tế của fiducia không phải là \"bạn biết bao nhiêu điều về Thiên Chúa?\" mà là \"bạn có thật sự trông cậy vào Ngài không, trong tình huống cụ thể này?\" Đây là câu hỏi không thể trả lời trong trừu tượng – nó chỉ có thể được trả lời trong cuộc sống thực."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Ngọc – bạn có thấy mình ở vị trí tương tự không: biết và đồng ý, nhưng không chắc về fiducia?","Ba yếu tố notitia, assensus, fiducia – bạn thấy yếu tố nào đang thiếu hoặc yếu nhất trong đức tin của mình lúc này?","James 2,19 về ma quỷ \"cũng tin\" – câu đó gây ra phản ứng gì trong bạn?","[Nhóm nhỏ] Fiducia trong cuộc sống thực: tuần vừa rồi có tình huống nào bạn thật sự đặt trọng lượng lên Thiên Chúa, không phải chỉ vào bản thân?"]]]},{"k":"ch","l":"Phần 2 · Chương 3","t":"Đức Tin Và Sự Hoài Nghi: Không Phải Kẻ Thù","pb":null,"b":[["q","Lạy Thầy, tôi tin; nhưng xin Thầy giúp lòng tin yếu kém của tôi.","Mark 9,24"],["h3","I. Câu Chuyện Của Hà"],["story","Câu chuyện: Hà – 35 tuổi",["Hà ba mươi lăm tuổi, giáo viên, đã theo đạo được mười năm. Cô có một vấn đề không dám nói với ai trong cộng đoàn: cô hoài nghi.","Không phải hoài nghi mọi thứ – mà là những câu hỏi cứ quay lại: Tại sao Thiên Chúa để người vô tội chịu đau? Có phải Ngài thật sự nghe lời cầu nguyện không, hay chỉ là tâm lý tự an ủi? Những câu hỏi đó không biến đi sau mười năm – chúng chỉ bị đẩy xuống sâu hơn.","Cô sợ nói ra vì cô nghĩ: \"Người tin thật thì không hoài nghi.\""]],["h3","II. Mark 9,24 – Lời Cầu Nguyện Thành Thật Nhất Trong Kinh Thánh"],["p","\"Lạy Thầy, tôi tin; nhưng xin Thầy giúp lòng tin yếu kém của tôi.\" Người nói câu đó là cha của một đứa trẻ bị quỷ ám – đang đứng trước Đức Giê-su và đang ở trong tình trạng tuyệt vọng nhất cuộc đời. Câu cầu nguyện của ông là mâu thuẫn được diễn đạt thành lời: \"Tôi tin\" – và ngay lập tức thêm – \"nhưng đức tin tôi không đủ. Xin giúp.\""],["p","Đức Giê-su không từ chối giúp ông vì ông hoài nghi. Ngài không nói: \"Hãy đi về và tin đủ rồi hãy quay lại.\" Ngài chữa lành đứa trẻ. Đức tin không hoàn hảo cộng với sự thành thật về giới hạn của nó là đủ. Đây là một trong những đoạn Kinh Thánh quan trọng nhất cho những người đang vật lộn với nghi ngờ."],["h3","III. Hoài Nghi Thật Và Hoài Nghi Giả"],["p","Không phải mọi hoài nghi đều giống nhau. Có sự khác biệt quan trọng giữa hoài nghi trí tuệ và hoài nghi đạo đức – và giữa hoài nghi tìm kiếm câu trả lời và hoài nghi tìm kiếm cái cớ."],["box","",["<b>Hoài nghi trí tuệ (Intellectual Doubt):<\/b> \"Tôi không hiểu tại sao điều này là thật. Tôi muốn hiểu.\" – Câu hỏi xuất phát từ sự muốn biết thật sự. Kinh Thánh không sợ những câu hỏi này.","<b>Hoài nghi ý chí (Volitional Doubt):<\/b> \"Tôi không muốn điều này là thật vì nếu thật, nó đòi hỏi điều gì đó từ tôi.\" – Đây không phải là vấn đề nhận thức; đây là vấn đề ý muốn. Trả lời thêm thông tin sẽ không giải quyết được.","<b>Nguyên tắc:<\/b> Thiên Chúa không sợ câu hỏi thật. Nhưng có những câu hỏi không phải là câu hỏi – chúng là cái cớ. Sự phân biệt đó nằm ở: bạn có sẵn sàng thay đổi nếu tìm thấy câu trả lời không?"]],["h3","IV. Thomas – Hình Mẫu Của Hoài Nghi Được Đón Nhận"],["p","Thomas – Tông đồ hay bị gọi là \"người nghi ngờ\" – thật ra là hình mẫu quan trọng nhất trong Kinh Thánh về cách Đức Giê-su xử lý sự hoài nghi. Khi Thomas từ chối tin vào Phục Sinh mà không thấy (John 20,25: \"Nếu tôi không nhìn thấy dấu đinh... tôi không tin\"), Đức Giê-su không loại ông ra."],["p","Tám ngày sau, Đức Giê-su trở lại – và đặc biệt quay sang Thomas trước tiên (John 20,27): \"Hãy đặt ngón tay vào đây... đừng cứng lòng nữa, nhưng hãy tin.\" Câu trả lời của Thomas khi đó là tuyên bố đức tin mạnh nhất trong tất cả bốn Phúc Âm: \"Lạy Chúa của tôi, lạy Thiên Chúa của tôi!\" Sự hoài nghi thành thật, khi được mang đến Đức Giê-su, dẫn đến đức tin sâu nhất."],["h3","V. Hà Và Sự Tự Do Để Đặt Câu Hỏi"],["p","Điều Hà cần nghe không phải là \"người tin thật thì không hoài nghi\". Điều đó không đúng với Kinh Thánh và không đúng với lịch sử đức tin. Hầu hết mọi người trong Kinh Thánh – Moses, Elijah, David, Thomas, thậm chí Gioan Tẩy Giả trong ngục tù – đều có những khoảnh khắc nghi ngờ và đặt câu hỏi. Và Thiên Chúa không từ bỏ họ trong những khoảnh khắc đó."],["p","Sự hoài nghi được mang thẳng đến Thiên Chúa – được cầu nguyện thành lời, được tìm kiếm câu trả lời trong Kinh Thánh và cộng đoàn – là dạng hoài nghi dẫn đến đức tin sâu hơn. Điều nguy hiểm không phải là hoài nghi. Điều nguy hiểm là hoài nghi bị đẩy xuống đất và giả vờ không tồn tại, cho đến khi một ngày nó nổ ra không thể kiểm soát."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Hà – bạn có câu hỏi nào đang bị đẩy xuống vì sợ rằng \"người tin thật không được nghi ngờ\" không?","Mark 9,24 – \"Tôi tin; nhưng xin giúp lòng tin yếu kém\" – bạn đã từng cầu nguyện kiểu đó chưa? Cảm giác thế nào?","Sự khác biệt giữa hoài nghi trí tuệ và hoài nghi ý chí – bạn nhận ra mình đang ở đâu khi đặt câu hỏi về đức tin?","[Nhóm nhỏ] Câu hỏi khó nhất mà bạn có về đức tin hiện tại là gì? Bạn đang mang nó đến đâu?"]]]},{"k":"ch","l":"Phần 2 · Chương 4","t":"Đức Tin Và Việc Làm: Không Phải Hoặc Là","pb":null,"b":[["q","Đức tin không có việc làm là đức tin chết.","James 2,26"],["h3","I. Câu Chuyện Của Kiên"],["story","Câu chuyện: Kiên – 40 tuổi",["Kiên bốn mươi tuổi, đọc Phao-lô và Luther về đức tin và ân sủng – và cảm thấy được giải phóng thật sự. Anh hiểu: không phải bởi việc làm, mà bởi đức tin. Không cần kiếm. Không cần chứng minh.","Nhưng rồi anh đọc James 2 và thấy bối rối: \"Đức tin không có việc làm là đức tin chết\". Anh mang câu hỏi đến nhóm nhỏ: \"Phao-lô và James có mâu thuẫn với nhau không? Và nếu việc làm quan trọng, thì đức tin thôi chưa đủ sao?\""]],["h3","II. Hai Câu Hỏi Khác Nhau"],["p","Câu trả lời cho sự bối rối của Kiên bắt đầu bằng nhận ra rằng Phao-lô và James đang trả lời hai câu hỏi khác nhau. Phao-lô trong Romans và Galatians đang trả lời: \"Làm sao người tội lỗi được đứng vững trước mặt Thiên Chúa công bình?\" Câu trả lời: bởi đức tin, không phải việc làm. Không ai có thể kiếm sự chấp nhận của Thiên Chúa bằng thành tích."],["p","James đang trả lời một câu hỏi khác: \"Làm sao phân biệt đức tin thật với đức tin giả?\" Câu trả lời: đức tin thật tạo ra việc làm – như cái cây thật tạo ra trái. Không ai trồng trái để làm cây trở thành cây thật – trái là bằng chứng rằng cây đã là cây thật rồi. Tương tự, việc làm không làm cho bạn được cứu; việc làm là bằng chứng rằng sự cứu rỗi đã thật sự xảy ra."],["box","",["<b>Phao-lô trả lời câu hỏi về:<\/b> \"Làm sao được xưng công chính trước mặt Thiên Chúa?\" – Bởi đức tin, không phải việc làm (Romans 3,28; Galatians 2,16)","<b>James trả lời câu hỏi về:<\/b> \"Làm sao phân biệt đức tin thật với đức tin giả?\" – Bởi việc làm. Đức tin không có việc làm là đức tin chết – nó không phải đức tin thật (James 2,17-18)","<b>Kết luận:<\/b> Chúng ta được cứu BỞI đức tin – không phải BỞI việc làm. Nhưng đức tin thật LUÔN TẠO RA việc làm, như nguyên nhân tạo ra kết quả. Việc làm là trái, không phải rễ."]],["h3","III. Abraham – Ví Dụ Cả Hai Người Dùng"],["p","Điều thú vị là cả Phao-lô (Romans 4) và James (James 2,21-23) đều dùng Abraham làm ví dụ – nhưng dùng theo hai cách khác nhau. Phao-lô nhấn mạnh: Abraham được kể là công chính TRƯỚC khi chịu cắt bì – bởi đức tin, không phải nghi lễ hay công việc. James nhấn mạnh: đức tin của Abraham trở nên hoàn hảo qua hành động – khi ông sẵn lòng dâng Isaac."],["p","Hai điều đó không mâu thuẫn khi nhìn theo thứ tự: Abraham được xưng công chính bởi đức tin (Genesis 15) – và đức tin đó sau đó bày tỏ ra qua hành động (Genesis 22). Hành động trong Genesis 22 không cứu ông; nó chứng minh rằng đức tin trong Genesis 15 là thật. Trình tự đó quan trọng: đức tin trước, việc làm sau."],["h3","IV. Đức Tin Như Là Gốc Rễ – Việc Làm Như Là Trái"],["p","Martin Luther dùng hình ảnh cây táo: cây táo tốt không cần ép buộc để ra quả táo ngon. Nếu cây táo tốt thì nó tự nhiên ra quả tốt. Và ngược lại, bạn không làm cho cây táo trở nên tốt bằng cách treo quả táo bên ngoài. Đức tin không tạo ra việc làm theo nghĩa nghĩa vụ – nó tạo ra việc làm theo nghĩa bản chất."],["p","Đây là lý do Ephesians 2 đặt cả hai điều cạnh nhau mà không mâu thuẫn: câu 8-9 nói \"bởi ân sủng qua đức tin – không phải việc làm\"; câu 10 ngay sau đó nói \"vì chúng ta là công trình của Thiên Chúa, được tạo dựng trong Đức Ki-tô Giê-su để làm những việc lành mà Thiên Chúa đã chuẩn bị sẵn cho chúng ta.\" Không mâu thuẫn – mà là trình tự: ân sủng → đức tin → việc làm."],["h3","V. Trả Lời Kiên – Và Câu Hỏi Thực Tế"],["p","Kiên không cần chọn giữa Phao-lô và James. Ông cần hiểu rằng họ đang nhìn cùng một thực tại từ hai góc độ khác nhau. Và câu hỏi thực tế không phải là \"đức tin hay việc làm?\" – mà là: \"Việc làm trong đời sống tôi đang xuất phát từ đâu? Từ nỗ lực kiếm sự chấp thuận, hay từ sự biết ơn vì đã được chấp thuận rồi?\""],["p","Đây là điểm mà Chính đề 18 kết nối trở lại với Chính đề 17: việc làm xuất phát từ ân sủng là việc làm tự do. Việc làm xuất phát từ nỗ lực kiếm ân sủng là việc làm kiệt sức. Cùng hành động – nhưng từ nguồn khác nhau, với kết quả khác nhau về mặt tâm linh và cảm xúc."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Kiên – bạn đã từng bối rối trước sự khác biệt giữa Phao-lô và James về đức tin và việc làm không?","Hình ảnh cây táo của Luther – \"đức tin là gốc rễ, việc làm là trái\" – điều đó thay đổi gì trong cách bạn nhìn việc làm lành?","Ephesians 2,8-10 – cả hai câu đặt cạnh nhau – điều đó giúp bạn giải quyết sự căng thẳng giữa ân sủng và trách nhiệm như thế nào?","[Nhóm nhỏ] Việc làm lành trong cuộc sống bạn hiện tại đang xuất phát từ nghĩa vụ hay từ lòng biết ơn? Làm sao bạn biết?"]]]},{"k":"ch","l":"Phần 2 · Chương 5","t":"Nuôi Dưỡng Đức Tin: Không Phải Tự Nhiên Lớn","pb":null,"b":[["q","Hãy đến gần Thiên Chúa, Thiên Chúa sẽ đến gần anh em.","James 4,8"],["h3","I. Câu Chuyện Của Mai"],["story","Câu chuyện: Mai – 32 tuổi",["Mai ba mươi hai tuổi, đã tin vào Đức Giê-su sau một trải nghiệm rất rõ ràng bốn năm trước. Nhưng trong một cuộc trò chuyện thành thật với người bạn tâm linh, cô thừa nhận: đức tin của cô không lớn lên trong bốn năm đó. Nó chỉ... tồn tại.","Cô vẫn tin những điều cô đã tin. Cô vẫn đi nhà thờ, đọc Kinh Thánh, và cầu nguyện – nhưng theo thói quen, không phải vì đang lớn lên. \"Tôi cảm thấy như mình đang giẫm nước,\" cô nói. \"Không tiến, không lùi. Chỉ duy trì.\"","Câu hỏi cô đặt ra: \"Đức tin có tự nhiên lớn không? Hay tôi phải làm gì đó?\""]],["h3","II. Đức Tin Như Là Sinh Vật Sống"],["p","Hình ảnh Kinh Thánh về đức tin không phải là vật vô tri – như đá hay đồng tiền bạn cất đi và nó vẫn ở đó sau mười năm. Hình ảnh Kinh Thánh về đức tin thường là sinh vật sống: cây lớn từ hạt nhỏ (Matthew 13,31-32), ngọn lửa cần được thổi bùng lên (2 Timothy 1,6), trẻ sơ sinh cần sữa để lớn (1 Peter 2,2)."],["p","Sinh vật sống cần được nuôi dưỡng. Không phải vì nuôi dưỡng làm cho nó trở nên sống – nó đã sống rồi. Nhưng vì thiếu nuôi dưỡng, nó suy yếu và teo lại. Điều này không mâu thuẫn với ân sủng: Đức Thánh Linh là Đấng làm cho đức tin lớn – nhưng Ngài thường làm điều đó qua các phương tiện mà chúng ta mở ra."],["h3","III. Năm Phương Tiện Nuôi Dưỡng Đức Tin"],["box","",["<b>1. Kinh Thánh – Lời Nuôi Dưỡng Đức Tin:<\/b> Romans 10,17: \"Đức tin đến từ việc nghe, và nghe là nghe lời Đức Ki-tô.\" Kinh Thánh không chỉ cung cấp thông tin – nó là phương tiện Đức Thánh Linh dùng để tạo ra và nuôi dưỡng đức tin. Không phải đọc như sách giáo khoa, mà đọc như người đang được Thiên Chúa nói chuyện.","<b>2. Cầu Nguyện – Cuộc Đối Thoại Nuôi Dưỡng Tương Quan:<\/b> Đức tin không lớn trong im lặng một chiều. Cầu nguyện – kể cả cầu nguyện khô khan, cầu nguyện nghi ngờ, cầu nguyện không biết nói gì – là hành động duy trì và nuôi dưỡng tương quan. Một mối quan hệ không được giao tiếp sẽ teo lại.","<b>3. Cộng Đoàn – Không Ai Lớn Lên Một Mình:<\/b> Hebrews 10,24-25: \"Hãy để ý đến nhau hầu khích lệ nhau trong đức ái và việc lành. Đừng bỏ việc họp nhau lại.\" Đức tin cần ma sát lành mạnh của cộng đoàn – được nhìn thấy, được nhắc nhở, được giữ trách nhiệm, được đồng hành trong khó khăn.","<b>4. Các Bí Tích / Nghi Lễ – Ân Sủng Nhìn Thấy Được:<\/b> Thánh Lễ và Phép Rửa là những điểm Thiên Chúa đã hứa gặp gỡ dân Ngài theo cách đặc biệt. Chúng không kiếm ân sủng – nhưng chúng là những nơi Ngài đã cam kết ban ân sủng. Bỏ qua chúng là bỏ qua phương tiện mà Ngài đã đặt sẵn.","<b>5. Thực Hành Đức Tin Trong Hoàn Cảnh Cụ Thể:<\/b> Đức tin lớn qua việc được tập thực hành. Mỗi lần bạn chọn tin tưởng Thiên Chúa trong một hoàn cảnh cụ thể – thay vì lo lắng hay kiểm soát – đức tin của bạn trở nên mạnh hơn một chút. Đây là nghịch lý: đức tin lớn hơn bằng cách được thực hành, không chỉ được suy nghĩ về."]],["h3","IV. Tăng Trưởng Không Phải Là Tuyến Tính"],["p","Một điều quan trọng cần hiểu: tăng trưởng trong đức tin không phải luôn luôn cảm thấy như tăng trưởng. Có những giai đoạn khô khan mà về sau nhìn lại mới thấy đó là thời kỳ rễ đang đâm sâu hơn. Có những giai đoạn khủng hoảng làm tan vỡ đức tin giả và làm nền tảng trở nên vững hơn."],["p","John of the Cross gọi những giai đoạn khô khan tâm linh là \"đêm tối của linh hồn\" – không phải là bằng chứng của việc Thiên Chúa rời đi, mà là quá trình Ngài đào sâu hơn. Điều quan trọng trong những giai đoạn đó không phải là cảm thấy tăng trưởng – mà là tiếp tục mở ra với các phương tiện ân sủng, dù không cảm thấy gì."],["h3","V. Câu Trả Lời Cho Mai – Và Tổng Kết Chính Đề 18"],["p","Câu trả lời cho Mai là: cả hai. Đức tin có tự nhiên lớn – nhưng không phải trong sự thụ động hoàn toàn. Nó lớn khi bạn mở ra với những phương tiện mà Đức Thánh Linh dùng. Không phải vì những hành động đó kiếm được sự tăng trưởng – mà vì chúng là những kênh Ngài đã hứa dùng."],["p","Và đây là điểm kết nối toàn bộ Chính đề 18 với Chính đề 17: đức tin không phải là nỗ lực thêm vào ân sủng. Đức tin là cách tay được mở ra để nhận quà tặng đã được đặt xuống. Và nuôi dưỡng đức tin không phải là kiếm thêm ân sủng – mà là giữ cho tay đó mở ra, mỗi ngày."],["sum","TỔNG KẾT CHÍNH ĐỀ 18 – Đức Tin: Tin Là Gì – Và Tin Như Thế Nào?",["<b>Chương 1: <\/b>Đức tin không phải là cảm giác – mà là sự tin tưởng có cơ sở đặt vào đối tượng đáng tin cậy. Sức mạnh của đức tin không nằm trong đức tin; nó nằm trong Đấng được tin.","<b>Chương 2: <\/b>Đức tin có ba chiều kích: notitia (biết), assensus (đồng ý), fiducia (tin cậy). Chỉ biết và đồng ý chưa đủ – fiducia là đặt trọng lượng bản thân vào điều đó.","<b>Chương 3: <\/b>Hoài nghi không phải là kẻ thù của đức tin – hoài nghi thành thật mang đến Thiên Chúa dẫn đến đức tin sâu hơn. Điều nguy hiểm là hoài nghi bị che giấu, không phải hoài nghi được đặt câu hỏi.","<b>Chương 4: <\/b>Đức tin và việc làm không mâu thuẫn – Phao-lô và James trả lời hai câu hỏi khác nhau. Chúng ta được cứu bởi đức tin; đức tin thật tạo ra việc làm như cây tạo ra trái.","<b>Chương 5: <\/b>Đức tin cần được nuôi dưỡng qua Kinh Thánh, cầu nguyện, cộng đoàn, các bí tích, và thực hành. Không phải để kiếm ân sủng – mà để giữ cho tay mở ra đón nhận điều đã được ban."]],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Mai – \"đức tin đang giẫm nước\" – bạn có nhận ra giai đoạn tương tự trong đời sống tâm linh của mình không?","Năm phương tiện nuôi dưỡng đức tin – bạn đang thực hành đều đặn điều nào? Điều nào đang bị bỏ qua?","Tăng trưởng không tuyến tính – \"đêm tối linh hồn\" – điều đó giúp bạn nhìn lại giai đoạn khó khăn trong quá khứ như thế nào?","[Nhóm nhỏ] Nhìn lại toàn bộ Chính đề 18: điều nào thay đổi nhiều nhất trong cách bạn hiểu đức tin là gì và đức tin hoạt động như thế nào?","[Nhóm nhỏ] Câu hỏi mở ra cho Chính đề 19: nếu đức tin là cách nhận ân sủng – Thiên Chúa tuyên bố điều gì về người có đức tin đó?"]]]},{"k":"front","l":"Phần 3 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 3","SỰ XƯNG CÔNG CHÍNH","Thiên Chúa Tuyên Bố Điều Gì?"],"b":[["p","Chính đề 17 đã nói về Tin Mừng – điều đã xảy ra cho chúng ta. Chính đề 18 đã nói về đức tin – cách chúng ta nhận lấy điều đó. Chính đề 19 hỏi câu hỏi tiếp theo, cụ thể và cá nhân hơn: khi một người tin vào Đức Giê-su Ki-tô, Thiên Chúa tuyên bố điều gì về người đó?"],["p","Câu trả lời của Kinh Thánh là một từ – sự xưng công chính (justification) – và từ này có lẽ là từ thần học quan trọng nhất trong Tân Ước. Hiểu sai nó, và toàn bộ đời sống Ki-tô hữu có thể lệch khỏi trục. Hiểu đúng nó, và nhiều thứ đột nhiên trở nên rõ ràng – lý do tại sao người tin có thể đến với Thiên Chúa không phải qua công lao mà qua ân sủng, lý do tại sao không còn án phạt, và lý do tại sao sự chắc chắn về ơn cứu độ không phải là kiêu ngạo mà là đức tin."]]},{"k":"ch","l":"Phần 3 · Chương 1","t":"\"Được Xưng Công Chính\" Nghĩa Là Gì?","pb":null,"b":[["q","Vậy, khi đã được nên công chính nhờ đức tin, chúng ta được bình an với Thiên Chúa, nhờ Đức Giê-su Ki-tô, Chúa chúng ta.","Romans 5,1"],["h3","I. Câu Chuyện Của Bảo"],["story","Câu chuyện: Bảo – 38 tuổi",["Bảo ba mươi tám tuổi, là kỹ sư, đã tin vào Đức Giê-su được bảy năm. Anh hiểu ân sủng về mặt lý thuyết – nhưng trong thực tế, anh mô tả đời sống đức tin của mình như một cuộc kiểm tra liên tục.","\"Mỗi khi thất bại – nổi giận với vợ, nói dối nhỏ trong công việc, bỏ qua ngày đọc Kinh Thánh – tôi cảm thấy như mình đang rớt xuống một bậc trong mắt Thiên Chúa. Và phải làm gì đó để leo lên lại.\"","Người hướng dẫn tâm linh của anh hỏi: \"Bảo nghĩ vị trí của mình trước mặt Thiên Chúa được quyết định bởi điều gì – bởi hành vi hôm nay, hay bởi điều đã xảy ra tại Thập Giá?\""]],["h3","II. \"Dikaioo\" – Từ Pháp Lý"],["p","Từ Hy-lạp được dịch là \"xưng công chính\" hay \"được nên công chính\" là \"dikaioo\" – từ thế giới pháp lý. Trong hệ thống tư pháp Hy-Lạp-La Mã, \"dikaioo\" là hành động của thẩm phán tuyên bố bị cáo trắng án – không có tội. Đây không phải là mô tả về tình trạng đạo đức của người đó (họ có thực sự tốt không), mà là tuyên bố về địa vị pháp lý của họ trước tòa (họ được tuyên là vô tội)."],["p","Điều này cực kỳ quan trọng: sự xưng công chính không phải là Thiên Chúa làm cho bạn trở nên công chính theo nghĩa đạo đức ngay lập tức. Đó là Thiên Chúa tuyên bố bạn đứng trong địa vị công chính trước mặt Ngài – dựa trên điều Đức Ki-tô đã làm, không phải dựa trên điều bạn đang là hay đang làm. Đây là phân biệt giữa sự xưng công chính (justification) và sự thánh hóa (sanctification) – hai điều thật sự, hai điều cần thiết, nhưng không phải một."],["box","Phân biệt nền tảng:",["<b>SỰ XƯNG CÔNG CHÍNH (Justification):<\/b>","– Thiên Chúa TUYỆN BỐ bạn công chính – sự kiện một lần, đã hoàn thành","– Dựa trên sự công chính của Đức Ki-tô được quy kết cho bạn","– Không thay đổi theo hành vi hàng ngày – đây là địa vị cố định","– Romans 8,1: \"Không còn án phạt nào cho những ai ở trong Đức Ki-tô\"","<b>SỰ THÁNH HÓA (Sanctification):<\/b>","– Đức Thánh Linh BIẾN ĐỔI bạn trở nên công chính – quá trình liên tục, suốt đời","– Dựa trên sự hiện diện và công việc của Đức Thánh Linh trong bạn","– Có thăng trầm, có tiến bộ và thất bại","– Philippians 1,6: \"Ngài sẽ đưa công việc tốt lành đó đến chỗ hoàn thành\"","Cả hai đều thật, cả hai đều cần thiết. Nhưng không được lẫn lộn."]],["h3","III. Không Phải \"Làm Cho Trở Nên\" – Mà Là \"Tuyên Bố Là\""],["p","Đây là điểm mà nhiều người hiểu sai và gây ra rất nhiều lo lắng tâm linh không cần thiết. Nếu sự xưng công chính là tiến trình Thiên Chúa dần dần làm cho bạn trở nên công chính, thì câu hỏi luôn còn đó: \"Tôi có đã đủ công chính chưa? Tôi có đang tiến triển đủ không?\" Vòng lặp kiệt sức mà Bảo mô tả là hệ quả tự nhiên của cách hiểu sai đó."],["p","Nhưng nếu sự xưng công chính là tuyên bố pháp lý một lần – xảy ra tại khoảnh khắc đức tin – thì câu hỏi không còn là \"tôi có đủ công chính không?\" mà là \"Đức Ki-tô có đủ công chính không?\" Và câu trả lời cho câu hỏi thứ hai là: có, hoàn toàn và vĩnh viễn. Đó là nền tảng mà người tin đứng trên – không phải thành tích của họ, mà là thành tích của Đức Ki-tô."],["h3","IV. Romans 5,1 – Ba Điều Đến Theo"],["p","Romans 5,1 đặt tuyên bố \"đã được nên công chính nhờ đức tin\" và ngay lập tức liệt kê những điều đến theo: bình an với Thiên Chúa, được vào trong ân sủng, và có niềm hy vọng. Cả ba đều là kết quả của một sự kiện đã xảy ra – không phải điều đang được xây dựng dần dần."],["p","\"Bình an với Thiên Chúa\" (Romans 5,1) không phải là cảm giác bình an – đây là trạng thái hết thù nghịch. Người được xưng công chính không còn đứng trong tư thế kẻ thù trước mặt Thiên Chúa; họ đứng trong tư thế người được hòa giải. Điều đó không thay đổi khi họ thất bại trong ngày hôm đó – vì nó không dựa trên hành vi của ngày hôm đó."],["h3","V. Câu Trả Lời Cho Bảo"],["p","Câu hỏi người hướng dẫn tâm linh hỏi Bảo là câu hỏi trung tâm: vị trí của anh trước mặt Thiên Chúa được quyết định bởi điều gì? Nếu câu trả lời là \"hành vi hôm nay\" – thì Bảo sẽ mãi mãi leo lên và rớt xuống theo vòng lặp kiệt sức. Nếu câu trả lời là \"điều đã xảy ra tại Thập Giá\" – thì vị trí đó cố định, an toàn, và không phụ thuộc vào ngày hôm đó anh có đọc Kinh Thánh hay không."],["p","Điều này không có nghĩa là hành vi không quan trọng – hành vi quan trọng, và đó là lĩnh vực của sự thánh hóa. Nhưng hành vi không xác định địa vị. Địa vị xác định hành vi – bởi vì người biết mình đứng vững trong ân sủng có nền tảng để lớn lên, thay vì phải leo lên liên tục để không rớt xuống."],["refl","CÂU HỎI SUY NGẪM — Chương 1",["Câu chuyện của Bảo – vòng lặp leo lên và rớt xuống theo hành vi – bạn có nhận ra điều đó trong đời sống đức tin của mình không?","Phân biệt giữa \"được tuyên bố công chính\" và \"được làm cho trở nên công chính\" – điều đó mới hay quen thuộc với bạn? Nó thay đổi điều gì?","\"Bình an với Thiên Chúa\" là trạng thái, không phải cảm giác – điều đó có nghĩa gì với bạn vào những ngày bạn không cảm thấy bình an?","[Nhóm nhỏ] Câu hỏi của người hướng dẫn tâm linh của Bảo – vị trí của bạn trước mặt Thiên Chúa được quyết định bởi điều gì? – nhóm trả lời thế nào?"]]]},{"k":"ch","l":"Phần 3 · Chương 2","t":"Sự Công Chính Quy Kết: Điều Không Thể Kiếm Được","pb":null,"b":[["q","Abraham tin vào Thiên Chúa, và điều đó được kể cho ông là sự công chính.","Romans 4,3 (trích dẫn Genesis 15,6)"],["h3","I. Câu Chuyện Của Linh"],["story","Câu chuyện: Linh – 30 tuổi",["Linh ba mươi tuổi, lớn lên trong môi trường Tin Lành và đã nghe về \"sự công chính của Đức Ki-tô\" từ nhỏ. Nhưng trong một buổi học nhóm, một câu hỏi làm cô dừng lại:","\"Nếu Đức Ki-tô công chính và sự công chính đó được quy kết cho tôi – thì Thiên Chúa có đang \"giả vờ\" tôi công chính không? Điều đó có phải là không trung thực không?\"","Câu hỏi đó, cô nhớ lại, là câu hỏi nghiêm túc nhất cô từng đặt ra về đức tin – vì nó chạm vào bản chất của những gì cô thật sự tin."]],["h3","II. \"Được Quy Kết\" – Logizesthai"],["p","Từ Hy-lạp trong Romans 4,3-5 là \"logizomai\" – từ kế toán, có nghĩa là ghi vào sổ, tính vào tài khoản. Khi Kinh Thánh nói đức tin của Abraham \"được kể là sự công chính\" – đây là ngôn ngữ kế toán: Thiên Chúa ghi vào sổ bên \"có\" của Abraham điều không thuộc về Abraham theo công lao, mà thuộc về Đức Ki-tô."],["p","Điều này không phải là giả vờ hay kế toán giả mạo. 2 Corinthians 5,21 cho thấy điều này có cơ sở thực tế: \"Đấng chẳng hề biết tội lỗi, thì Thiên Chúa đã làm cho Người trở thành hiện thân của tội lỗi vì chúng ta, để nhờ Người chúng ta được trở nên sự công chính của Thiên Chúa.\" Sự trao đổi là thật – tội lỗi của chúng ta được đặt thật sự lên Đức Ki-tô tại Thập Giá, và sự công chính của Ngài được ghi vào tài khoản của người tin thật sự. Không phải giả vờ; đây là giao dịch có nền tảng thật."],["h3","III. Abraham – Mẫu Mực Của Sự Xưng Công Chính Bởi Đức Tin"],["p","Romans 4 là chương Phao-lô dành để lập luận từ lịch sử Cựu Ước rằng sự xưng công chính bởi đức tin không phải là ý tưởng mới của Tin Mừng – mà là cách Thiên Chúa luôn luôn hoạt động. Abraham được xưng công chính trong Genesis 15 – bởi đức tin vào lời hứa Thiên Chúa – trước khi ông chịu cắt bì (Genesis 17) và trước khi Lề Luật Mosaic được ban (Exodus 20). Điều đó nghĩa là: cắt bì và Lề Luật không phải là nền tảng của sự xưng công chính của Abraham; đức tin là."],["p","Phao-lô rút ra hệ quả rõ ràng: nếu ngay cả người cha của giao ước được xưng công chính bởi đức tin chứ không phải bởi nghi lễ hay Lề Luật, thì mọi lập luận rằng người ta cần thêm điều gì ngoài đức tin đều đi ngược lại chính lịch sử Kinh Thánh Cựu Ước."],["box","Romans 4 – Tại sao Abraham là ví dụ quyết định:",["Genesis 15,6: Abraham tin Thiên Chúa → được kể là công chính","Genesis 17: Abraham chịu cắt bì → 14 năm sau Genesis 15","Exodus 20: Lề Luật Mosaic được ban → 430 năm sau Abraham (Galatians 3,17)","Trình tự đó nói gì?","– Sự công chính đến TRƯỚC cắt bì → nghi lễ không phải nền tảng","– Sự công chính đến TRƯỚC Lề Luật → việc giữ Luật không phải nền tảng","– Nền tảng duy nhất: đức tin vào lời hứa của Thiên Chúa","Kết luận: Tin Mừng không phải là giao ước mới thay thế giao ước Cựu Ước.","Đây là sự hoàn thành của điều Abraham đã sống theo từ đầu."]],["h3","IV. \"Cho Kẻ Không Làm Gì\" – Câu Kinh Thánh Khó Nghe Nhất"],["p","Romans 4,5 có lẽ là câu thách thức nhất trong thư Romans: \"Nhưng với kẻ không làm gì, mà chỉ tin vào Đấng làm cho kẻ vô đạo được nên công chính, thì lòng tin của người đó được kể là sự công chính.\" Hai điều gây khó chịu: \"kẻ không làm gì\" – đức tin không phải là công việc để kiếm sự công chính, và \"kẻ vô đạo\" – đây không phải là người tốt đẹp được Thiên Chúa chấp nhận thêm; đây là kẻ vô đạo được Thiên Chúa tuyên bố công chính dựa trên đức tin vào Đức Ki-tô."],["p","Câu này không nói đạo đức không quan trọng. Câu này nói rằng đạo đức của bạn không phải là căn cứ của sự xưng công chính. Căn cứ duy nhất là điều Đức Ki-tô đã làm – và điều đó được nhận lấy bởi đức tin, không phải bởi thành tích."],["h3","V. Trả Lời Câu Hỏi Của Linh"],["p","Câu hỏi của Linh – \"Thiên Chúa có đang giả vờ không?\" – nhận được câu trả lời từ 2 Corinthians 5,21. Sự quy kết không phải là kế toán giả mạo vì nó có nền tảng thật: Đức Ki-tô thật sự gánh tội lỗi của chúng ta. Sự trao đổi là thật – và vì thế khi Thiên Chúa tuyên bố người tin là công chính, Ngài không nói điều không thật. Ngài đang tuyên bố điều thật về địa vị của người đó trong Đức Ki-tô – sự công chính của Đức Ki-tô, được ghi vào tài khoản của người đó qua sự hợp nhất với Ngài bởi đức tin."],["refl","CÂU HỎI SUY NGẪM — Chương 2",["Câu hỏi của Linh – \"Thiên Chúa có đang giả vờ không?\" – câu trả lời từ chương này có thuyết phục bạn không? Còn điều gì bạn chưa chắc?","Hình ảnh kế toán và ghi sổ – \"logizomai\" – điều đó giúp bạn hiểu sự xưng công chính như thế nào?","Trình tự Abraham: đức tin trước nghi lễ và Lề Luật – điều đó nói gì với bạn về cách Thiên Chúa luôn hoạt động?","Romans 4,5 – \"kẻ không làm gì\" và \"kẻ vô đạo\" – câu đó gây phản ứng gì trong bạn? Khó chịu, giải phóng, hay cả hai?","[Nhóm nhỏ] Nếu sự công chính không thể được kiếm, tại sao nhiều người Ki-tô hữu vẫn sống như thể đang cố kiếm nó?"]]]},{"k":"ch","l":"Phần 3 · Chương 3","t":"Không Còn Án Phạt: Romans 8 Và Sự Chắc Chắn","pb":null,"b":[["q","Vậy, hiện nay không còn án phạt nào cho những ai sống trong Đức Ki-tô Giê-su.","Romans 8,1"],["h3","I. Câu Chuyện Của Thư"],["story","Câu chuyện: Thư – 44 tuổi",["Thư bốn mươi bốn tuổi, đã là người tin hai mươi năm. Cô biết nhiều Kinh Thánh, phục vụ đều đặn, và được coi là người trưởng thành trong đức tin trong cộng đoàn.","Nhưng trong một buổi tĩnh tâm kéo dài, khi được hỏi \"Khi bạn nghĩ đến Thiên Chúa, điều đầu tiên xuất hiện trong đầu bạn là gì?\" – Thư thành thật: \"Tôi sợ.\"","Không phải sợ theo nghĩa kính sợ thánh thiện. Mà là sợ rằng mình không đủ, sợ rằng lần thất bại tiếp theo sẽ là giọt nước tràn ly. Sau hai mươi năm, nỗi sợ đó vẫn còn đó – giấu dưới lớp hoạt động tôn giáo bận rộn."]],["h3","II. Romans 8,1 – Câu Không Có Điều Kiện"],["p","Romans 8,1 trong nguyên văn Hy-lạp không có bất kỳ điều kiện nào được thêm vào: \"Không còn án phạt nào (ouden katakrima) cho những ai ở trong Đức Ki-tô Giê-su.\" Không phải \"không còn án phạt nếu bạn sống đúng\", không phải \"không còn án phạt miễn là bạn không phạm tội nghiêm trọng\". Tuyên bố đó tuyệt đối và không có điều kiện – nền tảng của nó là vị trí \"trong Đức Ki-tô\", không phải thành tích của người đó."],["p","Đây là câu kết thúc tự nhiên của lập luận suốt bảy chương trước đó trong thư Romans. Phao-lô đã lập luận dài về tội lỗi, về sự chết, về Lề Luật, về đức tin – và tất cả dẫn đến tuyên bố này: với người ở trong Đức Ki-tô, án đã được tháo gỡ. Không phải bị hoãn lại. Không phải có điều kiện. Đã tháo gỡ."],["h3","III. \"Katakrima\" – Không Phải Cảm Giác Tội Lỗi"],["p","Từ Hy-lạp \"katakrima\" không có nghĩa là cảm giác tội lỗi chủ quan – nó có nghĩa là bản án, phán quyết có tội từ tòa án. Romans 8,1 không nói \"bạn sẽ không còn cảm thấy tội lỗi\" – người tin vẫn có thể cảm thấy tội lỗi, và đôi khi đó là điều đúng và cần thiết. Câu này nói rằng bản án pháp lý đã được tháo gỡ."],["p","Sự phân biệt đó quan trọng về mặt thực tế: khi bạn phạm lỗi và cảm thấy tội lỗi, đó có thể là Đức Thánh Linh đang thuyết phục bạn về tội lỗi để dẫn đến sự ăn năn và phục hồi. Nhưng đó không phải là bằng chứng rằng bản án đã quay trở lại. Cảm giác tội lỗi và bản án là hai điều khác nhau – và Romans 8,1 giải quyết điều thứ hai, không phải điều thứ nhất."],["box","Ba điều cần phân biệt sau khi tin:",["<b>CẢM GIÁC TỘI LỖI (Guilt feeling):<\/b>","– Cảm xúc tự nhiên khi vi phạm lương tâm hoặc chuẩn mực đạo đức","– Có thể là dấu hiệu lành mạnh của Đức Thánh Linh đang hoạt động","– Cần được mang đến Thiên Chúa để ăn năn và phục hồi","<b>SỰ THUYẾT PHỤC CỦA ĐỨC THÁNH LINH (Conviction):<\/b>","– Đức Thánh Linh chỉ ra điều cụ thể cần thay đổi","– Mục đích: dẫn đến ăn năn và phục hồi, không phải tự trừng phạt","– John 16,8: Ngài thuyết phục \"về tội lỗi, về sự công chính, về sự phán xét\"","<b>BẢN ÁN (Condemnation):<\/b>","– Phán quyết pháp lý \"có tội\", kéo theo hình phạt","– Romans 8,1: đây là điều \"không còn\" cho người ở trong Đức Ki-tô","– Kiểm tra: thuyết phục dẫn đến thay đổi; bản án dẫn đến tuyệt vọng và xa cách Thiên Chúa"]],["h3","IV. Sự Chắc Chắn Không Phải Là Kiêu Ngạo"],["p","Một trong những phản đối thường gặp với Romans 8,1 là: \"Nếu tôi chắc chắn không còn án phạt, điều đó có phải là kiêu ngạo
