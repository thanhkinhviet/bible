– không có cảnh báo, không có lý do, không có người có lỗi. Trong những năm đầu, cô tìm cách giải thích: có người nói \"Chúa cần em trai chị ở bên Ngài\", có người nói \"đây là bài học cho gia đình\". Bây giờ, sau mười hai năm, cô không còn cần những giải thích đó nữa. Điều cô nói với nhóm nhỏ: \"Tôi không biết tại sao em tôi mất. Tôi không nghĩ tôi sẽ biết trong đời này. Nhưng tôi biết Thiên Chúa vẫn đang là Thiên Chúa. Và tôi vẫn đang là người của Ngài. Đó là đủ để sống tiếp.\""]],["h3","II. Đức Tin Không Phải Là Sự Giải Thích"],["p","Một trong những áp lực ngầm trong đời sống đức tin là cảm giác rằng người tin phải có câu trả lời cho mọi câu hỏi – rằng nếu bạn không thể giải thích tại sao điều xấu xảy ra, thì đức tin của bạn không đủ vững. Nhưng điều đó không phải là điều Kinh Thánh mô tả như đức tin."],["p","Hebrews 11 – chương thường được gọi là \"phòng danh dự đức tin\" – liệt kê những người được nhắc đến vì đức tin của họ: Abraham, Moses, Rahab, các tiên tri. Phần cuối chương (11,35-40) liệt kê những người đã chịu đau khổ nặng nề mà không được giải cứu trong đời này – và Kinh Thánh gọi họ là những người \"được Thiên Chúa chứng nhận nhờ đức tin\" (11,39). Đức tin của họ không được đo bằng việc họ có câu trả lời – mà bằng việc họ tiếp tục hướng về Thiên Chúa dù không có câu trả lời."],["h3","III. Sống Trong Câu Hỏi – Không Phải Giải Quyết Câu Hỏi"],["box","",["Giải quyết câu hỏi: Tìm một giải thích đủ thuyết phục để câu hỏi không còn đau nữa. Đây là điều nhiều người tìm – và thường không tìm thấy.","Sống trong câu hỏi: Tiếp tục sống, tiếp tục hướng về Thiên Chúa, tiếp tục yêu người khác – ngay cả khi câu hỏi không được trả lời. Đây là điều Kinh Thánh mô tả như đức tin trưởng thành.","Sự khác biệt thực tế: Người giải quyết câu hỏi sẽ không yên cho đến khi tìm được câu trả lời thỏa mãn – và có thể không bao giờ tìm được. Người sống trong câu hỏi có thể không yên, nhưng vẫn đang sống và hướng về Thiên Chúa – và điều đó là đủ."]],["h3","IV. Psalm 27,13-14 – Đợi Chờ Không Phải Là Thụ Động"],["p","Câu \"hãy đợi chờ CHÚA\" trong Psalm 27 thường được hiểu là sự nhẫn nhục thụ động – ngồi yên và chờ. Nhưng từ Hê-bơ-rơ \"qavah\" có nghĩa là \"trông đợi với sự căng thẳng\", giống như một sợi dây được kéo căng – có sự căng thẳng thật, nhưng cũng có hướng đi rõ ràng."],["p","\"Đợi chờ CHÚA\" là một hành động chủ động: giữ hướng về Thiên Chúa dù chưa thấy điều mình đang trông đợi. Và Psalm 27,13 đặt điều đó trong một khung nhìn cụ thể: \"Tôi tin tưởng sẽ được nhìn xem ân lộc của CHÚA trong cõi đất dành cho kẻ sống.\" Không phải ở đời sau – \"trong cõi đất dành cho kẻ sống\". Tác giả Thánh Vịnh đang nói rằng sự hiện diện và ân sủng của Thiên Chúa có thể được nhìn thấy trong đời này – dù không phải lúc nào và không phải theo cách bạn mong đợi."],["h3","V. Điều Hà Đã Đến Được – Và Tổng Kết Chính Đề 25"],["p","Điều Hà nói sau mười hai năm không phải là câu trả lời cho câu hỏi tại sao em cô mất. Câu hỏi đó vẫn còn đó. Điều cô đến được là điều khác: sự phân biệt giữa \"hiểu\" và \"tin\". Cô không hiểu. Nhưng cô tin – tin rằng Thiên Chúa vẫn là Thiên Chúa, tin rằng cô vẫn là người của Ngài, và tin rằng điều đó là đủ để tiếp tục sống."],["p","Đây không phải là sự đầu hàng. Đây không phải là \"từ bỏ và chấp nhận số phận\". Đây là đức tin đã trưởng thành qua đau – đức tin không cần câu trả lời để tiếp tục đứng, vì nó không đứng trên câu trả lời, mà đứng trên Đấng vẫn đang ở đó dù câu trả lời không đến."],["sum","TỔNG KẾT CHÍNH ĐỀ 25 – Khổ Đau Và Đức Tin: Khi Không Ai Có Lỗi",["<b>Chương 1: <\/b>Đau khổ không phải là bằng chứng Thiên Chúa vắng mặt. Sách Job cho thấy rằng những lời giải thích của ba người bạn – dù nghe có vẻ đúng – đã bị Thiên Chúa từ chối. Điều đúng là kêu cầu trực tiếp với Ngài. Psalm 34,18 tuyên bố: Thiên Chúa ở gần nhất với những tâm hồn tan vỡ.","<b>Chương 2: <\/b>Romans 8,28 không nói \"mọi thứ đều tốt\" hoặc \"Thiên Chúa gây ra điều này để có mục đích tốt\". Nó nói Thiên Chúa có khả năng làm cho ngay cả những điều tệ nhất trở thành phương tiện của sự biến đổi (8,29). Câu này không nên được dùng để tắt câu hỏi – mà để mở ra hy vọng dài hạn.","<b>Chương 3: <\/b>Job không bị yêu cầu im lặng – và Thiên Chúa xác nhận rằng Job, không phải ba người bạn đưa ra lời giải thích gọn gàng, đã nói điều đúng. Câu hỏi là đức tin. Lamentations 3 cho thấy đức tin ở giữa đau, không phải ở phía bên kia của đau.","<b>Chương 4: <\/b>Đức Giê-su từ thập giá đã kêu \"sao Ngài bỏ rơi con?\" – cảm giác bị bỏ rơi đã được Đức Giê-su trải qua trước. Hebrews 4,15 xác nhận Ngài là Đấng Thượng Tế đã từng ở trong đau – không phải đứng từ xa, mà đã đứng đúng chỗ đó.","<b>Chương 5: <\/b>Đức tin không đòi hỏi câu trả lời để tiếp tục đứng. Hebrews 11 gọi những người chịu đau khổ không được giải cứu trong đời này là những người được Thiên Chúa chứng nhận nhờ đức tin. Sống trong câu hỏi – tiếp tục hướng về Thiên Chúa dù không có câu trả lời – là đức tin trưởng thành."]],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Hà sau mười hai năm – \"tôi không biết tại sao, nhưng tôi biết Thiên Chúa vẫn là Thiên Chúa và tôi vẫn là người của Ngài\" – điều đó nghe như sự đầu hàng hay sự trưởng thành với bạn? Tại sao?","Hebrews 11 – những người đức tin được kể đến dù không được giải cứu trong đời này – điều đó thay đổi gì trong cách bạn định nghĩa đức tin thành công?","\"Đợi chờ CHÚA\" trong Psalm 27 – không phải thụ động, mà là giữ hướng về Thiên Chúa dù chưa thấy – bạn đang làm điều đó như thế nào trong một hoàn cảnh cụ thể lúc này?","[Nhóm nhỏ] Nhìn lại toàn bộ Chính đề 25: trong năm chương về đau khổ và đức tin – điều nào nói với bạn nhiều nhất lúc này? Điều nào vẫn còn là câu hỏi mở với bạn?","[Nhóm nhỏ] Câu hỏi mở ra cho Chính đề 26: nếu đức tin có thể đứng vững trong đau khổ cá nhân – thì khi đau khổ đó không phải của cá nhân mà của cộng đoàn, của dân tộc, của lịch sử – đức tin đứng ở đâu trong đó?"]]]},{"k":"front","l":"Phần 2 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 2","ĐỨC TIN VÀ LỊCH SỬ","Khi Đau Khổ Thuộc Về Cả Một Dân Tộc"],"b":[["p","Chính đề 25 đã đặt câu hỏi cuối: nếu đức tin có thể đứng vững trong đau khổ cá nhân – khi bệnh tật đến, khi mất mát xảy ra, khi không ai có lỗi – thì đức tin đứng ở đâu khi đau khổ đó không phải của một người, mà của cả một cộng đoàn, một dân tộc, một thế hệ?"],["p","Đó là câu hỏi của Chính đề 26. Và đây là câu hỏi mà lịch sử liên tục đặt ra, không phân biệt nền văn hóa hay thời đại: chiến tranh, nạn đói, diệt chủng, áp bức kéo dài nhiều thế hệ – những thứ mà không một cá nhân nào gây ra toàn bộ, và không một cá nhân nào có thể giải quyết một mình. Thiên Chúa đứng ở đâu trong đó? Và đức tin cá nhân có nghĩa gì khi đặt vào bối cảnh đau khổ tập thể?"],["p","Chính đề 26 không tìm cách đưa ra lý luận biện hộ gọn gàng cho những sự kiện lịch sử nặng nề. Thay vào đó, nó đặt câu hỏi: Kinh Thánh có giúp chúng ta đứng vững trong loại đau khổ đó không – không phải bằng cách xóa bỏ nó, mà bằng cách cung cấp một khung nhìn đủ rộng để đức tin không bị nuốt chửng bởi nó?"]]},{"k":"ch","l":"Phần 2 · Chương 1","t":"Lịch Sử Không Vượt Ra Ngoài Tầm Mắt Của Thiên Chúa","pb":null,"b":[["q","CHÚA là vua muôn đời vạn đại; các dân tộc sẽ bị diệt khỏi xứ Người.","Psalm 10,16"],["h3","I. Câu Chuyện Của Vinh"],["story","Câu chuyện: Vinh – 68 tuổi",["Vinh sáu mươi tám tuổi, sinh ra năm 1957, lớn lên trong thời chiến và sống qua nhiều biến động lịch sử của đất nước. Ông tin vào Đức Giê-su từ khi còn trẻ – nhưng qua những thập niên đó, có một câu hỏi âm thầm chưa bao giờ được trả lời trọn vẹn: \"Thiên Chúa có nhìn thấy không? Khi cả một thế hệ bị tổn thương, khi cả một dân tộc sống trong nỗi sợ và mất mát – Ngài ở đâu trong đó? Và tại sao lịch sử lại diễn ra theo cách đó nếu Ngài đang nắm quyền kiểm soát?\" Câu hỏi không phải là câu hỏi của người mất đức tin. Đó là câu hỏi của người đã sống đủ lâu để biết rằng câu trả lời đơn giản không đủ sức chịu đựng trước thực tế phức tạp."]],["h3","II. Psalm 10 – Câu Hỏi Đứng Trước Mặt Thiên Chúa"],["p","Psalm 10 mở đầu bằng một câu hỏi trực tiếp và không che giấu: \"Lạy CHÚA, sao Ngài đứng xa vậy? Sao Ngài ẩn mình trong lúc gian nan?\" (10,1). Tác giả Thánh Vịnh đang chứng kiến cảnh người ác phát đạt, người yếu bị áp bức, và không thấy Thiên Chúa can thiệp – và ông nói điều đó thẳng thắn."],["p","Điều đáng chú ý là Psalm 10 không kết thúc ở câu hỏi đó. Nó kết thúc ở câu 16-18 bằng một tuyên bố về bản chất vĩnh cửu của Thiên Chúa so với bản chất tạm thời của mọi quyền lực trần thế: \"CHÚA là vua muôn đời vạn đại; các dân tộc sẽ bị diệt khỏi xứ Người.\" Câu này không phủ nhận thực tế của áp bức trong hiện tại – nó đặt thực tế đó vào một khung thời gian khác. Quyền lực áp bức là thật – nhưng không phải là vĩnh cửu. Và điều đó không phải là sự an ủi trống rỗng: đây là niềm tin nền tảng của Israel qua toàn bộ lịch sử dân tộc."],["h3","III. Sự Chênh Lệch Về Thời Gian – Và Tại Sao Điều Đó Không Phủ Nhận Đau Khổ"],["p","Một trong những căng thẳng thật nhất trong đức tin Ki-tô giáo là khoảng cách giữa thời gian của Thiên Chúa và thời gian của con người. 2 Peter 3,8 viết: \"Đối với Chúa, một ngày như ngàn năm, và ngàn năm như một ngày.\" Điều này không có nghĩa là đau khổ của những người sống và chết trong đau khổ lịch sử là \"không quan trọng\" với Thiên Chúa vì từ góc nhìn vĩnh cửu nó chỉ là \"một khoảnh khắc\". Đó là cách đọc sai và có hại."],["p","Điều câu đó thật sự nói là: hành động của Thiên Chúa trong lịch sử không bị giới hạn bởi khung thời gian mà con người đang sống trong đó. Những gì có vẻ như \"chậm trễ\" hay \"vắng mặt\" từ góc nhìn của một thế hệ có thể là một phần của một sự can thiệp lớn hơn mà không một con người đơn lẻ nào có thể nhìn thấy toàn bộ. Điều đó không trả lời câu hỏi tại sao đau khổ xảy ra – nhưng nó từ chối kết luận rằng sự vắng mặt có vẻ là sự từ bỏ thật."],["h3","IV. Daniel – Đức Tin Trong Bóng Đế Chế"],["p","Sách Daniel được viết trong bối cảnh lưu đày Babylon – một trong những thảm họa lớn nhất của lịch sử Israel. Cả một dân tộc mất quê hương, mất Đền Thờ, mất cấu trúc xã hội và tôn giáo của mình. Và trong bối cảnh đó, sách Daniel không cố gắng giải thích tại sao điều đó xảy ra – mà cố gắng dạy cách sống đức tin khi đang đứng dưới bóng của một đế chế mà không có gì cho thấy sẽ sớm sụp đổ."],["p","Daniel 2,21 viết: \"Chính Ngài thay đổi thời đại và mùa vụ, phế vua này, lập vua khác, ban sự khôn ngoan cho người khôn ngoan, và sự thông sáng cho kẻ có trí hiểu.\" Đây không phải là tuyên bố rằng mọi chế độ đều được Thiên Chúa chấp thuận. Đây là tuyên bố rằng không có quyền lực trần thế nào là vĩnh cửu – và Thiên Chúa đang vận hành bên trên và bên trong những chuyển động của lịch sử theo cách mà những người đang sống trong đó không thể nhìn thấy toàn bộ."],["h3","V. Câu Trả Lời Cho Vinh"],["p","Điều Vinh cần không phải là một lý thuyết thần học về tại sao lịch sử diễn ra theo cách đó. Điều ông có thể tin – dựa trên Psalm 10 và trên toàn bộ câu chuyện của Israel – là: Thiên Chúa nhìn thấy. Ngài không vắng mặt vì đau khổ quá lớn và quá tập thể. Và câu hỏi của ông – \"Ngài ở đâu trong đó?\" – là câu hỏi của đức tin đang vươn tới, không phải của đức tin đang sụp đổ."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Vinh – câu hỏi về Thiên Chúa trong bối cảnh đau khổ lịch sử của cả một dân tộc – bạn có một câu hỏi tương tự không, về lịch sử của đất nước bạn hoặc gia đình bạn?","Psalm 10 mở đầu bằng câu hỏi \"sao Ngài đứng xa vậy?\" nhưng kết thúc bằng tuyên bố về sự trị vì vĩnh cửu của Thiên Chúa – cuộc hành trình từ câu hỏi đến tuyên bố đó trông như thế nào trong đời sống đức tin của bạn?","Sự chênh lệch về thời gian giữa Thiên Chúa và con người – điều đó là nguồn an ủi hay nguồn thêm câu hỏi với bạn?","[Nhóm nhỏ] Daniel sống đức tin dưới một đế chế mạnh mẽ mà không thấy dấu hiệu nào của sự kết thúc – điều gì trong câu chuyện của ông có thể áp dụng cho hoàn cảnh của cộng đoàn bạn lúc này?"]]]},{"k":"ch","l":"Phần 2 · Chương 2","t":"Lamentations – Khi Toàn Bộ Một Dân Tộc Kêu Cầu","pb":null,"b":[["q","CHÚA thật công minh, vì tôi đã chống lại lệnh Ngài; hỡi hết thảy các dân, xin hãy nghe, và nhìn coi nỗi đau của tôi.","Lamentations 1,18"],["h3","I. Câu Chuyện Của Liên"],["story","Câu chuyện: Liên – 55 tuổi",["Liên năm mươi lăm tuổi, là con của một gia đình Công giáo đã trải qua nhiều giai đoạn khó khăn của lịch sử Việt Nam. Cha cô mất khi cô còn nhỏ trong một hoàn cảnh mà cả gia đình chưa bao giờ nói thẳng ra được. Cô lớn lên với câu chuyện của cha không bao giờ được kể trọn vẹn, với vết thương của gia đình không bao giờ được gọi đúng tên. Khi cô bắt đầu đọc sách Ai Ca (Lamentations), cô dừng lại rất lâu ở chương đầu tiên: \"Giê-ru-sa-lem đã bị vô số tội lỗi làm ô uế, vì vậy nó đã trở nên không sạch. Tất cả những ai tôn kính nó đã khinh thường nó, vì đã thấy sự trần trụi của nó; nó rên rỉ và quay mặt đi.\" Cô nói với chị gái: \"Lần đầu tiên tôi thấy câu chuyện của gia đình mình trong Kinh Thánh. Không ai giải thích. Chỉ là kêu cầu.\""]],["h3","II. Sách Ai Ca – Văn Học Của Nỗi Đau Tập Thể"],["p","Sách Lamentations (Ai Ca) là một trong những văn bản độc đáo nhất trong Kinh Thánh. Toàn bộ sách – năm chương – là bài than thở của một cộng đoàn trước sự sụp đổ của Jerusalem và sự lưu đày Babylon. Không có lời giải thích thần học được đưa ra trong dạng hệ thống. Không có lộ trình để phục hồi được vạch ra rõ ràng. Thứ có trong sách là ngôn ngữ của nỗi đau – và ngôn ngữ đó đủ mạnh và đủ rõ ràng để không ai cần thêm giải thích."],["p","Điều đặc biệt về sách Ai Ca là: nó được bảo tồn trong Kinh Thánh. Có nghĩa là Thiên Chúa không yêu cầu cộng đoàn phải \"lọc bỏ\" những lời than thở trước khi chúng được coi là đức tin thật. Kêu cầu trong đau khổ tập thể – khi cả một cộng đoàn kêu cầu – không phải là thiếu đức tin. Đó là một trong những hình thức đức tin cổ xưa nhất mà Kinh Thánh ghi lại."],["h3","III. Lamentations 3 – Đức Tin Không Phủ Nhận Thực Tế"],["p","Lamentations 3 là trung tâm của sách – và cũng là nơi thường được trích dẫn nhất: \"Tình yêu thương của CHÚA không bao giờ cạn, lòng thương xót của Người không bao giờ dứt; chúng mới mẻ mỗi sáng\" (3,22-23). Nhưng điều quan trọng là đoạn đó không đến ở chương đầu hay chương cuối. Nó đến ở chương ba – và tất cả bốn chương còn lại của sách vẫn tiếp tục với đau khổ."],["box","",["<b>Điều Lamentations 3 KHÔNG làm:<\/b> Nó không giải quyết câu hỏi tại sao đau khổ xảy ra. Nó không tuyên bố rằng đau khổ đã qua. Nó không yêu cầu người đang đau phải giả vờ ổn để có thể tin.","<b>Điều Lamentations 3 THẬT SỰ làm:<\/b> Nó tuyên bố một điều không phụ thuộc vào hoàn cảnh: lòng thương xót của Thiên Chúa không cạn – không phải vì hoàn cảnh đã thay đổi, mà vì bản chất của Ngài không thay đổi. Và điều đó đủ để ngày mai tiếp tục được nhìn đến.","<b>Bối cảnh của tuyên bố đó:<\/b> Tác giả vừa mô tả mình như người \"đã nhìn thấy sự khốn khổ\" (3,1), bị dồn vào bóng tối (3,2), bị giam cầm (3,7). Lời tuyên bố về lòng thương xót của Thiên Chúa không phải là lời của người đang sống trong điều kiện tốt đẹp – mà của người đang ở trong đáy của đau khổ và vẫn nhớ lại một điều."]],["h3","IV. Khi Vết Thương Tập Thể Không Có Tên"],["p","Một trong những khó khăn đặc biệt của đau khổ lịch sử là: thường xuyên, đau khổ đó không được gọi tên. Gia đình như gia đình của Liên – vết thương không được nói ra, câu chuyện không được kể trọn vẹn, sự mất mát không được phép than thở – mang một gánh nặng kép: không chỉ là đau khổ của sự kiện, mà còn là cô đơn của sự im lặng bắt buộc."],["p","Điều Sách Ai Ca làm là cho phép đặt tên cho điều chưa được đặt tên. Sách không đòi hỏi phải có giải thích trước khi kêu cầu. Nó không đòi hỏi phải biết \"tại sao\" trước khi được phép đau. Và điều đó – sự cho phép đó – đôi khi là điều đầu tiên mà người mang vết thương tập thể cần: không phải câu trả lời, mà là không gian để kêu cầu."],["h3","V. Câu Trả Lời Cho Liên"],["p","Điều Liên tìm thấy trong Sách Ai Ca không phải là câu trả lời cho câu hỏi về cha cô. Điều cô tìm thấy là: câu chuyện của gia đình cô không quá đặc biệt đến mức Kinh Thánh không có ngôn ngữ cho nó. Sự kêu cầu tập thể – của cả một cộng đoàn không biết tại sao nhưng vẫn quay về Thiên Chúa – đã ở trong Kinh Thánh từ rất lâu trước khi cô ra đời. Và điều đó không trả lời câu hỏi, nhưng nó phá vỡ sự cô đơn của nó."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Liên – vết thương của gia đình không có tên – bạn có một vết thương tập thể (trong gia đình, cộng đoàn, hay dân tộc) chưa bao giờ được đặt tên hay than thở trọn vẹn không?","Sách Ai Ca được bảo tồn trong Kinh Thánh như một hình thức đức tin – điều đó thay đổi gì trong cách bạn nhìn nhận những lời than thở, khóc lóc, hoặc câu hỏi trong đau khổ tập thể?","Lamentations 3,22-23 – \"lòng thương xót của Người không bao giờ dứt\" – được nói ở giữa đau khổ, không phải ở cuối của nó. Bạn có thể nói điều đó không, trong một hoàn cảnh cụ thể lúc này?","[Nhóm nhỏ] Có những vết thương trong cộng đoàn của bạn chưa được đặt tên hay than thở trọn vẹn không? Điều gì sẽ xảy ra nếu chúng được phép kêu cầu theo cách Kinh Thánh cho phép?"]]]},{"k":"ch","l":"Phần 2 · Chương 3","t":"Esther Và Joseph – Đức Tin Giữa Lòng Đế Chế","pb":null,"b":[["q","Không phải anh em đã bán tôi sang đây, mà là chính Thiên Chúa đã đưa tôi đến trước anh em.","Genesis 45,8"],["h3","I. Câu Chuyện Của Phúc"],["story","Câu chuyện: Phúc – 43 tuổi",["Phúc bốn mươi ba tuổi, là kỹ sư, làm việc cho một tập đoàn nước ngoài. Anh là người Kitô hữu thế hệ thứ hai – cha mẹ anh là những người sống sót qua thời kỳ khó khăn và đã giữ đức tin trong bí mật trong nhiều năm. Câu hỏi anh thường đặt ra không phải là câu hỏi thần học trừu tượng: \"Tôi thấy rõ rằng cha mẹ tôi đã bị đặt vào một hoàn cảnh mà không ai chọn. Nhưng trong hoàn cảnh đó, họ vẫn sống và vẫn truyền đức tin cho tôi. Tôi muốn hiểu điều đó xảy ra như thế nào – Thiên Chúa có đang làm điều gì trong những hoàn cảnh mà người ta không thể thoát ra không?\""]],["h3","II. Joseph – Bị Ném Vào Hoàn Cảnh Không Được Chọn"],["p","Câu chuyện của Joseph trong Genesis 37-50 là một trong những câu chuyện dài nhất và phức tạp nhất trong Kinh Thánh. Joseph không chọn bị anh em bán đi. Ông không chọn bị giam cầm oan. Ông không chọn bị lãng quên bởi người mà ông đã giúp. Phần lớn câu chuyện của ông là chuỗi những hoàn cảnh mà ông bị đặt vào – không phải vì ông chọn, mà vì người khác chọn hay vì hoàn cảnh áp đặt."],["p","Nhưng điều đáng chú ý là Kinh Thánh ghi lại ở Genesis 39,2.21.23 rằng \"CHÚA ở cùng Joseph\" – không phải khi mọi thứ tốt đẹp, mà chính xác trong những giai đoạn tối tăm nhất. Không phải là Thiên Chúa đã tạo ra những hoàn cảnh đó. Nhưng Ngài không vắng mặt trong chúng."],["p","Genesis 45,8 là khoảnh khắc nhận thức của Joseph – khi ông nhìn lại toàn bộ hành trình và nhận ra: có một chuỗi các sự kiện mà khi đứng ở đầu mỗi sự kiện, ông không thể nhìn thấy ý nghĩa – nhưng khi đứng ở cuối, một hình thù nào đó hiện ra. Không phải hình thù đó biện minh cho tội lỗi của các anh. Không phải nó xóa bỏ đau khổ. Nhưng nó cho thấy rằng Thiên Chúa đang làm việc ngay trong đau khổ, không phải chỉ sau khi nó qua đi."],["h3","III. Esther – Khi Đức Tin Đứng Trước Quyết Định Lịch Sử"],["p","Sách Esther là một trong hai sách trong Kinh Thánh không có lần nào đề cập trực tiếp đến tên Thiên Chúa. Và chính sự vắng mặt đó là một phần của điều sách này muốn dạy: đức tin không phải lúc nào cũng đến trong hình thức một tiếng nói từ trời hay một phép lạ hiển nhiên. Đôi khi nó đến trong hình thức một người phụ nữ đứng trước sự lựa chọn: can đảm đối diện với nguy hiểm để bảo vệ dân tộc, hay im lặng để an toàn."],["p","Mordecai nói với Esther trong chương 4,14: \"Biết đâu chính vì cớ thời này mà cô đã được vào ngôi hoàng hậu?\" Câu này không tuyên bố rằng Esther chắc chắn được đặt vào đó vì mục đích đó. Nó đặt ra một câu hỏi – và câu hỏi đó đủ để Esther đưa ra quyết định."],["box","",["<b>Điều Mordecai không nói:<\/b> \"Thiên Chúa đã sắp xếp cho cô ở đây, vì vậy cô không có gì phải sợ.\" Esther vẫn sợ. Vẫn có nguy hiểm thật. Vẫn có khả năng mất mạng.","<b>Điều Mordecai thật sự nói:<\/b> \"Có thể – có thể – cô đang ở đây vì một lý do. Cô không chắc. Nhưng câu hỏi đó đủ để hành động.\" Và Esther chọn hành động dựa trên sự không chắc chắn đó, không phải dựa trên sự bảo đảm hoàn toàn.","<b>Hàm ý thực tế:<\/b> Đức tin không yêu cầu phải chắc chắn hoàn toàn về kế hoạch của Thiên Chúa trước khi hành động. Đôi khi nó yêu cầu hành động dựa trên câu hỏi \"biết đâu\" – và tin tưởng rằng Thiên Chúa đang làm việc ngay trong sự không chắc chắn đó."]],["h3","IV. Đức Tin Trong Bóng Tối Của Lịch Sử – Không Phải Ở Phía Bên Kia"],["p","Cả Joseph lẫn Esther đều không sống trong thời điểm mà mọi thứ đã được giải quyết. Phần lớn câu chuyện của họ diễn ra trong khi bóng tối vẫn đang bao phủ – khi không có dấu hiệu rõ ràng nào cho thấy kết cục sẽ như thế nào. Và đức tin của họ – dù không được gọi thẳng là đức tin trong nhiều đoạn – là đức tin sống trong bóng tối đó, không phải đức tin chờ đợi ở phía bên kia của nó."],["p","Điều đó có ý nghĩa thực tế cho những cộng đoàn đang sống trong hoàn cảnh khó khăn không thấy lối ra: đức tin không cần đợi đến khi lối ra hiện ra mới có thể thật sự sống. Nó có thể sống ngay trong bóng tối – và điều đó không phải là đức tin bất thường hay đặc biệt. Đó là đức tin bình thường của những người đã sống trước chúng ta trong Kinh Thánh."],["h3","V. Câu Trả Lời Cho Phúc"],["p","Điều cha mẹ của Phúc đã làm – giữ đức tin trong bóng tối của một giai đoạn lịch sử không có lối ra rõ ràng, và truyền nó cho ông – không phải là điều bất thường trong lịch sử đức tin. Joseph giữ đức tin trong nhiều năm tù oan. Esther đứng trước lựa chọn mà kết quả không được bảo đảm. Và cộng đoàn Israel trong lưu đày tiếp tục cầu nguyện hướng về Jerusalem mà không biết bao giờ mới trở về. Đức tin trong hoàn cảnh không được chọn là một trong những hình thức đức tin lâu đời nhất – và cha mẹ của Phúc đã sống đúng trong truyền thống đó."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Phúc – cha mẹ giữ đức tin trong hoàn cảnh không được chọn – bạn có một người trong gia đình hay cộng đoàn đã làm điều tương tự không? Điều đó ảnh hưởng như thế nào đến đức tin của bạn?","Joseph nhận ra \"Thiên Chúa đã đưa tôi đến\" nhìn lại, không phải khi đang ở trong đó – bạn có một hoàn cảnh trong quá khứ mà khi nhìn lại, bạn nhận ra điều gì đó đang xảy ra mà bạn không thể thấy lúc đó không?","Mordecai nói với Esther \"biết đâu\" – không phải \"chắc chắn\" – bạn đã từng phải hành động dựa trên \"biết đâu\" thay vì sự chắc chắn không? Điều đó cảm thấy thế nào?","[Nhóm nhỏ] Câu nói của Mordecai trong Esther 4,14 – có một khoảnh khắc nào trong cuộc sống của cộng đoàn bạn mà câu hỏi \"biết đâu chính vì cớ thời này\" có thể được đặt ra không?"]]]},{"k":"ch","l":"Phần 2 · Chương 4","t":"Romans 8 Và Thập Giá – Đau Khổ Không Phải Là Điểm Cuối","pb":null,"b":[["q","Thật vậy, tôi nghĩ rằng những đau khổ trong thời hiện tại không thể so sánh được với vinh quang sắp được tỏ lộ cho chúng ta.","Romans 8,18"],["h3","I. Câu Chuyện Của Thúy"],["story","Câu chuyện: Thúy – 61 tuổi",["Thúy sáu mươi mốt tuổi. Cô mất chồng khi con cái còn nhỏ – và tiếp tục nuôi con một mình trong một hoàn cảnh kinh tế khó khăn kéo dài nhiều thập niên. Cô không bao giờ rời bỏ cộng đoàn. Nhưng trong một buổi chia sẻ, cô nói: \"Tôi đọc Kinh Thánh nói về phục sinh, về vinh quang, về sự đổi mới của tất cả mọi thứ. Tôi tin những điều đó. Nhưng đôi khi tôi ngồi lại và nghĩ: tôi đã chờ đợi điều đó cả cuộc đời này, và tôi vẫn chưa thấy. Điều đó không làm tôi mất đức tin – nhưng nó khiến tôi mệt. Tôi muốn ai đó không nói với tôi là 'sắp rồi' mà thay vào đó ngồi với tôi và thừa nhận rằng việc chờ đợi điều đó suốt cuộc đời là nặng nề.\""]],["h3","II. Romans 8 – Hy Vọng Không Phủ Nhận Rên Xiết"],["p","Romans 8 thường được trích dẫn vì những câu đầy hy vọng – đặc biệt câu 28 (\"Thiên Chúa làm cho mọi sự đều sinh lợi ích\") và câu 38-39 (không có gì có thể tách chúng ta khỏi tình yêu của Thiên Chúa). Nhưng cấu trúc của toàn chương 8 quan trọng hơn những câu đó tách ra."],["p","Phao-lô viết ở câu 22-23: \"Chúng ta biết rằng toàn thể thụ tạo vẫn rên siết và quằn quại như sản phụ từ trước đến nay. Không những thế, cả chúng ta nữa, dù đã có Thần Khí là hoa quả đầu mùa, chúng ta cũng rên siết trong lòng khi mong đợi được làm con Thiên Chúa, được cứu chuộc thân xác chúng ta.\" Phao-lô không nói người tin đức tin thật thì không rên xiết. Ông nói người tin vẫn rên xiết – và sự rên xiết đó là bằng chứng của việc đang chờ đợi điều thật, không phải bằng chứng của đức tin thiếu sót."],["h3","III. Thập Giá Và Phục Sinh – Cấu Trúc Của Hy Vọng Kitô Giáo"],["p","Hy vọng Ki-tô giáo không dựa trên ý tưởng rằng cuộc sống hiện tại sẽ trở nên tốt hơn dần dần nếu chúng ta cố đủ mạnh. Nó dựa trên một sự kiện lịch sử cụ thể: thập giá và phục sinh của Đức Giê-su. Và điều đặc biệt về cấu trúc đó là: phục sinh không xóa bỏ thập giá. Trong các tường thuật phục sinh, cơ thể phục sinh của Đức Giê-su vẫn mang các vết thương (John 20,27). Phục sinh không làm như thể thập giá chưa xảy ra – nó chiến thắng thập giá trong khi vẫn để thập giá là thật."],["p","Điều đó có hàm ý quan trọng cho đau khổ tập thể: hy vọng Ki-tô giáo không hứa rằng đau khổ lịch sử sẽ được xóa bỏ như thể nó chưa xảy ra. Nó hứa rằng đau khổ đó – dù là đau khổ của một người hay của cả một dân tộc – không phải là điểm cuối. Và điều đó khác với việc giả vờ nó không quan trọng."],["h3","IV. Revelation 21 – Đổi Mới Tất Cả Mọi Thứ"],["p","Revelation (Khải Huyền) 21,4-5 viết: \"Thiên Chúa sẽ lau sạch nước mắt họ. Sẽ không còn sự chết; cũng không còn tang tóc, kêu than và đau khổ nữa, vì những điều cũ đã qua đi. Đấng ngự trên ngai phán: 'Này đây Ta đổi mới tất cả mọi sự.'\" Câu \"đổi mới tất cả mọi sự\" trong tiếng Hy Lạp dùng từ \"panta\" – tất cả mọi thứ, không có ngoại lệ. Không chỉ là những đau khổ nhỏ. Không chỉ là những mất mát cá nhân. Tất cả mọi sự – bao gồm đau khổ lịch sử của cả các dân tộc."],["p","Điều này không có nghĩa là chúng ta không nên đau về những điều đã xảy ra, hay không nên đấu tranh để thay đổi những điều có thể thay đổi. Nhưng nó có nghĩa là: đức tin Ki-tô giáo từ chối chấp nhận rằng đau khổ – dù ở quy mô nào – là điểm cuối của câu chuyện."],["h3","V. Câu Trả Lời Cho Thúy"],["p","Điều Thúy cần không phải là được nói rằng \"sắp rồi\" như một câu an ủi không có thực chất. Điều cô cần là sự thừa nhận thật sự: việc chờ đợi trong suốt một cuộc đời là nặng nề – và Romans 8 đồng ý với điều đó. Phao-lô không nói chờ đợi là dễ. Ông nói chờ đợi đó có nền tảng trong một thực tế mà không ai có thể lấy đi: Thiên Chúa đang làm việc, thập giá đã xảy ra, phục sinh đã xảy ra, và Revelation 21 là điểm đến – không phải điểm đầu của hy vọng, mà điểm đến của một hành trình mà Thúy đang đi trên đó ngay lúc này."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Thúy – mệt mỏi với việc chờ đợi, không phải mất đức tin – bạn đã từng cảm thấy điều đó không? Điều gì giúp bạn tiếp tục trong sự mệt mỏi đó?","Romans 8 nói người tin vẫn rên xiết trong khi chờ đợi – điều đó thay đổi gì trong cách bạn nhìn nhận sự mệt mỏi hay thất vọng của chính mình trong đức tin?","Thập giá và phục sinh – phục sinh không xóa bỏ thập giá nhưng chiến thắng nó – điều đó có nghĩa gì đối với đau khổ lịch sử của cộng đoàn hay dân tộc bạn?","[Nhóm nhỏ] Revelation 21,5 – \"Ta đổi mới tất cả mọi sự\" – nếu bạn tin điều đó thật, điều đó thay đổi gì trong cách bạn sống hôm nay, ngay trong hoàn cảnh hiện tại?"]]]},{"k":"ch","l":"Phần 2 · Chương 5","t":"Sống Đức Tin Trong Bối Cảnh Tập Thể: Từ Đau Khổ Đến Chứng Tá","pb":null,"b":[["q","Anh em hãy vui mừng trong sự trông cậy, kiên nhẫn lúc gian truân, chuyên cần cầu nguyện.","Romans 12,12"],["h3","I. Câu Chuyện Của Nhân"],["story","Câu chuyện: Nhân – 50 tuổi",["Nhân năm mươi tuổi, là giáo viên. Anh lớn lên trong một gia đình có đức tin nhưng không bao giờ được nói thẳng về đức tin trong không gian công cộng. Khi anh bắt đầu dạy học, anh nhận ra rằng nhiều học sinh của mình đang mang những vết thương tập thể – của gia đình, của cộng đoàn, của lịch sử – mà không có ngôn ngữ để gọi tên. Câu hỏi anh đặt ra trong một buổi chia sẻ cộng đoàn: \"Khi tôi sống đức tin trong bối cảnh một xã hội mang nhiều vết thương lịch sử, đức tin của tôi có phải chỉ là về cá nhân tôi không? Hay có điều gì đó trong đức tin đó phải hướng về cộng đoàn – về những người đang mang vết thương mà họ không có ngôn ngữ để gọi tên?\""]],["h3","II. Đức Tin Cá Nhân Và Đức Tin Cộng Đoàn"],["p","Trong truyền thống Ki-tô giáo, đặc biệt trong bối cảnh phương Tây hiện đại, đức tin thường được hiểu chủ yếu như một vấn đề giữa cá nhân và Thiên Chúa. Nhưng Kinh Thánh – từ Cựu Ước đến Tân Ước – liên tục mô tả đức tin như một thực hành cộng đoàn, không chỉ cá nhân."],["p","Trong Cựu Ước, Israel không chỉ là một tập hợp các cá nhân có đức tin riêng – họ là một dân. Giao ước được lập với dân. Sự cứu chuộc được trải nghiệm như cộng đoàn (Exodus). Đau khổ được than thở như cộng đoàn (Lamentations). Và hy vọng được hướng đến sự phục hồi của toàn bộ dân tộc, không chỉ một số cá nhân may mắn."],["p","Trong Tân Ước, Hội Thánh không chỉ là nơi các cá nhân tin Đức Giê-su tập hợp lại. Hội Thánh là \"thân thể của Đức Ki-tô\" (1 Corinthians 12) – một thực thể hữu cơ trong đó mỗi phần có liên hệ đến các phần khác, và đau khổ của một phần ảnh hưởng đến toàn thể."],["h3","III. Romans 12 – Cộng Đoàn Như Chứng Tá"],["p","Romans 12 là một trong những chương mô tả đời sống cộng đoàn Ki-tô giáo rõ ràng nhất – và đặc biệt trong bối cảnh của đau khổ. Câu 12: \"Vui mừng trong sự trông cậy, kiên nhẫn lúc gian truân, chuyên cần cầu nguyện.\" Câu 15: \"Hãy vui với người vui, khóc với người khóc.\" Câu 16: \"Hãy có cùng tâm tình với nhau...\""],["box","",["<b>\"Vui mừng trong sự trông cậy\":<\/b> Không phải vui vì hoàn cảnh tốt – mà vui vì có điều gì đó đang được trông đợi, dù hoàn cảnh hiện tại không phản ánh điều đó.","<b>\"Kiên nhẫn lúc gian truân\":<\/b> Từ Hy Lạp 'hupomone' có nghĩa là sức chịu đựng chủ động – không phải im lặng thụ động, mà là tiếp tục đứng dưới áp lực.","<b>\"Khóc với người khóc\":<\/b> Trước khi đưa ra giải thích hay an ủi, điều cộng đoàn được kêu gọi làm là: đồng hành trong đau khổ. Điều này áp dụng cho đau khổ cá nhân lẫn đau khổ tập thể.","<b>Hàm ý thực tế:<\/b> Một cộng đoàn Ki-tô hữu trong bối cảnh của đau khổ lịch sử không chỉ là nơi người ta đến để tìm an ủi cá nhân. Nó là nơi đau khổ tập thể được đặt tên, được than thở cùng nhau, và được đặt trước mặt Thiên Chúa theo cách mà không ai phải làm một mình."]],["h3","IV. Từ Đau Khổ Đến Chứng Tá – Không Phải Đường Thẳng"],["p","2 Corinthians 1,3-4 mô tả một cấu trúc quan trọng: đau khổ → sự an ủi nhận được → khả năng an ủi người khác. Điều Phao-lô đang nói không phải là đau khổ tự động biến người đau khổ thành người có thể giúp người khác. Điều ông nói là: khi sự đau khổ được trải qua với sự đồng hành của Thiên Chúa – khi sự an ủi của Ngài thật sự được nhận – thì điều đó trở thành nguồn của một khả năng mà không thể có theo cách nào khác."],["p","Điều này cũng áp dụng cho đau khổ tập thể: một cộng đoàn đã đi qua đau khổ lịch sử – không phải phủ nhận nó, không phải giải thích nó đi, mà thật sự đi qua nó với Thiên Chúa – có thể trở thành chứng tá cho những cộng đoàn khác đang ở trong đau khổ. Không phải vì họ có câu trả lời, mà vì họ đã đứng ở cùng một nơi và không bị xóa bỏ."],["h3","V. Câu Trả Lời Cho Nhân – Và Tổng Kết Chính Đề 26"],["p","Câu hỏi của Nhân – đức tin có phải chỉ là về cá nhân không, hay có điều gì đó hướng về cộng đoàn – là câu hỏi mà Romans 12 trả lời: không phải chỉ là cá nhân. Đức tin Ki-tô giáo không chỉ là đức tin của từng người riêng lẻ đứng trước Thiên Chúa. Nó là đức tin của một dân, một thân thể, một cộng đoàn – và trong bối cảnh đau khổ tập thể, sự hiện diện của cộng đoàn đó chính là một hình thức của sự an ủi và chứng tá."],["p","Đức tin trong bối cảnh đau khổ tập thể không yêu cầu phải có câu trả lời cho tại sao lịch sử diễn ra như vậy. Nó yêu cầu: ở lại trong cộng đoàn, đặt tên cho đau khổ tập thể, than thở cùng nhau, và tiếp tục hướng về Thiên Chúa – Đấng mà Psalm 10 tuyên bố là vua vĩnh cửu, Đấng mà Lamentations 3 tuyên bố là nguồn của lòng thương xót không cạn, và Đấng mà Revelation 21 hứa sẽ đổi mới tất cả mọi sự."],["sum","TỔNG KẾT CHÍNH ĐỀ 26 – Đức Tin Và Lịch Sử: Khi Đau Khổ Thuộc Về Cả Một Dân Tộc",["<b>Chương 1: <\/b>Psalm 10 đặt câu hỏi trực tiếp về sự vắng mặt có vẻ của Thiên Chúa trong đau khổ tập thể – và kết thúc bằng tuyên bố về sự trị vì vĩnh cửu của Ngài. Sự chênh lệch về thời gian giữa Thiên Chúa và con người không phủ nhận đau khổ, nhưng từ chối kết luận rằng sự vắng mặt có vẻ là sự từ bỏ thật. Daniel sống đức tin dưới bóng đế chế mà không thấy lối ra.","<b>Chương 2: <\/b>Sách Ai Ca là văn học của đau khổ tập thể được bảo tồn trong Kinh Thánh – Thiên Chúa không yêu cầu lọc bỏ nỗi đau trước khi nó được coi là đức tin thật. Lamentations 3 tuyên bố lòng thương xót không cạn ở giữa đau khổ, không phải ở cuối của nó. Đặt tên cho vết thương tập thể là điều cần thiết và được Kinh Thánh cho phép.","<b>Chương 3: <\/b>Joseph và Esther là những người sống đức tin trong hoàn cảnh không được chọn. Genesis 39 xác nhận \"CHÚA ở cùng Joseph\" ngay trong đau khổ, không phải chỉ sau khi qua đi. Esther hành động dựa trên \"biết đâu\" – không chắc chắn hoàn toàn, nhưng đủ để quyết định. Đức tin trong bóng tối lịch sử là đức tin bình thường của Kinh Thánh.","<b>Chương 4: <\/b>Romans 8 xác nhận người tin vẫn rên xiết trong khi chờ đợi – và điều đó không phải là thất bại đức tin. Thập giá và phục sinh cung cấp cấu trúc của hy vọng Ki-tô giáo: phục sinh chiến thắng thập giá nhưng không xóa bỏ nó. Revelation 21 hứa đổi mới \"tất cả mọi sự\" – bao gồm đau khổ tập thể của các dân tộc.","<b>Chương 5: <\/b>Đức tin Ki-tô giáo không chỉ là đức tin cá nhân – Kinh Thánh mô tả đức tin như một thực hành cộng đoàn. Romans 12 kêu gọi: vui mừng trong trông cậy, kiên nhẫn trong gian truân, khóc với người khóc. Cộng đoàn đã đi qua đau khổ lịch sử với Thiên Chúa có thể trở thành chứng tá – không phải vì có câu trả lời, mà vì đã đứng ở cùng nơi và không bị xóa bỏ."]],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Nhân – đức tin cá nhân và đức tin cộng đoàn trong bối cảnh xã hội mang nhiều vết thương lịch sử – bạn nhìn cộng đoàn của mình đang làm điều gì với đau khổ tập thể của bối cảnh đó?","Romans 12,15 – \"khóc với người khóc\" – trước giải thích hay an ủi – điều đó trông như thế nào trong thực tế của cộng đoàn bạn khi đứng trước đau khổ tập thể?","Nhìn lại toàn bộ Chính đề 26: từ Psalm 10 đến Lamentations đến Joseph đến Esther đến Romans 8 đến Revelation 21 – câu chuyện nào hoặc đoạn Kinh Thánh nào nói với bạn nhiều nhất lúc này?","[Nhóm nhỏ] 2 Corinthians 1,3-4 – đau khổ đã đi qua với Thiên Chúa trở thành nguồn an ủi cho người khác – có điều gì trong lịch sử của cộng đoàn bạn, khi đã đi qua, trở thành điều có thể trao cho người khác không?","[Nhóm nhỏ] Câu hỏi mở ra cho Chính đề 27: nếu đức tin có thể đứng vững trong đau khổ tập thể của lịch sử – thì trong bối cảnh của thế giới hiện đại, với những thay đổi văn hóa và xã hội đang diễn ra nhanh chóng, đức tin định hình cách người tin sống trong thế giới đó như thế nào?"]]]},{"k":"front","l":"Phần 3 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 3","ĐỨC TIN VÀ VĂN HÓA","Khi Thế Giới Đang Thay Đổi"],"b":[["p","Chính đề 26 đã khép lại với một khung nhìn lớn: đức tin có thể đứng vững không chỉ trong đau khổ cá nhân, mà cả trong đau khổ tập thể của một dân tộc – nhờ vào một Thiên Chúa đứng trên lịch sử, nhìn thấy, và hứa đổi mới tất cả mọi sự. Nhưng có một câu hỏi mà Chính đề 26 chỉ mới mở ra ở cuối: nếu đức tin có thể đứng vững qua những biến động lớn của lịch sử, thì đức tin sống như thế nào trong một thế giới mà những biến động đó không còn là chuyện của \"quá khứ\" hay \"thế hệ trước\" – mà là chuyện đang xảy ra ngay trong đời sống hằng ngày, với tốc độ mà nhiều người cảm thấy không thể theo kịp?"],["p","Đó là câu hỏi của Chính đề 27. Công nghệ thay đổi cách con người giao tiếp, làm việc, và suy nghĩ với tốc độ chưa từng có. Các giá trị về gia đình, về thành công, về bản sắc cá nhân đang được định nghĩa lại liên tục – đôi khi trong khoảng một thế hệ, đôi khi trong vài năm. Người tin Chúa không sống ngoài thế giới đó. Họ sống trong nó – và nhiều người cảm thấy bị kéo theo hai hướng: một bên là cảm giác phải \"theo kịp\" để không bị bỏ lại, một bên là cảm giác phải \"giữ vững\" để không đánh mất điều gì đó quan trọng. Cả hai cảm giác đó có thể cùng tồn tại trong một người, và thường tạo ra mệt mỏi nhiều hơn là rõ ràng."],["p","Chính đề 27 không tìm cách đưa ra danh sách những điều \"nên\" và \"không nên\" trong văn hóa hiện đại. Thay vào đó, nó đặt câu hỏi nền tảng hơn: Romans 12,2 nói gì về việc sống trong một thế giới đang thay đổi – không phải bằng cách rút lui khỏi nó, và không phải bằng cách hòa tan vào nó, mà bằng một con đường thứ ba mà Kinh Thánh gọi là \"đổi mới tâm thần\"?"]]},{"k":"ch","l":"Phần 3 · Chương 1","t":"Rập Theo Đời Này Là Gì?","pb":null,"b":[["q","Anh em đừng có rập theo đời này, nhưng hãy cải biến con người anh em bằng cách đổi mới tâm thần, hầu có thể nhận ra đâu là ý Thiên Chúa.","Romans 12,2"],["h3","I. Câu Chuyện Của Khang"],["story","Câu chuyện: Khang – 29 tuổi",["Khang hai mươi chín tuổi, làm việc trong một công ty công nghệ và lớn lên với mạng xã hội như một phần tự nhiên của cuộc sống – không phải thứ anh \"thêm vào\", mà thứ anh không nhớ được thời điểm trước khi có nó. Anh tin Chúa từ nhỏ, đi nhà thờ đều đặn, và không có khủng hoảng đức tin lớn nào. Nhưng gần đây, anh nhận ra một điều khiến anh bối rối: anh có thể trích dẫn các giá trị Ki-tô giáo một cách trôi chảy trong nhà thờ – và cũng có thể, trong vòng vài giờ sau đó, lướt qua hàng trăm hình ảnh, ý kiến, và tiêu chuẩn về thành công, vẻ đẹp, và hạnh phúc trên mạng xã hội mà không thấy có gì \"sai\" cả. Anh nói với một người bạn: \"Tôi không cảm thấy mình đang phản bội đức tin. Nhưng tôi cũng không chắc đức tin của tôi đang định hình cách tôi nhìn thế giới, hay thế giới đang định hình cách tôi hiểu đức tin – và tôi không biết làm sao để phân biệt hai điều đó.\""]],["h3","II. \"Rập Theo\" – Một Tiến Trình, Không Phải Một Khoảnh Khắc"],["p","Từ Hy Lạp được dịch là \"rập theo\" trong Romans 12,2 là \"syschematizo\" – một từ ghép có nghĩa đen gần với \"cùng khuôn mẫu với\", \"mang cùng hình dạng bên ngoài với\". Điều đáng chú ý là từ này không mô tả một sự kiện đơn lẻ – như một lần \"phản bội\" rõ ràng – mà mô tả một tiến trình: dần dần được tạo hình theo khuôn mẫu của một thứ gì đó bên ngoài, thường mà không nhận ra."],["p","Đây là điều làm cho \"rập theo đời này\" khác với những hình thức tội lỗi mà người ta thường dễ nhận ra hơn. Không ai \"quyết định\" một ngày để rập theo các giá trị của thời đại mình – giống như không ai \"quyết định\" để nói một loại tiếng địa phương. Nó xảy ra qua việc tiếp xúc lặp đi lặp lại, qua những giả định không được kiểm tra, qua những tiêu chuẩn được hấp thụ trước khi được suy xét. Phao-lô viết câu này cho những Ki-tô hữu ở Roma – những người sống ngay trong trung tâm của một nền văn hóa với những giá trị về quyền lực, danh dự, và địa vị rất khác với giá trị của Tin Mừng. Lời cảnh báo của ông không phải là về một mối nguy xa xôi – mà về một mối nguy đang diễn ra ngay trong đời sống hằng ngày của họ."],["h3","III. Khuôn Mẫu Thay Đổi Theo Thời Đại – Nhưng Tiến Trình Thì Không"],["p","Một điều quan trọng cần làm rõ: \"đời này\" (tiếng Hy Lạp \"aion\" – có thể dịch là \"thời đại này\") không phải là một danh sách cố định của những điều xấu. Nó là khuôn mẫu giá trị, ưu tiên, và giả định đang chiếm ưu thế trong một thời đại cụ thể. Khuôn mẫu của thời Phao-lô – xoay quanh danh dự công khai, hệ thống bảo trợ, và quyền lực đế chế – khác với khuôn mẫu của thời đại số, xoay quanh sự chú ý, hình ảnh cá nhân, và tốc độ thông tin. Nhưng tiến trình \"rập theo\" – để cho khuôn mẫu đó dần dần định hình cách một người nhìn nhận giá trị của mình, của người khác, và của Thiên Chúa – là tiến trình giống nhau qua mọi thời đại."],["box","",["<b>Rập theo đời này:<\/b> Để cho khuôn mẫu giá trị của thời đại – về thành công, về sự chú ý, về điều gì \"đáng giá\" – dần dần trở thành thước đo mặc định, mà không được suy xét. Quá trình diễn ra âm thầm, qua tiếp xúc lặp lại.","<b>Đổi mới tâm thần:<\/b> Để cho cách nhìn của Tin Mừng – về giá trị con người, về điều gì là \"đủ\", về mối quan hệ với Thiên Chúa – trở thành thước đo được suy xét và lựa chọn một cách chủ động, không phải mặc định.","<b>Hệ quả thực tế:<\/b> Câu hỏi không phải là \"tôi có đang làm điều gì sai không\" – mà là \"thước đo nào đang vận hành trong tôi mà tôi chưa từng kiểm tra?\""]],["h3","IV. Câu Trả Lời Cho Khang"],["p","Điều Khang cảm nhận – sự không chắc chắn về việc đức tin đang định hình anh, hay thế giới đang định hình đức tin của anh – không phải là dấu hiệu của một đức tin yếu hay giả. Đó là dấu hiệu của một người đang bắt đầu nhận ra điều mà Romans 12,2 mô tả: \"rập theo\" là một tiến trình âm thầm, và việc nhận ra nó đang xảy ra – dù chưa biết phải làm gì với nó – đã là bước đầu của \"đổi mới tâm thần\". Câu hỏi của Khang không phải là câu hỏi cần một câu trả lời ngay lập tức. Nó là câu hỏi cần được tiếp tục đặt ra – có chủ ý, có thường xuyên – trong một thế giới mà khuôn mẫu thay đổi liên tục."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Khang – cảm giác không chắc liệu đức tin đang định hình mình hay thế giới đang định hình đức tin – bạn có nhận ra điều tương tự trong đời sống của mình không?","Từ \"rập theo\" (syschematizo) được mô tả như một tiến trình âm thầm, không phải một quyết định – điều đó thay đổi gì trong cách bạn nhìn về những ảnh hưởng văn hóa trong đời sống mình?","Khuôn mẫu của \"đời này\" trong thời đại bạn đang sống là gì – về thành công, về giá trị, về điều gì \"đáng giá\"? Bạn có thể kể ra một vài thước đo cụ thể không?","[Nhóm nhỏ] Có một thước đo nào trong đời sống cộng đoàn của bạn mà mọi người đang dùng – nhưng chưa từng được suy xét xem nó đến từ Tin Mừng hay từ văn hóa xung quanh?"]]]},{"k":"ch","l":"Phần 3 · Chương 2","t":"Đổi Mới Tâm Thần – Không Phải Là Chống Lại Mọi Thứ Mới","pb":null,"b":[["q","Hãy xem xét mọi sự, điều gì tốt hãy giữ lấy.","1 Thessalonians 5,21"],["h3","I. Câu Chuyện Của Cô Tâm"],["story","Câu chuyện: Cô Tâm – 64 tuổi",["Cô Tâm sáu mươi bốn tuổi, đã phục vụ trong cộng đoàn nhiều thập niên. Cô là người được nhiều người trẻ trong giáo xứ tìm đến vì sự khôn ngoan và lòng kiên nhẫn của cô. Nhưng cô cũng thẳng thắn về một điều cô đang vật lộn: \"Tôi lớn lên trong một thế giới mà mọi thứ chậm hơn rất nhiều. Bây giờ tôi thấy các con, các cháu sống trong một thế giới hoàn toàn khác – điện thoại, mạng xã hội, những cách suy nghĩ mới về gia đình, về công việc, về cả đời sống đức tin. Có những lúc tôi muốn nói: 'ngày xưa không như vậy' – nhưng tôi cũng tự hỏi: liệu tôi đang bảo vệ đức tin, hay tôi đang bảo vệ thế giới mà tôi quen thuộc? Hai điều đó có phải luôn là một không?\""]],["h3","II. Đổi Mới – Không Phải Là Quay Về"],["p","Một cách hiểu sai phổ biến về việc \"không rập theo đời này\" là hiểu nó như một lời kêu gọi quay về với một thời đại trước đó – như thể \"thời trước\" là thời điểm mà đức tin chưa bị \"đời này\" ảnh hưởng, và bây giờ chỉ cần trở lại đó. Nhưng Romans 12,2 không dùng từ \"quay về\" (tiếng Hy Lạp không có từ tương đương với \"trở lại thời trước\" trong câu này). Từ được dùng là \"metamorphoo\" – \"biến đổi\", cùng gốc với từ được dùng để mô tả sự biến hình của Đức Giê-su trên núi (Matthew 17,2). Đây là một từ hướng về phía trước – một sự biến đổi đang diễn ra, không phải một sự trở lại."],["p","Điều này quan trọng vì: mọi thời đại – bao gồm \"thời trước\" mà nhiều người hoài niệm – đều có khuôn mẫu văn hóa riêng của nó, và khuôn mẫu đó cũng cần được \"đổi mới tâm thần\" để nhận ra. Không có thời đại nào là \"thời đại trung lập\" mà đức tin chỉ cần được bảo tồn nguyên trạng. Mỗi thời đại đặt ra câu hỏi riêng của nó – và \"đổi mới tâm thần\" là một tiến trình đang diễn ra, không phải một trạng thái đã đạt được trong quá khứ và chỉ cần giữ nguyên."],["h3","III. 1 Thessalonians 5,21 – Phân Định, Không Phải Phân Loại Sẵn"],["p","1 Thessalonians 5,19-21 đưa ra một chuỗi chỉ dẫn đáng chú ý: \"Đừng dập tắt Thần Khí. Đừng coi thường các ơn nói tiên tri. Nhưng hãy xem xét mọi sự, điều gì tốt hãy giữ lấy.\" Cụm từ \"xem xét mọi sự\" (tiếng Hy Lạp \"dokimazo\") là một từ thường được dùng để mô tả việc kiểm tra kim loại để xác định độ tinh khiết – một tiến trình chủ động, không phải một phản ứng tự động."],["p","Điều đáng chú ý là Phao-lô không nói \"hãy từ chối mọi sự mới\" hay \"hãy chấp nhận mọi sự mới\". Ông nói \"hãy xem xét\" – và sau đó \"giữ lấy điều gì tốt\". Điều đó giả định rằng trong \"mọi sự\" – bao gồm những điều mới, những thay đổi văn hóa, những công cụ và cách suy nghĩ mới – có những điều tốt cần được giữ lấy, không chỉ những điều cần được cảnh giác. \"Đổi mới tâm thần\" không phải là một bộ lọc chỉ tìm những điều xấu để loại bỏ. Nó là một khả năng phân định – để nhận ra điều gì phù hợp với ý Thiên Chúa và điều gì không, trong bất kỳ thời đại nào."],["box","",["<b>Phản ứng phòng thủ:<\/b> Coi mọi điều mới hoặc thay đổi văn hóa như một mối đe dọa cần chống lại. Sự an toàn được đo bằng khoảng cách với những gì \"mới\".","<b>Hòa tan không suy xét:<\/b> Chấp nhận mọi điều mới như một sự tiến bộ tất nhiên, không cần kiểm tra. Sự cập nhật được đo bằng việc theo kịp.","<b>Phân định (1 Thessalonians 5,21):<\/b> Xem xét từng điều – công cụ, giá trị, cách suy nghĩ mới – dựa trên việc nó phù hợp với ý Thiên Chúa hay không. Giữ lấy điều tốt, dù nó cũ hay mới."]],["h3","IV. Câu Trả Lời Cho Cô Tâm"],["p","Câu hỏi của cô Tâm – liệu cô đang bảo vệ đức tin hay bảo vệ một thế giới quen thuộc – là chính xác loại câu hỏi mà \"đổi mới tâm thần\" đòi hỏi phải tiếp tục đặt ra, ở mọi thời đại, kể cả thời đại của cô khi cô còn trẻ. Điều cô có thể tin là: không phải mọi sự thay đổi đều là \"rập theo đời này\", và không phải mọi điều quen thuộc đều là \"đức tin nguyên chất\". 1 Thessalonians 5,21 mời cô – và những người trẻ mà cô đang đồng hành – cùng làm một việc: xem xét, cùng nhau, điều gì trong cả những giá trị cũ và những thay đổi mới là phù hợp với Tin Mừng, và giữ lấy điều đó."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của cô Tâm – câu hỏi \"tôi đang bảo vệ đức tin, hay tôi đang bảo vệ thế giới tôi quen thuộc?\" – bạn đã từng đặt câu hỏi tương tự cho chính mình không?","Romans 12,2 dùng từ \"biến đổi\" (metamorphoo) – hướng về phía trước, không phải \"quay về\" – điều đó thay đổi gì trong cách bạn nhìn về vai trò của đức tin trong một thế giới đang thay đổi?","1 Thessalonians 5,21 – \"xem xét mọi sự, điều gì tốt hãy giữ lấy\" – có một điều gì mới trong văn hóa hiện đại mà bạn nghĩ là \"điều tốt cần giữ lấy\", dù ban đầu bạn cảnh giác với nó?","[Nhóm nhỏ] Trong cộng đoàn của bạn, có sự khác biệt nào giữa các thế hệ về cách nhìn nhận thay đổi văn hóa? Điều gì sẽ giúp các thế hệ \"xem xét\" cùng nhau, thay vì chỉ đối đầu?"]]]},{"k":"ch","l":"Phần 3 · Chương 3","t":"Sống Giữa Thế Gian, Không Thuộc Về Thế Gian","pb":null,"b":[["q","Con đã ban cho họ lời của Cha, và thế gian đã ghét họ, vì họ không thuộc về thế gian, cũng như Con không thuộc về thế gian. Con không xin Cha đem họ ra khỏi thế gian, nhưng xin Cha gìn giữ họ khỏi ác thần.","John 17,14-15"],["h3","I. Câu Chuyện Của Đan"],["story","Câu chuyện: Đan – 24 tuổi",["Đan hai mươi bốn tuổi, sinh viên năm cuối, lớn lên trong một gia đình có đức tin nhưng học tập và làm việc trong những môi trường mà đức tin hầu như không bao giờ được nhắc đến – và khi được nhắc đến, thường bị xem là lỗi thời hoặc cá nhân, không nên đem vào không gian chung. Đan không cảm thấy bị ai công khai chống đối vì đức tin của mình. Nhưng cô cảm thấy một áp lực âm thầm khác: \"Tôi không bị ai ngăn cản. Nhưng tôi cảm thấy nếu tôi sống đúng với những gì tôi tin – về cách nhìn con người, về các giá trị gia đình, về một số điều tôi cho là quan trọng – tôi sẽ trở thành người 'khác', người 'lạc hậu' trong mắt bạn bè và đồng nghiệp. Tôi không muốn rút lui khỏi thế giới của họ. Nhưng tôi cũng không biết làm sao để ở trong đó mà không dần dần im lặng về những điều tôi tin.\""]],["h3","II. John 17 – Lời Cầu Nguyện Của Đức Giê-su Cho Các Môn Đệ"],["p","John 17 là một trong những đoạn sâu sắc nhất trong Tân Ước – lời cầu nguyện của Đức Giê-su cho các môn đệ ngay trước cuộc khổ nạn. Trong đó, Ngài đưa ra một mô tả kép về vị trí của người tin trong thế gian: họ \"không thuộc về thế gian\" (17,14) – nhưng Ngài không xin Cha \"đem họ ra khỏi thế gian\" (17,15). Hai điều đó đứng cạnh nhau một cách có chủ ý."],["p","Điều này loại trừ hai phản ứng thường gặp. Một là rút lui hoàn toàn – tạo ra một \"thế giới riêng\" tách biệt khỏi xã hội xung quanh, với hy vọng giữ được sự thuần khiết bằng cách giảm tiếp xúc. Hai là hòa tan hoàn toàn – để cho \"không thuộc về thế gian\" trở thành một nhãn hiệu trừu tượng không còn ảnh hưởng đến cách sống thật. John 17 mô tả một vị trí thứ ba: ở trong thế gian, với tất cả sự tiếp xúc và tham gia thật mà điều đó đòi hỏi – nhưng với một bản sắc, một nguồn giá trị, không bắt nguồn từ thế gian đó."],["h3","III. Muối Và Ánh Sáng – Hình Ảnh Về Sự Hiện Diện, Không Phải Sự Tách Biệt"],["p","Matthew 5,13-16 dùng hai hình ảnh để mô tả vai trò của người tin trong thế gian: muối và ánh sáng. Cả hai hình ảnh đều giả định sự tiếp xúc, không phải sự tách biệt. Muối không có tác dụng nếu nó được giữ riêng trong hộp – nó có tác dụng khi nó tiếp xúc với thức ăn. Ánh sáng không có tác dụng nếu nó được \"đặt dưới cái thùng\" (5,15) – nó có tác dụng khi nó chiếu ra trong không gian tối."],["p","Nhưng cả hai hình ảnh cũng giả định một điều khác: muối phải vẫn là muối – \"nếu muối mất vị, thì lấy gì làm cho nó mặn lại?\" (5,13) – và ánh sáng phải vẫn là ánh sáng, không trở thành bóng tối để \"hòa hợp\" với bóng tối xung quanh. Sự hiện diện hiệu quả trong thế gian không đến từ việc trở nên giống thế gian hơn. Nó đến từ việc giữ được bản chất riêng – trong khi vẫn ở trong sự tiếp xúc thật."],["box","",["<b>Rút lui:<\/b> Giảm tiếp xúc với thế giới xung quanh để bảo vệ đức tin. Muối được giữ trong hộp – an toàn, nhưng không có tác dụng.","<b>Hòa tan:<\/b> Để cho bản sắc đức tin mờ dần trong tiếp xúc, nhằm tránh xung đột hoặc bị nhìn là \"khác\". Muối mất vị – vẫn ở trong thức ăn, nhưng không còn là muối.","<b>Hiện diện (John 17, Matthew 5):<\/b> Ở trong sự tiếp xúc thật với thế giới xung quanh, đồng thời giữ bản sắc và giá trị bắt nguồn từ Tin Mừng. Muối vẫn mặn – và chính vì vậy mới có tác dụng."]],["h3","IV. Sự \"Khác Biệt\" Không Phải Luôn Là Đối Đầu"],["p","Một lo lắng phổ biến của những người trẻ như Đan là: sống khác biệt sẽ đồng nghĩa với xung đột – rằng để giữ vững điều mình tin, người ta phải liên tục \"đứng lên\" theo cách gây chú ý hoặc gây tranh cãi. Nhưng phần lớn sự khác biệt mà muối và ánh sáng tạo ra trong Matthew 5 không phải là sự khác biệt ồn ào. Nó là sự khác biệt trong cách một người đối xử với đồng nghiệp khi không ai để ý, cách một người dùng thời gian và tiền bạc, cách một người phản ứng khi bị đối xử bất công, cách một người nói về người khác khi người đó không có mặt."],["p","Loại khác biệt đó thường không đòi hỏi phải \"tuyên bố\" điều gì. Nó được nhận ra qua thời gian – và thường được nhận ra nhiều hơn bởi chính những người ở gần, hơn là bởi những cuộc tranh luận công khai. Đây không phải là lời kêu gọi tránh mọi cuộc trò chuyện khó – nhưng nó giải phóng khỏi cảm giác rằng \"không thuộc về thế gian\" phải luôn được chứng minh bằng đối đầu."],["h3","V. Câu Trả Lời Cho Đan"],["p","Điều Đan đang cảm nhận – áp lực âm thầm để im lặng dần về những điều cô tin – là chính xác loại áp lực mà John 17 và Matthew 5 nói đến. Đức Giê-su không cầu nguyện để Đan được đưa ra khỏi môi trường của mình. Ngài cầu nguyện để cô được gìn giữ trong đó – với bản sắc của muối còn mặn và ánh sáng còn chiếu. Điều đó không có nghĩa là Đan phải trở thành người gây tranh cãi trong mọi cuộc trò chuyện. Nó có nghĩa là: trong những lựa chọn nhỏ, lặp đi lặp lại, hằng ngày – cách cô đối xử với người khác, cách cô dùng thời gian, điều cô coi là quan trọng – sự khác biệt đó có thể hiện diện một cách tự nhiên, không phải như một tuyên bố, mà như một cách sống."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Đan – áp lực âm thầm để dần im lặng về điều mình tin, không phải vì bị cấm, mà vì không muốn bị xem là \"khác\" – bạn có nhận ra áp lực tương tự trong môi trường của mình không?","John 17,14-15 – \"không thuộc về thế gian\" nhưng \"không bị đem ra khỏi thế gian\" – hai điều đó đứng cạnh nhau như thế nào trong đời sống thực tế của bạn?","Hình ảnh muối và ánh sáng (Matthew 5,13-16) giả định sự tiếp xúc, không phải sự tách biệt – điều đó thay đổi gì trong cách bạn nhìn về môi trường làm việc, học tập, hay xã hội của mình?","[Nhóm nhỏ] Có những \"lựa chọn nhỏ, lặp đi lặp lại, hằng ngày\" nào trong cộng đoàn của bạn mà mọi người có thể cùng nhận ra là cách 'muối vẫn mặn' trong môi trường của họ?"]]]},{"k":"ch","l":"Phần 3 · Chương 4","t":"Công Nghệ, Tốc Độ, Và Sự Hiện Diện","pb":null,"b":[["q","Hãy cẩn thận xem xét cách anh em sống, đừng như người không khôn, nhưng như người khôn ngoan; hãy tận dụng thời gian, vì những ngày này là xấu.","Ephesians 5,15-16"],["h3","I. Câu Chuyện Của Linh"],["story","Câu chuyện: Linh – 34 tuổi",["Linh ba mươi bốn tuổi, mẹ của hai con nhỏ, làm việc từ xa cho một công ty quốc tế. Cô nói: \"Công nghệ giúp tôi làm được rất nhiều điều mà mẹ tôi không thể làm được – làm việc từ nhà, giữ liên lạc với gia đình ở xa, học hỏi những điều mới. Tôi không nghĩ công nghệ là 'xấu'. Nhưng có một điều tôi nhận ra gần đây: tôi cầu nguyện ít hơn, không phải vì tôi quyết định cầu nguyện ít hơn – mà vì điện thoại luôn ở đó, và mỗi khoảng trống nhỏ trong ngày, thay vì là khoảng lặng, lại bị lấp đầy bởi một thứ gì khác. Tôi không biết phải gọi điều đó là gì – không phải tội lỗi theo nghĩa truyền thống, nhưng nó đang thay đổi điều gì đó trong tôi mà tôi chưa hiểu hết.\""]],["h3","II. Ephesians 5 – \"Tận Dụng Thời Gian\" Trong \"Những Ngày Xấu\""],["p","Ephesians 5,15-16 đưa ra một chỉ dẫn thú vị: \"hãy cẩn thận xem xét cách anh em sống... hãy tận dụng thời gian, vì những ngày này là xấu.\" Cụm từ \"tận dụng thời gian\" trong tiếng Hy Lạp – \"exagorazomenoi ton kairon\" – có nghĩa đen gần với \"chuộc lại thời gian\", một hình ảnh thương mại: mua lại một thứ gì đó đang có nguy cơ bị mất."],["p","Điều đáng chú ý là Phao-lô không viết câu này cho một thời đại đặc biệt \"xấu\" hơn các thời đại khác theo nghĩa duy nhất – \"những ngày này là xấu\" là một mô tả mà nhiều thế hệ Ki-tô hữu đã áp dụng cho thời đại của họ. Nhưng điều đó không làm câu này kém liên quan – ngược lại, nó cho thấy: mỗi thời đại có những cách riêng để \"thời gian bị lấy đi\" mà không cần một sự kiện lớn nào – chỉ cần rất nhiều khoảnh khắc nhỏ, mỗi khoảnh khắc có vẻ vô hại, cộng lại."],["h3","III. Khoảng Lặng – Một Điều Mới Cần Được Bảo Vệ"],["p","Một trong những điều mà các nhân vật trong Kinh Thánh – từ Đức Giê-su rút vào nơi thanh vắng để cầu nguyện (Mark 1,35; Luke 5,16), đến các ẩn sĩ sa mạc trong truyền thống Ki-tô giáo cổ – có chung, là sự công nhận rằng khoảng lặng không phải là điều tự động xảy ra. Nó cần được tạo ra, được bảo vệ, được chọn."],["p","Trong nhiều thế kỷ, thử thách đối với khoảng lặng chủ yếu là công việc, nghĩa vụ, và những đòi hỏi bên ngoài. Trong thời đại số, thử thách đó vẫn còn – nhưng thêm vào đó là một thử thách mới: những khoảng trống nhỏ trong ngày – chờ xe, chờ thang máy, vài phút trước khi ngủ – những khoảng trống mà trước đây tự nhiên trở thành khoảng lặng (dù ngắn), nay thường được lấp đầy ngay lập tức bởi một thiết bị. Điều này không phải là vấn đề về \"công nghệ tốt hay xấu\" – mà là về việc khoảng lặng, vốn đã khó tìm, nay cần một sự chủ ý mới để được bảo vệ."],["box","",["<b>Quan điểm sai:<\/b> Công nghệ tự thân là vấn đề đạo đức – sử dụng nhiều là \"xấu\", sử dụng ít là \"tốt\". Điều này biến một công cụ thành một thước đo đức hạnh, và bỏ lỡ câu hỏi thật.","<b>Câu hỏi của Ephesians 5:<\/b> Không phải \"tôi có dùng công nghệ không\" – mà là \"thời gian của tôi – đặc biệt những khoảng lặng – đang được 'tận dụng' hay đang bị 'lấy đi' một cách âm thầm?\"","<b>Hàm ý thực tế:<\/b> Bảo vệ khoảng lặng không phải là từ chối công nghệ. Đó là một lựa chọn chủ động – tương tự như Đức Giê-su \"rút vào nơi thanh vắng\" giữa một lịch trình đầy những đòi hỏi thật."]],["h3","IV. Câu Trả Lời Cho Linh"],["p","Điều Linh nhận ra – rằng cô không \"quyết định\" cầu nguyện ít hơn, nhưng những khoảng trống dần biến mất – là chính xác loại nhận thức mà Ephesians 5,15-16 mời gọi: \"cẩn thận xem xét cách anh em sống\". Đây không phải là lời kêu gọi cảm thấy tội lỗi về công nghệ, hay từ bỏ những công cụ đang giúp cô làm việc và giữ liên lạc với gia đình. Đó là lời mời để \"chuộc lại\" một vài khoảng lặng nhỏ – có chủ ý, không phải hoàn hảo – như một không gian được bảo vệ, theo cách Đức Giê-su đã làm giữa một lịch trình còn đầy hơn lịch trình của Linh."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Linh – những khoảng trống nhỏ trong ngày dần bị lấp đầy mà không phải do một quyết định nào – bạn có nhận ra điều tương tự trong ngày của mình không?","Ephesians 5,16 – \"tận dụng thời gian\" (chuộc lại thời gian) – nếu áp dụng cho một ngày bình thường của bạn, điều đó trông như thế nào trong thực tế?","Đức Giê-su \"rút vào nơi thanh vắng để cầu nguyện\" giữa một lịch trình đầy người tìm đến Ngài (Mark 1,35-37) – điều đó có ý nghĩa gì cho việc bảo vệ khoảng lặng trong đời sống hiện đại?","[Nhóm nhỏ] Cộng đoàn của bạn có thể làm gì – không phải bằng quy định, mà bằng thực hành chung – để giúp các thành viên bảo vệ những khoảng lặng nhỏ trong ngày?"]]]},{"k":"ch","l":"Phần 3 · Chương 5","t":"Một Cộng Đoàn Vừa Trung Tín Vừa Sống Động","pb":null,"b":[["q","Ngày hôm qua, ngày hôm nay, và mãi đến muôn đời, Đức Giê-su Ki-tô vẫn là một.","Hebrews 13,8"],["h3","I. Câu Chuyện Của Anh Quân"],["story","Câu chuyện: Anh Quân – 47 tuổi",["Anh Quân bốn mươi bảy tuổi, là một người phục vụ tích cực trong cộng đoàn – tham gia vào việc tổ chức các sinh hoạt cho cả người lớn tuổi và người trẻ. Anh thường thấy mình ở giữa hai nhóm có những kỳ vọng khác nhau: những người lớn tuổi muốn giữ các hình thức sinh hoạt quen thuộc, và những người trẻ muốn những cách tiếp cận mới – về hình thức, về ngôn ngữ, về cách trình bày. Anh nói: \"Tôi không nghĩ đây là một cuộc chiến giữa 'đúng' và 'sai'. Nhưng tôi cảm thấy cộng đoàn của chúng tôi đôi khi dùng nhiều năng lượng để tranh luận về hình thức – nhạc, cách trình bày, ngôn ngữ – hơn là về điều mà cả hai nhóm thật ra đều quan tâm: làm sao để Tin Mừng vẫn thật và sống động cho mọi thế hệ.\""]],["h3","II. Hebrews 13,8 – Điều Không Thay Đổi Là Nền Tảng Cho Điều Có Thể Thay Đổi"],["p","Hebrews 13,8 – \"Đức Giê-su Ki-tô vẫn là một, ngày hôm qua, ngày hôm nay, và mãi đến muôn đời\" – thường được trích dẫn như một lời an ủi về sự bất biến của Thiên Chúa. Nhưng trong bối cảnh của một thế giới đang thay đổi, câu này có một hàm ý khác cũng quan trọng: chính vì có một điều không thay đổi – bản chất và lời hứa của Đức Ki-tô – mà những điều khác có thể thay đổi mà không đe dọa đến nền tảng."],["p","Đây là sự khác biệt giữa nền tảng và hình thức. Nếu một cộng đoàn coi mọi hình thức – cách thức sinh hoạt, ngôn ngữ, phương tiện – như một phần của nền tảng không thể thay đổi, thì mọi thay đổi hình thức sẽ cảm thấy như một mối đe dọa đến đức tin. Nhưng nếu nền tảng – Đức Ki-tô, Tin Mừng, các giá trị cốt lõi – được xác định rõ và được giữ chắc, thì hình thức có thể thay đổi qua các thế hệ mà không làm nền tảng đó lung lay. Hebrews 13,8 đặt sự chắc chắn vào đúng chỗ: không phải vào hình thức, mà vào Đấng đứng sau hình thức."],["h3","III. Acts 15 – Khi Cộng Đoàn Đầu Tiên Đối Diện Với Thay Đổi Lớn"],["p","Acts 15 ghi lại một trong những thời điểm căng thẳng nhất của Hội Thánh sơ khai: liệu những người ngoại trở lại đạo có cần tuân giữ các quy định của Luật Do Thái – như cắt bì – để được coi là thành viên đầy đủ của cộng đoàn không? Đây không phải là một câu hỏi nhỏ. Nó liên quan đến bản sắc, truyền thống, và cách hiểu về ơn cứu độ."],["p","Điều đáng chú ý trong Acts 15 là cách cộng đoàn xử lý câu hỏi đó: họp lại, lắng nghe những trải nghiệm thật (Phao-lô và Barnaba kể lại điều Thiên Chúa đã làm giữa người ngoại – 15,12), xem xét Kinh Thánh (Giacôbê trích dẫn các tiên tri – 15,15-18), và đưa ra một quyết định phân biệt rõ giữa điều cốt lõi (đức tin vào Đức Giê-su, ân sủng) và điều không cốt lõi (các quy định về thực hành). Quyết định đó không phải là \"giữ mọi thứ như cũ\" cũng không phải là \"bỏ hết truyền thống\". Đó là một sự phân định – dựa trên việc xác định điều gì thuộc về nền tảng và điều gì thuộc về hình thức."],["box","",["<b>Nền tảng (không thay đổi):<\/b> Đức Ki-tô, Tin Mừng về ơn cứu độ qua đức tin, các giá trị cốt lõi của đời sống Ki-tô hữu – yêu Chúa, yêu người, sự thật, sự công bằng, lòng thương xót.","<b>Hình thức (có thể thay đổi qua thời đại):<\/b> Ngôn ngữ, phương tiện truyền thông, cách trình bày, phong cách sinh hoạt cộng đoàn, công cụ được sử dụng để học hỏi và kết nối.","<b>Vai trò của cộng đoàn (như Acts 15):<\/b> Cùng nhau phân định – lắng nghe trải nghiệm thật, xem xét Kinh Thánh – để biết điều gì thuộc về nền tảng cần giữ vững, và điều gì thuộc về hình thức có thể đổi mới mà không đánh mất điều cốt lõi."]],["h3","IV. Hai Thế Hệ, Một Tin Mừng"],["p","Căng thẳng mà anh Quân nhìn thấy giữa hai nhóm trong cộng đoàn của mình không phải là điều mới trong lịch sử Hội Thánh – Acts 15 cho thấy nó đã xuất hiện từ những ngày đầu. Điều khác biệt qua các thời đại là nội dung cụ thể của căng thẳng đó. Nhưng cách giải quyết – như Acts 15 cho thấy – không phải là một bên \"thắng\" và bên kia \"thua\". Đó là một tiến trình cùng phân định, với sự tôn trọng lẫn nhau: người lớn tuổi mang đến chiều sâu của kinh nghiệm và truyền thống đã được kiểm chứng qua thời gian; người trẻ mang đến nhận thức về những cách mới mà Tin Mừng có thể chạm đến những người đang sống trong một thế giới khác với thế giới mà truyền thống đó được hình thành."],["p","Khi cả hai phía cùng hướng về câu hỏi của Acts 15 – không phải \"hình thức nào tôi quen thuộc hơn\", mà \"điều gì thật sự thuộc về nền tảng, và điều gì là hình thức có thể phục vụ nền tảng đó tốt hơn cho thế hệ hiện tại\" – căng thẳng có thể trở thành một cuộc đối thoại, thay vì một cuộc tranh giành."],["h3","V. Câu Trả Lời Cho Anh Quân – Và Tổng Kết Chính Đề 27"],["p","Điều anh Quân đang tìm – một cách để cộng đoàn của anh dùng năng lượng cho điều cốt lõi hơn là cho những tranh luận về hình thức – chính là điều Acts 15 đã làm: phân biệt rõ giữa nền tảng (Hebrews 13,8 – Đức Ki-tô không thay đổi) và hình thức (có thể và nên thích nghi qua các thế hệ). Một cộng đoàn \"vừa trung tín vừa sống động\" không phải là một cộng đoàn đã giải quyết xong mọi câu hỏi về văn hóa và thay đổi. Đó là một cộng đoàn đã học được cách tiếp tục đặt đúng câu hỏi – cùng nhau, qua các thế hệ – và giữ chắc vào Đấng là nền tảng trong khi để hình thức phục vụ cho việc Tin Mừng vẫn thật và sống động cho mỗi thế hệ mới."],["p","Chính đề 27 không kết thúc bằng một danh sách những điều \"nên làm\" trong thế giới hiện đại. Nó kết thúc bằng một khung nhìn: Romans 12,2 mời mỗi người tin – và mỗi cộng đoàn – vào một tiến trình liên tục của \"đổi mới tâm thần\", không phải một lần, mà như một cách sống. Khang, cô Tâm, Đan, Linh, và anh Quân đều đang ở trong tiến trình đó – không phải vì họ đã thất bại điều gì, mà vì đó là điều mà đức tin trong một thế giới đang thay đổi luôn đòi hỏi: tiếp tục xem xét, tiếp tục phân định, và tiếp tục giữ chắc vào Đấng \"vẫn là một, ngày hôm qua, ngày hôm nay, và mãi đến muôn đời\"."],["sum","TỔNG KẾT CHÍNH ĐỀ 27 – Đức Tin Và Văn Hóa: Khi Thế Giới Đang Thay Đổi",["<b>Chương 1: <\/b>Romans 12,2 mô tả \"rập theo đời này\" như một tiến trình âm thầm, không phải một quyết định – khuôn mẫu văn hóa của mỗi thời đại có thể dần định hình giá trị của một người mà không được nhận ra. Nhận ra tiến trình đó đang xảy ra là bước đầu của \"đổi mới tâm thần\".","<b>Chương 2: <\/b>\"Đổi mới tâm thần\" (metamorphoo) hướng về phía trước, không phải \"quay về\" một thời đại trước. 1 Thessalonians 5,21 mời một thái độ phân định – \"xem xét mọi sự, điều gì tốt hãy giữ lấy\" – thay vì phản ứng phòng thủ hoặc hòa tan không suy xét.","<b>Chương 3: <\/b>John 17,14-15 và Matthew 5,13-16 mô tả vị trí của người tin: không thuộc về thế gian, nhưng không bị đem ra khỏi thế gian – như muối và ánh sáng, có tác dụng qua sự tiếp xúc, không qua sự tách biệt. Sự khác biệt thường được nhận ra qua những lựa chọn nhỏ, lặp lại, hằng ngày.","<b>Chương 4: <\/b>Ephesians 5,15-16 kêu gọi \"tận dụng thời gian\" trong \"những ngày xấu\" – một lời mời bảo vệ khoảng lặng một cách chủ động, theo cách Đức Giê-su đã \"rút vào nơi thanh vắng\" giữa một lịch trình đầy đòi hỏi. Câu hỏi không phải về công nghệ tốt hay xấu, mà về việc thời gian đang được \"chuộc lại\" hay bị lấy đi âm thầm.","<b>Chương 5: <\/b>Hebrews 13,8 đặt sự chắc chắn vào Đức Ki-tô – nền tảng không thay đổi – cho phép hình thức thích nghi qua các thế hệ mà không đe dọa nền tảng. Acts 15 là mẫu gương về cách cộng đoàn phân định cùng nhau, dựa trên trải nghiệm thật và Kinh Thánh, giữa căng thẳng về thay đổi."]],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của anh Quân – năng lượng của cộng đoàn dùng cho tranh luận về hình thức hơn là điều cốt lõi – bạn có nhận ra điều tương tự trong cộng đoàn của mình không?","Hebrews 13,8 – sự không thay đổi của Đức Ki-tô là nền tảng cho phép hình thức thay đổi – trong cộng đoàn của bạn, điều gì thuộc về \"nền tảng\" và điều gì thuộc về \"hình thức\"? Hai điều đó có luôn được phân biệt rõ không?","Nhìn lại toàn bộ Chính đề 27: từ Romans 12,2 đến 1 Thessalonians 5,21 đến John 17 đến Ephesians 5 đến Hebrews 13 và Acts 15 – đoạn Kinh Thánh hay câu chuyện nào nói với bạn nhiều nhất lúc này?","[Nhóm nhỏ] Acts 15 cho thấy cộng đoàn đầu tiên giải quyết một căng thẳng lớn bằng cách lắng nghe trải nghiệm thật và xem xét Kinh Thánh cùng nhau – cộng đoàn của bạn có thể áp dụng tiến trình đó cho một căng thẳng cụ thể nào hiện nay không?","[Nhóm nhỏ] Câu hỏi mở ra cho Chính đề 28: nếu đức tin định hình cách một người sống trong một thế giới đang thay đổi – thì điều đó dẫn đến đâu khi nhìn về phía trước, về đích đến cuối cùng mà toàn bộ hành trình của Kiếp Nhân Sinh đang hướng tới?"]]]},{"k":"front","l":"Phần 4 · Mở đầu","t":"Dẫn Nhập","pb":["PHẦN 4","ĐÍCH ĐẾN CỦA HÀNH TRÌNH","Được Sai Đi Và Không Đi Một Mình"],"b":[["p","Chính đề 27 đã đặt câu hỏi cuối: nếu đức tin định hình cách một người sống trong một thế giới đang thay đổi – không rút lui, không hòa tan, mà như muối và ánh sáng ở trong sự tiếp xúc thật – thì đức tin đó đang đi về đâu? Nó có một đích đến không? Hay nó chỉ là một cách sống tốt hơn, không có điểm cuối?"],["p","Đó là câu hỏi của Chính đề 28. Và đây là chính đề cuối cùng trong toàn bộ hành trình Kiếp Nhân Sinh – không phải vì hành trình đức tin kết thúc ở đây, mà vì hành trình học hỏi này đang dẫn đến một điều mà mọi chính đề trước đều đang hướng tới: sứ mệnh. Người đã được tạo dựng, đã sa ngã, đã được cứu chuộc, đã được đổ đầy Đức Thánh Linh, đã được dạy cầu nguyện, đã được đào luyện qua đau khổ và biến động lịch sử – người đó được sai đi làm gì?"],["p","Matthew 28,19-20 là câu Kinh Thánh thường được gọi là \"Đại Mệnh Lệnh\" – và nó là điểm cuối tự nhiên của hành trình 28 chính đề. Nhưng điều làm câu này không chỉ là một nhiệm vụ cần hoàn thành là phần thứ hai của nó: “Viì vậy, Thầy ở cùng anh em mọi ngày cho đến tận thế.” Sứ mệnh không được trao ra rồi bỏ một mình. Nó được trao kèm với sự hiện diện – và đó là điều thay đổi tất cả."]]},{"k":"ch","l":"Phần 4 · Chương 1","t":"Đại Mệnh Lệnh: Không Phải Cho Một Số Người","pb":null,"b":[["q","Vậy, anh em hãy đi và làm cho muôn dân trở thành môn đệ, làm phép rửa cho họ nhân danh Chúa Cha, Chúa Con và Chúa Thánh Thần, dạy bảo họ tuân giữ mọi điều Thầy đã truyền cho anh em. Và đây, Thầy ở cùng anh em mọi ngày cho đến tận thế.","Matthew 28,19-20"],["h3","I. Câu Chuyện Của Nhã"],["story","Câu chuyện: Nhã – 36 tuổi",["Nhã ba mươi sáu tuổi, là kế toán, đã tin vào Đức Giê-su mười hai năm. Cô không phải nhà truyền giáo, không phải linh mục hay tu sĩ, không đi thuyết giảng hay tổ chức buổi phúc âm. Cô sống một cuộc sống bình thường: đi làm, chăm sóc mẹ già, sinh hoạt cộng đoàn vào cuối tuần.","Khi nhóm nhỏ của cô học về “Đại Mệnh Lệnh” trong Matthew 28, Nhã ngồi im lặng khá lâu rồi nói: “Thôi thì tôi đọc câu này nhiều lần. Mỗi lần tôi đều nghĩ: câu này dành cho ai đó khác – những người làm mục vụ chuyên nghiệp, những người có ơn truyền giáo đặc biệt. Tôi chỉ là người đi làm hằng ngày. Tôi không biết câu này có nghĩa gì với người như tôi.”"]],["h3","II. “Muôn Dân” Và “Anh Em” – Ai Được Nói Đến"],["p","Matthew 28,19-20 được Đức Giê-su nói với “mười một môn đệ” (28,16) – không phải với một nhóm được đào tạo đặc biệt hay được trao chức vụ. Trong số mười một người đó có ngư dân, người thu thuế, và “kẻ nghi ngờ” (28,17 ghi lại rằng “một số người nghi ngờ” ngay tại thời điểm đó). Đại Mệnh Lệnh được trao cho những người bình thường đang có câu hỏi – không phải cho những người đã hoàn hảo."],["p","Từ Hy Lạp “matheteusate” – “làm cho họ trở thành môn đệ” – là dạng chủ động, mệnh lệnh, và quan trọng là không có giới hạn về người nhận. Không phải “làm cho những người dễ tiếp nhận trở thành môn đệ”, hay “làm cho những người ở xa trở thành môn đệ”. Mà là “muôn dân” – tiếng Hy Lạp “panta ta ethne” – tất cả mọi dân tộc, mọi nhóm người, mọi vòng tròn mà người tin đang tiếp xúc."],["p","Điều đó bao gồm đồng nghiệp của Nhã. Bao gồm mẹ của cô. Bao gồm người hàng xóm mà cô nói chuyện mỗi sáng khi đi làm. “Muôn dân” không bắt đầu ở đất nước xa lạ – nó bắt đầu ở vòng tròn tiếp xúc gần nhất."],["box","",["<b>Matthew 28,19-20 KHÔNG có nghĩa là:<\/b> Chỉ những người trong chức vụ chuyên nghiệp mới có sứ mệnh. Sứ mệnh phải diễn ra ở quy mô lớn hay theo những hình thức đặc biệt. Bạn phải “đủ tốt” trước khi bắt đầu.","<b>Matthew 28,19-20 CÓ nghĩa là:<\/b> Mỗi người tin được mời vào một hành trình làm cho người khác trở thành môn đệ – theo khả năng, vòng tròn tiếp xúc, và hoàn cảnh cụ thể của mình. Sứ mệnh không phải là chương trình thêm vào đời sống – nó là cách đời sống được sống khi đức tin đang thật."]],["h3","III. “Hãy Đi” – Động Từ Của Sứ Mệnh"],["p","Từ “hãy đi” trong tiếng Hy Lạp là participle – nghĩa đen gần với “khi bạn đang đi”. Không phải “hãy thay đổi lịch trình của bạn để có thể đi”, mà là “trong khi bạn đang đi – trong cuộc sống hằng ngày của bạn – hãy làm cho người khác trở thành môn đệ.”"],["p","Điều đó thay đổi cách hiểu sứ mệnh: không phải là điều bạn thêm vào, mà là cách bạn sống những gì bạn đang sống. Nhã không cần từ bỏ công việc kế toán hay cuộc sống chăm sóc mẹ để có sứ mệnh. Sứ mệnh của cô diễn ra trong chính những điều đó – qua cách cô đối xử với đồng nghiệp, cách cô sống sự trung thực trong công việc, cách cô chăm sóc người thân, và những cuộc trò chuyện tự nhiên nảy sinh từ những điều đó."],["h3","IV. Phép Rửa Và Dạy Bảo – Hai Chiều Của Việc Làm Môn Đệ"],["p","Đại Mệnh Lệnh nói đến hai hành động cụ thể: làm phép rửa và dạy bảo. Cả hai đều giả định sự tiếp nối – không phải một khoảnh khắc đơn lẻ, mà là một quá trình được đồng hành. Làm phép rửa là dấu hiệu của sự bước vào cộng đoàn đức tin. Dạy bảo là hành trình tiếp tục bên trong cộng đoàn đó. Và cả hai đều giả định rằng người làm môn đệ cho người khác cũng đang là môn đệ – đang học hỏi, không phải đã hoàn thành."],["h3","V. Câu Trả Lời Cho Nhã"],["p","Điều Nhã cần nghe không phải là “bạn cũng phải làm điều lớn hơn”. Điều cô cần là nhận ra rằng công việc kế toán, mối quan hệ với đồng nghiệp, và việc chăm sóc mẹ – tất cả những điều đó là vòng tròn “muôn dân” mà cô đang được sai đến. Sứ mệnh của cô không đợi bắt đầu – nó đang xảy ra, nếu cô sống nó với ý thức rằng mình đang đi trong sự hiện diện của Đấng đã sai cô."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Nhã – “câu này dành cho ai đó khác” – bạn đã từng cảm thấy Đại Mệnh Lệnh không dành cho mình không? Điều gì tạo ra cảm giác đó?","“Khi bạn đang đi” (participle) – sứ mệnh diễn ra trong cuộc sống đang sống, không phải ngoài nó – điều đó thay đổi gì trong cách bạn nhìn về những điều hằng ngày của mình?","“Muôn dân” bắt đầu ở vòng tròn tiếp xúc gần nhất – bạn có thể kể ra ba người trong vòng tròn đó lúc này không?","[Nhóm nhỏ] Ai trong số những người bạn biết đã làm cho bạn trở thành môn đệ theo cách cụ thể – không phải bằng bài giảng, mà bằng cách sống? Điều họ làm trông như thế nào?"]]]},{"k":"ch","l":"Phần 4 · Chương 2","t":"Được Sai Đi Bởi Tình Yêu, Không Phải Bởi Nghĩa Vụ","pb":null,"b":[["q","Tình yêu Đức Ki-tô thúc bách chúng tôi... Vì chúng tôi biết rằng một người đã chết thay cho mọi người, vậy mọi người đều đã chết. Người đã chết thay cho mọi người, để những ai đang sống không còn sống cho chính mình nữa, mà sống cho Đấng đã chết và sống lại vì họ.","2 Corinthians 5,14-15"],["h3","I. Câu Chuyện Của Sơn"],["story","Câu chuyện: Sơn – 44 tuổi",["Sơn bốn mươi bốn tuổi, là giáo viên trung học. Anh đã tin vào Đức Giê-su từ hồi hai mươi tuổi, và trong nhiều năm anh cảm thấy “truyền giáo” là nghĩa vụ nặng nề – điều gì đó anh nên làm nhưng không muốn làm vì sợ làm phiền người khác, sợ bị từ chối, sợ nói điều gì đó sai.","Một lần trong giờ nghỉ, anh tình cờ ngồi cạnh đồng nghiệp đang trong giai đoạn khủng hoảng. Anh không có kế hoạch, không có bài chia sẻ chuẩn bị sẵn – anh chỉ ở đó, lắng nghe, và tại một điểm nào đó trong cuộc trò chuyện, chia sẻ về điều đã giúp anh vượt qua giai đoạn khủng hoảng của chính mình. Sau đó, anh nói với vợ: “Tôi không biết đó có phải là truyền giáo không. Nhưng lần đầu tiên, tôi không cảm thấy mình đang thực hiện một nhiệm vụ. Tôi chỉ quan tâm đến người đó.”"]],["h3","II. “Thúc Bách” – Không Phải Bắt Buộc"],["p","Từ Hy Lạp “sunechei” trong 2 Corinthians 5,14 được dịch là “thúc bách” – nhưng nghĩa đen của nó gần hơn với “bao vây từ mọi phía”, “giữ chặt”. Không phải là một mệnh lệnh từ bên ngoài ép vào – mà là một động lực từ bên trong không thể bỏ qua. Phâo-lô không nói tình yêu Đức Ki-tô là điều anh phải tuân theo. Anh nói đó là điều anh không thể không sống theo."],["p","Đây là sự khác biệt cốt lõi giữa sứ mệnh đến từ nghĩa vụ và sứ mệnh đến từ tình yêu. Người sống sứ mệnh như nghĩa vụ hỏi: “Tôi đã làm đủ chưa? Tôi có đang mắc nợ không?” Người sống sứ mệnh từ tình yêu hỏi: “Điều này quan trọng với ai? Và tôi có thể làm gì không?”"],["box","",["<b>Sứ mệnh từ nghĩa vụ:<\/b> Cảm giác nặng nề và phòng thủ. Sợ thất bại và bị từ chối. Tập trung vào kết quả – bao nhiêu người đã được tiếp cận. Kiệt sức theo thời gian.","<b>Sứ mệnh từ tình yêu (2 Corinthians 5,14):<\/b> Xuất phát từ điều đã nhận được, không phải từ điều phải trả lại. Quan tâm đến người cụ thể trước khi quan tâm đến kết quả. Có thể bền vững vì nó không chạy bằng sức người. Điều tự nhiên xảy ra khi đức tin đang sống – không phải điều thêm vào."]],["h3","III. 2 Corinthians 5,15 – “Không Còn Sống Cho Chính Mình”"],["p","Phâo-lô mô tả kết quả của việc hiểu tình yêu Đức Ki-tô là gì: người hiểu điều đó “không còn sống cho chính mình nữa, mà sống cho Đấng đã chết và sống lại vì họ.” Điều đáng chú ý là câu này không phải là một mệnh lệnh – không phải “hãy ngừng sống cho chính mình”. Đây là mô tả về điều xảy ra tự nhiên khi người tin thật sự hiểu điều Đức Ki-tô đã làm cho họ."],["p","Điều đó không có nghĩa là sứ mệnh loại bỏ sự chăm sóc bản thân hay các mối quan hệ cá nhân. Nó có nghĩa là trục của cuộc sống dịch chuyển: không phải “cuộc sống của tôi, và đôi khi tôi làm gì đó cho người khác” – mà là “tôi là người thuộc về Đấng đã sống và chết vì tôi, và điều đó định hình cách tôi tiếp xúc với mọi người và mọi thứ.”"],["h3","IV. 1 Corinthians 9,19-23 – Linh Động Trong Tình Yêu"],["p","Phâo-lô mô tả sứ mệnh của mình trong 1 Corinthians 9: “Tôi là người tự do, không lệ thuộc vào ai, thế mà tôi đã tự làm nô lệ cho mọi người, để chinh phục được càng nhiều người càng tốt.” Ông trở nên “như người Do Thái” với người Do Thái, “như người không có lề luật” với người không có lề luật – không phải vì ông không có bản sắc riêng, mà vì ông đặt người anh đang tiếp xúc lên trên sự thoải mái của chính mình."],["p","Đây là sứ mệnh từ tình yêu trong thực tế: sẵn sàng không tiện cho chính mình, vì điều quan trọng hơn là người trước mặt bạn có thể nghe được điều họ cần nghe theo cách họ có thể nhận được. Điều đó không yêu cầu từ bỏ sự thật – nó yêu cầu đủ tình yêu để tìm cách đến với người khác từ nơi họ đang đứng."],["h3","V. Câu Trả Lời Cho Sơn"],["p","Điều Sơn trải nghiệm trong giờ nghỉ đó – không có kế hoạch, không có bài chia sẻ chuẩn bị, chỉ là quan tâm đến người trước mặt – là chính xác điều 2 Corinthians 5 mô tả. Sứ mệnh không bắt đầu bằng “tôi phải truyền giáo cho người này.” Nó bắt đầu bằng: “người này đang đau, và tôi quan tâm.” Và từ sự quan tâm đó, điều Sơn đã nhận được tự nhiên tìm cách chia sẻ chính nó."],["refl","CÂU HỎI SUY NGẪM",["Câu chuyện của Sơn – “lần đầu tiên tôi không cảm thấy mình đang thực hiện một nhiệm vụ” – bạn có từng trải nghiệm điều tương tự không?","Từ “thúc bách” (sunechei) – tình yêu bao vây từ mọi phía, không phải mệnh lệnh từ bên ngoài – điều đó mô tả điều gì trong đức tin của bạn lúc này?","2 Corinthians 5,15 – “không còn sống cho chính mình” – điều đó trông cụ thể như thế nào trong một ngày bình thường của bạn?","[Nhóm nhỏ] 1 Corinthians 9 – Phâo-lô trở nên linh động để tiếp cận người khác từ nơi họ đứng – có một người cụ thể trong vòng tròn của bạn mà bạn cần “đến từ nơi họ đứng” thay vì yêu cầu họ đến theo cách của bạn không?"]]]},{"k":"ch","l":"Phần 4 · Chương 3","t":"Làm Chứng, Không Phải Thuyết Phục","pb":null,"b":[["q","Nhưng anh em sẽ nhận được sức mạnh của Đức Thánh Thần khi Người ngự xuống trên anh em, và anh em sẽ là chứng nhân của Thầy tại Giê-ru-sa-lem, trong toàn miền Giu-đê và Sa-ma-ri, và cho đến tận cùng trái đất.","Acts 1,8"],["h3","I. Câu Chuyện Của Thu"],["story","Câu chuyện: Thu – 31 tuổi",["Thu ba mươi một tuổi, làm thiết kế đồ họ a tự do. Cô tin vào Đức Giê-su từ hồi hai mươi lăm tuổi sau một giai đoạn dài tìm kiếm. Điều cô sợ nhất trong việc “chia sẻ đức tin” là bị nhìn nhận như người đang áp đặt quan điểm, hay đang cố thuyết phục người khác theo quan điểm của mình.","Một lần, bạn thân hỏi cô thẳng: “Mày theo đạo – điều đó có nghĩa gì với mày? Mày thay đổi như thế nào?” Thu không có bài thuyết trình. Cô chỉ kể lại điều đã xảy ra trong cuộc sống của mình – những sợ hãi đã được giải quyết ra sao, cách cô nhìn bản thân mình đã thay đổi như thế nào. Người bạn ngồi nghe và sau đó nói: “Tao muốn biết thêm về điều đó.” Thu về nhà và nhận ra: cô không thuyết phục ai cả. Cô chỉ làm chứng."]],["h3","II. “Chứng Nhân” – Marturion Là Gì"],["p","Từ Hy Lạp “martus” – chứng nhân – là từ pháp lý: người làm chứng về điều họ đã thấy và biết, không phải người tranh luận về điều họ tin là đúng về mặt lý thuyết. Chứng nhân không cần thuyết phục bồi thẩm đoàn bằng lập luận – họ kể lại những gì họ đã trải nghiệm, và để điều đó tự nói cho nó."],["p","Acts 1,8 nói rõ: “anh em sẽ là chứng nhân của Thầy.” Không phải “anh em sẽ thuyết phục người khác về Thầy”, hay “anh em sẽ lập luận về Thầy”. Làm chứng là chia sẻ điều bạn đã trải nghiệm – và tin tưởng rằng Đức Thánh Linh sẽ làm phần còn lại."],["box","",["<b>Thuyết phục:<\/b> Đặt trách nhiệm thay đổi quan điểm của người khác lên người chia sẻ. Dễ trở thành tranh luận và gây ra phòng thủ. Phụ thuộc vào khả năng lập luận của người chia sẻ.","<b>Làm chứng:<\/b> Chia sẻ điều bạn đã biết và trải nghiệm, không phải điều bạn đang cố chứng minh. Tự nhiên và không đe dửa – vì bạn không đang yêu cầu người khác đồng ý, bạn đang kể câu chuyện của mình. Trao quyền cho Đức Thánh Linh – người làm chứng làm phần của họ, và tin tưởng Ngài làm phần của Ngài."]],["h3","III. Từ Giê-ru-sa-lem Đến Tận Cùng Trái Đất – Không Phải Bỏ Qua Gần Để Đến Xa"],["p","Acts 1,8 mô tả một vòng tròn lan rộng dần: Giê-ru-sa-lem – Giu-đê – Sa-ma-ri – đến tận cùng trái đất. Điều đáng chú ý là không ai nhảy từ Giê-ru-sa-lem thẳng đến “tận cùng trái đất” và bỏ qua những gì ở giữa. Sứ mệnh mở rộng từ trong ra ngoài – từ nơi bạn đang đứng, ra đến những vòng tròn tiếp xúc xa hơn."],["p","Trong thực tế,
